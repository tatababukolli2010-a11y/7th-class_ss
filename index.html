డు మధ్యలో నడవాలి", "గుంపుగా పక్కపక్కన నడవాలి", "వాహనాలకు వీపు చూపుతూ నడవాలి"], 0, "Without a footpath, walk in a single file on the extreme edge of the road facing oncoming vehicles to avoid getting hurt.", "ఫుట్‌పాత్ లేకపోతే ఎదురుగా వచ్చే వాహనాలను చూసేలా రోడ్డు చివరన ఒక్కొక్కరుగా నడవాలి."], ["Arrange the steps of the Kerb Drill (method for children crossing the road) in the correct order", "కెర్బ్ డ్రిల్ (పిల్లలు రోడ్డు దాటే పద్ధతి) దశలను సరైన క్రమంలో అమర్చండి", ["Stop at the kerb → Look right → Look left → Look right again → Walk straight across if clear", "Look left → Look right → Run across", "Stop at the kerb → Look left → Look right → Run across", "Walk across → Look right → Look left"], ["అంచు వద్ద ఆగు → కుడివైపు చూడు → ఎడమవైపు చూడు → మళ్ళీ కుడివైపు చూడు → రోడ్డు ఖాళీగా ఉంటే నేరుగా నడిచి దాటు", "ఎడమ చూడు → కుడి చూడు → పరిగెత్తి దాటు", "అంచు వద్ద ఆగు → ఎడమ చూడు → కుడి చూడు → పరిగెత్తి దాటు", "దాటు → కుడి చూడు → ఎడమ చూడు"], 0, "Kerb drill: 1. Stop at the kerb. 2. Look right. 3. Look left. 4. Look right again. 5. If clear, walk straight across — don't run.", "కెర్బ్ డ్రిల్: 1. అంచు వద్ద ఆగు. 2. కుడి చూడు. 3. ఎడమ చూడు. 4. మళ్ళీ కుడి చూడు. 5. ఖాళీగా ఉంటే నేరుగా నడిచి దాటు — పరిగెత్తవద్దు."], ["In the Kerb Drill, after the road is clear, a child should", "కెర్బ్ డ్రిల్‌లో రోడ్డు ఖాళీగా ఉన్నప్పుడు పిల్లవాడు", ["Walk straight across without running", "Run across quickly", "Cross diagonally", "Wait for a friend to push"], ["పరిగెత్తకుండా నేరుగా నడిచి దాటాలి", "వేగంగా పరిగెత్తి దాటాలి", "అడ్డంగా (వాలుగా) దాటాలి", "స్నేహితుడు తోసేవరకు ఆగాలి"], 0, "If the road is clear, walk straight across. Don't run. Always make sure the driver sees you.", "రోడ్డు ఖాళీగా ఉంటే నేరుగా నడిచి దాటాలి, పరిగెత్తవద్దు. డ్రైవర్ మిమ్మల్ని చూశాడని నిర్ధారించుకోండి."], ["Which of the following is a road safety hurdle?", "కిందివాటిలో రోడ్డు భద్రతకు ఆటంకం ఏది?", ["Using footpaths by pedestrians", "Following traffic signals", "Pedestrians crossing the road at zebra crossing", "None of these"], ["పాదచారులు ఫుట్‌పాత్ వాడటం", "ట్రాఫిక్ సిగ్నళ్ళు పాటించడం", "పాదచారులు జీబ్రా క్రాసింగ్ వద్ద దాటడం", "ఏదీ కాదు"], 3, "All three are safe practices, so none of them is a road safety hurdle. (Textbook exercise.)", "మూడూ సురక్షిత పద్ధతులే, కాబట్టి ఏదీ ఆటంకం కాదు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Identify the UNSAFE practice for a pedestrian", "పాదచారికి అసురక్షితమైన అలవాటు", ["Walking on railway tracks", "Using an over-bridge or subway", "Crossing at a zebra crossing", "Avoiding crossing at a blind curve"], ["రైలు పట్టాలపై నడవడం", "ఫుట్ ఓవర్ బ్రిడ్జ్ లేదా సబ్‌వే వాడటం", "జీబ్రా క్రాసింగ్ వద్ద దాటడం", "మలుపుల వద్ద దాటకుండా ఉండటం"], 0, "Never walk on railway tracks; always use the over-bridge, or wait for the gate/barrier to open. Never play on roads or accept rides from strangers.", "రైలు పట్టాలపై ఎప్పుడూ నడవవద్దు; ఓవర్ బ్రిడ్జ్ వాడాలి లేదా గేటు తెరిచేవరకు ఆగాలి. రోడ్లపై ఆడవద్దు, అపరిచితుల వాహనాల్లో ఎక్కవద్దు."], ["While cycling, a cyclist should ride", "సైకిల్ తొక్కేటప్పుడు సైకిలిస్ట్ ఇలా వెళ్ళాలి", ["Close to the kerb on the left, in single file", "In the middle of the road", "On the right side facing traffic", "Side by side with friends"], ["ఎడమవైపు అంచుకు దగ్గరగా, ఒక్కొక్కరుగా వరుసలో", "రోడ్డు మధ్యలో", "కుడివైపు ట్రాఫిక్‌కు ఎదురుగా", "స్నేహితులతో పక్కపక్కన"], 0, "Ride close to the kerb on the left in single file; use a cycle track if available; beware of uncovered drainage pits.", "ఎడమవైపు అంచుకు దగ్గరగా ఒక్కొక్కరుగా వెళ్ళాలి; సైకిల్ ట్రాక్ ఉంటే వాడాలి; మూతలేని డ్రైనేజీ గుంతల పట్ల జాగ్రత్త."], ["A cyclist should keep a safe lateral distance from heavy vehicles because", "సైకిలిస్ట్ భారీ వాహనాల నుండి సురక్షిత పక్క దూరం పాటించాలి, ఎందుకంటే", ["The wind turbulence created by them may throw the cyclist off balance", "They are always parked", "They move very slowly", "They have no horns"], ["వాటి వల్ల ఏర్పడే గాలి తాకిడి సైకిలిస్ట్ సమతుల్యం తప్పేలా చేయవచ్చు", "అవి ఎప్పుడూ నిలిపి ఉంటాయి", "అవి చాలా నెమ్మదిగా కదులుతాయి", "వాటికి హారన్ ఉండదు"], 0, "Wind turbulence created by heavy vehicles may throw a cyclist out of balance, so keep a safe lateral distance.", "భారీ వాహనాల వల్ల వచ్చే గాలి తాకిడి సైకిలిస్ట్‌ను పడేయవచ్చు, కాబట్టి సురక్షిత దూరం పాటించాలి."], ["Identify the correct safe-cycling practice", "సరైన సురక్షిత సైకిలింగ్ పద్ధతి", ["Use hand signals before starting, stopping or turning", "Ride at high speed on wet roads", "Cross when the signal is red", "Ride at night without a reflector or light"], ["బయలుదేరే, ఆగే, మలుపు తిరిగే ముందు చేతి సంకేతాలు ఇవ్వడం", "తడి రోడ్లపై వేగంగా వెళ్ళడం", "ఎరుపు సిగ్నల్‌లో దాటడం", "రాత్రి రిఫ్లెక్టర్, లైట్ లేకుండా వెళ్ళడం"], 0, "Use hand signals before you start, stop or turn; don't ride fast on wet roads; follow signals; have a reflector or light at night.", "బయలుదేరే, ఆగే, మలుపు తిరిగే ముందు చేతి సంకేతాలు ఇవ్వాలి; తడి రోడ్లపై వేగం వద్దు; సిగ్నళ్ళు పాటించాలి; రాత్రి రిఫ్లెక్టర్/లైట్ ఉండాలి."], ["While getting down from a vehicle, one should always get down", "వాహనం నుండి దిగేటప్పుడు ఎల్లప్పుడూ ఇలా దిగాలి", ["From the left side onto the footpath", "From the right side onto the road", "From a moving vehicle quickly", "Through the window"], ["ఎడమవైపు నుండి ఫుట్‌పాత్‌పైకి", "కుడివైపు నుండి రోడ్డుపైకి", "కదులుతున్న వాహనం నుండి వేగంగా", "కిటికీ గుండా"], 0, "Always get down from the left side onto the footpath; never get in or out of a moving vehicle.", "ఎల్లప్పుడూ ఎడమవైపు నుండి ఫుట్‌పాత్‌పైకి దిగాలి; కదులుతున్న వాహనం ఎక్కడం/దిగడం చేయవద్దు."], ["Identify the UNSAFE practice while travelling by bus", "బస్సు ప్రయాణంలో అసురక్షిత అలవాటు", ["Putting your head or hand out of the window", "Standing in a queue on the footpath", "Waiting till the bus leaves after getting down", "Not disturbing the driver"], ["కిటికీ నుండి తల లేదా చేయి బయటపెట్టడం", "ఫుట్‌పాత్‌పై వరుసలో నిలబడటం", "దిగిన తర్వాత బస్సు వెళ్ళేవరకు ఆగడం", "డ్రైవర్‌ను ఇబ్బంది పెట్టకపోవడం"], 0, "Never put your head or hand out of the window. Stand in a queue, don't push, wait till the bus leaves, never board or get down from a moving bus.", "కిటికీ నుండి తల/చేయి బయటపెట్టవద్దు. వరుసలో నిలబడాలి, తోసుకోవద్దు, బస్సు వెళ్ళేవరకు ఆగాలి, కదులుతున్న బస్సు ఎక్కవద్దు/దిగవద్దు."], ["After getting down from a bus, the safe practice is to", "బస్సు దిగిన తర్వాత సురక్షిత పద్ధతి", ["Wait till the bus leaves and then cross from a safe point following the kerb drill", "Cross immediately in front of the bus", "Run behind the bus", "Cross from between parked vehicles"], ["బస్సు వెళ్ళేవరకు ఆగి, కెర్బ్ డ్రిల్ పాటించి సురక్షిత చోట దాటడం", "వెంటనే బస్సు ముందు నుండి దాటడం", "బస్సు వెనుక పరిగెత్తడం", "నిలిపిన వాహనాల మధ్య నుండి దాటడం"], 0, "After getting down, wait till the bus leaves, then walk across from a safe point — remember the kerb drill.", "దిగిన తర్వాత బస్సు వెళ్ళేవరకు ఆగి, సురక్షిత చోట నుండి కెర్బ్ డ్రిల్ పాటిస్తూ దాటాలి."], ["Identify the safety measure that is compulsory while travelling in a car", "కారులో ప్రయాణించేటప్పుడు తప్పనిసరి భద్రతా చర్య", ["Wearing a seat belt", "Keeping the doors unlocked", "Travelling in an overcrowded car", "Disturbing the driver"], ["సీట్ బెల్ట్ పెట్టుకోవడం", "తలుపులు తెరిచి ఉంచడం", "కిక్కిరిసిన కారులో ప్రయాణం", "డ్రైవర్‌ను ఇబ్బంది పెట్టడం"], 0, "Put on your seat belt in a car; see that doors are properly locked; avoid overcrowded vehicles; never disturb the driver.", "కారులో సీట్ బెల్ట్ పెట్టుకోవాలి; తలుపులు సరిగా మూయాలి; కిక్కిరిసిన వాహనాల్లో ప్రయాణించవద్దు; డ్రైవర్‌ను ఇబ్బంది పెట్టవద్దు."], ["The minimum age limit for driving a motor vehicle as given in the textbook is", "పాఠ్యపుస్తకం ప్రకారం మోటారు వాహనం నడపడానికి కనీస వయసు", ["18 years", "14 years", "16 years", "21 years"], ["18 ఏళ్ళు", "14 ఏళ్ళు", "16 ఏళ్ళు", "21 ఏళ్ళు"], 0, "The minimum age limit for driving a motor vehicle is 18 years; a valid driving licence is required.", "మోటారు వాహనం నడపడానికి కనీస వయసు 18 ఏళ్ళు; చెల్లుబాటు అయ్యే డ్రైవింగ్ లైసెన్స్ తప్పనిసరి."], ["While riding a motorcycle, the most important safety gear to be worn is a", "మోటార్ సైకిల్ నడిపేటప్పుడు తప్పక ధరించాల్సిన ముఖ్య భద్రతా పరికరం", ["Helmet", "Cap", "Scarf", "Sunglasses only"], ["హెల్మెట్", "టోపీ", "స్కార్ఫ్", "కళ్ళజోడు మాత్రమే"], 0, "Wear a helmet while driving a motorcycle; avoiding helmets and seat belts is a major cause of serious injury.", "మోటార్ సైకిల్ నడిపేటప్పుడు హెల్మెట్ ధరించాలి; హెల్మెట్, సీట్ బెల్ట్ ధరించకపోవడం తీవ్ర గాయాలకు ప్రధాన కారణం."], ["The road safety slogan 'Fast Drive Could be Last Drive' mainly warns against", "'ఫాస్ట్ డ్రైవ్ కుడ్ బి లాస్ట్ డ్రైవ్' అనే రోడ్డు భద్రతా నినాదం ప్రధానంగా హెచ్చరించేది", ["Over speeding", "Using footpaths", "Wearing helmets", "Following signals"], ["అతివేగం", "ఫుట్‌పాత్ వాడకం", "హెల్మెట్ ధరించడం", "సిగ్నళ్ళు పాటించడం"], 0, "'Fast Drive Could be Last Drive' and 'Start Early, Drive Slowly, Reach Safely' warn against over speeding, a major cause of crashes.", "'ఫాస్ట్ డ్రైవ్ కుడ్ బి లాస్ట్ డ్రైవ్', 'ముందుగా బయలుదేరి, నెమ్మదిగా నడిపి, సురక్షితంగా చేరండి' — అతివేగం పట్ల హెచ్చరికలు."], ["Using a mobile phone while driving is dangerous mainly because it causes", "డ్రైవింగ్‌లో మొబైల్ ఫోన్ వాడటం ప్రమాదకరం, ఎందుకంటే ఇది కలిగించేది", ["Distraction of the driver", "Better concentration", "Reduced speed always", "Clear vision"], ["డ్రైవర్ దృష్టి మళ్ళడం", "మెరుగైన ఏకాగ్రత", "ఎప్పుడూ వేగం తగ్గడం", "స్పష్టమైన దృష్టి"], 0, "Mobile phone use and other distractions take the driver's attention off the road — a major urban cause of crashes.", "మొబైల్ వాడకం డ్రైవర్ దృష్టిని రోడ్డు నుండి మళ్ళిస్తుంది — పట్టణ ప్రమాదాలకు ప్రధాన కారణం."], ["The pole with three lights (red, orange, green) placed at road junctions is meant to", "రోడ్డు కూడళ్ళలో ఉండే మూడు లైట్ల (ఎరుపు, నారింజ, ఆకుపచ్చ) స్తంభం ఉద్దేశం", ["Regulate the road traffic", "Light up the road at night", "Decorate the junction", "Count the vehicles"], ["రోడ్డు ట్రాఫిక్‌ను నియంత్రించడం", "రాత్రి రోడ్డుకు వెలుతురు ఇవ్వడం", "కూడలిని అలంకరించడం", "వాహనాలను లెక్కించడం"], 0, "As Satwik's grandfather explains, traffic signal lights regulate the road traffic, which consists of pedestrians, vehicles, animals and others.", "సాత్విక్ తాతయ్య వివరించినట్లు ట్రాఫిక్ సిగ్నల్ లైట్లు పాదచారులు, వాహనాలు, జంతువులు మొదలైనవాటితో కూడిన రోడ్డు ట్రాఫిక్‌ను నియంత్రిస్తాయి."], ["In the Kerb Drill, after stopping at the kerb, a child should first look to the", "కెర్బ్ డ్రిల్‌లో అంచు వద్ద ఆగిన తర్వాత పిల్లవాడు మొదట చూడాల్సిన వైపు", ["Right", "Left", "Back", "Sky"], ["కుడివైపు", "ఎడమవైపు", "వెనుకవైపు", "పైకి"], 0, "Stop at the kerb, look right, look left, look right again — in India vehicles drive on the left, so the nearest traffic comes from the right.", "అంచు వద్ద ఆగి, కుడి, ఎడమ, మళ్ళీ కుడి చూడాలి — భారతదేశంలో వాహనాలు ఎడమవైపు నడుస్తాయి కాబట్టి దగ్గరి ట్రాఫిక్ కుడివైపు నుండి వస్తుంది."], ["To create road safety awareness, a teacher takes students on a placard rally in the village and asks them to interview traffic police. This approach mainly promotes", "రోడ్డు భద్రతపై అవగాహనకు ఉపాధ్యాయుడు విద్యార్థులతో గ్రామంలో ప్లకార్డుల ర్యాలీ చేయించి, ట్రాఫిక్ పోలీసులను ఇంటర్వ్యూ చేయమన్నాడు. ఈ విధానం ప్రధానంగా ప్రోత్సహించేది", ["Community-linked, experiential learning and application in daily life", "Memorising sign names only", "Competition among students", "Avoiding the topic"], ["సమాజంతో ముడిపడిన అనుభవపూర్వక అభ్యసనం, దైనందిన జీవితంలో అన్వయం", "గుర్తుల పేర్లు బట్టీ పట్టడం", "విద్యార్థుల మధ్య పోటీ", "అంశాన్ని దాటవేయడం"], 0, "Rallies, interviews and field visits connect classroom learning with the community and help apply road safety knowledge in daily life — a key learning outcome of this chapter.", "ర్యాలీలు, ఇంటర్వ్యూలు, క్షేత్ర సందర్శనలు తరగతి అభ్యసనను సమాజంతో అనుసంధానించి రోడ్డు భద్రతా జ్ఞానాన్ని దైనందిన జీవితంలో అన్వయించేలా చేస్తాయి — ఈ అధ్యాయ ముఖ్య అభ్యసన ఫలితం."]]}, {"n": 12, "en": "Markets Around Us", "te": "మన చుట్టూ ఉన్న మార్కెట్లు", "c": "#e11d48", "q": [["A market is a place where", "మార్కెట్ అంటే", ["Buyers and sellers interact with each other", "Only goods are produced", "Only farmers live", "Only government offices work"], ["కొనుగోలుదారులు, అమ్మకందారులు పరస్పరం వ్యవహరించే ప్రదేశం", "వస్తువులు ఉత్పత్తి అయ్యే చోటు మాత్రమే", "రైతులు మాత్రమే నివసించే చోటు", "ప్రభుత్వ కార్యాలయాలు మాత్రమే పనిచేసే చోటు"], 0, "A market is a place where buyers (people who buy) and sellers (people who sell) interact with each other.", "కొనుగోలుదారులు (కొనేవారు), అమ్మకందారులు (అమ్మేవారు) పరస్పరం వ్యవహరించే ప్రదేశమే మార్కెట్."], ["Depending upon how they work, markets can be broadly classified into", "పనిచేసే విధానం ఆధారంగా మార్కెట్లను స్థూలంగా ఇలా వర్గీకరిస్తారు", ["Physical markets and E-markets", "Local and Regional markets", "Wholesale and Retail markets", "Weekly and Daily markets"], ["భౌతిక మార్కెట్లు, ఇ-మార్కెట్లు", "స్థానిక, ప్రాంతీయ మార్కెట్లు", "టోకు, చిల్లర మార్కెట్లు", "వారపు, రోజువారీ మార్కెట్లు"], 0, "Broadly, markets are classified into two types: 1. Physical markets, 2. E-markets (online markets).", "మార్కెట్లు స్థూలంగా రెండు రకాలు: 1. భౌతిక మార్కెట్లు, 2. ఇ-మార్కెట్లు (ఆన్‌లైన్ మార్కెట్లు)."], ["According to the Portuguese traveller Domingo Paes, the markets in the Vijayanagara Empire, where one could buy everything from common goods to diamonds, were called", "పోర్చుగీస్ యాత్రికుడు డొమింగో పేస్ ప్రకారం సాధారణ వస్తువుల నుండి వజ్రాల వరకు అన్నీ దొరికే విజయనగర మార్కెట్ల పేరు", ["Bazaars", "Malls", "Santhas", "Rythu Bazars"], ["బజార్లు", "మాల్స్", "సంతలు", "రైతు బజార్లు"], 0, "Domingo Paes wrote that the Vijayanagara Empire had markets called bazaars where one could purchase everything from common goods to valuable jewellery and diamonds.", "విజయనగర సామ్రాజ్యంలో బజార్లు ఉండేవని, అక్కడ సాధారణ వస్తువుల నుండి విలువైన ఆభరణాలు, వజ్రాల వరకు దొరికేవని డొమింగో పేస్ రాశాడు."], ["During the Middle Ages, which of the following were exported from Indian markets to Persia, Italy, China and Japan?", "మధ్యయుగంలో భారతీయ మార్కెట్ల నుండి పర్షియా, ఇటలీ, చైనా, జపాన్‌లకు ఎగుమతి అయినవి", ["Spices, handloom textiles, handicrafts, copper and brass utensils, gold and silver jewellery", "Petroleum and machinery", "Computers and mobile phones", "Automobiles and steel"], ["సుగంధ ద్రవ్యాలు, చేనేత వస్త్రాలు, హస్తకళలు, రాగి–ఇత్తడి పాత్రలు, బంగారు–వెండి ఆభరణాలు", "పెట్రోలియం, యంత్రాలు", "కంప్యూటర్లు, మొబైల్ ఫోన్లు", "వాహనాలు, ఉక్కు"], 0, "Spices, handloom textiles, handicrafts, copper and brass utensils, gold and silver jewellery were exported by land and sea routes.", "సుగంధ ద్రవ్యాలు, చేనేత వస్త్రాలు, హస్తకళలు, రాగి–ఇత్తడి పాత్రలు, బంగారు–వెండి ఆభరణాలు భూ, సముద్ర మార్గాల ద్వారా ఎగుమతి అయ్యేవి."], ["Kamala's son Balu asked for mangoes in winter, but the fruit seller said they were available only in summer. This shows that", "చలికాలంలో బాలు మామిడిపండ్లు అడగగా అవి వేసవిలో మాత్రమే దొరుకుతాయని పండ్ల వ్యాపారి చెప్పాడు. దీని అర్థం", ["The availability of some goods in markets depends on the season", "Markets sell all goods throughout the year", "Mangoes are imported only in winter", "Fruit sellers do not sell fruits"], ["కొన్ని వస్తువులు మార్కెట్లో రుతువును బట్టి దొరుకుతాయి", "మార్కెట్లలో అన్ని వస్తువులు ఏడాది పొడవునా దొరుకుతాయి", "మామిడిని చలికాలంలో మాత్రమే దిగుమతి చేస్తారు", "పండ్ల వ్యాపారులు పండ్లు అమ్మరు"], 0, "Seasonal goods like mangoes are available only in their season; demand and supply in markets vary with seasons.", "మామిడి వంటి సీజనల్ వస్తువులు ఆ రుతువులోనే దొరుకుతాయి; మార్కెట్లలో గిరాకీ, సరఫరా రుతువును బట్టి మారతాయి."], ["Regional markets differ from local markets because they", "ప్రాంతీయ మార్కెట్లు స్థానిక మార్కెట్ల కంటే భిన్నమైనవి, ఎందుకంటే అవి", ["Cover a wider area, even a group of states, depending on availability of goods in a region", "Operate only one day a week", "Operate only online", "Sell only to foreign countries"], ["ఒక ప్రాంతంలో వస్తువుల లభ్యతను బట్టి విస్తృత ప్రాంతం — కొన్ని రాష్ట్రాల సమూహం వరకు — విస్తరిస్తాయి", "వారానికి ఒక్క రోజు మాత్రమే పనిచేస్తాయి", "ఆన్‌లైన్‌లో మాత్రమే పనిచేస్తాయి", "విదేశాలకు మాత్రమే అమ్ముతాయి"], 0, "Regional markets cover a wider area than local markets, depending on availability of goods in a particular region or even a group of states.", "ప్రాంతీయ మార్కెట్లు ఒక ప్రాంతంలో వస్తువుల లభ్యతను బట్టి స్థానిక మార్కెట్ల కంటే విస్తృత ప్రాంతాన్ని, కొన్ని రాష్ట్రాల సమూహాన్ని కూడా కవర్ చేస్తాయి."], ["A place where buyers can physically meet the sellers and purchase the desired items is called a", "కొనుగోలుదారులు అమ్మకందారులను నేరుగా కలిసి కావలసిన వస్తువులు కొనే ప్రదేశం", ["Physical market", "E-market", "Online market", "Virtual market"], ["భౌతిక మార్కెట్", "ఇ-మార్కెట్", "ఆన్‌లైన్ మార్కెట్", "వర్చువల్ మార్కెట్"], 0, "In a physical market buyers physically meet sellers; e.g., shopping malls, departmental stores, retail stores.", "భౌతిక మార్కెట్‌లో కొనుగోలుదారులు అమ్మకందారులను నేరుగా కలుస్తారు; ఉదా: షాపింగ్ మాల్స్, డిపార్ట్‌మెంటల్ స్టోర్లు, రిటైల్ దుకాణాలు."], ["Arrange the physical markets based on geographical location from the smallest to the largest coverage", "భౌగోళిక స్థానం ఆధారంగా భౌతిక మార్కెట్లను చిన్నదాని నుండి పెద్దదానికి అమర్చండి", ["Local, Regional, National, International", "Regional, Local, International, National", "National, Local, Regional, International", "Local, National, Regional, International"], ["స్థానిక, ప్రాంతీయ, జాతీయ, అంతర్జాతీయ", "ప్రాంతీయ, స్థానిక, అంతర్జాతీయ, జాతీయ", "జాతీయ, స్థానిక, ప్రాంతీయ, అంతర్జాతీయ", "స్థానిక, జాతీయ, ప్రాంతీయ, అంతర్జాతీయ"], 0, "Based on geographical location: Local → Regional → National → International markets.", "భౌగోళిక స్థానం ఆధారంగా: స్థానిక → ప్రాంతీయ → జాతీయ → అంతర్జాతీయ మార్కెట్లు."], ["A market where buyers and sellers are limited to the local area and which usually sells goods of daily use like vegetables and fruits is a", "కొనుగోలుదారులు, అమ్మకందారులు స్థానిక ప్రాంతానికే పరిమితమై, కూరగాయలు, పండ్లు వంటి రోజువారీ వస్తువులు అమ్మే మార్కెట్", ["Local market", "National market", "International market", "Regional market"], ["స్థానిక మార్కెట్", "జాతీయ మార్కెట్", "అంతర్జాతీయ మార్కెట్", "ప్రాంతీయ మార్కెట్"], 0, "In a local market buyers and sellers are limited to the local area; it usually sells goods of daily use like vegetables and fruits.", "స్థానిక మార్కెట్‌లో కొనుగోలుదారులు, అమ్మకందారులు స్థానిక ప్రాంతానికే పరిమితం; కూరగాయలు, పండ్లు వంటి రోజువారీ వస్తువులు అమ్ముతారు."], ["The selling of fish, transported from coastal regions, all over the country is an example of a", "తీర ప్రాంతాల నుండి రవాణా అయిన చేపలను దేశమంతటా అమ్మడం దీనికి ఉదాహరణ", ["National market", "Local market", "Weekly market", "Floating market"], ["జాతీయ మార్కెట్", "స్థానిక మార్కెట్", "వారపు సంత", "తేలియాడే మార్కెట్"], 0, "A national market is where trade in goods and services takes place in all parts of the country — e.g., fish from coastal regions sold all over the country.", "దేశమంతటా వస్తుసేవల వ్యాపారం జరిగేది జాతీయ మార్కెట్ — ఉదా: తీర ప్రాంతాల చేపలు దేశమంతా అమ్మకం."], ["Export of crude oil from Gulf countries to all other nations of the world is an example of an", "గల్ఫ్ దేశాల నుండి ప్రపంచంలోని ఇతర దేశాలకు ముడిచమురు ఎగుమతి దీనికి ఉదాహరణ", ["International market", "Regional market", "Local market", "Neighbourhood market"], ["అంతర్జాతీయ మార్కెట్", "ప్రాంతీయ మార్కెట్", "స్థానిక మార్కెట్", "పొరుగు మార్కెట్"], 0, "Trading of goods and services among different countries is an international market — e.g., export of crude oil from Gulf countries.", "వివిధ దేశాల మధ్య వస్తుసేవల వ్యాపారం అంతర్జాతీయ మార్కెట్ — ఉదా: గల్ఫ్ దేశాల ముడిచమురు ఎగుమతి."], ["Which of the following goods has a demand in the international market?", "కిందివాటిలో అంతర్జాతీయ మార్కెట్‌లో గిరాకీ ఉన్న వస్తువు", ["Gold", "Jewellery", "Petroleum", "All the above"], ["బంగారం", "ఆభరణాలు", "పెట్రోలియం", "పైవన్నీ"], 3, "Gold, jewellery and petroleum are all traded among countries, so all have demand in the international market. (Textbook exercise.)", "బంగారం, ఆభరణాలు, పెట్రోలియం అన్నీ దేశాల మధ్య వ్యాపారం అవుతాయి; అన్నింటికీ అంతర్జాతీయ గిరాకీ ఉంది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Identify the market that is classified based on NATURE (not geographical location)", "స్వభావం ఆధారంగా (భౌగోళిక స్థానం ఆధారంగా కాకుండా) వర్గీకరించిన మార్కెట్", ["Weekly market", "Local market", "Regional market", "International market"], ["వారపు సంత", "స్థానిక మార్కెట్", "ప్రాంతీయ మార్కెట్", "అంతర్జాతీయ మార్కెట్"], 0, "Based on nature: neighbourhood markets, weekly markets, shopping malls, shopping complexes. Local, regional, national and international are based on geographical location.", "స్వభావం ఆధారంగా: పొరుగు మార్కెట్లు, వారపు సంతలు, షాపింగ్ మాల్స్, షాపింగ్ కాంప్లెక్స్‌లు. స్థానిక, ప్రాంతీయ, జాతీయ, అంతర్జాతీయ — భౌగోళిక స్థానం ఆధారం."], ["Shops located next to our house or at the end of the street, some in permanent buildings and some in temporary sheds or movable carts, are called", "మన ఇంటి పక్కన లేదా వీధి చివర, కొన్ని శాశ్వత భవనాల్లో, కొన్ని తాత్కాలిక షెడ్లు లేదా తోపుడు బండ్లపై ఉండే దుకాణాలు", ["Neighbourhood shops", "Shopping malls", "Weekly markets", "E-markets"], ["పొరుగు దుకాణాలు", "షాపింగ్ మాల్స్", "వారపు సంతలు", "ఇ-మార్కెట్లు"], 0, "Shops next to our house or at the end of the street are neighbourhood shops; we buy groceries, books, medicines etc. from them.", "ఇంటి పక్కన లేదా వీధి చివర ఉండే దుకాణాలు పొరుగు దుకాణాలు; వాటి నుండి సరుకులు, పుస్తకాలు, మందులు కొంటాం."], ["One special benefit of neighbourhood stores, since we make frequent purchases there, is that", "తరచుగా కొనుగోళ్ళు చేయడం వల్ల పొరుగు దుకాణాల ప్రత్యేక ప్రయోజనం", ["We can buy items on credit and pay later", "They are open only once a week", "They sell only branded goods", "They are air-conditioned"], ["అప్పుగా కొని తర్వాత డబ్బు చెల్లించవచ్చు", "వారానికి ఒకసారి మాత్రమే తెరుస్తారు", "బ్రాండెడ్ వస్తువులు మాత్రమే అమ్ముతారు", "ఎయిర్ కండిషన్డ్‌గా ఉంటాయి"], 0, "We can go to neighbourhood stores any time and, since we buy frequently, we can buy on credit and pay later.", "పొరుగు దుకాణాలకు ఏ సమయంలోనైనా వెళ్ళవచ్చు; తరచుగా కొంటాం కాబట్టి అప్పుగా తీసుకుని తర్వాత చెల్లించవచ్చు."], ["Payments made in the form of cash, cheque or drafts are called", "నగదు, చెక్కు లేదా డ్రాఫ్ట్ రూపంలో చేసే చెల్లింపులు", ["Physical payments", "Digital payments", "Electronic payments", "UPI payments"], ["భౌతిక చెల్లింపులు", "డిజిటల్ చెల్లింపులు", "ఎలక్ట్రానిక్ చెల్లింపులు", "యూపీఐ చెల్లింపులు"], 0, "Physical payments are made in cash, cheque or drafts; digital payments use debit/credit cards, UPI, QR codes, mobile wallets or internet banking.", "భౌతిక చెల్లింపులు నగదు, చెక్కు, డ్రాఫ్ట్‌ల రూపంలో; డిజిటల్ చెల్లింపులు డెబిట్/క్రెడిట్ కార్డు, యూపీఐ, క్యూఆర్ కోడ్, మొబైల్ వాలెట్, నెట్ బ్యాంకింగ్ ద్వారా."], ["Identify the mode that is NOT a digital or electronic payment", "డిజిటల్ లేదా ఎలక్ట్రానిక్ చెల్లింపు కానిది", ["UPI with QR code", "Mobile wallet", "Internet banking", "Cash"], ["క్యూఆర్ కోడ్‌తో యూపీఐ", "మొబైల్ వాలెట్", "ఇంటర్నెట్ బ్యాంకింగ్", "నగదు"], 3, "Cash is a physical payment; UPI, mobile wallets, internet banking and cards are digital payments.", "నగదు భౌతిక చెల్లింపు; యూపీఐ, మొబైల్ వాలెట్, నెట్ బ్యాంకింగ్, కార్డులు డిజిటల్ చెల్లింపులు."], ["A card issued by financial institutions which lets you borrow funds up to a pre-approved limit to pay for your purchases is a", "ముందుగా ఆమోదించిన పరిమితి వరకు అప్పు తీసుకుని కొనుగోళ్ళకు చెల్లించడానికి ఆర్థిక సంస్థలు జారీ చేసే కార్డు", ["Credit card", "Debit card", "Ration card", "Aadhaar card"], ["క్రెడిట్ కార్డు", "డెబిట్ కార్డు", "రేషన్ కార్డు", "ఆధార్ కార్డు"], 0, "A credit card lets you borrow funds from a pre-approved limit to pay for purchases.", "క్రెడిట్ కార్డు ముందుగా ఆమోదించిన పరిమితి వరకు అప్పుగా కొనుగోళ్ళకు చెల్లించేందుకు వీలు కల్పిస్తుంది."], ["For online shopping we can pay through", "ఆన్‌లైన్ షాపింగ్‌కు చెల్లించే పద్ధతి", ["Net banking", "Credit card", "Debit card", "All of these"], ["నెట్ బ్యాంకింగ్", "క్రెడిట్ కార్డు", "డెబిట్ కార్డు", "పైవన్నీ"], 3, "Net banking, credit cards and debit cards can all be used for online shopping. (Textbook exercise.)", "నెట్ బ్యాంకింగ్, క్రెడిట్ కార్డు, డెబిట్ కార్డు అన్నీ ఆన్‌లైన్ షాపింగ్‌కు వాడవచ్చు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Traditional markets, generally found in rural areas, set up on a particular day every week from early morning till evening, are called", "గ్రామీణ ప్రాంతాల్లో వారంలో ఒక నిర్దిష్ట రోజున ఉదయం నుండి సాయంత్రం వరకు జరిగే సంప్రదాయ మార్కెట్లు", ["Weekly markets (Santha)", "Shopping malls", "E-markets", "Shopping complexes"], ["వారపు సంతలు", "షాపింగ్ మాల్స్", "ఇ-మార్కెట్లు", "షాపింగ్ కాంప్లెక్స్‌లు"], 0, "Weekly markets (Santha) are traditional rural markets set up on a particular day every week, early morning to evening.", "వారపు సంతలు గ్రామీణ సంప్రదాయ మార్కెట్లు; వారంలో ఒక రోజు ఉదయం నుండి సాయంత్రం వరకు జరుగుతాయి."], ["In which of the following markets are goods available at cheaper rates?", "కిందివాటిలో ఏ మార్కెట్‌లో వస్తువులు తక్కువ ధరకు దొరుకుతాయి?", ["Shopping Mall", "Weekly Markets", "E-Market", "Neighbourhood Markets"], ["షాపింగ్ మాల్", "వారపు సంతలు", "ఇ-మార్కెట్", "పొరుగు మార్కెట్లు"], 1, "Because of low maintenance costs, weekly markets can sell goods at lower prices than regular markets. (Textbook exercise.)", "నిర్వహణ ఖర్చులు తక్కువ కాబట్టి వారపు సంతల్లో సాధారణ మార్కెట్ల కంటే తక్కువ ధరకు వస్తువులు అమ్మగలరు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Identify the one that is NOT a problem faced by weekly markets", "వారపు సంతలు ఎదుర్కొనే సమస్య కానిది", ["Lack of proper transportation facilities", "Lack of protection for temporary shops", "Lack of drinking water and toilets", "Very high maintenance costs"], ["సరైన రవాణా సౌకర్యాల లోపం", "తాత్కాలిక దుకాణాలకు రక్షణ లేకపోవడం", "తాగునీరు, మరుగుదొడ్ల లోపం", "చాలా ఎక్కువ నిర్వహణ ఖర్చులు"], 3, "Weekly markets have LOW maintenance costs. Their problems: distance from urban areas, poor transport, investment problems, no protection for temporary shops, lack of water and toilets, seasonal demand.", "వారపు సంతల నిర్వహణ ఖర్చులు తక్కువ. సమస్యలు: పట్టణాలకు దూరం, రవాణా లోపం, పెట్టుబడి సమస్యలు, తాత్కాలిక దుకాణాలకు రక్షణ లేకపోవడం, నీరు, మరుగుదొడ్ల లోపం, సీజనల్ గిరాకీ."], ["Traders in weekly markets have to move from one business to another in different seasons because", "వారపు సంతల వ్యాపారులు వేర్వేరు రుతువుల్లో ఒక వ్యాపారం నుండి మరో వ్యాపారానికి మారాల్సి వస్తుంది, ఎందుకంటే", ["The demand for goods varies from one season to another", "Government forces them", "They have permanent shops", "They sell only online"], ["వస్తువుల గిరాకీ రుతువును బట్టి మారుతుంది", "ప్రభుత్వం బలవంతం చేస్తుంది", "వారికి శాశ్వత దుకాణాలు ఉన్నాయి", "వారు ఆన్‌లైన్‌లో మాత్రమే అమ్ముతారు"], 0, "Demand varies with seasons, so traders may not be able to sell the same goods throughout the year.", "గిరాకీ రుతువును బట్టి మారుతుంది కాబట్టి వ్యాపారులు ఏడాది పొడవునా ఒకే వస్తువులు అమ్మలేరు."], ["Rythu Bazar, a farmers' market run by the Government of Andhra Pradesh, was started in", "ఆంధ్రప్రదేశ్ ప్రభుత్వం నిర్వహించే రైతు బజార్ ప్రారంభమైనది", ["January 1999", "August 2019", "January 2010", "December 1988"], ["జనవరి 1999", "ఆగస్టు 2019", "జనవరి 2010", "డిసెంబర్ 1988"], 0, "Rythu Bazar was started in January 1999 by the Government of Andhra Pradesh for the benefit of farmers.", "రైతు బజార్‌ను ఆంధ్రప్రదేశ్ ప్రభుత్వం రైతుల ప్రయోజనం కోసం జనవరి 1999లో ప్రారంభించింది."], ["The main aim of Rythu Bazars is to", "రైతు బజార్ల ప్రధాన లక్ష్యం", ["Avoid middlemen so that farmers sell directly to consumers and get a good price", "Sell only imported goods", "Help shopping malls", "Increase the number of agents"], ["దళారులను నివారించి రైతులు నేరుగా వినియోగదారులకు అమ్మి మంచి ధర పొందేలా చేయడం", "దిగుమతి వస్తువులు మాత్రమే అమ్మడం", "షాపింగ్ మాల్స్‌కు సహాయం", "దళారుల సంఖ్య పెంచడం"], 0, "Rythu Bazars avoid middlemen; marginal and small farmers sell vegetables directly to consumers, get good prices, and consumers get quality products.", "రైతు బజార్లు దళారులను నివారిస్తాయి; చిన్న, సన్నకారు రైతులు నేరుగా వినియోగదారులకు అమ్మి మంచి ధర పొందుతారు; వినియోగదారులకు నాణ్యమైన సరుకులు."], ["Large multi-storied air-conditioned buildings in urban areas with shops on different floors, restaurants, banks and multiplexes are known as", "పట్టణాల్లో వివిధ అంతస్తుల్లో దుకాణాలు, రెస్టారెంట్లు, బ్యాంకులు, మల్టీప్లెక్స్‌లు ఉండే పెద్ద బహుళ అంతస్తుల ఏసీ భవనాలు", ["Shopping malls", "Weekly markets", "Rythu Bazars", "Neighbourhood markets"], ["షాపింగ్ మాల్స్", "వారపు సంతలు", "రైతు బజార్లు", "పొరుగు మార్కెట్లు"], 0, "Malls are large multi-storied air-conditioned buildings with branded and non-branded goods, restaurants, banks, multiplexes and service stations.", "మాల్స్ పెద్ద బహుళ అంతస్తుల ఏసీ భవనాలు; బ్రాండెడ్, నాన్-బ్రాండెడ్ వస్తువులు, రెస్టారెంట్లు, బ్యాంకులు, మల్టీప్లెక్స్‌లు ఉంటాయి."], ["Match the following:\nA. Internet Banking   B. International Market   C. Farmer   D. Multinational Companies\n1. Shopping Malls   2. Producer   3. Petroleum   4. Digital Payments", "జతపరచండి:\nA. ఇంటర్నెట్ బ్యాంకింగ్   B. అంతర్జాతీయ మార్కెట్   C. రైతు   D. బహుళజాతి కంపెనీలు\n1. షాపింగ్ మాల్స్   2. ఉత్పత్తిదారు   3. పెట్రోలియం   4. డిజిటల్ చెల్లింపులు", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Internet banking – digital payments; International market – petroleum; Farmer – producer; Multinational companies – shopping malls. (Textbook exercise.)", "ఇంటర్నెట్ బ్యాంకింగ్ – డిజిటల్ చెల్లింపులు; అంతర్జాతీయ మార్కెట్ – పెట్రోలియం; రైతు – ఉత్పత్తిదారు; బహుళజాతి కంపెనీలు – షాపింగ్ మాల్స్. (పాఠ్యపుస్తక అభ్యాసం.)"], ["A place in towns where shops selling almost all kinds of goods — groceries, clothing, household items, tools, electronics — are on the same premises is a", "పట్టణాల్లో సరుకులు, బట్టలు, గృహోపకరణాలు, పనిముట్లు, ఎలక్ట్రానిక్స్ — దాదాపు అన్ని రకాల వస్తువుల దుకాణాలు ఒకే ఆవరణలో ఉండే ప్రదేశం", ["Shopping complex", "Weekly market", "Floating market", "Rythu Bazar"], ["షాపింగ్ కాంప్లెక్స్", "వారపు సంత", "తేలియాడే మార్కెట్", "రైతు బజార్"], 0, "A shopping complex has shops selling almost all kinds of goods on the same premises, so buyers can buy everything in one place.", "షాపింగ్ కాంప్లెక్స్‌లో దాదాపు అన్ని రకాల వస్తువుల దుకాణాలు ఒకే ఆవరణలో ఉంటాయి; అన్నీ ఒకేచోట కొనవచ్చు."], ["The famous floating market where vegetables are traded through boats called 'Shikara' every day from 5 am to 7 am is in", "ప్రతిరోజు ఉదయం 5 నుండి 7 వరకు 'శికారా' పడవల ద్వారా కూరగాయల వ్యాపారం జరిగే ప్రసిద్ధ తేలియాడే మార్కెట్ ఉన్నది", ["Dal Lake, Srinagar", "Kolleru Lake, Andhra Pradesh", "Chilika Lake, Odisha", "Hussain Sagar, Hyderabad"], ["దాల్ సరస్సు, శ్రీనగర్", "కొల్లేరు సరస్సు, ఆంధ్రప్రదేశ్", "చిలికా సరస్సు, ఒడిశా", "హుస్సేన్ సాగర్, హైదరాబాద్"], 0, "The floating market is on Dal Lake, Srinagar (J&K); besides vegetables, wood carvings and saffron are sold on Shikaras.", "తేలియాడే మార్కెట్ శ్రీనగర్ (జమ్మూ కాశ్మీర్) దాల్ సరస్సులో ఉంది; కూరగాయలతో పాటు చెక్క నగిషీలు, కుంకుమపువ్వు శికారాలపై అమ్ముతారు."], ["The boats used in the floating market of Dal Lake are locally called", "దాల్ సరస్సు తేలియాడే మార్కెట్‌లో వాడే పడవల స్థానిక పేరు", ["Shikara", "Kettuvallam", "Dhow", "Catamaran"], ["శికారా", "కెట్టువల్లం", "ధౌ", "కటమరాన్"], 0, "The boats are called 'Shikara' in the local language.", "ఈ పడవలను స్థానిక భాషలో 'శికారా' అంటారు."], ["The song 'In the Bazaars of Hyderabad', mentioned in the textbook, was written by", "పాఠ్యపుస్తకంలో ప్రస్తావించిన 'ఇన్ ది బజార్స్ ఆఫ్ హైదరాబాద్' గీతం రచయిత్రి", ["Sarojini Naidu", "Mahadevi Varma", "Durgabai Deshmukh", "Sucheta Kripalani"], ["సరోజినీ నాయుడు", "మహాదేవి వర్మ", "దుర్గాబాయి దేశ్‌ముఖ్", "సుచేతా కృపలానీ"], 0, "'In the Bazaars of Hyderabad' was written by Sarojini Naidu.", "'ఇన్ ది బజార్స్ ఆఫ్ హైదరాబాద్' గీతాన్ని సరోజినీ నాయుడు రాశారు."], ["A business platform that allows buyers and sellers to buy or sell things over the internet is called", "ఇంటర్నెట్ ద్వారా కొనుగోలుదారులు, అమ్మకందారులు వస్తువులు కొనడానికి/అమ్మడానికి వీలు కల్పించే వ్యాపార వేదిక", ["E-commerce", "Weekly market", "Barter system", "Wholesale"], ["ఇ-కామర్స్", "వారపు సంత", "వస్తు మార్పిడి", "టోకు వ్యాపారం"], 0, "Electronic commerce (e-commerce) or online market allows buying and selling over the internet using a mobile phone or computer.", "ఎలక్ట్రానిక్ కామర్స్ (ఇ-కామర్స్) లేదా ఆన్‌లైన్ మార్కెట్ ద్వారా మొబైల్ లేదా కంప్యూటర్‌తో ఇంటర్నెట్‌లో కొనుగోళ్ళు, అమ్మకాలు చేయవచ్చు."], ["Consider the following statements:\nI. Physical markets are confined to a particular place and work at particular times.\nII. In e-markets we can buy goods without stepping out of our home.", "కింది వాక్యాలను పరిశీలించండి:\nI. భౌతిక మార్కెట్లు ఒక నిర్దిష్ట ప్రదేశానికి పరిమితమై నిర్దిష్ట సమయాల్లో పనిచేస్తాయి.\nII. ఇ-మార్కెట్లలో ఇంటి నుండి బయటకు వెళ్ళకుండానే వస్తువులు కొనవచ్చు.", ["Both I and II are correct", "Only I is correct", "Only II is correct", "Neither I nor II is correct"], ["I, II రెండూ సరైనవి", "I మాత్రమే సరైనది", "II మాత్రమే సరైనది", "రెండూ సరైనవి కావు"], 0, "Physical markets are confined to a place and work at particular times; in online markets we can order by mobile or computer and buy without leaving home.", "భౌతిక మార్కెట్లు ఒక ప్రదేశానికి, నిర్దిష్ట సమయాలకు పరిమితం; ఆన్‌లైన్ మార్కెట్లలో మొబైల్/కంప్యూటర్ ద్వారా ఇంటి నుండే కొనవచ్చు."], ["Arrange the chain of markets in the correct order", "మార్కెట్ల గొలుసును సరైన క్రమంలో అమర్చండి", ["Industries/farms → Distribution point → Wholesale shops → Retail shops → Consumer", "Consumer → Retail shops → Wholesale shops → Farms", "Industries → Retail shops → Wholesale shops → Consumer", "Distribution point → Farms → Retail shops → Wholesale shops → Consumer"], ["పరిశ్రమలు/పొలాలు → పంపిణీ కేంద్రం → టోకు దుకాణాలు → చిల్లర దుకాణాలు → వినియోగదారు", "వినియోగదారు → చిల్లర → టోకు → పొలాలు", "పరిశ్రమలు → చిల్లర → టోకు → వినియోగదారు", "పంపిణీ కేంద్రం → పొలాలు → చిల్లర → టోకు → వినియోగదారు"], 0, "Goods produced in factories, farms and homes first reach a distribution/stock point, then wholesale shops, then retailers, and finally consumers.", "కర్మాగారాలు, పొలాలు, ఇళ్ళలో ఉత్పత్తి అయిన వస్తువులు మొదట పంపిణీ/నిల్వ కేంద్రానికి, తర్వాత టోకు దుకాణాలకు, చిల్లర వర్తకులకు, చివరకు వినియోగదారులకు చేరతాయి."], ["People who buy goods on a large scale are known as", "పెద్ద మొత్తంలో వస్తువులు కొనేవారిని ఇలా అంటారు", ["Wholesaler", "Retailer", "Trader", "None"], ["టోకు వర్తకుడు", "చిల్లర వర్తకుడు", "వ్యాపారి", "ఏదీ కాదు"], 0, "A wholesaler buys and sells goods in large quantities to other businesses (retailers). (Textbook exercise.)", "టోకు వర్తకుడు పెద్ద మొత్తంలో కొని ఇతర వ్యాపారులకు (చిల్లర వర్తకులకు) అమ్ముతాడు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The persons who finally sell goods to consumers are known as", "చివరగా వినియోగదారులకు వస్తువులు అమ్మేవారిని ఇలా అంటారు", ["Retailers", "Wholesalers", "Producers", "Agents"], ["చిల్లర వర్తకులు", "టోకు వర్తకులు", "ఉత్పత్తిదారులు", "దళారులు"], 0, "Retailers sell goods to the public (consumers). (Textbook fill-in-the-blank.)", "చిల్లర వర్తకులు ప్రజలకు (వినియోగదారులకు) వస్తువులు అమ్ముతారు. (పాఠ్యపుస్తక ఖాళీ పూరణ.)"], ["Among the marketing channels, the customer generally gets goods at the cheapest price through the", "మార్కెటింగ్ మార్గాల్లో వినియోగదారుకు సాధారణంగా అత్యంత తక్కువ ధరకు వస్తువులు లభించేది", ["Direct channel (producer to consumer)", "Agent channel", "Wholesale channel", "Retail channel"], ["ప్రత్యక్ష మార్గం (ఉత్పత్తిదారు నుండి వినియోగదారుకు)", "దళారీ మార్గం", "టోకు మార్గం", "చిల్లర మార్గం"], 0, "In the direct channel there are no middlemen; the price of products rises when agents and wholesalers come between producers and consumers.", "ప్రత్యక్ష మార్గంలో దళారులు ఉండరు; ఉత్పత్తిదారు, వినియోగదారు మధ్య దళారులు, టోకు వర్తకులు వస్తే ధరలు పెరుగుతాయి."], ["Anwar, a wholesale fruit trader, buys mangoes from Nuzvid and Ulavapadu, grapes from Anantapur and Bangalore, and pomegranates from Sholapur. Retail fruit merchants and hawkers then buy from him. This shows the importance of the wholesaler in", "టోకు పండ్ల వ్యాపారి అన్వర్ నూజివీడు, ఉలవపాడు నుండి మామిడి, అనంతపురం, బెంగళూరు నుండి ద్రాక్ష, షోలాపూర్ నుండి దానిమ్మ కొంటాడు. చిల్లర వ్యాపారులు, హాకర్లు అతని నుండి కొంటారు. ఇది టోకు వర్తకుని ప్రాముఖ్యాన్ని ఇందులో చూపుతుంది", ["Distribution of goods from many producing areas to retailers", "Producing fruits", "Fixing government prices", "Exporting crude oil"], ["వివిధ ఉత్పత్తి ప్రాంతాల నుండి చిల్లర వర్తకులకు వస్తువుల పంపిణీ", "పండ్లు పండించడం", "ప్రభుత్వ ధరల నిర్ణయం", "ముడిచమురు ఎగుమతి"], 0, "The wholesaler collects goods in bulk from different producing areas, stores them, and supplies retailers — a key link in the distribution of goods.", "టోకు వర్తకుడు వివిధ ప్రాంతాల నుండి పెద్ద మొత్తంలో సేకరించి, నిల్వ చేసి, చిల్లర వర్తకులకు సరఫరా చేస్తాడు — వస్తు పంపిణీలో కీలక లంకె."], ["A production system in which goods are produced by craftsmen at home or in small workshops, by individuals or family units instead of large factories, is called", "పెద్ద కర్మాగారాలకు బదులు ఇళ్ళలో లేదా చిన్న వర్క్‌షాప్‌లలో వ్యక్తులు, కుటుంబాలు చేతివృత్తుల ద్వారా వస్తువులు ఉత్పత్తి చేసే విధానం", ["Cottage industry", "Multinational company", "E-commerce", "Shopping mall"], ["కుటీర పరిశ్రమ", "బహుళజాతి కంపెనీ", "ఇ-కామర్స్", "షాపింగ్ మాల్"], 0, "Cottage industry relies on craftsmen producing goods at home or in small workshops (e.g., basket making); it is a boon to the rural unemployed.", "కుటీర పరిశ్రమలో చేతివృత్తులవారు ఇళ్ళలో లేదా చిన్న వర్క్‌షాప్‌లలో ఉత్పత్తి చేస్తారు (ఉదా: బుట్టల తయారీ); గ్రామీణ నిరుద్యోగులకు వరం."], ["Markets are considered sources of income because", "మార్కెట్లను ఆదాయ వనరులుగా భావించడానికి కారణం", ["Producers, wholesalers, retailers and workers all earn income — profits, salaries, wages and rents — through market transactions", "Only the government earns from markets", "Only consumers earn money", "Markets do not need any workers"], ["ఉత్పత్తిదారులు, టోకు, చిల్లర వర్తకులు, కార్మికులు అందరూ మార్కెట్ లావాదేవీల ద్వారా లాభాలు, జీతాలు, వేతనాలు, అద్దెలు సంపాదిస్తారు", "ప్రభుత్వం మాత్రమే సంపాదిస్తుంది", "వినియోగదారులు మాత్రమే సంపాదిస్తారు", "మార్కెట్లకు కార్మికులు అవసరం లేదు"], 0, "Industrialists and farmers earn by selling to wholesalers, wholesalers to retailers, retailers to consumers; workers like cleaners, loaders and drivers earn salaries, wages and rents.", "పరిశ్రమలు, రైతులు టోకు వర్తకులకు, వారు చిల్లర వర్తకులకు, వారు వినియోగదారులకు అమ్మి సంపాదిస్తారు; శుభ్రపరిచేవారు, కూలీలు, డ్రైవర్లు జీతాలు, వేతనాలు, అద్దెలు పొందుతారు."], ["A person fixed a sum of money in a national bank and is getting monthly income on it. This income return is known as", "ఒక వ్యక్తి జాతీయ బ్యాంకులో డబ్బు ఫిక్స్‌డ్ డిపాజిట్ చేసి నెలనెలా ఆదాయం పొందుతున్నాడు. ఈ ఆదాయాన్ని ఇలా అంటారు", ["Salary", "Rent", "Interest", "Commission"], ["జీతం", "అద్దె", "వడ్డీ", "కమీషన్"], 2, "Income earned on money deposited in a bank is interest. (Textbook exercise.)", "బ్యాంకులో డిపాజిట్ చేసిన డబ్బుపై వచ్చే ఆదాయం వడ్డీ. (పాఠ్యపుస్తక అభ్యాసం.)"], ["____ is the return for Land", "భూమికి లభించే ప్రతిఫలం ____", ["Rent", "Interest", "Wages", "Profit"], ["అద్దె (బాటకం)", "వడ్డీ", "వేతనాలు", "లాభం"], 0, "Rent is the return for land; interest – capital; wages – labour; profit – entrepreneur. (Textbook fill-in-the-blank.)", "భూమికి ప్రతిఫలం అద్దె (బాటకం); మూలధనానికి వడ్డీ; శ్రమకు వేతనం; వ్యవస్థాపకునికి లాభం. (పాఠ్యపుస్తక ఖాళీ పూరణ.)"], ["A person who purchases a product or avails a service for a consideration, for personal use or to earn a livelihood by self-employment, is a", "ప్రతిఫలం చెల్లించి వ్యక్తిగత ఉపయోగానికి లేదా స్వయం ఉపాధి ద్వారా జీవనోపాధికి వస్తువు కొనే లేదా సేవ పొందే వ్యక్తి", ["Consumer", "Producer", "Wholesaler", "Agent"], ["వినియోగదారు", "ఉత్పత్తిదారు", "టోకు వర్తకుడు", "దళారి"], 0, "A consumer purchases a product or avails a service for a consideration, for personal use or for livelihood through self-employment.", "ప్రతిఫలం చెల్లించి వ్యక్తిగత ఉపయోగానికి లేదా స్వయం ఉపాధికి వస్తువు కొనేవారు/సేవ పొందేవారు వినియోగదారు."], ["The Consumer Protection Act 2019, which defines a consumer as anyone who buys goods offline or online, through teleshopping, direct selling or multi-level marketing, was approved on", "ఆఫ్‌లైన్, ఆన్‌లైన్, టెలిషాపింగ్, డైరెక్ట్ సెల్లింగ్, మల్టీ-లెవల్ మార్కెటింగ్ ద్వారా కొనేవారందరినీ వినియోగదారులుగా నిర్వచించిన వినియోగదారుల రక్షణ చట్టం 2019 ఆమోదం పొందిన తేదీ", ["9th August 2019", "24th December 2019", "26th January 2019", "15th March 2019"], ["9 ఆగస్టు 2019", "24 డిసెంబర్ 2019", "26 జనవరి 2019", "15 మార్చి 2019"], 0, "The Consumer Protection Act 2019 was approved on 9 August 2019; it aims at timely and effective settlement of consumer disputes in the digital age.", "వినియోగదారుల రక్షణ చట్టం 2019 ఆగస్టు 9, 2019న ఆమోదం పొందింది; డిజిటల్ యుగంలో వినియోగదారుల వివాదాల సకాల, సమర్థ పరిష్కారం దీని లక్ష్యం."], ["Identify the one that is NOT a consumer right", "వినియోగదారు హక్కు కానిది", ["Right to be protected against hazardous goods", "Right to be informed about quality, quantity and price", "Right to seek redressal against unfair trade practices", "Right to fix the selling price of goods"], ["ప్రమాదకర వస్తువుల నుండి రక్షణ పొందే హక్కు", "నాణ్యత, పరిమాణం, ధర గురించి తెలుసుకునే హక్కు", "అన్యాయ వ్యాపార పద్ధతులపై పరిహారం కోరే హక్కు", "వస్తువుల అమ్మకం ధరను నిర్ణయించే హక్కు"], 3, "Consumer rights: safety, information, choice (variety at competitive prices), to be heard, to seek redressal, and consumer awareness. Fixing selling prices is not a consumer right.", "వినియోగదారు హక్కులు: భద్రత, సమాచారం, ఎంపిక (పోటీ ధరల్లో వివిధ వస్తువులు), వినిపించుకునే హక్కు, పరిహారం, వినియోగదారు అవగాహన. అమ్మకం ధర నిర్ణయించడం వినియోగదారు హక్కు కాదు."], ["Suguna's new mobile phone stopped working within days and the shop owner refused to replace it. She complained with the bill to the District Consumer forum, which ordered replacement and a fine. Which consumer right did she exercise?", "సుగుణ కొన్న కొత్త మొబైల్ కొన్ని రోజుల్లోనే పనిచేయడం మానేసింది; దుకాణదారు మార్చడానికి నిరాకరించాడు. ఆమె బిల్లుతో జిల్లా వినియోగదారుల ఫోరంలో ఫిర్యాదు చేయగా మార్పిడి, జరిమానా విధించారు. ఆమె వినియోగించుకున్న హక్కు", ["Right to seek redressal", "Right to choose", "Right to vote", "Right to property"], ["పరిహారం కోరే హక్కు", "ఎంచుకునే హక్కు", "ఓటు హక్కు", "ఆస్తి హక్కు"], 0, "Suguna used the right to seek redressal against unfair trade practices; keeping the bill was essential for her complaint.", "సుగుణ అన్యాయ వ్యాపార పద్ధతులపై పరిహారం కోరే హక్కును వినియోగించుకుంది; ఫిర్యాదుకు బిల్లు తప్పనిసరి."], ["The National Consumer Disputes Redressal Commission (NCDRC), with head office in New Delhi, was set up in 1988 under the", "న్యూఢిల్లీలో ప్రధాన కార్యాలయం గల జాతీయ వినియోగదారుల వివాదాల పరిష్కార కమిషన్ (NCDRC) 1988లో ఈ చట్టం కింద ఏర్పడింది", ["Consumer Protection Act, 1986", "Consumer Protection Act, 2019", "RTI Act, 2005", "Legal Services Authorities Act, 1987"], ["వినియోగదారుల రక్షణ చట్టం, 1986", "వినియోగదారుల రక్షణ చట్టం, 2019", "సమాచార హక్కు చట్టం, 2005", "న్యాయ సేవల ప్రాధికార సంస్థల చట్టం, 1987"], 0, "The NCDRC was set up in 1988 under the Consumer Protection Act 1986; its head office is in New Delhi.", "NCDRC వినియోగదారుల రక్షణ చట్టం 1986 కింద 1988లో ఏర్పడింది; ప్రధాన కార్యాలయం న్యూఢిల్లీ."], ["National Consumers Day is observed in India every year on", "భారతదేశంలో జాతీయ వినియోగదారుల దినోత్సవం జరుపుకునే రోజు", ["24th December", "15th March", "26th November", "9th August"], ["డిసెంబర్ 24", "మార్చి 15", "నవంబర్ 26", "ఆగస్టు 9"], 0, "National Consumers Day is observed on 24 December every year. (Textbook fill-in-the-blank.)", "ప్రతి సంవత్సరం డిసెంబర్ 24న జాతీయ వినియోగదారుల దినోత్సవం జరుపుకుంటారు. (పాఠ్యపుస్తక ఖాళీ పూరణ.)"], ["The national toll-free consumer helpline number given in the textbook is", "పాఠ్యపుస్తకంలో ఇచ్చిన జాతీయ వినియోగదారుల టోల్-ఫ్రీ హెల్ప్‌లైన్ నంబర్", ["1800-114000 or 14404", "100", "108", "1098"], ["1800-114000 లేదా 14404", "100", "108", "1098"], 0, "National Consumer Helpline: 1800-114000 or 14404. (100 – police, 108 – ambulance, 1098 – childline.)", "జాతీయ వినియోగదారుల హెల్ప్‌లైన్: 1800-114000 లేదా 14404. (100 – పోలీసు, 108 – అంబులెన్స్, 1098 – చైల్డ్‌లైన్.)"], ["As a project, a teacher asks students to visit different e-commerce sites, collect prices of a laptop, phone and toys, and compare them with a local shop. This activity mainly develops", "ప్రాజెక్టుగా ఉపాధ్యాయుడు విద్యార్థులను వివిధ ఇ-కామర్స్ సైట్లలో ల్యాప్‌టాప్, ఫోన్, బొమ్మల ధరలు సేకరించి స్థానిక దుకాణంతో పోల్చమన్నాడు. ఈ కృత్యం ప్రధానంగా పెంపొందించేది", ["Data collection, comparison skills and consumer awareness", "Rote memorisation", "Handwriting", "Map reading"], ["సమాచార సేకరణ, పోలిక నైపుణ్యాలు, వినియోగదారు అవగాహన", "బట్టీ పట్టడం", "చేతిరాత", "పటం చదవడం"], 0, "Collecting and comparing prices from e-commerce sites is a learning outcome of this chapter; it builds inquiry, comparison skills and awareness as a consumer.", "ఇ-కామర్స్ సైట్ల నుండి ధరలు సేకరించి పోల్చడం ఈ అధ్యాయ అభ్యసన ఫలితం; పరిశోధన, పోలిక నైపుణ్యాలు, వినియోగదారు అవగాహన పెంచుతుంది."]]}, {"n": 13, "en": "Women Change the World", "te": "ప్రపంచాన్ని మార్చే మహిళలు", "c": "#5b2be0", "q": [["The Constitution of India gives", "భారత రాజ్యాంగం కల్పించేది", ["Equal rights without gender discrimination", "More rights to men than women", "Rights only to educated people", "Rights only to adults above 25"], ["లింగ వివక్ష లేకుండా సమాన హక్కులు", "స్త్రీల కంటే పురుషులకు ఎక్కువ హక్కులు", "చదువుకున్నవారికే హక్కులు", "25 ఏళ్ళు పైబడినవారికే హక్కులు"], 0, "The Constitution gives equal rights without gender discrimination, but in some areas discrimination against women still persists even in the 21st century.", "రాజ్యాంగం లింగ వివక్ష లేకుండా సమాన హక్కులు ఇస్తుంది; అయినా 21వ శతాబ్దంలో కూడా కొన్ని చోట్ల స్త్రీలపై వివక్ష కొనసాగుతోంది."], ["As per NSS 61st Round (2004–05), the percentage of working women in India engaged in agricultural work is", "ఎన్‌ఎస్‌ఎస్ 61వ రౌండ్ (2004–05) ప్రకారం వ్యవసాయ పనుల్లో ఉన్న శ్రామిక మహిళల శాతం", ["89.6", "91.7", "83.6", "65.2"], ["89.6", "91.7", "83.6", "65.2"], 2, "83.6% of working women in India are engaged in agricultural work — planting, weeding, harvesting, threshing — yet we think of a farmer only as a man. (Textbook exercise.)", "భారతదేశంలో శ్రామిక మహిళల్లో 83.6% వ్యవసాయ పనుల్లో ఉన్నారు — నాట్లు, కలుపు తీత, కోత, నూర్పిడి — అయినా రైతు అంటే పురుషుడినే ఊహిస్తాం. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Identify the agricultural tasks mainly done by women as mentioned in the textbook", "పాఠ్యపుస్తకంలో పేర్కొన్న, ప్రధానంగా మహిళలు చేసే వ్యవసాయ పనులు", ["Planting, weeding, harvesting and threshing", "Driving tractors only", "Selling crops in foreign markets", "Making fertilisers in factories"], ["నాట్లు వేయడం, కలుపు తీయడం, కోత, నూర్పిడి", "ట్రాక్టర్లు నడపడం మాత్రమే", "విదేశీ మార్కెట్లలో పంటలు అమ్మడం", "కర్మాగారాల్లో ఎరువుల తయారీ"], 0, "Women's agricultural work includes planting, weeding, harvesting and threshing.", "మహిళల వ్యవసాయ పనుల్లో నాట్లు, కలుపు తీత, కోత, నూర్పిడి ఉంటాయి."], ["Rangayya and Rajamma work as construction workers. Rangayya gets Rs. 500 per day but Rajamma gets only Rs. 300. This is an example of", "రంగయ్య, రాజమ్మ భవన నిర్మాణ కార్మికులు. రంగయ్యకు రోజుకు రూ.500, రాజమ్మకు రూ.300 మాత్రమే. ఇది దీనికి ఉదాహరణ", ["Wage discrimination against women for equal work", "Equal pay for equal work", "Fair labour practice", "Child labour"], ["సమాన పనికి స్త్రీలపై వేతన వివక్ష", "సమాన పనికి సమాన వేతనం", "న్యాయమైన కార్మిక పద్ధతి", "బాలకార్మిక వ్యవస్థ"], 0, "Paying a woman less than a man for equal work is gender-based wage discrimination; it is unfair.", "సమాన పనికి స్త్రీకి పురుషుని కంటే తక్కువ వేతనం ఇవ్వడం లింగ ఆధారిత వేతన వివక్ష; ఇది అన్యాయం."], ["Vinay's father told him that Hotel Management is a course for girls and asked him to choose engineering or medicine. This situation reflects", "హోటల్ మేనేజ్‌మెంట్ అమ్మాయిల కోర్సు అని, ఇంజనీరింగ్ లేదా వైద్యం ఎంచుకోమని వినయ్ తండ్రి చెప్పాడు. ఈ సందర్భం సూచించేది", ["Gender stereotyping in choosing courses", "Scientific career guidance", "Equality in education", "Economic planning"], ["కోర్సుల ఎంపికలో లింగ మూస భావన", "శాస్త్రీయ వృత్తి మార్గదర్శనం", "విద్యలో సమానత్వం", "ఆర్థిక ప్రణాళిక"], 0, "Dividing courses into 'male' and 'female' courses is gender stereotyping; education should not differ on the basis of gender.", "కోర్సులను 'అబ్బాయిలవి', 'అమ్మాయిలవి'గా విభజించడం లింగ మూస భావన; లింగం ఆధారంగా విద్యలో తేడా ఉండకూడదు."], ["Bhavana's parents admitted her in a reputed college, but Sailaja's parents said higher education was unnecessary for women and decided to marry her off. This shows", "భావన తల్లిదండ్రులు ఆమెను మంచి కళాశాలలో చేర్పించారు, కానీ శైలజ తల్లిదండ్రులు స్త్రీలకు ఉన్నత విద్య అనవసరమని పెళ్ళి చేస్తామన్నారు. ఇది సూచించేది", ["Discriminatory family attitudes that hinder girls' education", "Equal support for all girls", "Government rules against girls", "Lack of colleges"], ["బాలికల విద్యకు ఆటంకమైన కుటుంబ వివక్షా ధోరణులు", "బాలికలందరికీ సమాన ప్రోత్సాహం", "బాలికలకు వ్యతిరేక ప్రభుత్వ నియమాలు", "కళాశాలల కొరత"], 0, "Certain family views do not value girls' ambitions; such stereotypes and rituals followed from the past hinder women's development.", "కొన్ని కుటుంబాలు బాలికల ఆకాంక్షలకు విలువ ఇవ్వవు; గతం నుండి వస్తున్న ఇటువంటి మూస భావనలు, ఆచారాలు స్త్రీల అభివృద్ధికి ఆటంకం."], ["During Dussehra holidays, Dharani's father said, 'The girl should not go alone to grandmother's village. Go with your younger brother.' This situation reflects", "దసరా సెలవుల్లో ధరణి తండ్రి 'అమ్మాయి ఒంటరిగా అమ్మమ్మ ఊరికి వెళ్ళకూడదు, తమ్ముడితో వెళ్ళు' అన్నాడు. ఈ సందర్భం సూచించేది", ["Restrictions on girls' freedom of movement based on gender", "Equal freedom for girls and boys", "Concern only for the younger brother", "A government travel rule"], ["లింగం ఆధారంగా బాలికల స్వేచ్ఛా సంచారంపై ఆంక్షలు", "అబ్బాయిలు, అమ్మాయిలకు సమాన స్వేచ్ఛ", "తమ్ముడి పట్ల మాత్రమే శ్రద్ధ", "ప్రభుత్వ ప్రయాణ నియమం"], 0, "The notion that a girl cannot travel alone, while even a younger brother is considered a protector, is a gender-based restriction on girls' freedom.", "అమ్మాయి ఒంటరిగా ప్రయాణించలేదని, చిన్న తమ్ముడే రక్షకుడని భావించడం బాలికల స్వేచ్ఛపై లింగ ఆధారిత ఆంక్ష."], ["A generalised belief about a particular category of people — an expectation that every person of a group will behave in a certain way — is called a", "ఒక నిర్దిష్ట వర్గపు ప్రజల గురించి సాధారణీకరించిన నమ్మకం — ఆ సమూహంలోని ప్రతి వ్యక్తి ఒకేలా ఉంటారనే అంచనా", ["Stereotype", "Gender equality", "Inspiration", "Movement"], ["మూస భావన (స్టీరియోటైప్)", "లింగ సమానత్వం", "ప్రేరణ", "ఉద్యమం"], 0, "A stereotype is a generalised belief about a particular category of people.", "ఒక వర్గం ప్రజల గురించి సాధారణీకరించిన నమ్మకమే మూస భావన (స్టీరియోటైప్)."], ["The act of making unjustified distinctions between people based on the groups, classes or categories to which they belong is called", "ప్రజలు చెందిన సమూహాలు, వర్గాలు ఆధారంగా అన్యాయమైన తేడాలు చూపడం", ["Discrimination", "Equality", "Fraternity", "Empowerment"], ["వివక్ష", "సమానత్వం", "సౌభ్రాతృత్వం", "సాధికారత"], 0, "Discrimination is making unjustified distinctions between people based on groups, classes or categories.", "సమూహాలు, వర్గాల ఆధారంగా అన్యాయమైన తేడాలు చూపడమే వివక్ష."], ["When people of all genders have equal rights, responsibilities and opportunities, it is called", "అన్ని లింగాలవారికి సమాన హక్కులు, బాధ్యతలు, అవకాశాలు ఉండటాన్ని ఇలా అంటారు", ["Gender equality", "Stereotype", "Discrimination", "Patriarchy"], ["లింగ సమానత్వం", "మూస భావన", "వివక్ష", "పితృస్వామ్యం"], 0, "Gender equality means people of all genders have equal rights, responsibilities and opportunities.", "అన్ని లింగాలవారికి సమాన హక్కులు, బాధ్యతలు, అవకాశాలు ఉండటమే లింగ సమానత్వం."], ["According to the textbook, discrimination against women is even more severe in", "పాఠ్యపుస్తకం ప్రకారం స్త్రీలపై వివక్ష ఎక్కువగా ఉండేది", ["Illiterate families", "Educated families only", "Government offices only", "Schools only"], ["నిరక్షరాస్య కుటుంబాల్లో", "చదువుకున్న కుటుంబాల్లో మాత్రమే", "ప్రభుత్వ కార్యాలయాల్లో మాత్రమే", "పాఠశాలల్లో మాత్రమే"], 0, "Discrimination is even more severe in illiterate families, though in some cases even educated people do not give equal priority to women.", "నిరక్షరాస్య కుటుంబాల్లో వివక్ష ఎక్కువ; కొన్నిసార్లు చదువుకున్నవారు కూడా స్త్రీలకు సమాన ప్రాధాన్యం ఇవ్వరు."], ["Ramya joined polytechnic in Mechanical Engineering despite discouragement and later got a higher post in the railways. Her story mainly shows", "నిరుత్సాహపరిచినా రమ్య పాలిటెక్నిక్‌లో మెకానికల్ ఇంజనీరింగ్ చదివి రైల్వేలో ఉన్నత ఉద్యోగం పొందింది. ఆమె కథ ప్రధానంగా చూపేది", ["Breaking stereotypes — girls can achieve anything", "Girls should avoid technical courses", "Only boys succeed in engineering", "Railways do not employ women"], ["మూస భావనలను ఛేదించడం — అమ్మాయిలు ఏదైనా సాధించగలరు", "అమ్మాయిలు సాంకేతిక కోర్సులు మానుకోవాలి", "ఇంజనీరింగ్‌లో అబ్బాయిలే విజయం సాధిస్తారు", "రైల్వేలో స్త్రీలకు ఉద్యోగాలు లేవు"], 0, "Ramya studied with perseverance, passed and got a higher post in the railways — proving girls can achieve anything.", "రమ్య పట్టుదలతో చదివి రైల్వేలో ఉన్నత పదవి పొంది అమ్మాయిలు ఏదైనా సాధించగలరని నిరూపించింది."], ["Madhuri, who lost her husband early, supported her family by driving an auto and educated her children. Gita, confined to a wheelchair after an accident, started her own business with government help. Both are examples of", "భర్తను కోల్పోయిన మాధురి ఆటో నడిపి పిల్లలను చదివించింది; ప్రమాదంలో వీల్‌చైర్‌కు పరిమితమైన గీత ప్రభుత్వ సహాయంతో వ్యాపారం ప్రారంభించింది. ఇద్దరూ దీనికి ఉదాహరణలు", ["Women succeeding in adverse circumstances", "Women depending on others", "Women avoiding work", "Discrimination by the government"], ["ప్రతికూల పరిస్థితుల్లో విజయం సాధించిన స్త్రీలు", "ఇతరులపై ఆధారపడిన స్త్రీలు", "పని మానుకున్న స్త్రీలు", "ప్రభుత్వ వివక్ష"], 0, "Madhuri and Gita faced criticism and discouragement with courage and succeeded, proving it is possible to reach higher positions despite all odds.", "మాధురి, గీత విమర్శలు, నిరుత్సాహాన్ని ధైర్యంగా ఎదుర్కొని విజయం సాధించారు — ఎన్ని అడ్డంకులున్నా ఉన్నత స్థాయికి చేరవచ్చని నిరూపించారు."], ["According to the textbook, the major tool in getting rid of stereotypes is", "పాఠ్యపుస్తకం ప్రకారం మూస భావనలను తొలగించడంలో ప్రధాన సాధనం", ["Education", "Marriage", "Rituals", "Migration"], ["విద్య", "వివాహం", "ఆచారాలు", "వలస"], 0, "Education plays a major role in getting rid of stereotypes. Yet girls from Dalit, tribal and poor families are still deprived of education due to socio-economic reasons.", "మూస భావనలను తొలగించడంలో విద్య ప్రధాన పాత్ర పోషిస్తుంది. అయినా దళిత, గిరిజన, పేద కుటుంబాల బాలికలు సామాజిక–ఆర్థిక కారణాలతో ఇంకా విద్యకు దూరమవుతున్నారు."], ["'Poor girls drop out of school because they are not interested in getting education.' This statement is", "'పేద బాలికలు చదువుపై ఆసక్తి లేకనే బడి మానేస్తారు.' ఈ వాక్యం", ["Not justified — they drop out mainly due to socio-economic reasons", "Fully justified", "Justified only for boys", "A government rule"], ["సమర్థనీయం కాదు — ప్రధానంగా సామాజిక–ఆర్థిక కారణాల వల్ల బడి మానేస్తారు", "పూర్తిగా సమర్థనీయం", "అబ్బాయిలకు మాత్రమే వర్తిస్తుంది", "ప్రభుత్వ నియమం"], 0, "Girls from Dalit, tribal and poor families are deprived of education because of socio-economic reasons — not lack of interest. (Textbook question.)", "దళిత, గిరిజన, పేద కుటుంబాల బాలికలు ఆసక్తి లేక కాదు, సామాజిక–ఆర్థిక కారణాల వల్ల విద్యకు దూరమవుతారు. (పాఠ్యపుస్తక ప్రశ్న.)"], ["The poem 'Anadha', which students are asked to read in this chapter, was written by", "ఈ అధ్యాయంలో విద్యార్థులను చదవమన్న 'అనాథ' కవిత రచయిత", ["Gurram Jashuva", "Sri Sri", "Viswanatha Satyanarayana", "Gurajada Appa Rao"], ["గుర్రం జాషువా", "శ్రీశ్రీ", "విశ్వనాథ సత్యనారాయణ", "గురజాడ అప్పారావు"], 0, "The textbook asks students to read the poem 'Anadha' written by Sri Gurram Jashuva.", "గుర్రం జాషువా రచించిన 'అనాథ' కవితను చదవమని పాఠ్యపుస్తకం సూచిస్తుంది."], ["In the past, the role of women in the family was limited to that of a", "గతంలో కుటుంబంలో స్త్రీ పాత్ర దీనికే పరిమితమైంది", ["Mere caretaker", "Scientist", "Administrator", "Trader"], ["కేవలం సంరక్షకురాలు", "శాస్త్రవేత్త", "పరిపాలకురాలు", "వ్యాపారి"], 0, "In the past, sons were taught to read and write while daughters were married off; the role of women was a mere caretaker.", "గతంలో కొడుకులకు చదువు నేర్పి, కూతుళ్ళకు పెళ్ళి చేసేవారు; స్త్రీ పాత్ర కేవలం సంరక్షకురాలు."], ["In which century did many new ideas about education emerge, with schools established for modern education, though there was opposition to educating girls?", "ఆధునిక విద్యకు పాఠశాలలు ఏర్పడి, విద్యపై కొత్త ఆలోచనలు వచ్చినా బాలికల విద్యకు వ్యతిరేకత ఉన్న శతాబ్దం", ["Nineteenth century", "Fifteenth century", "Twenty-first century", "Twelfth century"], ["పందొమ్మిదో శతాబ్దం", "పదిహేనో శతాబ్దం", "ఇరవై ఒకటో శతాబ్దం", "పన్నెండో శతాబ్దం"], 0, "In the 19th century many new ideas about education emerged and schools were established, but there was much opposition to educating girls; still many people opened schools for girls.", "19వ శతాబ్దంలో విద్యపై కొత్త ఆలోచనలు వచ్చి పాఠశాలలు ఏర్పడ్డాయి; బాలికల విద్యకు వ్యతిరేకత ఉన్నా చాలామంది బాలికల పాఠశాలలు తెరిచారు."], ["The social reformer couple remembered for pioneering girls' education in India, mentioned in the textbook, is", "భారతదేశంలో బాలికల విద్యకు మార్గదర్శకులుగా పాఠ్యపుస్తకంలో ప్రస్తావించిన సంఘ సంస్కర్త దంపతులు", ["Jyotiba Phule and Savitribai Phule", "Motilal and Swaroop Rani Nehru", "Raja Ram Mohan Roy and wife", "Gandhiji and Kasturba"], ["జ్యోతిబా ఫూలే, సావిత్రీబాయి ఫూలే", "మోతీలాల్, స్వరూప్ రాణి నెహ్రూ", "రాజా రామ్మోహన్ రాయ్ దంపతులు", "గాంధీజీ, కస్తూర్బా"], 0, "Jyotiba Phule and Savitribai Phule worked for girls' education; they started a school for girls in Pune in 1848.", "జ్యోతిబా ఫూలే, సావిత్రీబాయి ఫూలే బాలికల విద్య కోసం కృషి చేశారు; 1848లో పుణేలో బాలికల పాఠశాల ప్రారంభించారు."], ["The 'Beti Bachao Beti Padhao' campaign was launched in the year", "'బేటీ బచావో బేటీ పఢావో' ఉద్యమం ప్రారంభమైన సంవత్సరం", ["2012", "2013", "2014", "2015"], ["2012", "2013", "2014", "2015"], 3, "The 'Beti Bachao Beti Padhao' campaign (save the girl child, educate the girl child) was launched in 2015. (Textbook exercise.)", "'బేటీ బచావో బేటీ పఢావో' (ఆడపిల్లను కాపాడండి, చదివించండి) ఉద్యమం 2015లో ప్రారంభమైంది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The struggle of women, individually and collectively, to bring about changes in education, legal reform, violence and health is known as the", "విద్య, చట్ట సంస్కరణలు, హింస, ఆరోగ్య రంగాల్లో మార్పుల కోసం స్త్రీలు వ్యక్తిగతంగా, సమష్టిగా చేసిన పోరాటాన్ని ఇలా అంటారు", ["Women's movement", "Bhakti movement", "Non-cooperation movement", "Green revolution"], ["మహిళా ఉద్యమం", "భక్తి ఉద్యమం", "సహాయ నిరాకరణ ఉద్యమం", "హరిత విప్లవం"], 0, "These changes did not happen overnight; women struggled individually and collectively — this struggle is the women's movement.", "ఈ మార్పులు రాత్రికి రాత్రే రాలేదు; స్త్రీలు వ్యక్తిగతంగా, సమష్టిగా పోరాడారు — ఇదే మహిళా ఉద్యమం."], ["The state that banned arrack in 1993 as a result of the women's anti-arrack movement is", "మహిళల సారా వ్యతిరేక ఉద్యమం ఫలితంగా 1993లో సారాను నిషేధించిన రాష్ట్రం", ["Tamil Nadu", "Andhra Pradesh", "Gujarat", "Kerala"], ["తమిళనాడు", "ఆంధ్రప్రదేశ్", "గుజరాత్", "కేరళ"], 1, "Women in Andhra Pradesh started the anti-arrack movement; because of their struggle the government banned arrack in 1993. (Textbook exercise.)", "ఆంధ్రప్రదేశ్ మహిళలు సారా వ్యతిరేక ఉద్యమం ప్రారంభించారు; వారి పోరాటంతో ప్రభుత్వం 1993లో సారాను నిషేధించింది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["As a result of the movement for girls' self-esteem, which of the following happened?", "బాలికల ఆత్మగౌరవ ఉద్యమ ఫలితంగా జరిగినది", ["Separate toilets for girls in schools and toilets in every house", "Closing of girls' schools", "Ban on girls' education", "Reduction of women's wages"], ["పాఠశాలల్లో బాలికలకు ప్రత్యేక మరుగుదొడ్లు, ప్రతి ఇంట్లో మరుగుదొడ్లు", "బాలికల పాఠశాలల మూసివేత", "బాలికల విద్యపై నిషేధం", "స్త్రీల వేతనాల తగ్గింపు"], 0, "As a result of the movement for girls' self-esteem, toilets were set up exclusively for girls in schools and toilets were built in every house.", "బాలికల ఆత్మగౌరవ ఉద్యమం ఫలితంగా పాఠశాలల్లో బాలికలకు ప్రత్యేక మరుగుదొడ్లు, ప్రతి ఇంట్లో మరుగుదొడ్లు నిర్మించారు."], ["International Women's Day is celebrated on", "అంతర్జాతీయ మహిళా దినోత్సవం జరుపుకునే రోజు", ["15th March", "7th April", "8th March", "11th July"], ["మార్చి 15", "ఏప్రిల్ 7", "మార్చి 8", "జూలై 11"], 2, "International Women's Day is celebrated on 8th March. (Textbook exercise.)", "అంతర్జాతీయ మహిళా దినోత్సవం మార్చి 8న జరుపుకుంటారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The first two female graduates of India were", "భారతదేశపు మొదటి ఇద్దరు మహిళా పట్టభద్రులు", ["Kadambari Ganguly and Chandramukhi Basu", "Savitribai Phule and Fatima Sheikh", "Sarojini Naidu and Annie Besant", "Janaki Ammal and Anna Mani"], ["కాదంబినీ గంగూలీ, చంద్రముఖి బసు", "సావిత్రీబాయి ఫూలే, ఫాతిమా షేక్", "సరోజినీ నాయుడు, అనీబిసెంట్", "జానకి అమ్మాళ్, అన్నా మణి"], 0, "Kadambari (Kadambini) Ganguly (1861–1923) and Chandramukhi Basu (1860–1944) were the first two female graduates in India.", "కాదంబినీ గంగూలీ (1861–1923), చంద్రముఖి బసు (1860–1944) భారతదేశపు మొదటి ఇద్దరు మహిళా పట్టభద్రులు."], ["The first South Asian woman physician to graduate in Western medicine in India was", "భారతదేశంలో పాశ్చాత్య వైద్యంలో పట్టభద్రురాలైన మొదటి దక్షిణాసియా మహిళా వైద్యురాలు", ["Kadambari Ganguly", "Chandramukhi Basu", "Janaki Ammal", "Kalpana Chawla"], ["కాదంబినీ గంగూలీ", "చంద్రముఖి బసు", "జానకి అమ్మాళ్", "కల్పనా చావ్లా"], 0, "Kadambari Ganguly was the first South Asian woman physician to graduate in Western medicine in India; Chandramukhi Basu served as lecturer and principal at Bethune College.", "కాదంబినీ గంగూలీ భారతదేశంలో పాశ్చాత్య వైద్యంలో పట్టభద్రురాలైన మొదటి దక్షిణాసియా మహిళా వైద్యురాలు; చంద్రముఖి బసు బెథూన్ కళాశాలలో అధ్యాపకురాలు, ప్రిన్సిపాల్."], ["Chandramukhi Basu served as lecturer and principal at", "చంద్రముఖి బసు అధ్యాపకురాలిగా, ప్రిన్సిపాల్‌గా పనిచేసిన కళాశాల", ["Bethune College", "Presidency College", "Patna Women's College", "Tata Institute of Social Sciences"], ["బెథూన్ కళాశాల", "ప్రెసిడెన్సీ కళాశాల", "పాట్నా మహిళా కళాశాల", "టాటా ఇన్‌స్టిట్యూట్ ఆఫ్ సోషల్ సైన్సెస్"], 0, "Chandramukhi Basu served as lecturer and principal at Bethune College.", "చంద్రముఖి బసు బెథూన్ కళాశాలలో అధ్యాపకురాలు, ప్రిన్సిపాల్‌గా పనిచేశారు."], ["The first woman scientist to receive the Padma Shri award, as per the textbook, was", "పాఠ్యపుస్తకం ప్రకారం పద్మశ్రీ అవార్డు పొందిన మొదటి మహిళా శాస్త్రవేత్త", ["Janaki Ammal", "Nandini Harinath", "Kadambari Ganguly", "Anna Mani"], ["జానకి అమ్మాళ్", "నందిని హరినాథ్", "కాదంబినీ గంగూలీ", "అన్నా మణి"], 0, "Janaki Ammal Edavalath Kakkat, botanist and cytogeneticist, received the Padma Shri in 1977; the textbook names her the first Indian woman scientist to receive it. (Textbook exercise.)", "వృక్షశాస్త్రవేత్త, సైటోజెనెటిసిస్ట్ జానకి అమ్మాళ్ 1977లో పద్మశ్రీ పొందారు; పద్మశ్రీ పొందిన మొదటి భారతీయ మహిళా శాస్త్రవేత్తగా పాఠ్యపుస్తకం పేర్కొంది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Janaki Ammal carried out scientific research in cytogenetics, which is a branch of genetics related to", "జానకి అమ్మాళ్ సైటోజెనెటిక్స్‌లో పరిశోధన చేశారు. ఇది జన్యుశాస్త్రంలో దీనికి సంబంధించిన శాఖ", ["Chromosomes", "Rocks", "Stars", "Rivers"], ["క్రోమోజోములు", "శిలలు", "నక్షత్రాలు", "నదులు"], 0, "Cytogenetics is a branch of genetics related to chromosomes. Janaki Ammal received an Honours degree in Botany from Presidency College in 1921.", "సైటోజెనెటిక్స్ క్రోమోజోములకు సంబంధించిన జన్యుశాస్త్ర శాఖ. జానకి అమ్మాళ్ 1921లో ప్రెసిడెన్సీ కళాశాల నుండి వృక్షశాస్త్రంలో ఆనర్స్ డిగ్రీ పొందారు."], ["Kalpana Chawla, the first Indian-born woman to go to space, was born in", "అంతరిక్షంలోకి వెళ్ళిన మొదటి భారత సంతతి మహిళ కల్పనా చావ్లా జన్మస్థలం", ["Karnal, Haryana", "Jodhpur, Rajasthan", "Ulhasnagar, Maharashtra", "Srikakulam, Andhra Pradesh"], ["కర్నాల్, హర్యానా", "జోధ్‌పూర్, రాజస్థాన్", "ఉల్హాస్‌నగర్, మహారాష్ట్ర", "శ్రీకాకుళం, ఆంధ్రప్రదేశ్"], 0, "Kalpana Chawla, an Indian-American astronaut, was born into a middle-class family in Karnal, Haryana.", "భారతీయ–అమెరికన్ వ్యోమగామి కల్పనా చావ్లా హర్యానాలోని కర్నాల్‌లో మధ్యతరగతి కుటుంబంలో జన్మించారు."], ["Kalpana Chawla died on February 1, 2003 due to the failure of the space mission", "కల్పనా చావ్లా 2003 ఫిబ్రవరి 1న ఈ అంతరిక్ష మిషన్ విఫలమవడంతో మరణించారు", ["STS-107 (Columbia)", "Chandrayaan-1", "Mangalyaan", "Apollo 11"], ["STS-107 (కొలంబియా)", "చంద్రయాన్-1", "మంగళ్‌యాన్", "అపోలో 11"], 0, "She died when the STS-107 mission (Space Shuttle Columbia) failed in the atmosphere on 1 February 2003; the US awarded her the Congressional Space Medal of Honor and the NASA Distinguished Service Medal.", "STS-107 మిషన్ (కొలంబియా స్పేస్ షటిల్) 2003 ఫిబ్రవరి 1న వాతావరణంలో విఫలమైనప్పుడు ఆమె మరణించారు; అమెరికా ఆమెకు కాంగ్రెషనల్ స్పేస్ మెడల్ ఆఫ్ ఆనర్, నాసా విశిష్ట సేవా పతకం ప్రదానం చేసింది."], ["The woman cricketer known as 'Lady Sachin', the only woman to cross 7,000 runs in women's ODIs, is", "'లేడీ సచిన్'గా పేరొందిన, మహిళల వన్డేల్లో 7,000 పరుగులు దాటిన ఏకైక క్రికెటర్", ["Mithali Raj", "Jhulan Goswami", "Smriti Mandhana", "Harmanpreet Kaur"], ["మిథాలీ రాజ్", "జులన్ గోస్వామి", "స్మృతి మంధాన", "హర్మన్‌ప్రీత్ కౌర్"], 0, "Mithali Raj, born in Jodhpur on 3 December 1982, is the highest run-scorer in women's international cricket and the only woman to cross 7,000 ODI runs; she received the Khel Ratna.", "1982 డిసెంబర్ 3న జోధ్‌పూర్‌లో జన్మించిన మిథాలీ రాజ్ మహిళల అంతర్జాతీయ క్రికెట్‌లో అత్యధిక పరుగుల వీరాంగన, వన్డేల్లో 7,000 పరుగులు దాటిన ఏకైక మహిళ; ఖేల్ రత్న పొందారు."], ["Mithali Raj was selected for the Indian cricket team at the age of", "మిథాలీ రాజ్ భారత క్రికెట్ జట్టుకు ఎంపికైన వయసు", ["Seventeen", "Twenty-five", "Twelve", "Thirty"], ["పదిహేడు", "ఇరవై ఐదు", "పన్నెండు", "ముప్పై"], 0, "Mithali started training in cricket during her school days and was selected for the Indian team at the age of seventeen.", "మిథాలీ పాఠశాల రోజుల్లోనే క్రికెట్ శిక్షణ ప్రారంభించి 17 ఏళ్ళకే భారత జట్టుకు ఎంపికయ్యారు."], ["The highest sports honour received by Mithali Raj, as mentioned in the textbook, is the", "పాఠ్యపుస్తకం ప్రకారం మిథాలీ రాజ్ పొందిన అత్యున్నత క్రీడా పురస్కారం", ["Khel Ratna", "Padma Shri", "Right Livelihood Award", "Sydney Peace Prize"], ["ఖేల్ రత్న", "పద్మశ్రీ", "రైట్ లైవ్లీహుడ్ అవార్డు", "సిడ్నీ శాంతి బహుమతి"], 0, "Mithali Raj was awarded the Khel Ratna, India's highest sporting honour.", "మిథాలీ రాజ్‌కు భారతదేశ అత్యున్నత క్రీడా పురస్కారం ఖేల్ రత్న లభించింది."], ["Pranjal Patil from Ulhasnagar, Maharashtra, who took charge as Sub Collector in Thiruvananthapuram in October 2019, is known as India's first", "2019 అక్టోబర్‌లో తిరువనంతపురం సబ్ కలెక్టర్‌గా బాధ్యతలు చేపట్టిన మహారాష్ట్ర ఉల్హాస్‌నగర్‌కు చెందిన ప్రాంజల్ పాటిల్ దేశంలో మొదటి", ["Visually challenged woman IAS officer", "Woman commando trainer", "Woman astronaut", "Woman Chief Justice"], ["దృష్టి లోపం గల మహిళా ఐఏఎస్ అధికారి", "మహిళా కమాండో శిక్షకురాలు", "మహిళా వ్యోమగామి", "మహిళా ప్రధాన న్యాయమూర్తి"], 0, "Pranjal Patil, blind from a young age, cleared the UPSC civil services with rank 124 a dignity.", "సామాజిక, ఆర్థిక, ఆరోగ్యకర కుటుంబాలు, సమాజాలకు మహిళా సాధికారత ముఖ్యం; స్త్రీలందరినీ గౌరవంగా చూడాలి."], ["A teacher asks students to fill a table showing whether women or men in their area work as police, doctors, shopkeepers, farmers, scientists and drivers, and then discuss their observations. This activity mainly helps students to", "తమ ప్రాంతంలో పోలీసులు, వైద్యులు, దుకాణదారులు, రైతులు, శాస్త్రవేత్తలు, డ్రైవర్లుగా స్త్రీలు/పురుషులు ఎవరు పనిచేస్తున్నారో పట్టికలో నింపి చర్చించమని ఉపాధ్యాయుడు అడిగాడు. ఈ కృత్యం ప్రధానంగా విద్యార్థులకు సహాయపడేది", ["Recognise and question gender stereotypes through observation", "Memorise job names", "Choose jobs only by gender", "Avoid discussion"], ["పరిశీలన ద్వారా లింగ మూస భావనలను గుర్తించి ప్రశ్నించడం", "వృత్తుల పేర్లు బట్టీ పట్టడం", "లింగం ఆధారంగానే వృత్తులు ఎంచుకోవడం", "చర్చను నివారించడం"], 0, "Observation from the local environment followed by discussion helps learners recognise gender stereotypes and develop sensitivity towards equality — 'appreciation and sensitivity' academic standard.", "స్థానిక పరిశీలన, చర్చ ద్వారా విద్యార్థులు లింగ మూస భావనలను గుర్తించి సమానత్వం పట్ల సున్నితత్వం పెంచుకుంటారు — 'ప్రశంస, సున్నితత్వం' విద్యా ప్రమాణం."]]}];
const UI={
 en:{q:"Question",prev:"◀ Previous",next:"Next ▶",finish:"Finish",score:"Score",ok:"✔ Correct!",bad:"✘ Wrong! Correct answer:",exp:"Explanation",res:"Your Result",review:"Review answers",restart:"Restart quiz",att:"Attempted",home:"🏠 All Chapters",ch:"Chapter",qs:"Questions",best:"Last score",
   m:["Keep practising – read the chapter again!","Good effort – revise the weak areas.","Very good!","Excellent! Outstanding performance!"]},
 te:{q:"ప్రశ్న",prev:"◀ వెనుకకు",next:"తరువాత ▶",finish:"ముగించు",score:"స్కోరు",ok:"✔ సరైన సమాధానం!",bad:"✘ తప్పు! సరైన సమాధానం:",exp:"వివరణ",res:"మీ ఫలితం",review:"సమాధానాలు చూడండి",restart:"మళ్ళీ ప్రారంభించండి",att:"ప్రయత్నించినవి",home:"🏠 అన్ని అధ్యాయాలు",ch:"అధ్యాయం",qs:"ప్రశ్నలు",best:"చివరి స్కోరు",
   m:["మరింత సాధన చేయండి – పాఠాన్ని మళ్ళీ చదవండి!","మంచి ప్రయత్నం – బలహీన అంశాలను పునశ్చరణ చేయండి.","చాలా బాగుంది!","అద్భుతం! అత్యుత్తమ ప్రదర్శన!"]}
};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("q7soc_lang","both");
let Q=[],cur=0,chIdx=-1;
const $=id=>document.getElementById(id);
const L=k=>lang==="te"?UI.te[k]:UI.en[k];
const both=k=>lang==="both"?UI.en[k]+" / "+UI.te[k]:L(k);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function txt(en,te,cls){
  if(lang==="en")return `<div class="${cls}">${en}</div>`;
  if(lang==="te")return `<div class="${cls} te">${te}</div>`;
  return `<div class="${cls}">${en}</div><div class="${cls} te">${te}</div>`;
}
function headerText(){
  document.querySelectorAll("[data-en]").forEach(e=>{e.textContent=lang==="en"?e.dataset.en:lang==="te"?e.dataset.te:e.dataset.en+" | "+e.dataset.te});
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
}
function renderHome(){
  headerText();
  const mk=(c,i)=>{const last=store.get("q7soc_last_"+c.n,null);
    const t1=lang==="te"?"":`<div class="ct1">${UI.en.ch} ${c.n}: ${c.en}</div>`;
    const t2=lang==="en"?"":`<div class="ct2">${UI.te.ch} ${c.n}: ${c.te}</div>`;
    const lastTxt=last!==null?` · <span class="done">${L("best")}: ${last}/${c.q.length}</span>`:"";
    return `<a class="ccard" data-i="${i}" style="--c:${c.c}"><div class="cnum">${c.n}</div><div>${t1}${t2}<div class="ct3">${c.q.length} ${lang==="te"?UI.te.qs:UI.en.qs}${lang==="both"?" · "+c.q.length+" "+UI.te.qs:""}${lastTxt}</div></div></a>`};
  $("sem1").innerHTML=CHAPTERS.slice(0,6).map((c,i)=>mk(c,i)).join("");
  $("sem2").innerHTML=CHAPTERS.slice(6).map((c,i)=>mk(c,i+6)).join("");
  document.querySelectorAll(".ccard").forEach(a=>a.onclick=()=>openChapter(+a.dataset.i));
}
function showHome(){
  chIdx=-1;$("quiz").classList.add("hide");$("home").classList.remove("hide");$("score").classList.add("hide");
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  renderHome();window.scrollTo({top:0});
}
function openChapter(i){
  chIdx=i;const c=CHAPTERS[i];
  Q=c.q.map(r=>{const order=shuffle([0,1,2,3]);
    return {qe:r[0],qt:r[1],oe:order.map(k=>r[2][k]),ot:order.map(k=>r[3][k]),ans:order.indexOf(r[4]),ee:r[5],et:r[6],pick:null}});
  cur=0;$("home").classList.add("hide");$("quiz").classList.remove("hide");$("score").classList.remove("hide");
  $("rcard").classList.add("hide");$("qcard").classList.remove("hide");
  try{history.replaceState(null,"","#ch"+c.n)}catch(e){}
  render();window.scrollTo({top:0});
}
function render(){
  headerText();
  const c=CHAPTERS[chIdx];
  $("chtitle").innerHTML=(lang!=="te"?`${UI.en.ch} ${c.n}: ${c.en}`:"")+(lang!=="en"?`<span class="te">${UI.te.ch} ${c.n}: ${c.te}</span>`:"");
  $("homeBtn").textContent=L("home");$("toHome").textContent=L("home");
  const q=Q[cur];
  $("qno").textContent=`${lang==="te"?UI.te.q:UI.en.q} ${cur+1} / ${Q.length}`;
  $("qtext").innerHTML=txt(q.qe,q.qt,"q");
  $("opts").innerHTML=q.oe.map((o,i)=>{
    const t=lang==="en"?o:lang==="te"?`<span class="te">${q.ot[i]}</span>`:(o===q.ot[i]?o:`${o}<span class="te">${q.ot[i]}</span>`);
    let cl="";if(q.pick!==null){if(i===q.ans)cl="ok";else if(i===q.pick)cl="bad"}
    return `<button class="opt ${cl}" data-i="${i}" ${q.pick!==null?"disabled":""}><span class="n">${i+1}</span><span class="t">${t}</span></button>`}).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{Q[cur].pick=+b.dataset.i;render()});
  const ex=$("exp");
  if(q.pick!==null){
    const right=q.pick===q.ans;
    const corr=lang==="te"?q.ot[q.ans]:q.oe[q.ans]+(lang==="both"&&q.oe[q.ans]!==q.ot[q.ans]?" / "+q.ot[q.ans]:"");
    ex.innerHTML=`<div class="verdict ${right?"ok":"bad"}">${right?both("ok"):both("bad")+" ("+(q.ans+1)+") "+corr}</div><b>${both("exp")}:</b>`+
      (lang!=="te"?`<div>${q.ee}</div>`:"")+(lang!=="en"?`<div class="te">${q.et}</div>`:"");
    ex.style.display="block";
  } else ex.style.display="none";
  $("prev").textContent=L("prev");$("next").textContent=L("next");$("finish").textContent=L("finish");
  $("prev").disabled=cur===0;$("next").disabled=cur===Q.length-1;
  const done=Q.filter(x=>x.pick!==null).length,sc=Q.filter(x=>x.pick===x.ans).length;
  $("score").textContent=`${L("score")}: ${sc} / ${Q.length}  ·  ${L("att")}: ${done}`;
  $("pbar").style.width=(done/Q.length*100)+"%";
  $("grid").innerHTML=Q.map((x,i)=>`<button class="${i===cur?"cur ":""}${x.pick===null?"":x.pick===x.ans?"g":"r"}" data-i="${i}">${i+1}</button>`).join("");
  document.querySelectorAll("#grid button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;$("rcard").classList.add("hide");$("qcard").classList.remove("hide");render()});
  $("review").textContent=L("review");$("restart").textContent=L("restart");
}
function finish(){
  const sc=Q.filter(x=>x.pick===x.ans).length,p=sc/Q.length;
  store.set("q7soc_last_"+CHAPTERS[chIdx].n,String(sc));
  $("qcard").classList.add("hide");$("rcard").classList.remove("hide");
  $("rtitle").textContent=both("res");$("rscore").textContent=`${sc} / ${Q.length}`;
  const k=p<.4?0:p<.6?1:p<.85?2:3;
  $("rmsg").textContent=lang==="en"?UI.en.m[k]:lang==="te"?UI.te.m[k]:UI.en.m[k]+" | "+UI.te.m[k];
  render();
}
$("prev").onclick=()=>{if(cur>0){cur--;render()}};
$("next").onclick=()=>{if(cur<Q.length-1){cur++;render();window.scrollTo({top:0,behavior:"smooth"})}};
$("finish").onclick=finish;
$("review").onclick=()=>{cur=0;$("rcard").classList.add("hide");$("qcard").classList.remove("hide");render()};
$("restart").onclick=()=>openChapter(chIdx);
$("homeBtn").onclick=showHome;$("toHome").onclick=showHome;
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("q7soc_lang",lang);
  if(chIdx<0)renderHome();else if(!$("rcard").classList.contains("hide"))finish();else render()});
const m=/^#ch(\d+)$/.exec(location.hash);
if(m&&+m[1]>=1&&+m[1]<=CHAPTERS.length)openChapter(+m[1]-1);else showHome();
</script>
