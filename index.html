<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7th Social Quiz App</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#5b2be0;--c2:#ff4f8b;--c3:#ffb020;--ok:#18a058;--bad:#e5484d;--ink:#1d1a33;--card:#ffffff;--soft:#f3f0ff}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,'Noto Sans Telugu',sans-serif;color:var(--ink);
background:linear-gradient(160deg,#0f0c3d 0%,#2b1a7a 45%,#6a1b9a 100%);min-height:100vh;padding:14px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff9,transparent),radial-gradient(2px 2px at 85% 60%,#fff7,transparent),radial-gradient(1px 1px at 40% 80%,#fff9,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#fff8,transparent),radial-gradient(1px 1px at 55% 45%,#fffa,transparent)}
.wrap{max-width:860px;margin:0 auto;position:relative}
header{background:linear-gradient(120deg,var(--c1),var(--c2) 60%,var(--c3));border-radius:22px;padding:18px;color:#fff;
display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px #0006}
header img{width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:top;border:4px solid #fff;box-shadow:0 4px 14px #0005;flex-shrink:0}
header h1{margin:0;font-size:1.35rem;line-height:1.3}
header p{margin:4px 0 0;font-size:.92rem;opacity:.95}
.tag{display:inline-block;background:#ffffff33;border-radius:20px;padding:2px 10px;font-size:.78rem;margin-top:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:14px 0}
.lang button,.btn{border:0;border-radius:30px;padding:9px 16px;font:600 .9rem Poppins,'Noto Sans Telugu',sans-serif;cursor:pointer;transition:.15s}
.lang{background:#ffffff22;border-radius:30px;padding:4px;display:flex;gap:4px}
.lang button{background:transparent;color:#fff}
.lang button.on{background:#fff;color:var(--c1);box-shadow:0 2px 8px #0003}
.score{color:#fff;font-weight:600;background:#ffffff22;border-radius:30px;padding:8px 14px;font-size:.9rem}
.prog{height:10px;background:#ffffff26;border-radius:10px;overflow:hidden;margin-bottom:12px}
.prog div{height:100%;width:0;background:linear-gradient(90deg,#3ee0b0,var(--c3),var(--c2));transition:width .3s}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 12px 34px #0005}
.qno{display:inline-block;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;border-radius:20px;padding:3px 14px;font-weight:700;font-size:.85rem}
.q{font-size:1.08rem;font-weight:600;margin:12px 0 4px;white-space:pre-line;line-height:1.55}
.q.te{font-family:'Noto Sans Telugu',sans-serif;color:#4a2a99}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;transition:.15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--c1);transform:translateY(-1px)}
.opt .n{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.opt:nth-child(1) .n{background:#5b2be0}.opt:nth-child(2) .n{background:#ff4f8b}.opt:nth-child(3) .n{background:#f59e0b}.opt:nth-child(4) .n{background:#0ea5a4}
.opt .t{line-height:1.45}.opt .t .te{font-family:'Noto Sans Telugu',sans-serif;color:#4a2a99;display:block}
.opt.ok{background:#e3f9ec;border-color:var(--ok)}.opt.bad{background:#fde8e8;border-color:var(--bad)}
.opt:disabled{cursor:default}
.exp{margin-top:16px;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#fff7e0,#ffeef6);border-left:6px solid var(--c3);display:none;line-height:1.6}
.exp b{color:var(--c1)}.exp .te{font-family:'Noto Sans Telugu',sans-serif}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;box-shadow:0 4px 12px #5b2be055}
.btn.ghost{background:var(--soft);color:var(--c1);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.grid button{border:0;border-radius:8px;padding:7px 0;font:600 .8rem Poppins;cursor:pointer;background:#ffffff2e;color:#fff}
.grid button.cur{outline:3px solid var(--c3)}.grid button.g{background:var(--ok)}.grid button.r{background:var(--bad)}
.result{text-align:center}
.result .big{font-size:3rem;font-weight:700;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{margin-top:18px;text-align:center;color:#fff;background:linear-gradient(120deg,#ffffff1f,#ffffff10);border-radius:18px;padding:14px;line-height:1.7;font-size:.95rem}
footer .te{font-family:'Noto Sans Telugu',sans-serif;font-weight:700;color:#ffd166}
.hide{display:none!important}
@media(max-width:560px){header{flex-direction:column;text-align:center}.grid{grid-template-columns:repeat(5,1fr)}header h1{font-size:1.15rem}.q{font-size:1rem}}

.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.ccard{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 22px #0004;transition:.18s;border-left:8px solid var(--c);cursor:pointer}
a.ccard:hover{transform:translateY(-3px)}
.cnum{flex-shrink:0;width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem}
.ct1{font-weight:700;line-height:1.35}.ct2{font-family:'Noto Sans Telugu',sans-serif;color:#4a2a99;font-size:.93rem;margin-top:2px}.ct3{font-size:.78rem;color:#777;margin-top:4px}
.ct3 .done{color:#18a058;font-weight:600}
.sem{color:#fff;margin:22px 4px 10px;display:flex;align-items:center;gap:10px;font-size:1.1rem}
.sem b{background:linear-gradient(90deg,#3ee0b0,#ffb020);color:#1d1a33;border-radius:20px;padding:4px 14px;font-size:.85rem}
.sem span{font-family:'Noto Sans Telugu',sans-serif}
.chhead{display:flex;align-items:center;gap:10px;color:#fff;margin:12px 0 4px;flex-wrap:wrap}
.chhead .btn{padding:8px 14px}
.chtitle{font-weight:700;font-size:1.02rem}
.chtitle .te{font-family:'Noto Sans Telugu',sans-serif;display:block;font-weight:600;color:#ffd166}
</style>
</head>

const CHAPTERS = [{"n": 1, "en": "The Universe and the Earth", "te": "విశ్వం, భూమి", "c": "#5b2be0", "q": [["A vast space that contains the Sun, planets, the Milky Way galaxy and all other galaxies is called", "సూర్యుడు, గ్రహాలు, పాలపుంత, ఇతర అన్ని గెలాక్సీలను కలిగి ఉన్న అనంతమైన విస్తారమైన ప్రదేశం", ["Solar System", "Universe", "Galaxy", "Atmosphere"], ["సౌర కుటుంబం", "విశ్వం", "గెలాక్సీ (పాలపుంత)", "వాతావరణం"], 1, "The Universe is a vast space that includes the Sun, planets, the Milky Way and all other galaxies. Its range is infinite — nobody knows how big it is.", "విశ్వం అనంతమైన విస్తారమైన ప్రదేశం; సూర్యుడు, గ్రహాలు, పాలపుంత, ఇతర గెలాక్సీలన్నీ అందులో ఉంటాయి. దాని పరిధి అనంతం."], ["The word 'Universe' originated from the Latin word 'universum', which means", "'యూనివర్స్' అనే పదం లాటిన్ పదం 'యూనివర్సమ్' నుండి వచ్చింది. దాని అర్థం", ["All matter and all space", "Ball of fire", "Group of stars", "Land and water"], ["సమస్త పదార్థం, సమస్త ప్రదేశం", "అగ్ని గోళం", "నక్షత్రాల సమూహం", "భూమి, నీరు"], 0, "'Universum' means all matter and all space.", "'యూనివర్సమ్' అంటే సమస్త పదార్థం, సమస్త ప్రదేశం."], ["The science that studies the Universe is called", "విశ్వాన్ని అధ్యయనం చేసే శాస్త్రం", ["Geology", "Astronomy", "Ecology", "Biology"], ["భూవిజ్ఞాన శాస్త్రం", "ఖగోళ శాస్త్రం", "పర్యావరణ శాస్త్రం", "జీవశాస్త్రం"], 1, "The science that studies the Universe is called Astronomy. An astronomer studies stars, planets and other natural objects in space.", "విశ్వాన్ని అధ్యయనం చేసే శాస్త్రం ఖగోళ శాస్త్రం (ఆస్ట్రానమీ). నక్షత్రాలు, గ్రహాలు మొదలైనవాటిని అధ్యయనం చేసే శాస్త్రవేత్తను ఖగోళ శాస్త్రవేత్త అంటారు."], ["Scientific research in astronomy began with the Italian astronomer who made a telescope. He was", "టెలిస్కోప్‌ను తయారు చేసి ఖగోళ శాస్త్ర పరిశోధనను ప్రారంభించిన ఇటలీ ఖగోళ శాస్త్రవేత్త", ["Copernicus", "Galileo", "Ptolemy", "Immanuel Kant"], ["కోపర్నికస్", "గెలీలియో", "టాలెమీ", "ఇమ్మాన్యుయేల్ కాంట్"], 1, "Scientific research in astronomy began with Galileo, who made the telescope and saw many wonders in the sky.", "ఖగోళ శాస్త్ర పరిశోధన గెలీలియోతో మొదలైంది; ఆయన టెలిస్కోప్ తయారు చేసి ఆకాశంలో ఎన్నో అద్భుతాలను చూశాడు."], ["The theory about the origin of the Universe is", "విశ్వం ఆవిర్భావానికి సంబంధించిన సిద్ధాంతం", ["Geocentric theory", "Heliocentric theory", "Big Bang theory", "Nebular hypothesis"], ["భూకేంద్రక సిద్ధాంతం", "సూర్యకేంద్రక సిద్ధాంతం", "మహావిస్ఫోటన (బిగ్ బ్యాంగ్) సిద్ధాంతం", "నీహారిక పరికల్పన"], 2, "The Big Bang theory is about the origin of the Universe. Geocentric, Heliocentric and Nebular theories are about the Solar System.", "బిగ్ బ్యాంగ్ సిద్ధాంతం విశ్వం ఆవిర్భావానికి సంబంధించినది. భూకేంద్రక, సూర్యకేంద్రక, నీహారిక సిద్ధాంతాలు సౌర కుటుంబానికి సంబంధించినవి."], ["The Big Bang theory was first proposed by the Belgian astronomer", "బిగ్ బ్యాంగ్ సిద్ధాంతాన్ని మొదట ప్రతిపాదించిన బెల్జియం ఖగోళ శాస్త్రవేత్త", ["Georges Lemaitre", "Nicolaus Copernicus", "Galileo Galilei", "Ptolemy"], ["జార్జెస్ లెమైత్రే", "నికోలస్ కోపర్నికస్", "గెలీలియో గెలీలీ", "టాలెమీ"], 0, "The Big Bang theory was first proposed by Georges Lemaitre, a Belgian astronomer.", "బిగ్ బ్యాంగ్ సిద్ధాంతాన్ని బెల్జియం ఖగోళ శాస్త్రవేత్త జార్జెస్ లెమైత్రే మొదట ప్రతిపాదించారు."], ["According to the Big Bang theory, the present-day Universe began from a tiny atom about", "బిగ్ బ్యాంగ్ సిద్ధాంతం ప్రకారం నేటి విశ్వం ఒక చిన్న అణువు నుండి సుమారు ఎన్ని సంవత్సరాల క్రితం మొదలైంది", ["4.6 billion years ago", "13.7 billion years ago", "2.6 million years ago", "137 million years ago"], ["460 కోట్ల సంవత్సరాల క్రితం", "1370 కోట్ల సంవత్సరాల క్రితం", "26 లక్షల సంవత్సరాల క్రితం", "13.7 కోట్ల సంవత్సరాల క్రితం"], 1, "Lemaitre believed the Universe began and has been expanding from a tiny atom about 13.7 billion years ago. (4.6 billion years is the age of the Solar System.)", "సుమారు 1370 కోట్ల (13.7 బిలియన్) సంవత్సరాల క్రితం ఒక చిన్న అణువు నుండి విశ్వం మొదలై విస్తరిస్తోంది. (460 కోట్ల సంవత్సరాలు సౌర కుటుంబ వయస్సు.)"], ["According to the Big Bang theory, the tiny atom exploded because of its", "బిగ్ బ్యాంగ్ సిద్ధాంతం ప్రకారం ఆ చిన్న అణువు పేలడానికి కారణం", ["Increasing temperature and density", "Low temperature", "Collision with the Earth", "Gravity of the Moon"], ["పెరుగుతున్న ఉష్ణోగ్రత, సాంద్రత", "తక్కువ ఉష్ణోగ్రత", "భూమితో ఢీకొనడం", "చంద్రుని ఆకర్షణ"], 0, "The tiny atom had infinite temperature and density; due to increasing temperature and density it exploded, forming stars, galaxies, planets and satellites. The expansion continues today.", "ఆ అణువుకు అనంత ఉష్ణోగ్రత, సాంద్రత ఉండేవి; అవి పెరగడంతో అది పేలి నక్షత్రాలు, గెలాక్సీలు, గ్రహాలు, ఉపగ్రహాలు ఏర్పడ్డాయి. విశ్వ విస్తరణ నేటికీ కొనసాగుతోంది."], ["According to astronomers, the number of galaxies in the Universe is at least", "ఖగోళ శాస్త్రవేత్తల ప్రకారం విశ్వంలో కనీసం ఇన్ని గెలాక్సీలు ఉన్నాయి", ["125 million", "125 billion", "1,20,000", "8"], ["12.5 కోట్లు", "12,500 కోట్లు (125 బిలియన్)", "1,20,000", "8"], 1, "According to astronomers, at least 125 billion galaxies are there in the Universe.", "ఖగోళ శాస్త్రవేత్తల ప్రకారం విశ్వంలో కనీసం 125 బిలియన్ (12,500 కోట్ల) గెలాక్సీలు ఉన్నాయి."], ["The galaxy in which our Solar System is located is the", "మన సౌర కుటుంబం ఉన్న గెలాక్సీ", ["Andromeda", "Milky Way", "Big Bear", "Orion"], ["ఆండ్రోమెడా", "పాలపుంత (మిల్కీ వే)", "బిగ్ బేర్", "ఓరియన్"], 1, "The Milky Way is the galaxy in which our Solar System is located.", "మన సౌర కుటుంబం పాలపుంత (మిల్కీ వే) గెలాక్సీలో ఉంది."], ["A light-year is a unit of", "కాంతి సంవత్సరం దేనికి ప్రమాణం", ["Time", "Distance", "Speed", "Temperature"], ["కాలం", "దూరం", "వేగం", "ఉష్ణోగ్రత"], 1, "A light-year is a unit of distance — the distance light travels in one year at about 3,00,000 km per second.", "కాంతి సంవత్సరం దూరానికి ప్రమాణం — సెకనుకు సుమారు 3,00,000 కి.మీ. వేగంతో కాంతి ఒక సంవత్సరంలో ప్రయాణించే దూరం."], ["According to the textbook, the distance from one edge of our galaxy to the other is", "పాఠ్యపుస్తకం ప్రకారం గెలాక్సీ ఒక అంచు నుండి మరో అంచుకు దూరం", ["1,20,000 light-years", "3,00,000 km", "4.6 billion km", "125 light-years"], ["1,20,000 కాంతి సంవత్సరాలు", "3,00,000 కి.మీ.", "460 కోట్ల కి.మీ.", "125 కాంతి సంవత్సరాలు"], 0, "The distance from one edge of the galaxy to the other is 1,20,000 light-years.", "గెలాక్సీ ఒక అంచు నుండి మరో అంచుకు దూరం 1,20,000 కాంతి సంవత్సరాలు."], ["Scientists estimate that our Solar System was formed about", "మన సౌర కుటుంబం ఏర్పడిన కాలం సుమారు", ["13.7 billion years ago", "4.6 billion years ago", "1 million years ago", "5000 years ago"], ["1370 కోట్ల సంవత్సరాల క్రితం", "460 కోట్ల సంవత్సరాల క్రితం", "10 లక్షల సంవత్సరాల క్రితం", "5000 సంవత్సరాల క్రితం"], 1, "Scientists estimated that our Solar System was formed about 4.6 billion years ago.", "మన సౌర కుటుంబం సుమారు 460 కోట్ల (4.6 బిలియన్) సంవత్సరాల క్రితం ఏర్పడిందని శాస్త్రవేత్తల అంచనా."], ["Match the theories of origin of the Solar System with their proponents:\nA. Geocentric theory   B. Heliocentric theory   C. Nebular hypothesis\n1. Immanuel Kant   2. Ptolemy   3. Nicolaus Copernicus", "సౌర కుటుంబ ఆవిర్భావ సిద్ధాంతాలను ప్రతిపాదకులతో జతపరచండి:\nA. భూకేంద్రక సిద్ధాంతం   B. సూర్యకేంద్రక సిద్ధాంతం   C. నీహారిక పరికల్పన\n1. ఇమ్మాన్యుయేల్ కాంట్   2. టాలెమీ   3. నికోలస్ కోపర్నికస్", ["A-2, B-3, C-1", "A-3, B-2, C-1", "A-1, B-3, C-2", "A-2, B-1, C-3"], ["A-2, B-3, C-1", "A-3, B-2, C-1", "A-1, B-3, C-2", "A-2, B-1, C-3"], 0, "Geocentric – Ptolemy (Egyptian astronomer); Heliocentric – Nicolaus Copernicus (Polish astronomer); Nebular hypothesis – Immanuel Kant.", "భూకేంద్రక – టాలెమీ (ఈజిప్టు ఖగోళ శాస్త్రవేత్త); సూర్యకేంద్రక – నికోలస్ కోపర్నికస్ (పోలెండ్); నీహారిక పరికల్పన – ఇమ్మాన్యుయేల్ కాంట్."], ["According to the Geocentric theory proposed by Ptolemy", "టాలెమీ ప్రతిపాదించిన భూకేంద్రక సిద్ధాంతం ప్రకారం", ["The Sun is at the centre", "The Earth is at the centre and the Sun and other bodies revolve around it", "Planets formed from a cloud of dust", "The Universe began with an explosion"], ["సూర్యుడు కేంద్రంలో ఉంటాడు", "భూమి కేంద్రంలో ఉండి సూర్యుడు, ఇతర ఖగోళ వస్తువులు దాని చుట్టూ తిరుగుతాయి", "ధూళి మేఘం నుండి గ్రహాలు ఏర్పడ్డాయి", "విస్ఫోటనంతో విశ్వం మొదలైంది"], 1, "In the Geocentric theory the Earth is at the centre of the Universe and the Sun and other celestial bodies revolve around it.", "భూకేంద్రక సిద్ధాంతం ప్రకారం భూమి విశ్వ కేంద్రం; సూర్యుడు, ఇతర ఖగోళ వస్తువులు దాని చుట్టూ తిరుగుతాయి."], ["The theory that the Sun is at the centre and planets, satellites and other bodies revolve around it was proposed by the Polish astronomer", "సూర్యుడు కేంద్రంలో ఉండి గ్రహాలు, ఉపగ్రహాలు దాని చుట్టూ తిరుగుతాయని ప్రతిపాదించిన పోలెండ్ ఖగోళ శాస్త్రవేత్త", ["Ptolemy", "Nicolaus Copernicus", "Georges Lemaitre", "Galileo"], ["టాలెమీ", "నికోలస్ కోపర్నికస్", "జార్జెస్ లెమైత్రే", "గెలీలియో"], 1, "The Heliocentric theory (Sun at the centre) was proposed by Nicolaus Copernicus, a Polish astronomer.", "సూర్యకేంద్రక సిద్ధాంతాన్ని పోలెండ్ ఖగోళ శాస్త్రవేత్త నికోలస్ కోపర్నికస్ ప్రతిపాదించాడు."], ["According to the Nebular hypothesis, the planets were formed out of", "నీహారిక పరికల్పన ప్రకారం గ్రహాలు వీటి నుండి ఏర్పడ్డాయి", ["A cloud of dust and gases associated with the Sun", "Pieces of the Moon", "Ocean water", "A tiny atom that exploded"], ["సూర్యునితో సంబంధమున్న ధూళి, వాయువుల మేఘం", "చంద్రుని ముక్కలు", "సముద్రపు నీరు", "పేలిన చిన్న అణువు"], 0, "The Nebular hypothesis (Immanuel Kant): the planets were formed out of a cloud of dust and gases associated with the Sun.", "నీహారిక పరికల్పన (ఇమ్మాన్యుయేల్ కాంట్): సూర్యునితో సంబంధమున్న ధూళి, వాయువుల మేఘం నుండి గ్రహాలు ఏర్పడ్డాయి."], ["The Earth is the only planet in the Solar System capable of supporting life because", "సౌర కుటుంబంలో జీవానికి అనుకూలమైన ఏకైక గ్రహం భూమి. ఎందుకంటే", ["It is the biggest planet", "It has the right temperature, being neither too close to nor too far from the Sun", "It has no atmosphere", "It is nearest to the Sun"], ["అది అతిపెద్ద గ్రహం", "సూర్యునికి మరీ దగ్గరగా, మరీ దూరంగా లేకపోవడంతో సరైన ఉష్ణోగ్రత ఉంది", "దానికి వాతావరణం లేదు", "అది సూర్యునికి అతి దగ్గరగా ఉంది"], 1, "The Earth has the right temperature because it is neither too close to the Sun nor too far from it; so living things survive on the Earth.", "భూమి సూర్యునికి మరీ దగ్గరగా గానీ, మరీ దూరంగా గానీ లేనందున సరైన ఉష్ణోగ్రత ఉంది; అందుకే జీవులు మనుగడ సాగిస్తున్నాయి."], ["A natural system that works with all living and non-living things, including plants, animals and micro-organisms in an area, is called", "ఒక ప్రాంతంలోని మొక్కలు, జంతువులు, సూక్ష్మజీవులతో సహా అన్ని జీవ, నిర్జీవ వస్తువులతో కూడిన సహజ వ్యవస్థ", ["Environment", "Galaxy", "Lithosphere", "Universe"], ["పర్యావరణం", "గెలాక్సీ", "శిలావరణం", "విశ్వం"], 0, "An environment is a natural system of all living and non-living things. It is our basic life-supporting system — giving air, water, food and land.", "పర్యావరణం అన్ని జీవ, నిర్జీవ వస్తువుల సహజ వ్యవస్థ. గాలి, నీరు, ఆహారం, భూమిని అందించే మన ప్రాథమిక జీవనాధార వ్యవస్థ."], ["The word 'Environment' is derived from the French word 'Environer / Environner', meaning", "'ఎన్విరాన్‌మెంట్' పదం ఫ్రెంచ్ పదం 'ఎన్విరోనర్' నుండి వచ్చింది. దాని అర్థం", ["Neighbourhood", "Life", "Stone", "Water"], ["పరిసరాలు (చుట్టుపక్కల)", "జీవం", "రాయి", "నీరు"], 0, "'Environer / Environner' (French) means 'neighbourhood' — our surroundings.", "'ఎన్విరోనర్' (ఫ్రెంచ్) అంటే 'పరిసరాలు' — మన చుట్టుపక్కల."], ["Match the days with their celebrations:\nA. June 5th   B. April 22nd   C. March 22nd   D. September 16th\n1. World Water Day   2. World Ozone Day   3. World Environment Day   4. World Earth Day", "రోజులను వాటి దినోత్సవాలతో జతపరచండి:\nA. జూన్ 5   B. ఏప్రిల్ 22   C. మార్చి 22   D. సెప్టెంబర్ 16\n1. ప్రపంచ జల దినోత్సవం   2. ప్రపంచ ఓజోన్ దినోత్సవం   3. ప్రపంచ పర్యావరణ దినోత్సవం   4. ప్రపంచ ధరిత్రీ దినోత్సవం", ["A-3, B-4, C-1, D-2", "A-4, B-3, C-1, D-2", "A-3, B-1, C-4, D-2", "A-3, B-4, C-2, D-1"], ["A-3, B-4, C-1, D-2", "A-4, B-3, C-1, D-2", "A-3, B-1, C-4, D-2", "A-3, B-4, C-2, D-1"], 0, "June 5 – World Environment Day; April 22 – World Earth Day; March 22 – World Water Day; September 16 – World Ozone Day.", "జూన్ 5 – ప్రపంచ పర్యావరణ దినం; ఏప్రిల్ 22 – ప్రపంచ ధరిత్రీ దినం; మార్చి 22 – ప్రపంచ జల దినం; సెప్టెంబర్ 16 – ప్రపంచ ఓజోన్ దినం."], ["The components of the environment are classified into three categories. They are", "పర్యావరణ అంశాలను మూడు వర్గాలుగా విభజిస్తారు. అవి", ["Natural, Human and Man-made", "Land, Water and Air", "Plants, Animals and Insects", "Rural, Urban and Tribal"], ["సహజ, మానవ, మానవ నిర్మిత", "భూమి, నీరు, గాలి", "మొక్కలు, జంతువులు, కీటకాలు", "గ్రామీణ, పట్టణ, గిరిజన"], 0, "The things in the environment are classified as Natural, Human and Man-made components.", "పర్యావరణంలోని అంశాలను సహజ, మానవ, మానవ నిర్మిత అంశాలుగా వర్గీకరిస్తారు."], ["Identify the one that is NOT a component of the human environment", "మానవ పర్యావరణ అంశం కానిది", ["Factory", "Religion", "Community", "Family"], ["కర్మాగారం", "మతం", "సమాజం (సముదాయం)", "కుటుంబం"], 0, "Human environment consists of individual, family, community, religious, educational, economic and political situations. A factory is part of the man-made environment. (Textbook exercise question.)", "మానవ పర్యావరణంలో వ్యక్తి, కుటుంబం, సమాజం, మత, విద్య, ఆర్థిక, రాజకీయ పరిస్థితులు ఉంటాయి. కర్మాగారం మానవ నిర్మిత పర్యావరణానికి చెందినది. (పాఠ్యపుస్తక అభ్యాస ప్రశ్న.)"], ["Find the odd one out", "వేరుగా ఉన్నదాన్ని గుర్తించండి", ["Plains", "Road", "Valley", "River"], ["మైదానాలు", "రోడ్డు", "లోయ", "నది"], 1, "Plains, valley and river are natural environment; a road is part of the man-made environment. (Textbook exercise question.)", "మైదానాలు, లోయ, నది సహజ పర్యావరణం; రోడ్డు మానవ నిర్మిత పర్యావరణం. (పాఠ్యపుస్తక అభ్యాస ప్రశ్న.)"], ["Buildings, factories, parks, roads, bridges, projects and monuments belong to the", "భవనాలు, కర్మాగారాలు, పార్కులు, రోడ్లు, వంతెనలు, ప్రాజెక్టులు, స్మారకాలు ఈ పర్యావరణానికి చెందుతాయి", ["Natural environment", "Human environment", "Man-made environment", "Biosphere"], ["సహజ పర్యావరణం", "మానవ పర్యావరణం", "మానవ నిర్మిత పర్యావరణం", "జీవావరణం"], 2, "Our surroundings made by human beings — buildings, factories, parks, roads, bridges, projects, monuments — form the man-made environment.", "మనుషులు నిర్మించిన పరిసరాలు — భవనాలు, కర్మాగారాలు, పార్కులు, రోడ్లు, వంతెనలు, ప్రాజెక్టులు, స్మారకాలు — మానవ నిర్మిత పర్యావరణం."], ["The natural environment comprises land, water, air and living organisms. These are also called", "భూమి, నీరు, గాలి, జీవులతో కూడిన సహజ పర్యావరణాన్ని ఇలా కూడా అంటారు", ["Natural realms of the Earth", "Man-made elements", "Human environment", "Layers of the interior"], ["భూమి యొక్క సహజ ఆవరణాలు", "మానవ నిర్మిత అంశాలు", "మానవ పర్యావరణం", "అంతర్భాగ పొరలు"], 0, "Lithosphere, Hydrosphere, Atmosphere and Biosphere are the natural elements, also called the natural realms of the Earth.", "శిలావరణం, జలావరణం, వాతావరణం, జీవావరణం సహజ అంశాలు; వీటిని భూమి సహజ ఆవరణాలు అంటారు."], ["The solid part of the Earth, made up of rocks and minerals and covered with a thin layer of soil, is the", "శిలలు, ఖనిజాలతో ఏర్పడి, పలుచని మట్టి పొరతో కప్పబడిన భూమి యొక్క ఘన భాగం", ["Hydrosphere", "Lithosphere", "Atmosphere", "Biosphere"], ["జలావరణం", "శిలావరణం", "వాతావరణం", "జీవావరణం"], 1, "The solid part of the Earth is the Lithosphere — rocks and minerals covered with a thin soil layer, with landforms like mountains, plateaus, plains, valleys and deserts.", "భూమి ఘన భాగం శిలావరణం — శిలలు, ఖనిజాలతో ఏర్పడి పలుచని మట్టి పొర కలిగి ఉంటుంది; పర్వతాలు, పీఠభూములు, మైదానాలు, లోయలు, ఎడారులు వంటి భూస్వరూపాలు ఉంటాయి."], ["Match the Greek root words with their meanings:\nA. Litho   B. Hydor   C. Atmos   D. Bios\n1. Life   2. Vapour   3. Water   4. Stone / rock", "గ్రీకు మూల పదాలను వాటి అర్థాలతో జతపరచండి:\nA. లిథో   B. హైడర్   C. అట్మోస్   D. బయోస్\n1. జీవం   2. ఆవిరి   3. నీరు   4. రాయి / శిల", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Litho – stone/rock; Hydor – water; Atmos – vapour; Bios – life. 'Sphaira' means sphere or ball.", "లిథో – రాయి/శిల; హైడర్ – నీరు; అట్మోస్ – ఆవిరి; బయోస్ – జీవం. 'స్ఫైరా' అంటే గోళం / బంతి."], ["The landforms of the Lithosphere are divided into", "శిలావరణంలోని భూస్వరూపాలను ఇన్ని రకాలుగా విభజిస్తారు", ["Two types", "Three types — first, second and third order", "Four types", "Five types"], ["రెండు రకాలు", "మూడు రకాలు — ప్రథమ, ద్వితీయ, తృతీయ శ్రేణి", "నాలుగు రకాలు", "ఐదు రకాలు"], 1, "Landforms are divided into three types: first order, second order and third order landforms.", "భూస్వరూపాలు మూడు రకాలు: ప్రథమ శ్రేణి, ద్వితీయ శ్రేణి, తృతీయ శ్రేణి భూస్వరూపాలు."], ["The Earth consists of three layers. Arrange them from the surface to the centre", "భూమిలోని మూడు పొరలను ఉపరితలం నుండి కేంద్రం వైపు అమర్చండి", ["Crust, Mantle, Core", "Core, Mantle, Crust", "Mantle, Crust, Core", "Crust, Core, Mantle"], ["భూపటలం, ప్రావారం, కేంద్రమండలం", "కేంద్రమండలం, ప్రావారం, భూపటలం", "ప్రావారం, భూపటలం, కేంద్రమండలం", "భూపటలం, కేంద్రమండలం, ప్రావారం"], 0, "Like an egg, the Earth has three layers: 1. Crust 2. Mantle 3. Core (outer core and inner core).", "గుడ్డు వలె భూమికి మూడు పొరలు: 1. భూపటలం (క్రస్ట్) 2. ప్రావారం (మాంటిల్) 3. కేంద్రమండలం (కోర్ — బాహ్య, అంతర)."], ["The second layer of the interior of the Earth is the", "భూ అంతర్భాగంలో రెండవ పొర", ["Mantle", "Inner Core", "Outer Core", "Crust"], ["ప్రావారం (మాంటిల్)", "అంతర కేంద్రమండలం", "బాహ్య కేంద్రమండలం", "భూపటలం"], 0, "The layers are Crust (1st), Mantle (2nd) and Core (3rd). (Textbook exercise question.)", "పొరలు: భూపటలం (1వ), ప్రావారం (2వ), కేంద్రమండలం (3వ). (పాఠ్యపుస్తక అభ్యాస ప్రశ్న.)"], ["The Core of the Earth is divided into", "భూ కేంద్రమండలాన్ని ఇలా విభజిస్తారు", ["Outer core and Inner core", "Crust and Mantle", "Upper and lower crust", "Troposphere and Stratosphere"], ["బాహ్య కేంద్రమండలం, అంతర కేంద్రమండలం", "భూపటలం, ప్రావారం", "ఎగువ, దిగువ భూపటలం", "ట్రోపోస్ఫియర్, స్ట్రాటోస్ఫియర్"], 0, "Fig 1.8 shows the core as 3a Outer Core and 3b Inner Core — the deep interior part of the Earth.", "పటం 1.8 కేంద్రమండలాన్ని 3a బాహ్య, 3b అంతర కేంద్రమండలాలుగా చూపుతుంది — ఇది భూమి లోతైన అంతర్భాగం."], ["The Earth is known as the 'Watery Planet' because", "భూమిని 'జల గ్రహం' అని పిలవడానికి కారణం", ["It is the only planet containing water in abundance", "It rains every day", "It is made of ice", "It is near Neptune"], ["సమృద్ధిగా నీరు ఉన్న ఏకైక గ్రహం", "ప్రతిరోజూ వర్షం పడుతుంది", "అది మంచుతో ఏర్పడింది", "అది నెప్ట్యూన్‌కు దగ్గరగా ఉంది"], 0, "The Earth is the only planet containing water in abundance; the presence of life is mainly due to its water and air.", "సమృద్ధిగా నీరు ఉన్న ఏకైక గ్రహం భూమి; జీవం ఉండటానికి ప్రధాన కారణం నీరు, గాలి."], ["About how much of the Earth's surface is covered by the hydrosphere?", "భూ ఉపరితలంలో సుమారు ఎంత భాగం జలావరణంతో కప్పబడి ఉంది", ["1/3 (29%)", "2/3 (71%)", "1/2 (50%)", "3/4 (90%)"], ["1/3 (29%)", "2/3 (71%)", "1/2 (50%)", "3/4 (90%)"], 1, "About 2/3 (71%) of the Earth's surface is covered by the hydrosphere.", "భూ ఉపరితలంలో సుమారు 2/3 (71%) భాగం జలావరణంతో కప్పబడి ఉంది."], ["Of the total water on the Earth, the percentage useful to our needs is only", "భూమిపై ఉన్న మొత్తం నీటిలో మన అవసరాలకు ఉపయోగపడేది కేవలం", ["1%", "10%", "29%", "71%"], ["1%", "10%", "29%", "71%"], 0, "Only 1% of water is useful to our needs; the remaining 99% is in the form of ice, saline water etc. So we must avoid wasting water.", "మన అవసరాలకు ఉపయోగపడేది 1% నీరు మాత్రమే; మిగతా 99% మంచు, ఉప్పు నీరు రూపంలో ఉంది. అందుకే నీటిని వృథా చేయకూడదు."], ["Water found deep down under the Earth among rocks is called", "భూమి లోపల రాళ్ళ మధ్య లోతుగా ఉండే నీటిని ఇలా అంటారు", ["Surface water", "Ground water", "Saline water", "Rain water"], ["ఉపరితల నీరు", "భూగర్భ జలం", "ఉప్పు నీరు", "వర్షపు నీరు"], 1, "Some part of water found deep down under the Earth among rocks is called ground water.", "భూమి లోపల రాళ్ళ మధ్య ఉండే నీటిని భూగర్భ జలం అంటారు."], ["The thin envelope of air surrounding the Earth is called", "భూమిని ఆవరించి ఉన్న పలుచని వాయు పొరను ఇలా అంటారు", ["Lithosphere", "Hydrosphere", "Atmosphere", "Biosphere"], ["శిలావరణం", "జలావరణం", "వాతావరణం", "జీవావరణం"], 2, "The thin envelope of air surrounding the Earth is the atmosphere; it extends several hundred kilometres upward.", "భూమిని ఆవరించి ఉన్న పలుచని వాయు పొర వాతావరణం; ఇది కొన్ని వందల కిలోమీటర్ల ఎత్తు వరకు విస్తరించి ఉంది."], ["The gas regarded as the 'breath of life', without which life would not be possible, is", "'జీవ శ్వాస'గా పరిగణించే, అది లేకుండా జీవం సాధ్యం కాని వాయువు", ["Nitrogen", "Oxygen", "Carbon dioxide", "Helium"], ["నైట్రోజన్", "ఆక్సిజన్", "కార్బన్ డై ఆక్సైడ్", "హీలియం"], 1, "Oxygen is regarded as the 'breath of life'. Nitrogen, oxygen and carbon dioxide are important gases of the atmosphere.", "ఆక్సిజన్‌ను 'జీవ శ్వాస' అంటారు. నైట్రోజన్, ఆక్సిజన్, కార్బన్ డై ఆక్సైడ్ వాతావరణంలోని ముఖ్య వాయువులు."], ["Arrange the five layers of the atmosphere from the Earth's surface upwards", "వాతావరణంలోని ఐదు పొరలను భూ ఉపరితలం నుండి పైకి అమర్చండి", ["Troposphere, Stratosphere, Mesosphere, Thermosphere, Exosphere", "Stratosphere, Troposphere, Mesosphere, Exosphere, Thermosphere", "Exosphere, Thermosphere, Mesosphere, Stratosphere, Troposphere", "Troposphere, Mesosphere, Stratosphere, Thermosphere, Exosphere"], ["ట్రోపోస్ఫియర్, స్ట్రాటోస్ఫియర్, మీసోస్ఫియర్, థర్మోస్ఫియర్, ఎక్సోస్ఫియర్", "స్ట్రాటోస్ఫియర్, ట్రోపోస్ఫియర్, మీసోస్ఫియర్, ఎక్సోస్ఫియర్, థర్మోస్ఫియర్", "ఎక్సోస్ఫియర్, థర్మోస్ఫియర్, మీసోస్ఫియర్, స్ట్రాటోస్ఫియర్, ట్రోపోస్ఫియర్", "ట్రోపోస్ఫియర్, మీసోస్ఫియర్, స్ట్రాటోస్ఫియర్, థర్మోస్ఫియర్, ఎక్సోస్ఫియర్"], 0, "From the surface: Troposphere, Stratosphere, Mesosphere, Thermosphere and Exosphere. There is no sharp boundary between them.", "ఉపరితలం నుండి: ట్రోపోస్ఫియర్, స్ట్రాటోస్ఫియర్, మీసోస్ఫియర్, థర్మోస్ఫియర్, ఎక్సోస్ఫియర్. వీటి మధ్య స్పష్టమైన సరిహద్దులు లేవు."], ["Plants use carbon dioxide from the atmosphere for", "వాతావరణంలోని కార్బన్ డై ఆక్సైడ్‌ను మొక్కలు దీని కోసం వాడతాయి", ["Photosynthesis", "Respiration only", "Pollination", "Germination only"], ["కిరణజన్య సంయోగక్రియ", "శ్వాసక్రియ మాత్రమే", "పరాగ సంపర్కం", "అంకురోత్పత్తి మాత్రమే"], 0, "Carbon dioxide helps plants in photosynthesis — using sunlight to synthesise nutrients from carbon dioxide and water.", "కార్బన్ డై ఆక్సైడ్ మొక్కల కిరణజన్య సంయోగక్రియకు సహాయపడుతుంది — సూర్యకాంతితో కార్బన్ డై ఆక్సైడ్, నీటి నుండి పోషకాలు తయారు చేసుకోవడం."], ["Identify the one that is NOT a function of the atmosphere", "వాతావరణం చేసే పని కానిది", ["Provides oxygen to animals", "Protects us from harmful rays of the Sun", "Helps formation of clouds and rain", "Provides minerals for industries"], ["జంతువులకు ఆక్సిజన్ ఇవ్వడం", "సూర్యుని హానికర కిరణాల నుండి రక్షణ", "మేఘాలు, వర్షం ఏర్పడటానికి సహాయం", "పరిశ్రమలకు ఖనిజాలు అందించడం"], 3, "The atmosphere gives oxygen, carbon dioxide for plants, protects from harmful rays and heat, and helps form clouds and rain. Minerals for industries come from the lithosphere.", "వాతావరణం ఆక్సిజన్, మొక్కలకు కార్బన్ డై ఆక్సైడ్ ఇస్తుంది; హానికర కిరణాల నుండి రక్షిస్తుంది; మేఘాలు, వర్షానికి తోడ్పడుతుంది. పరిశ్రమలకు ఖనిజాలు శిలావరణం నుండి లభిస్తాయి."], ["A narrow zone of the Earth where land, water and air interact and micro-organisms, plants, animals and humans live together is the", "భూమి, నీరు, గాలి పరస్పరం ప్రభావితం చేసుకుంటూ, సూక్ష్మజీవులు, మొక్కలు, జంతువులు, మనుషులు కలిసి జీవించే ఇరుకైన మండలం", ["Lithosphere", "Hydrosphere", "Atmosphere", "Biosphere"], ["శిలావరణం", "జలావరణం", "వాతావరణం", "జీవావరణం"], 3, "The Biosphere is the zone where land, water and air interact and all living organisms live together.", "భూమి, నీరు, గాలి పరస్పర చర్య జరిగే, అన్ని జీవులు కలిసి జీవించే మండలం జీవావరణం."], ["Match the following:\nA. Lithosphere   B. Biosphere   C. Core   D. Hydrosphere\n1. Natural domain of water   2. Deep interior part of the Earth   3. Narrow zone where land, water and air interact   4. Rocky layer of the Earth", "జతపరచండి:\nA. శిలావరణం   B. జీవావరణం   C. కేంద్రమండలం   D. జలావరణం\n1. నీటి సహజ ఆవరణం   2. భూమి లోతైన అంతర్భాగం   3. భూమి, నీరు, గాలి కలిసే ఇరుకు మండలం   4. భూమి శిలా పొర", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Lithosphere – rocky layer; Biosphere – narrow zone where land, water and air interact; Core – deep interior; Hydrosphere – natural domain of water. (Textbook match the following.)", "శిలావరణం – శిలా పొర; జీవావరణం – భూమి, నీరు, గాలి కలిసే మండలం; కేంద్రమండలం – లోతైన అంతర్భాగం; జలావరణం – నీటి ఆవరణం. (పాఠ్యపుస్తక జతపరచడం.)"], ["Addition of various impurities to the environment, causing undesirable changes in air, water and soil, is called", "పర్యావరణానికి వివిధ మలినాలు చేరి గాలి, నీరు, నేలల్లో అవాంఛనీయ మార్పులు రావడాన్ని ఇలా అంటారు", ["Conservation", "Pollution", "Photosynthesis", "Recycling"], ["సంరక్షణ", "కాలుష్యం", "కిరణజన్య సంయోగక్రియ", "పునర్వినియోగం"], 1, "Pollution is the addition of impurities to the environment — an undesirable change in chemical, physical and biological characteristics of air, water and soil.", "పర్యావరణానికి మలినాలు చేరడం కాలుష్యం — గాలి, నీరు, నేలల రసాయన, భౌతిక, జీవ లక్షణాల్లో అవాంఛనీయ మార్పు."], ["Identify the one that is NOT an effect of air pollution", "వాయు కాలుష్య ప్రభావం కానిది", ["Global warming", "Acid rain", "Respiratory health problems", "Increase in forest cover"], ["భూతాపం", "ఆమ్ల వర్షం", "శ్వాసకోశ ఆరోగ్య సమస్యలు", "అటవీ విస్తీర్ణం పెరగడం"], 3, "Air pollution causes global warming, climate change, acid rain, declining farmland, extinction of species and respiratory problems. It does not increase forest cover.", "వాయు కాలుష్యం భూతాపం, వాతావరణ మార్పు, ఆమ్ల వర్షాలు, సాగుభూమి తగ్గుదల, జీవజాతుల అంతరింపు, శ్వాసకోశ సమస్యలకు దారితీస్తుంది. అడవులను పెంచదు."], ["Which of the following is a threat to the environment?", "కింది వాటిలో పర్యావరణానికి ముప్పు ఏది?", ["Growing plants", "Growing crops", "Growing vehicles", "None of these"], ["మొక్కలు పెరగడం", "పంటలు పెరగడం", "వాహనాలు పెరగడం", "ఏదీ కాదు"], 2, "Growing number of vehicles increases fuel consumption and smoke, causing air pollution. (Textbook exercise question.)", "వాహనాల సంఖ్య పెరగడం వల్ల ఇంధన వినియోగం, పొగ పెరిగి వాయు కాలుష్యం ఏర్పడుతుంది. (పాఠ్యపుస్తక అభ్యాస ప్రశ్న.)"], ["Industrial effluents from paper and pulp mills and dyeing textile industries mainly cause", "కాగితం, గుజ్జు మిల్లులు, రంగుల వస్త్ర పరిశ్రమల వ్యర్థాలు ప్రధానంగా కలిగించేది", ["Water pollution", "Noise pollution", "Light pollution", "Earthquakes"], ["నీటి కాలుష్యం", "శబ్ద కాలుష్యం", "కాంతి కాలుష్యం", "భూకంపాలు"], 0, "Industrial effluents (paper and pulp mills, dyeing textile industries) and fertiliser and chemical industries are causes of water pollution.", "పారిశ్రామిక వ్యర్థాలు (కాగితం, గుజ్జు మిల్లులు, రంగుల వస్త్ర పరిశ్రమలు), ఎరువులు, రసాయన పరిశ్రమలు నీటి కాలుష్యానికి కారణాలు."], ["Identify the one that is NOT a way to conserve natural resources like air and water", "గాలి, నీరు వంటి సహజ వనరుల సంరక్షణ మార్గం కానిది", ["Recycling and reusing", "Planting more trees", "Using bio-gas and bio-fuels", "Dumping industrial wastes into rivers"], ["పునర్వినియోగం, తిరిగి వాడటం", "ఎక్కువ చెట్లు నాటడం", "బయోగ్యాస్, జీవ ఇంధనాల వాడకం", "పారిశ్రామిక వ్యర్థాలను నదుల్లో పడేయడం"], 3, "Conservation: recycling and reusing, planting trees, alternatives to non-renewable resources, bio-gas and bio-fuels, optimal use of water, and avoiding dumping industrial wastes into rivers.", "సంరక్షణ మార్గాలు: పునర్వినియోగం, చెట్లు నాటడం, పునరుత్పాదకం కాని వనరులకు ప్రత్యామ్నాయాలు, బయోగ్యాస్, జీవ ఇంధనాలు, నీటి పొదుపు, నదుల్లో పారిశ్రామిక వ్యర్థాలు పడేయకపోవడం."], ["A situation of prolonged shortage of water supply, whether surface water or ground water, is an example of", "ఉపరితల లేదా భూగర్భ జలాల సరఫరాలో దీర్ఘకాలిక కొరత దీనికి ఉదాహరణ", ["Man-made disaster — fire", "Natural disaster — drought", "Man-made disaster — accident", "Flood"], ["మానవ కారక విపత్తు — అగ్ని ప్రమాదం", "సహజ విపత్తు — కరువు", "మానవ కారక విపత్తు — ప్రమాదం", "వరద"], 1, "A drought is a natural disaster — a situation of prolonged shortage of water supply. Man-made disasters result from technological or human hazards.", "కరువు సహజ విపత్తు — నీటి సరఫరాలో దీర్ఘకాలిక కొరత. మానవ కారక విపత్తులు సాంకేతిక లేదా మానవ ప్రమాదాల ఫలితం."], ["For the first time, disaster management was defined as a developmental issue in the", "విపత్తు నిర్వహణను మొదటిసారిగా అభివృద్ధి అంశంగా నిర్వచించినది", ["Fifth Five-Year Plan", "Eighth Five-Year Plan", "Tenth Five-Year Plan", "Twelfth Five-Year Plan"], ["5వ పంచవర్ష ప్రణాళిక", "8వ పంచవర్ష ప్రణాళిక", "10వ పంచవర్ష ప్రణాళిక", "12వ పంచవర్ష ప్రణాళిక"], 2, "For the first time, disaster management was defined as a developmental issue in the Tenth Five-Year Plan, which suggested policy and operational guidelines.", "10వ పంచవర్ష ప్రణాళికలో మొదటిసారిగా విపత్తు నిర్వహణను అభివృద్ధి అంశంగా నిర్వచించి, విధాన, కార్యాచరణ మార్గదర్శకాలు సూచించారు."]]}, {"n": 2, "en": "Forests", "te": "అడవులు", "c": "#ff4f8b", "q": [["Geographers defined the climatic regions of the world based on", "భూగోళ శాస్త్రవేత్తలు ప్రపంచ శీతోష్ణ మండలాలను వీటి ఆధారంగా నిర్వచించారు", ["Temperature and precipitation", "Population and language", "Soil and minerals", "Latitude only"], ["ఉష్ణోగ్రత, అవపాతం (వర్షపాతం)", "జనాభా, భాష", "నేల, ఖనిజాలు", "అక్షాంశం మాత్రమే"], 0, "Geographers defined climatic regions based on temperature and precipitation.", "భూగోళ శాస్త్రవేత్తలు ఉష్ణోగ్రత, అవపాతం ఆధారంగా శీతోష్ణ మండలాలను నిర్వచించారు."], ["The number of climatic regions in the world, as given in the textbook, is", "పాఠ్యపుస్తకం ప్రకారం ప్రపంచంలోని శీతోష్ణ మండలాల సంఖ్య", ["Five", "Six", "Seven", "Nine"], ["ఐదు", "ఆరు", "ఏడు", "తొమ్మిది"], 2, "There are seven climatic regions: Equatorial, Savanna, Desert, Mediterranean, Steppe, Taiga and Tundra.", "ఏడు శీతోష్ణ మండలాలు: భూమధ్యరేఖా, సవన్నా, ఎడారి, మధ్యధరా, స్టెప్పీ, టైగా, టండ్రా."], ["The dense forest zone of the Equatorial region, with heavy rainfall of about 150 cm/year, is called", "సంవత్సరానికి సుమారు 150 సెం.మీ. అధిక వర్షపాతం గల భూమధ్యరేఖా ప్రాంతపు దట్టమైన అటవీ మండలాన్ని ఇలా అంటారు", ["Savanna", "Selvas", "Steppe", "Taiga"], ["సవన్నా", "సెల్వాస్", "స్టెప్పీ", "టైగా"], 1, "The Equatorial region gets heavy precipitation (about 150 cm/year) and has the most favourable conditions for trees; this dense forest zone is called 'Selvas'.", "భూమధ్యరేఖా ప్రాంతంలో అధిక వర్షపాతం (సుమారు 150 సెం.మీ.), చెట్ల పెరుగుదలకు అనుకూల పరిస్థితులు ఉంటాయి; ఈ దట్టమైన అటవీ మండలాన్ని 'సెల్వాస్' అంటారు."], ["Match the tribes with the regions they inhabit in the Equatorial zone:\nA. Red Indians   B. Pigmies\n1. Congo basin   2. Amazon basin", "భూమధ్యరేఖా మండలంలోని తెగలను వారి ప్రాంతాలతో జతపరచండి:\nA. రెడ్ ఇండియన్లు   B. పిగ్మీలు\n1. కాంగో బేసిన్   2. అమెజాన్ బేసిన్", ["A-2, B-1", "A-1, B-2", "Both live in Amazon", "Both live in Congo"], ["A-2, B-1", "A-1, B-2", "ఇద్దరూ అమెజాన్‌లో", "ఇద్దరూ కాంగోలో"], 0, "Red Indians live in the Amazon basin and Pigmies in the Congo basin; they still lead a primitive lifestyle of hunting and podu agriculture.", "రెడ్ ఇండియన్లు అమెజాన్ బేసిన్‌లో, పిగ్మీలు కాంగో బేసిన్‌లో నివసిస్తారు; ఇప్పటికీ వేట, పోడు వ్యవసాయం వంటి ఆదిమ జీవన విధానం గడుపుతున్నారు."], ["The climatic region between 10° and 20° N and S latitudes, with dense forests towards the equator and wide grasslands (1 to 6 m high grass), where people live by cattle grazing, is the", "10°–20° ఉత్తర, దక్షిణ అక్షాంశాల మధ్య ఉండి, భూమధ్యరేఖ వైపు దట్టమైన అడవులు, ఎత్తైన (1–6 మీ.) గడ్డి భూములు గల, పశువుల మేతతో జీవనం సాగించే శీతోష్ణ మండలం", ["Savanna", "Steppe", "Tundra", "Mediterranean"], ["సవన్నా", "స్టెప్పీ", "టండ్రా", "మధ్యధరా"], 0, "The Savanna extends from 10° to 20° N and S latitudes; people get their livelihood through cattle grazing. Example: Kenya.", "సవన్నా 10°–20° ఉత్తర, దక్షిణ అక్షాంశాల మధ్య ఉంటుంది; ప్రజలు పశువుల మేత ద్వారా జీవనం సాగిస్తారు. ఉదా: కెన్యా."], ["The biggest desert of the Desert climatic region is the", "ఎడారి శీతోష్ణ మండలంలోని అతిపెద్ద ఎడారి", ["Thar", "Sahara", "Gobi", "Kalahari"], ["థార్", "సహారా", "గోబీ", "కలహారి"], 1, "Deserts lie between 15° and 30° N and S latitudes on the western margins of continents; the Sahara Desert is the biggest. Vegetation has thick bark and small or no leaves.", "ఎడారులు 15°–30° ఉత్తర, దక్షిణ అక్షాంశాల మధ్య ఖండాల పశ్చిమ అంచుల్లో ఉంటాయి; సహారా అతిపెద్దది. మొక్కలకు మందపాటి బెరడు, చిన్న ఆకులు లేదా ఆకులు ఉండవు."], ["The climatic region with dry summers and moderate to high winter rainfall, with vegetation like olive and cork-oak, found on the western margins of all continents except Antarctica, is the", "పొడి వేసవి, శీతాకాలంలో మోస్తరు నుండి అధిక వర్షం, ఆలివ్, కార్క్-ఓక్ వృక్షాలు గల, అంటార్కిటికా తప్ప అన్ని ఖండాల పశ్చిమ అంచుల్లో ఉండే మండలం", ["Mediterranean climate", "Steppe", "Taiga", "Savanna"], ["మధ్యధరా శీతోష్ణస్థితి", "స్టెప్పీ", "టైగా", "సవన్నా"], 0, "The Mediterranean climate has a pleasant climate with dry summer and winter rainfall; olive and cork-oak grow; commercial agriculture and dairying are practised. Example: France.", "మధ్యధరా శీతోష్ణస్థితిలో పొడి వేసవి, శీతాకాలపు వర్షం ఉంటాయి; ఆలివ్, కార్క్-ఓక్ పెరుగుతాయి; వాణిజ్య వ్యవసాయం, పాడి పరిశ్రమ ఉంటాయి. ఉదా: ఫ్రాన్స్."], ["Match the climatic regions with their example countries:\nA. Equatorial   B. Savanna   C. Mediterranean   D. Steppe\n1. Ukraine   2. France   3. Kenya   4. Angola", "శీతోష్ణ మండలాలను ఉదాహరణ దేశాలతో జతపరచండి:\nA. భూమధ్యరేఖా   B. సవన్నా   C. మధ్యధరా   D. స్టెప్పీ\n1. ఉక్రెయిన్   2. ఫ్రాన్స్   3. కెన్యా   4. అంగోలా", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Examples given in the textbook: Equatorial – Angola; Savanna – Kenya; Mediterranean – France; Steppe – Ukraine.", "పాఠ్యపుస్తకంలోని ఉదాహరణలు: భూమధ్యరేఖా – అంగోలా; సవన్నా – కెన్యా; మధ్యధరా – ఫ్రాన్స్; స్టెప్పీ – ఉక్రెయిన్."], ["The semi-arid continental grasslands with extremes of heat and cold, where low rainfall restricts vegetation to grass and scrub and extensive agriculture is practised, are called", "తీవ్రమైన వేడి, చలి గల, తక్కువ వర్షం వల్ల గడ్డి, పొదలు మాత్రమే పెరిగే, విస్తృత వ్యవసాయం జరిగే అర్ధ శుష్క ఖండాంతర గడ్డి భూములు", ["Selvas", "Steppe", "Tundra", "Taiga"], ["సెల్వాస్", "స్టెప్పీ", "టండ్రా", "టైగా"], 1, "The Steppe grasslands extend over extensive continental areas; they are semi-arid with extremes of heat and cold. Example: Ukraine.", "స్టెప్పీ గడ్డి భూములు విశాల ఖండాంతర ప్రాంతాల్లో ఉంటాయి; అర్ధ శుష్కం, తీవ్ర వేడి, చలి. ఉదా: ఉక్రెయిన్."], ["The natural zone between 55° and 70° latitudes in the Northern Hemisphere, covered with evergreen forests, where fur trading is an important activity, is the", "ఉత్తరార్ధగోళంలో 55°–70° అక్షాంశాల మధ్య, సతత హరిత అడవులతో కప్పబడి, బొచ్చు వ్యాపారం ముఖ్యంగా ఉండే సహజ మండలం", ["Taiga", "Tundra", "Savanna", "Mediterranean"], ["టైగా", "టండ్రా", "సవన్నా", "మధ్యధరా"], 0, "The Taiga extends between 55° and 70° latitudes in the Northern Hemisphere; fur trading is an important commercial activity. Example: North Canada.", "టైగా ఉత్తరార్ధగోళంలో 55°–70° అక్షాంశాల మధ్య ఉంటుంది; బొచ్చు వ్యాపారం ముఖ్యమైన వాణిజ్య కార్యకలాపం. ఉదా: ఉత్తర కెనడా."], ["In the Tundra region, which stretches between the Arctic and Polar regions, trees do not grow because", "ఆర్కిటిక్, ధ్రువ ప్రాంతాల మధ్య విస్తరించిన టండ్రా ప్రాంతంలో చెట్లు పెరగకపోవడానికి కారణం", ["Winters are long and bitterly cold", "Rainfall is very heavy", "It is too hot", "The soil is very fertile"], ["శీతాకాలాలు దీర్ఘంగా, తీవ్ర చలిగా ఉంటాయి", "వర్షపాతం చాలా ఎక్కువ", "చాలా వేడిగా ఉంటుంది", "నేల చాలా సారవంతం"], 0, "In the Tundra, winters are long and bitterly cold; adverse climate does not support trees. People depend on fauna for food. Example: North Russia.", "టండ్రాలో శీతాకాలాలు దీర్ఘంగా, తీవ్ర చలిగా ఉంటాయి; ప్రతికూల వాతావరణం చెట్లకు అనుకూలం కాదు. ప్రజలు జంతువులపై ఆహారం కోసం ఆధారపడతారు. ఉదా: ఉత్తర రష్యా."], ["The main factors that determine the type of vegetation in an area are", "ఒక ప్రాంతంలోని వృక్షసంపద రకాన్ని నిర్ణయించే ప్రధాన కారకాలు", ["Temperature, rainfall and soil", "Population and roads", "Language and culture", "Industries and markets"], ["ఉష్ణోగ్రత, వర్షపాతం, నేల", "జనాభా, రోడ్లు", "భాష, సంస్కృతి", "పరిశ్రమలు, మార్కెట్లు"], 0, "Temperature, rainfall and soil are the main factors that determine the type of vegetation in an area.", "ఉష్ణోగ్రత, వర్షపాతం, నేల ఒక ప్రాంతపు వృక్షసంపద రకాన్ని నిర్ణయించే ప్రధాన కారకాలు."], ["Identify the one that is NOT an influence of forests mentioned in the textbook", "పాఠ్యపుస్తకం ప్రకారం అడవుల ప్రభావం కానిది", ["Influencing rainfall", "Soil development", "Reducing pollution in industrial areas", "Increasing soil erosion"], ["వర్షపాతాన్ని ప్రభావితం చేయడం", "నేల అభివృద్ధి", "పారిశ్రామిక ప్రాంతాల్లో కాలుష్యం తగ్గించడం", "నేల కోతను పెంచడం"], 3, "Forests influence rainfall, soil development, regulation of streams, ecological balance and reduce pollution. Their roots actually prevent soil erosion.", "అడవులు వర్షపాతం, నేల అభివృద్ధి, వాగుల నియంత్రణ, పర్యావరణ సమతుల్యతను ప్రభావితం చేసి కాలుష్యాన్ని తగ్గిస్తాయి. వాటి వేర్లు నేల కోతను నివారిస్తాయి."], ["Based on climate, rainfall and types of soil, forests are divided into", "శీతోష్ణస్థితి, వర్షపాతం, నేల రకాల ఆధారంగా అడవులను ఇన్ని రకాలుగా విభజిస్తారు", ["Three types", "Four types", "Five types", "Seven types"], ["మూడు రకాలు", "నాలుగు రకాలు", "ఐదు రకాలు", "ఏడు రకాలు"], 2, "Five types: Evergreen, Deciduous, Thorny, Mangrove and Montane forests.", "ఐదు రకాలు: సతత హరిత, ఆకురాల్చే, ముళ్ళ, మడ, పర్వత అడవులు."], ["For administrative convenience, the Government of India divided forests into", "పరిపాలన సౌలభ్యం కోసం భారత ప్రభుత్వం అడవులను ఇలా విభజించింది", ["Reserved, Protected and Unclassified forests", "Evergreen, Deciduous and Thorny forests", "Moist, Dry and Tidal forests", "Tropical, Temperate and Polar forests"], ["రిజర్వు, రక్షిత, వర్గీకరించని అడవులు", "సతత హరిత, ఆకురాల్చే, ముళ్ళ అడవులు", "తేమ, పొడి, తీర అడవులు", "ఉష్ణ, సమశీతోష్ణ, ధ్రువ అడవులు"], 0, "For administrative convenience, forests are divided into Reserved, Protected and Unclassified forests.", "పరిపాలన సౌలభ్యం కోసం అడవులను రిజర్వు, రక్షిత, వర్గీకరించని అడవులుగా విభజించారు."], ["Forests where hunting and grazing are prohibited and the rights of the land are with the government are", "వేట, పశువుల మేత నిషేధించబడి, భూమి హక్కులు ప్రభుత్వానికే ఉండే అడవులు", ["Reserved forests", "Protected forests", "Unclassified forests", "Social forests"], ["రిజర్వు అడవులు", "రక్షిత అడవులు", "వర్గీకరించని అడవులు", "సామాజిక అడవులు"], 0, "In reserved forests activities like hunting and grazing are prohibited and land rights are reserved with the government. Unclassified forests have no restrictions.", "రిజర్వు అడవుల్లో వేట, మేత నిషేధం; భూమి హక్కులు ప్రభుత్వానివి. వర్గీకరించని అడవుల్లో ఎలాంటి ఆంక్షలు ఉండవు."], ["Forests with no restrictions on collecting forest products for livelihood and grazing cattle are", "జీవనోపాధి కోసం అటవీ ఉత్పత్తుల సేకరణ, పశువుల మేతపై ఆంక్షలు లేని అడవులు", ["Reserved forests", "Protected forests", "Unclassified forests", "Evergreen forests"], ["రిజర్వు అడవులు", "రక్షిత అడవులు", "వర్గీకరించని అడవులు", "సతత హరిత అడవులు"], 2, "Unclassified forests have no restrictions on collection of forest products and grazing. Protected forests protect certain species; excessive damage is not allowed.", "వర్గీకరించని అడవుల్లో అటవీ ఉత్పత్తుల సేకరణ, మేతపై ఆంక్షలు లేవు. రక్షిత అడవులు కొన్ని జాతులను కాపాడతాయి; అధిక నష్టం అనుమతించరు."], ["Evergreen forests grow in areas with rainfall of more than", "సతత హరిత అడవులు ఈ వర్షపాతం కంటే ఎక్కువ ఉన్న ప్రాంతాల్లో పెరుగుతాయి", ["75 cm", "100 cm", "200 cm", "50 cm"], ["75 సెం.మీ.", "100 సెం.మీ.", "200 సెం.మీ.", "50 సెం.మీ."], 2, "Evergreen forests grow in areas with high rainfall (more than 200 cm) and temperature (22 °C); trees are very tall with broad leaves and remain green throughout the year.", "సతత హరిత అడవులు 200 సెం.మీ. కంటే ఎక్కువ వర్షపాతం, 22 °C ఉష్ణోగ్రత గల ప్రాంతాల్లో పెరుగుతాయి; చెట్లు చాలా ఎత్తుగా, వెడల్పు ఆకులతో ఏడాది పొడవునా పచ్చగా ఉంటాయి."], ["Evergreen forests in India are located in", "భారతదేశంలో సతత హరిత అడవులు ఉన్న ప్రాంతాలు", ["The Himalaya region, North-eastern states and Western Ghats (Kerala)", "The Thar desert", "The Deccan plateau only", "Sundarbans only"], ["హిమాలయ ప్రాంతం, ఈశాన్య రాష్ట్రాలు, పశ్చిమ కనుమలు (కేరళ)", "థార్ ఎడారి", "దక్కన్ పీఠభూమి మాత్రమే", "సుందర్‌బన్స్ మాత్రమే"], 0, "Evergreen forests are located in the Himalaya region, North-eastern states and the Western Ghats (Kerala), with flora like Mahogany, Ebony and Rosewood.", "సతత హరిత అడవులు హిమాలయ ప్రాంతం, ఈశాన్య రాష్ట్రాలు, పశ్చిమ కనుమల (కేరళ)లో ఉన్నాయి; మహాగని, ఎబోని, రోజ్‌వుడ్ వంటి వృక్షాలు ఉంటాయి."], ["Identify the tree that is NOT mentioned as flora of evergreen forests", "సతత హరిత అడవుల వృక్షాలుగా పేర్కొనబడనిది", ["Mahogany", "Ebony", "Rosewood", "Deodar"], ["మహాగని", "ఎబోని", "రోజ్‌వుడ్", "దేవదారు"], 3, "Evergreen forest flora: Mahogany, Ebony, Rosewood, Ivory wood. Deodar grows in Montane (coniferous) forests.", "సతత హరిత వృక్షాలు: మహాగని, ఎబోని, రోజ్‌వుడ్, ఐవరీ వుడ్. దేవదారు పర్వత (శంఖాకార) అడవుల్లో పెరుగుతుంది."], ["Match the forests with their fauna:\nA. Evergreen forests   B. Deciduous forests   C. Montane forests   D. Mangrove forests\n1. Variety of fishes   2. Snow leopard   3. Different kinds of deer   4. Lion-tailed macaque", "అడవులను వాటి జంతుజాలంతో జతపరచండి:\nA. సతత హరిత   B. ఆకురాల్చే   C. పర్వత   D. మడ అడవులు\n1. వివిధ రకాల చేపలు   2. మంచు చిరుత   3. వివిధ రకాల జింకలు   4. సింహపు తోక కోతి", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Evergreen – lion-tailed macaque; Deciduous – different kinds of deer; Montane – snow leopard; Mangrove – variety of fishes. (Textbook match the following.)", "సతత హరిత – సింహపు తోక కోతి; ఆకురాల్చే – జింకలు; పర్వత – మంచు చిరుత; మడ – చేపలు. (పాఠ్యపుస్తక జతపరచడం.)"], ["Forests that have a variety of snakes and insects are", "వివిధ రకాల పాములు, కీటకాలు ఉండే అడవులు", ["Evergreen forests", "Deciduous forests", "Mangrove forests", "Thorny forests"], ["సతత హరిత అడవులు", "ఆకురాల్చే అడవులు", "మడ అడవులు", "ముళ్ళ అడవులు"], 0, "Evergreen forests have fauna like the lion-tailed macaque, different types of snakes and a variety of insects. (Textbook exercise question.)", "సతత హరిత అడవుల్లో సింహపు తోక కోతి, వివిధ పాములు, కీటకాలు ఉంటాయి. (పాఠ్యపుస్తక అభ్యాస ప్రశ్న.)"], ["Deciduous forests grow in areas with rainfall between", "ఆకురాల్చే అడవులు పెరిగే ప్రాంతాల వర్షపాతం", ["70 cm and 200 cm", "Above 200 cm", "Below 50 cm", "200 cm and 400 cm"], ["70 – 200 సెం.మీ.", "200 సెం.మీ. పైన", "50 సెం.మీ. లోపు", "200 – 400 సెం.మీ."], 0, "Deciduous forests grow where rainfall is between 70 cm and 200 cm; they are located in the peninsular plateau.", "ఆకురాల్చే అడవులు 70–200 సెం.మీ. వర్షపాతం గల ప్రాంతాల్లో పెరుగుతాయి; ద్వీపకల్ప పీఠభూమిలో ఉంటాయి."], ["Trees in deciduous forests shed their leaves during very dry months in order to", "ఆకురాల్చే అడవుల్లో చెట్లు ఎండాకాలంలో ఆకులు రాల్చడానికి కారణం", ["Minimise transpiration", "Attract animals", "Increase rainfall", "Grow taller"], ["బాష్పోత్సేకాన్ని (నీటి నష్టాన్ని) తగ్గించడం", "జంతువులను ఆకర్షించడం", "వర్షపాతం పెంచడం", "ఎత్తుగా పెరగడం"], 0, "Trees shed their leaves during very dry months to minimise transpiration — the loss of water vapour through the stomata.", "బాష్పోత్సేకం (పత్రరంధ్రాల ద్వారా నీటి ఆవిరి నష్టం) తగ్గించడానికి ఎండాకాలంలో చెట్లు ఆకులు రాల్చుతాయి."], ["Teak, Sal, Bamboo, Sandalwood and Neem are found in", "టేకు, సాల్, వెదురు, గంధం, వేప ఈ అడవుల్లో ఉంటాయి", ["Deciduous forests", "Montane forests", "Mangrove forests", "Tundra"], ["ఆకురాల్చే అడవులు", "పర్వత అడవులు", "మడ అడవులు", "టండ్రా"], 0, "Deciduous forests have vegetation like Teak, Sal, Bamboo, Rosewood, Sandalwood and Neem, and fauna like deer, elephants, tigers and peacocks.", "ఆకురాల్చే అడవుల్లో టేకు, సాల్, వెదురు, రోజ్‌వుడ్, గంధం, వేప; జింకలు, ఏనుగులు, పులులు, నెమళ్ళు ఉంటాయి."], ["Forests with sharp, thorny and bushy trees, whose leaves are small or modified into thorns, growing in areas of little rainfall and high temperature, are", "తక్కువ వర్షం, అధిక ఉష్ణోగ్రత ప్రాంతాల్లో పెరిగే, ముళ్ళు, పొదలతో కూడిన, చిన్న లేదా ముళ్ళుగా మారిన ఆకులు గల అడవులు", ["Thorny and shrub forests", "Evergreen forests", "Mangrove forests", "Montane forests"], ["ముళ్ళ, పొద అడవులు", "సతత హరిత అడవులు", "మడ అడవులు", "పర్వత అడవులు"], 0, "Thorny and shrub forests grow in arid areas (Deccan plateau, deserts); thorns and small leaves prevent transpiration. Flora: Acacia, Brahmajamudu, Nagajamudu, Thumma (Babul), Plum.", "ముళ్ళ, పొద అడవులు శుష్క ప్రాంతాల్లో (దక్కన్ పీఠభూమి, ఎడారులు) పెరుగుతాయి; ముళ్ళు, చిన్న ఆకులు నీటి నష్టాన్ని నివారిస్తాయి. ఉదా: అకేసియా, బ్రహ్మజెముడు, నాగజెముడు, తుమ్మ, రేగు."], ["Mangrove forests are also known as", "మడ అడవులను ఇలా కూడా అంటారు", ["Swamp / Littoral forests", "Coniferous forests", "Selvas", "Taiga"], ["చిత్తడి / తీర అడవులు", "శంఖాకార అడవులు", "సెల్వాస్", "టైగా"], 0, "Mangrove (littoral) forests are also known as swamp forests; they grow on sea coasts affected by tidal waves.", "మడ (తీర) అడవులను చిత్తడి అడవులు అని కూడా అంటారు; అలల ప్రభావం గల సముద్ర తీరాల్లో పెరుగుతాయి."], ["The vegetation of mangrove forests has aerial roots for", "మడ అడవుల మొక్కలకు గాలి వేర్లు ఉండేది దీని కోసం", ["Respiration", "Storing food", "Climbing", "Catching insects"], ["శ్వాసక్రియ", "ఆహార నిల్వ", "ప్రాకడం", "కీటకాలను పట్టడం"], 0, "Mangrove vegetation is adapted to saline water and tidal waves and has aerial roots for respiration.", "మడ మొక్కలు ఉప్పు నీరు, అలలకు అనుగుణంగా మారి శ్వాసక్రియ కోసం గాలి వేర్లను కలిగి ఉంటాయి."], ["The famous mangrove forests of West Bengal are the", "పశ్చిమ బెంగాల్‌లోని ప్రసిద్ధ మడ అడవులు", ["Sundarbans", "Nallamala", "Seshachalam", "Nilgiris"], ["సుందర్‌బన్స్", "నల్లమల", "శేషాచలం", "నీలగిరి"], 0, "Mangrove forests are located in coastal and brackish water areas and the Sundarbans in West Bengal.", "మడ అడవులు తీర ప్రాంతాలు, ఉప్పునీటి ప్రాంతాలు, పశ్చిమ బెంగాల్‌లోని సుందర్‌బన్స్‌లో ఉన్నాయి."], ["In Montane forests, leaves are long, pointed and cone-shaped in order to", "పర్వత అడవుల్లో ఆకులు పొడవుగా, సూదిగా, శంఖు ఆకారంలో ఉండటానికి కారణం", ["Drain off snow or rainwater", "Store water", "Attract birds", "Prevent animals"], ["మంచు లేదా వర్షపు నీరు జారిపోవడానికి", "నీరు నిల్వ చేయడానికి", "పక్షులను ఆకర్షించడానికి", "జంతువులను అడ్డుకోవడానికి"], 0, "Montane forests grow in cold mountain areas; their long, pointed, cone-shaped leaves drain off snow or rainwater. Flora: Spruce, Fir, Willow, Deodar; fauna: musk deer, snow leopard.", "పర్వత అడవులు చల్లని కొండ ప్రాంతాల్లో పెరుగుతాయి; పొడవైన, సూది, శంఖు ఆకుల వల్ల మంచు, వర్షపు నీరు జారిపోతుంది. వృక్షాలు: స్ప్రూస్, ఫర్, విల్లో, దేవదారు; జంతువులు: కస్తూరి జింక, మంచు చిరుత."], ["Match the conditions with the forest types:\nA. High rainfall   B. Little rainfall   C. Coastal line   D. Mountain region\n1. Montane forests   2. Mangrove forests   3. Thorny forests   4. Evergreen forests", "పరిస్థితులను అటవీ రకాలతో జతపరచండి:\nA. అధిక వర్షపాతం   B. తక్కువ వర్షపాతం   C. తీర రేఖ   D. పర్వత ప్రాంతం\n1. పర్వత అడవులు   2. మడ అడవులు   3. ముళ్ళ అడవులు   4. సతత హరిత అడవులు", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "High rainfall – evergreen; little rainfall – thorny; coastal line – mangrove; mountain region – montane forests. (Textbook match the following.)", "అధిక వర్షం – సతత హరిత; తక్కువ వర్షం – ముళ్ళ; తీర రేఖ – మడ; పర్వత ప్రాంతం – పర్వత అడవులు. (పాఠ్యపుస్తక జతపరచడం.)"], ["According to the India State of Forest Report (ISFR) 2019, the total forest and tree cover of India is about", "భారత అటవీ నివేదిక (ISFR) 2019 ప్రకారం భారతదేశంలో అటవీ, వృక్ష విస్తీర్ణం సుమారు", ["24.56% of the total area", "33% of the total area", "50% of the total area", "10% of the total area"], ["మొత్తం విస్తీర్ణంలో 24.56%", "మొత్తం విస్తీర్ణంలో 33%", "మొత్తం విస్తీర్ణంలో 50%", "మొత్తం విస్తీర్ణంలో 10%"], 0, "As per ISFR 2019, the total area under forest and tree cover is 8,07,276 sq. km — 24.56% of India's area; India ranks 10th in the world in forest area.", "ISFR 2019 ప్రకారం అటవీ, వృక్ష విస్తీర్ణం 8,07,276 చ.కి.మీ. — దేశ విస్తీర్ణంలో 24.56%; అటవీ విస్తీర్ణంలో ప్రపంచంలో భారత్ 10వ స్థానం."], ["According to the National Forest Policy, the percentage of total area that should be covered by forests is", "జాతీయ అటవీ విధానం ప్రకారం మొత్తం విస్తీర్ణంలో అడవులు ఉండవలసిన శాతం", ["20%", "24.56%", "33%", "60%"], ["20%", "24.56%", "33%", "60%"], 2, "The National Forest Policy (1952, per textbook) says forests should cover 33% of the total area — 20% in plains and 60% in mountain and hilly terrain.", "జాతీయ అటవీ విధానం (పాఠ్యపుస్తకం ప్రకారం 1952) ప్రకారం మొత్తం విస్తీర్ణంలో 33% అడవులు ఉండాలి — మైదానాల్లో 20%, కొండ ప్రాంతాల్లో 60%."], ["In terms of area, the state with the largest forest cover in India is ____ and the lowest is ____", "విస్తీర్ణం పరంగా భారతదేశంలో అత్యధిక అటవీ విస్తీర్ణం గల రాష్ట్రం ____, అత్యల్పం ____", ["Madhya Pradesh; Haryana", "Arunachal Pradesh; Punjab", "Andhra Pradesh; Goa", "Kerala; Rajasthan"], ["మధ్యప్రదేశ్; హర్యానా", "అరుణాచల్ ప్రదేశ్; పంజాబ్", "ఆంధ్రప్రదేశ్; గోవా", "కేరళ; రాజస్థాన్"], 0, "Madhya Pradesh has the largest forest cover, followed by Arunachal Pradesh; Haryana has the lowest.", "అత్యధిక అటవీ విస్తీర్ణం మధ్యప్రదేశ్‌లో, తర్వాత అరుణాచల్ ప్రదేశ్; అత్యల్పం హర్యానాలో."], ["As per ISFR 2019, the forest cover of Andhra Pradesh is about", "ISFR 2019 ప్రకారం ఆంధ్రప్రదేశ్ అటవీ విస్తీర్ణం సుమారు", ["22.94% of its total area", "33% of its total area", "50% of its total area", "10% of its total area"], ["మొత్తం విస్తీర్ణంలో 22.94%", "మొత్తం విస్తీర్ణంలో 33%", "మొత్తం విస్తీర్ణంలో 50%", "మొత్తం విస్తీర్ణంలో 10%"], 0, "Andhra Pradesh has a forest cover of 37,392 sq. km — 22.94% of its total geographical area.", "ఆంధ్రప్రదేశ్ అటవీ విస్తీర్ణం 37,392 చ.కి.మీ. — మొత్తం విస్తీర్ణంలో 22.94%."], ["In Andhra Pradesh, the erstwhile district with the highest notified forest area is ____ and the largest forest is ____", "ఆంధ్రప్రదేశ్‌లో అత్యధిక అటవీ విస్తీర్ణం గల పూర్వ జిల్లా ____, అతిపెద్ద అడవి ____", ["YSR Kadapa; Nallamala", "Krishna; Seshachalam", "Visakhapatnam; Papikondalu", "Kurnool; Simhachalam"], ["వై.ఎస్.ఆర్. కడప; నల్లమల", "కృష్ణా; శేషాచలం", "విశాఖపట్నం; పాపికొండలు", "కర్నూలు; సింహాచలం"], 0, "Erstwhile YSR Kadapa has the highest notified forest area and Krishna the lowest; in density, Visakhapatnam is first. Nallamala forest is the largest. Forests extend from Simhachalam hills (north) to Seshachalam hills (south).", "పూర్వ వై.ఎస్.ఆర్. కడపలో అత్యధిక అటవీ విస్తీర్ణం, కృష్ణాలో అత్యల్పం; సాంద్రతలో విశాఖపట్నం ప్రథమం. నల్లమల అతిపెద్ద అడవి. సింహాచలం (ఉత్తరం) నుండి శేషాచలం (దక్షిణం) వరకు అడవులు విస్తరించాయి."], ["Forests in Andhra Pradesh are mainly divided into four types. Identify the one that is NOT among them", "ఆంధ్రప్రదేశ్ అడవుల నాలుగు ప్రధాన రకాల్లో లేనిది", ["Moist deciduous forests", "Dry deciduous forests", "Tidal forests", "Montane coniferous forests"], ["తేమ ఆకురాల్చే అడవులు", "పొడి ఆకురాల్చే అడవులు", "తీర (టైడల్) అడవులు", "పర్వత శంఖాకార అడవులు"], 3, "AP forests: Moist deciduous, Dry deciduous, Shrub (thorn) and Tidal forests. Montane coniferous forests are found in the Himalayas.", "ఏపీ అడవులు: తేమ ఆకురాల్చే, పొడి ఆకురాల్చే, పొద (ముళ్ళ), తీర అడవులు. పర్వత శంఖాకార అడవులు హిమాలయాల్లో ఉంటాయి."], ["Moist deciduous forests of Andhra Pradesh, with rainfall of 125–200 cm, are spread over the agency areas of", "125–200 సెం.మీ. వర్షపాతం గల ఆంధ్రప్రదేశ్ తేమ ఆకురాల్చే అడవులు ఈ ఏజెన్సీ ప్రాంతాల్లో విస్తరించాయి", ["Srikakulam, Vizianagaram and East Godavari", "Kadapa, Kurnool and Anantapur", "Krishna and Guntur", "Nellore and Prakasam"], ["శ్రీకాకుళం, విజయనగరం, తూర్పు గోదావరి", "కడప, కర్నూలు, అనంతపురం", "కృష్ణా, గుంటూరు", "నెల్లూరు, ప్రకాశం"], 0, "Moist deciduous forests (125–200 cm rainfall) spread over the agency areas of Srikakulam, Vizianagaram and East Godavari; trees: Vegi, Egisa, Bamboo, Maddi, Sal.", "తేమ ఆకురాల్చే అడవులు (125–200 సెం.మీ.) శ్రీకాకుళం, విజయనగరం, తూర్పు గోదావరి ఏజెన్సీ ప్రాంతాల్లో ఉన్నాయి; వేగి, ఏగిస, వెదురు, మద్ది, సాల్ చెట్లు."], ["Red sandalwood, a rare species with a prominent place in the economy, grows in the", "ఆర్థికంగా ప్రముఖ స్థానం గల అరుదైన ఎర్రచందనం పెరిగే అడవి", ["Seshachalam forest (Kadapa and Chittoor)", "Sundarbans", "Korangi forest", "Simhachalam hills"], ["శేషాచలం అడవి (కడప, చిత్తూరు)", "సుందర్‌బన్స్", "కోరంగి అడవి", "సింహాచలం కొండలు"], 0, "Red sandalwood grows in dry deciduous forests (75–100 cm rainfall) of the Seshachalam forest in Kadapa and Chittoor districts.", "ఎర్రచందనం కడప, చిత్తూరు జిల్లాల్లోని శేషాచలం అడవిలో (75–100 సెం.మీ. వర్షపాత పొడి ఆకురాల్చే అడవులు) పెరుగుతుంది."], ["The Kalivikodi, notified by IUCN as a rarest species, lives in", "IUCN అత్యంత అరుదైన జాతిగా ప్రకటించిన కలివికోడి నివసించే ప్రదేశం", ["Sri Lankamaleswara sanctuary, Kadapa", "Sundarbans", "Nallamala, Kurnool", "Korangi, East Godavari"], ["శ్రీ లంకమల్లేశ్వర అభయారణ్యం, కడప", "సుందర్‌బన్స్", "నల్లమల, కర్నూలు", "కోరంగి, తూర్పు గోదావరి"], 0, "The Kalivikodi (Jerdon's courser) living in the Sri Lankamaleswara sanctuary in Kadapa district has been notified as the rarest species by IUCN.", "కడప జిల్లా శ్రీ లంకమల్లేశ్వర అభయారణ్యంలోని కలివికోడిని IUCN అత్యంత అరుదైన జాతిగా ప్రకటించింది."], ["The tidal forests of Andhra Pradesh along the coast are seen, for example, in the", "ఆంధ్రప్రదేశ్ తీరం వెంబడి ఉన్న తీర (టైడల్) అడవులకు ఉదాహరణ", ["Korangi region of East Godavari", "Seshachalam hills", "Nallamala hills", "Anantapur district"], ["తూర్పు గోదావరి కోరంగి ప్రాంతం", "శేషాచలం కొండలు", "నల్లమల కొండలు", "అనంతపురం జిల్లా"], 0, "Tidal forests exist along the coastline, e.g., the Korangi region of East Godavari, with Uppu ponna, Boddu ponna, Urada and Mada trees.", "తీర అడవులు తీరం వెంబడి ఉన్నాయి; ఉదా: తూర్పు గోదావరి కోరంగి ప్రాంతం — ఉప్పు పొన్న, బొడ్డు పొన్న, ఉరడ, మడ చెట్లు."], ["To protect flora and fauna, Andhra Pradesh has established", "వృక్ష, జంతుజాల సంరక్షణ కోసం ఆంధ్రప్రదేశ్ ఏర్పాటు చేసినవి", ["13 wildlife sanctuaries and 3 national parks", "3 sanctuaries and 13 national parks", "10 sanctuaries only", "No sanctuaries"], ["13 వన్యప్రాణి అభయారణ్యాలు, 3 జాతీయ పార్కులు", "3 అభయారణ్యాలు, 13 జాతీయ పార్కులు", "10 అభయారణ్యాలు మాత్రమే", "ఏ అభయారణ్యాలూ లేవు"], 0, "Thirteen wildlife sanctuaries and three national parks are established in Andhra Pradesh to protect flora and fauna.", "వృక్ష, జంతుజాల సంరక్షణ కోసం ఆంధ్రప్రదేశ్‌లో 13 వన్యప్రాణి అభయారణ్యాలు, 3 జాతీయ పార్కులు ఉన్నాయి."], ["Identify the tribe that is NOT recognised as a primitive tribal group in Andhra Pradesh, as per the textbook", "పాఠ్యపుస్తకం ప్రకారం ఆంధ్రప్రదేశ్‌లో ఆదిమ గిరిజన సమూహంగా గుర్తించబడని తెగ", ["Bondo", "Chenchus", "Konda Reddies", "Yanadis"], ["బోండో", "చెంచులు", "కొండ రెడ్లు", "యానాదులు"], 3, "Primitive tribal groups: Bondo, Chenchus, Konda Reddies, Konda Savaras. Other tribes: Gond, Yerukalas and Yanadis.", "ఆదిమ గిరిజన సమూహాలు: బోండో, చెంచులు, కొండ రెడ్లు, కొండ సవరలు. ఇతర తెగలు: గోండులు, ఎరుకలలు, యానాదులు."], ["The British enacted laws in these years to establish the Forest Department and control forests, restricting the traditional rights of tribals", "అటవీ శాఖ ఏర్పాటు చేసి అడవులను అధీనంలోకి తీసుకుని గిరిజనుల సాంప్రదాయ హక్కులను పరిమితం చేస్తూ బ్రిటిష్ వారు చట్టాలు చేసిన సంవత్సరాలు", ["1864 and 1878", "1947 and 1950", "1952 and 1988", "1980 and 2006"], ["1864, 1878", "1947, 1950", "1952, 1988", "1980, 2006"], 0, "The British enacted two laws in 1864 and 1878 to establish the Forest Department; forests were classified as 'reserved' and 'protected', restricting tribals' customary rights.", "బ్రిటిష్ వారు 1864, 1878లలో రెండు చట్టాలు చేసి అటవీ శాఖను ఏర్పాటు చేశారు; అడవులను 'రిజర్వు', 'రక్షిత'గా విభజించి గిరిజనుల సాంప్రదాయ హక్కులను పరిమితం చేశారు."], ["The National Forest Policy of 1988 declared that the primary task should be to", "1988 జాతీయ అటవీ విధానం ప్రకటించిన ప్రధాన లక్ష్యం", ["Associate tribal people in the protection, regeneration and development of forests", "Remove all tribals from forests", "Convert forests into farms", "Sell all timber"], ["అడవుల సంరక్షణ, పునరుత్పత్తి, అభివృద్ధిలో గిరిజనులను భాగస్వాములను చేయడం", "గిరిజనులందరినీ అడవుల నుండి తొలగించడం", "అడవులను పొలాలుగా మార్చడం", "కలప అంతా అమ్మేయడం"], 0, "The National Forest Policy 1988 declared that the primary task should be to associate tribal people in the protection, regeneration and development of forests.", "1988 జాతీయ అటవీ విధానం అడవుల సంరక్షణ, పునరుత్పత్తి, అభివృద్ధిలో గిరిజనులను భాగస్వాములను చేయడమే ప్రధాన లక్ష్యమని ప్రకటించింది."], ["Identify the one that is NOT a forest product", "అటవీ ఉత్పత్తి కానిది", ["Timber", "Honey", "Plums", "Bread"], ["కలప", "తేనె", "రేగు పండ్లు", "బ్రెడ్"], 3, "Timber, honey, plums, bamboo, lac, herbs etc. are forest products; bread is a factory/kitchen product. (Textbook exercise question.)", "కలప, తేనె, రేగు పండ్లు, వెదురు, లక్క, మూలికలు అటవీ ఉత్పత్తులు; బ్రెడ్ కాదు. (పాఠ్యపుస్తక అభ్యాస ప్రశ్న.)"], ["Identify the one that is NOT a reason for deforestation", "అటవీ నిర్మూలనకు కారణం కానిది", ["Converting forest land into agricultural land", "Construction of roads and dams", "Industrial purposes", "Social forestry"], ["అటవీ భూమిని వ్యవసాయ భూమిగా మార్చడం", "రోడ్లు, ఆనకట్టల నిర్మాణం", "పారిశ్రామిక అవసరాలు", "సామాజిక అడవుల పెంపకం"], 3, "Reasons for deforestation: conversion to agriculture, roads and dams, timber, industries, urbanisation and setting forests on fire. Social forestry is afforestation — it increases forests.", "అటవీ నిర్మూలన కారణాలు: వ్యవసాయ భూమిగా మార్పు, రోడ్లు, ఆనకట్టలు, కలప, పరిశ్రమలు, పట్టణీకరణ, అడవులకు నిప్పు. సామాజిక అడవుల పెంపకం అడవులను పెంచుతుంది."], ["The management of forests for the benefit of local communities and afforestation of barren and deforested lands is called", "స్థానిక సముదాయాల ప్రయోజనం కోసం అడవుల నిర్వహణ, బంజరు, నరికిన భూముల్లో అడవుల పెంపకాన్ని ఇలా అంటారు", ["Deforestation", "Social forestry", "Podu cultivation", "Urbanisation"], ["అటవీ నిర్మూలన", "సామాజిక అడవుల పెంపకం (సోషల్ ఫారెస్ట్రీ)", "పోడు సాగు", "పట్టణీకరణ"], 1, "Social forestry refers to the management of forests for the benefit of local communities and afforestation of barren and deforested lands for environmental, social and rural development.", "స్థానిక సముదాయాల ప్రయోజనం కోసం అడవుల నిర్వహణ, బంజరు భూముల్లో అడవుల పెంపకమే సామాజిక అడవుల పెంపకం."], ["Match the years with the forest-related acts/events:\nA. 1950   B. 1980   C. 2006\n1. Forest Rights Act   2. Forest Festival (Vana Mahotsav)   3. Forest Conservation Act", "సంవత్సరాలను అటవీ చట్టాలు/ఘటనలతో జతపరచండి:\nA. 1950   B. 1980   C. 2006\n1. అటవీ హక్కుల చట్టం   2. అటవీ ఉత్సవం (వనమహోత్సవం)   3. అటవీ సంరక్షణ చట్టం", ["A-2, B-3, C-1", "A-3, B-2, C-1", "A-1, B-3, C-2", "A-2, B-1, C-3"], ["A-2, B-3, C-1", "A-3, B-2, C-1", "A-1, B-3, C-2", "A-2, B-1, C-3"], 0, "1950 – Forest Festival (Vana Mahotsav); 1952 – National Forest Policy; 1980 – Forest Conservation Act; 2006 – Forest Rights Act.", "1950 – అటవీ ఉత్సవం (వనమహోత్సవం); 1952 – జాతీయ అటవీ విధానం; 1980 – అటవీ సంరక్షణ చట్టం; 2006 – అటవీ హక్కుల చట్టం."], ["The Forest Rights Act 2006 (also called the Tribal Rights Act) gives legal recognition to the rights of", "అటవీ హక్కుల చట్టం 2006 (గిరిజన హక్కుల చట్టం) చట్టపరమైన గుర్తింపు ఇచ్చేది", ["Traditional forest-dwelling communities", "Timber merchants", "Industries in forests", "Foreign tourists"], ["సాంప్రదాయికంగా అడవుల్లో నివసించే సముదాయాలు", "కలప వ్యాపారులు", "అడవుల్లోని పరిశ్రమలు", "విదేశీ పర్యాటకులు"], 0, "Passed in December 2006, the Forest Rights Act recognises the rights of Forest Dwelling Scheduled Tribes (FDST) and Other Traditional Forest Dwellers (OTFD) and partially corrects colonial injustice.", "2006 డిసెంబర్‌లో వచ్చిన అటవీ హక్కుల చట్టం అడవుల్లో నివసించే షెడ్యూల్డ్ తెగలు (FDST), ఇతర సాంప్రదాయ అటవీ నివాసుల (OTFD) హక్కులను గుర్తించి, వలస పాలనా అన్యాయాన్ని కొంత సరిదిద్దింది."]]}, {"n": 3, "en": "Learning through Maps", "te": "పటాల ద్వారా అభ్యసనం", "c": "#f59e0b", "q": [["Maps make our travel easier because they help us", "పటాలు మన ప్రయాణాన్ని సులభతరం చేస్తాయి, ఎందుకంటే అవి", ["Accurately guide us towards the destination with distance, direction and location", "Increase the speed of vehicles", "Reduce fuel prices", "Change the weather"], ["దూరం, దిశ, స్థానంతో గమ్యం వైపు ఖచ్చితంగా మార్గనిర్దేశం చేస్తాయి", "వాహనాల వేగం పెంచుతాయి", "ఇంధన ధరలు తగ్గిస్తాయి", "వాతావరణాన్ని మారుస్తాయి"], 0, "Maps make travel easier and accurate in guiding us towards the destination; earlier travellers faced difficulty in estimating distance, direction and location.", "పటాలు గమ్యం వైపు ఖచ్చితంగా మార్గనిర్దేశం చేసి ప్రయాణాన్ని సులభం చేస్తాయి; ఒకప్పుడు ప్రయాణికులకు దూరం, దిశ, స్థానం అంచనా వేయడం కష్టమయ్యేది."], ["Columbus, who set out to reach India by travelling from the west, actually reached", "పడమర దిశగా ప్రయాణించి భారతదేశం చేరాలనుకున్న కొలంబస్ నిజానికి చేరింది", ["Africa", "America", "Australia", "China"], ["ఆఫ్రికా", "అమెరికా", "ఆస్ట్రేలియా", "చైనా"], 1, "Earlier travellers had difficulty estimating distance, direction and location; Columbus, trying to reach India from the west, reached America.", "ఒకప్పుడు ప్రయాణికులకు దూరం, దిశ, స్థానం అంచనా వేయడం కష్టంగా ఉండేది; పడమర నుండి భారత్ చేరాలనుకున్న కొలంబస్ అమెరికా చేరాడు."], ["After many unsuccessful attempts to find a new sea route to India, Vasco da Gama reached Calicut in", "భారత్‌కు కొత్త సముద్ర మార్గం కోసం అనేక విఫల ప్రయత్నాల తర్వాత వాస్కోడగామా కాలికట్ చేరిన సంవత్సరం", ["1492 AD", "1498 AD", "1520 AD", "1600 AD"], ["క్రీ.శ. 1492", "క్రీ.శ. 1498", "క్రీ.శ. 1520", "క్రీ.శ. 1600"], 1, "Vasco da Gama reached Calicut in 1498 AD.", "వాస్కోడగామా క్రీ.శ. 1498లో కాలికట్ చేరాడు."], ["The first person who voyaged across the Globe was", "భూగోళం చుట్టూ మొదట సముద్ర యాత్ర చేసినవాడు", ["Columbus", "Vasco da Gama", "Magellan", "Ptolemy"], ["కొలంబస్", "వాస్కోడగామా", "మెగల్లాన్", "టాలెమీ"], 2, "Magellan was the first person who voyaged across the Globe.", "భూగోళం చుట్టూ మొదట సముద్ర యాత్ర చేసినవాడు మెగల్లాన్."], ["In early map-making, the Sumerians and Babylonians used", "తొలి పటాల తయారీలో సుమేరియన్లు, బాబిలోనియన్లు వాడినవి", ["Clay tablets as maps", "Paper maps", "Satellite images", "Globes"], ["మట్టి పలకలను పటాలుగా", "కాగితపు పటాలు", "ఉపగ్రహ చిత్రాలు", "గ్లోబులు"], 0, "References to map-making are found in cave paintings; the Sumerians and Babylonians used clay tablets as maps.", "పటాల తయారీ ఆనవాళ్ళు గుహ చిత్రాల్లో కనిపిస్తాయి; సుమేరియన్లు, బాబిలోనియన్లు మట్టి పలకలను పటాలుగా వాడారు."], ["Identify the one who was NOT a Greek map maker mentioned in the textbook", "పాఠ్యపుస్తకంలో పేర్కొన్న గ్రీకు పటకారులలో లేనివారు", ["Anaximander", "Hecataeus", "Herodotus", "Vasco da Gama"], ["అనాక్సిమాండర్", "హెకాటియస్", "హెరొడొటస్", "వాస్కోడగామా"], 3, "Greek map makers Anaximander, Hecataeus and Herodotus prepared maps arranging places from west to east; Greeks applied latitudes and longitudes. Vasco da Gama was a Portuguese sailor.", "గ్రీకు పటకారులు అనాక్సిమాండర్, హెకాటియస్, హెరొడొటస్ ప్రదేశాలను పడమర నుండి తూర్పుకు అమర్చి పటాలు గీశారు. వాస్కోడగామా పోర్చుగీసు నావికుడు."], ["The concept of latitudes and longitudes was first applied in map making by the", "పటాల తయారీలో అక్షాంశ, రేఖాంశ భావనను మొదట వాడినవారు", ["Greeks", "Sumerians", "Babylonians", "Chinese"], ["గ్రీకులు", "సుమేరియన్లు", "బాబిలోనియన్లు", "చైనీయులు"], 0, "Greeks applied the concept of latitudes and longitudes in map making; Ptolemy's efforts were remarkable.", "పటాల తయారీలో అక్షాంశ, రేఖాంశ భావనను గ్రీకులు వాడారు; టాలెమీ కృషి విశేషమైనది."], ["The method called 'projection', which brought a great change in map-making, was introduced by the Dutch cartographer", "పటాల తయారీలో గొప్ప మార్పు తెచ్చిన 'ప్రక్షేపణ' పద్ధతిని ప్రవేశపెట్టిన డచ్ పటకారుడు", ["Gerardus Mercator", "Ptolemy", "Magellan", "Herodotus"], ["గెరార్డస్ మెర్కేటర్", "టాలెమీ", "మెగల్లాన్", "హెరొడొటస్"], 0, "Gerardus Mercator, a Dutch cartographer, introduced projection — showing the shape and directions of continents of the spherical globe on a plain surface (with some distortions).", "డచ్ పటకారుడు గెరార్డస్ మెర్కేటర్ ప్రక్షేపణ పద్ధతిని ప్రవేశపెట్టాడు — గోళాకార గ్లోబుపై ఉన్న ఖండాల ఆకారం, దిశలను సమతలంపై చూపడం (కొన్ని వక్రీకరణలతో)."], ["Showing the shape and directions of continents of the spherical globe on a plain surface, with some distortions, is called", "గోళాకార గ్లోబుపై ఉన్న ఖండాల ఆకారం, దిశలను కొన్ని వక్రీకరణలతో సమతలంపై చూపడాన్ని ఇలా అంటారు", ["Projection", "Contour", "Legend", "Grid"], ["ప్రక్షేపణ (ప్రొజెక్షన్)", "సమోన్నత రేఖ", "సూచిక (లెజెండ్)", "జాలకం (గ్రిడ్)"], 0, "Projection means showing the shape and directions of continents of the spherical globe on a plain surface but with distortions.", "గ్లోబుపై ఖండాల ఆకారం, దిశలను సమతలంపై వక్రీకరణలతో చూపడమే ప్రక్షేపణ."], ["A person who draws maps is called a", "పటాలు గీసే వ్యక్తిని ఇలా అంటారు", ["Cartographer", "Astronomer", "Historian", "Geologist"], ["పటకారుడు (కార్టోగ్రాఫర్)", "ఖగోళ శాస్త్రవేత్త", "చరిత్రకారుడు", "భూవిజ్ఞాన శాస్త్రవేత్త"], 0, "A cartographer is a person who draws maps; cartographers collected information from sailors and travellers.", "పటాలు గీసేవారు పటకారులు (కార్టోగ్రాఫర్లు); వారు నావికులు, యాత్రికుల నుండి సమాచారం సేకరించారు."], ["Scale, directions, symbols and colours used in a map are parts of the", "పటంలో వాడే స్కేలు, దిక్కులు, చిహ్నాలు, రంగులు దీని భాగాలు", ["Index of a map", "Projection", "Grid only", "Contour lines"], ["పట సూచిక (ఇండెక్స్)", "ప్రక్షేపణ", "జాలకం మాత్రమే", "సమోన్నత రేఖలు"], 0, "Title, directions, scale, symbols, colours, patterns, legend and latitudes-longitudes are elements of the index of a map, used in reading, pointing and drawing a map.", "శీర్షిక, దిక్కులు, స్కేలు, చిహ్నాలు, రంగులు, నమూనాలు, సూచిక, అక్షాంశ–రేఖాంశాలు పట సూచికలోని అంశాలు."], ["The element of a map that reveals its theme or subject and is generally placed at the top is the", "పటం విషయాన్ని తెలిపి, సాధారణంగా పైభాగంలో ఉండే అంశం", ["Title", "Legend", "Scale", "Grid"], ["శీర్షిక", "సూచిక", "స్కేలు", "జాలకం"], 0, "The title says about the theme or subject of the map and is generally placed at the top.", "శీర్షిక పటం విషయాన్ని తెలుపుతుంది; సాధారణంగా పైభాగంలో ఉంటుంది."], ["Generally, maps are prepared showing this direction on the top, noticed with the help of the arrow on the right top corner", "సాధారణంగా పటాలలో పైభాగంలో చూపే దిక్కు; దీనిని కుడి పై మూలలోని బాణం ద్వారా గుర్తిస్తాం", ["South", "East", "North", "West"], ["దక్షిణం", "తూర్పు", "ఉత్తరం", "పడమర"], 2, "Maps generally show North at the top, indicated by the arrow on the right top corner.", "పటాల్లో సాధారణంగా ఉత్తరం పైభాగంలో ఉంటుంది; కుడి పై మూలలోని బాణం దానిని సూచిస్తుంది."], ["To travel from Bengaluru to Itanagar (Arunachal Pradesh), the direction of travel is", "బెంగళూరు నుండి ఇటానగర్ (అరుణాచల్ ప్రదేశ్)కు ప్రయాణించాల్సిన దిశ", ["North-east", "South-west", "North-west", "South-east"], ["ఈశాన్యం", "నైరుతి", "వాయవ్యం", "ఆగ్నేయం"], 0, "Itanagar lies to the north-east of Bengaluru, so one travels towards the north-east.", "ఇటానగర్ బెంగళూరుకు ఈశాన్యంగా ఉంది; కాబట్టి ఈశాన్య దిశగా ప్రయాణించాలి."], ["Scale is expressed in three types. They are", "స్కేలును మూడు రకాలుగా వ్యక్తపరుస్తారు. అవి", ["Statement scale, Graphical scale and Representative Fraction (RF)", "Large, small and medium scale", "Political, physical and thematic scale", "Contour, grid and legend"], ["వాక్య స్కేలు, గ్రాఫిక్ స్కేలు, ప్రాతినిధ్య భిన్నం (RF)", "పెద్ద, చిన్న, మధ్యస్థ స్కేలు", "రాజకీయ, భౌతిక, విషయ స్కేలు", "సమోన్నత, జాలక, సూచిక"], 0, "Scale is expressed as Statement (verbal) scale, Graphical scale and Representative Fraction (RF).", "స్కేలును వాక్య (మౌఖిక) స్కేలు, గ్రాఫిక్ స్కేలు, ప్రాతినిధ్య భిన్నం (RF) గా వ్యక్తపరుస్తారు."], ["'1 cm = 10 km' is an example of", "'1 సెం.మీ. = 10 కి.మీ.' దీనికి ఉదాహరణ", ["Statement (verbal) scale", "Graphical scale", "Representative Fraction", "Contour interval"], ["వాక్య (మౌఖిక) స్కేలు", "గ్రాఫిక్ స్కేలు", "ప్రాతినిధ్య భిన్నం", "సమోన్నత అంతరం"], 0, "A statement scale is in the form of a sentence and easy to understand, e.g., 1 cm = 10 km.", "వాక్య స్కేలు వాక్య రూపంలో ఉండి సులభంగా అర్థమవుతుంది; ఉదా: 1 సెం.మీ. = 10 కి.మీ."], ["The scale which changes accordingly when the map is enlarged or reduced is the", "పటాన్ని పెద్దది లేదా చిన్నది చేసినప్పుడు దానితో పాటు మారే స్కేలు", ["Statement scale", "Graphical scale", "Representative Fraction", "Verbal scale"], ["వాక్య స్కేలు", "గ్రాఫిక్ స్కేలు", "ప్రాతినిధ్య భిన్నం", "మౌఖిక స్కేలు"], 1, "In a graphical scale, when the size of the map is expanded or reduced, the scale also changes accordingly.", "గ్రాఫిక్ స్కేలులో పటం పరిమాణం పెరిగినా, తగ్గినా స్కేలు కూడా దానికి అనుగుణంగా మారుతుంది."], ["The scale in which the ratio remains the same whatever the unit of measurement (inches, cm, km or miles) is the", "కొలత ప్రమాణం (అంగుళాలు, సెం.మీ., కి.మీ., మైళ్ళు) ఏదైనా నిష్పత్తి మారని స్కేలు", ["Representative Fraction (RF)", "Statement scale", "Graphical scale", "Contour scale"], ["ప్రాతినిధ్య భిన్నం (RF)", "వాక్య స్కేలు", "గ్రాఫిక్ స్కేలు", "సమోన్నత స్కేలు"], 0, "In Representative Fraction (RF), the reader can convert units conveniently; whatever the unit, the ratio remains the same.", "ప్రాతినిధ్య భిన్నంలో ఏ కొలత ప్రమాణం వాడినా నిష్పత్తి మారదు; పాఠకుడు సులభంగా ప్రమాణాలు మార్చుకోవచ్చు."], ["On a map with scale 1 cm = 300 km, Chennai to Hyderabad measures 3 cm. The actual distance is about", "1 సెం.మీ. = 300 కి.మీ. స్కేలు గల పటంలో చెన్నై నుండి హైదరాబాద్ 3 సెం.మీ. ఉంది. వాస్తవ దూరం సుమారు", ["300 km", "600 km", "900 km", "3000 km"], ["300 కి.మీ.", "600 కి.మీ.", "900 కి.మీ.", "3000 కి.మీ."], 2, "3 cm × 300 km = 900 km. Scale helps to calculate actual distances between places on a map.", "3 × 300 కి.మీ. = 900 కి.మీ. పటంపై ప్రదేశాల మధ్య వాస్తవ దూరం లెక్కించడానికి స్కేలు సహాయపడుతుంది."], ["The conventional symbols used in the preparation of toposheets in India are given by the", "భారతదేశంలో టోపోషీట్ల తయారీలో వాడే సాంప్రదాయ చిహ్నాలను ఇచ్చే సంస్థ", ["Survey of India", "ISRO", "Election Commission", "Census of India"], ["సర్వే ఆఫ్ ఇండియా", "ఇస్రో", "ఎన్నికల సంఘం", "భారత జనగణన"], 0, "The Survey of India uses conventional symbols in the preparation of toposheets.", "సర్వే ఆఫ్ ఇండియా టోపోషీట్ల తయారీలో సాంప్రదాయ చిహ్నాలను వాడుతుంది."], ["Small pictures that stand for different features on a map, used by the Survey of India, are called", "సర్వే ఆఫ్ ఇండియా వాడే, పటంపై వివిధ అంశాలను సూచించే చిన్న బొమ్మలు", ["Conventional symbols", "Contour lines", "Patterns", "Projections"], ["సాంప్రదాయ చిహ్నాలు", "సమోన్నత రేఖలు", "నమూనాలు", "ప్రక్షేపణలు"], 0, "Conventional symbols are small pictures standing for features on a map, used by the Survey of India, since actual items cannot be drawn.", "సాంప్రదాయ చిహ్నాలు పటంపై అంశాలను సూచించే చిన్న బొమ్మలు; సర్వే ఆఫ్ ఇండియా వీటిని వాడుతుంది."], ["The base line taken to measure the elevation of a place is", "ఒక ప్రదేశపు ఎత్తును కొలవడానికి తీసుకునే ఆధార రేఖ", ["Mean Sea Level (MSL)", "Equator", "Tropic of Cancer", "Prime Meridian"], ["సగటు సముద్ర మట్టం (MSL)", "భూమధ్యరేఖ", "కర్కట రేఖ", "ప్రధాన రేఖాంశం"], 0, "As sea level across the globe is more or less equal, Mean Sea Level is taken as the base line to measure the elevation of a place.", "ప్రపంచమంతటా సముద్ర మట్టం దాదాపు సమానం కాబట్టి ఎత్తును కొలవడానికి సగటు సముద్ర మట్టాన్ని ఆధారంగా తీసుకుంటారు."], ["Special provisions in a map that describe variable information of a theme, like population density or types of soils, are called", "జనసాంద్రత, నేలల రకాల వంటి ఒక అంశపు మారే సమాచారాన్ని పటంలో చూపే ప్రత్యేక ఏర్పాట్లు", ["Patterns", "Titles", "Directions", "Grids"], ["నమూనాలు (ప్యాటర్న్‌లు)", "శీర్షికలు", "దిక్కులు", "జాలకాలు"], 0, "Patterns describe variable information of a theme and give quantitative and qualitative details, e.g., population density, soils and forests.", "నమూనాలు ఒక అంశపు మారే సమాచారాన్ని, పరిమాణాత్మక, గుణాత్మక వివరాలను చూపుతాయి; ఉదా: జనసాంద్రత, నేలలు, అడవులు."], ["A table of symbols used in a map, explained briefly to interpret the features, seen in any corner of the map, is called the", "పటంలో వాడిన చిహ్నాలను క్లుప్తంగా వివరించే, పటం ఏదో ఒక మూలలో ఉండే పట్టిక", ["Legend", "Title", "Grid", "Projection"], ["సూచిక (లెజెండ్)", "శీర్షిక", "జాలకం", "ప్రక్షేపణ"], 0, "The legend is a table of symbols or tools used in the map, explained briefly to interpret its features; it is seen in any corner.", "లెజెండ్ (సూచిక) పటంలోని చిహ్నాలను క్లుప్తంగా వివరించే పట్టిక; పటం ఏదో ఒక మూలలో ఉంటుంది."], ["Latitudes and longitudes on a map help us to know the location of a place and also to guess its", "పటంపై అక్షాంశ, రేఖాంశాలు ఒక ప్రదేశపు స్థానంతో పాటు దీనిని
