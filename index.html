యంప్రతిపత్తిని ప్రతిపాదించింది."], ["'Diarchy' means", "'ద్వంద్వ ప్రభుత్వం' (డయార్కీ) అంటే", ["A government in which power is vested in two authorities", "Rule by one person", "Rule by the people", "Rule by the army"], ["అధికారం రెండు సంస్థల చేతుల్లో ఉండే ప్రభుత్వం", "ఒక వ్యక్తి పాలన", "ప్రజల పాలన", "సైనిక పాలన"], 0, "Diarchy is a government in which power is vested in two authorities. (Federal – power distributed between central and state governments.)", "అధికారం రెండు సంస్థలకు ఉండే ప్రభుత్వం డయార్కీ. (సమాఖ్య – కేంద్ర, రాష్ట్ర ప్రభుత్వాల మధ్య అధికార విభజన.)"], ["In 1928, an all-party committee was constituted to draft a constitution for India. Its chairman was", "1928లో భారతదేశానికి రాజ్యాంగ రూపకల్పనకు ఏర్పడిన అఖిలపక్ష కమిటీ అధ్యక్షుడు", ["Motilal Nehru", "Jawaharlal Nehru", "Dr. B.R. Ambedkar", "Mahatma Gandhi"], ["మోతీలాల్ నెహ్రూ", "జవహర్‌లాల్ నెహ్రూ", "డా. బి.ఆర్. అంబేద్కర్", "మహాత్మా గాంధీ"], 0, "Motilal Nehru (father of Jawaharlal Nehru) chaired the 1928 committee; its 1929 report was known as the Nehru Report.", "1928 కమిటీకి మోతీలాల్ నెహ్రూ (జవహర్‌లాల్ నెహ్రూ తండ్రి) అధ్యక్షత వహించారు; 1929 నివేదికను నెహ్రూ నివేదిక అంటారు."], ["The Nehru Report, submitted in 1929, is considered the", "1929లో సమర్పించిన నెహ్రూ నివేదికను ఇలా భావిస్తారు", ["First Constitutional Document", "Final Constitution of India", "Objective Resolution", "Cabinet Mission Plan"], ["మొదటి రాజ్యాంగ పత్రం", "భారత తుది రాజ్యాంగం", "లక్ష్యాల తీర్మానం", "కేబినెట్ మిషన్ ప్రణాళిక"], 0, "The Nehru Report was considered the first Constitutional Document, but it could not come into force because the British did not accept it.", "నెహ్రూ నివేదిక మొదటి రాజ్యాంగ పత్రంగా భావించబడింది; కానీ బ్రిటిష్‌వారు అంగీకరించనందున అమలు కాలేదు."], ["In 1931, the Indian National Congress passed a resolution on how independent India's Constitution should look like at its session held at", "స్వతంత్ర భారత రాజ్యాంగం ఎలా ఉండాలో 1931లో భారత జాతీయ కాంగ్రెస్ తీర్మానం చేసిన సమావేశం", ["Karachi", "Lahore", "Lucknow", "Haripura"], ["కరాచీ", "లాహోర్", "లక్నో", "హరిపుర"], 0, "The INC Karachi session (1931) passed the resolution. Both the Nehru Report and the Karachi resolution were committed to Universal Adult Franchise, Right to Freedom and Equality.", "1931 కరాచీ కాంగ్రెస్ సమావేశం ఈ తీర్మానం చేసింది. నెహ్రూ నివేదిక, కరాచీ తీర్మానం రెండూ సార్వజనీన వయోజన ఓటుహక్కు, స్వేచ్ఛ, సమానత్వ హక్కులకు కట్టుబడ్డాయి."], ["Arrange the following events in chronological order:\n1. Karachi resolution of INC\n2. Nehru Report submitted\n3. Government of India Act\n4. INC first demands a Constituent Assembly", "కింది సంఘటనలను కాలక్రమంలో అమర్చండి:\n1. కాంగ్రెస్ కరాచీ తీర్మానం\n2. నెహ్రూ నివేదిక సమర్పణ\n3. భారత ప్రభుత్వ చట్టం\n4. కాంగ్రెస్ మొదటిసారి రాజ్యాంగ పరిషత్తు కోరడం", ["2, 1, 4, 3", "1, 2, 3, 4", "2, 1, 3, 4", "4, 2, 1, 3"], ["2, 1, 4, 3", "1, 2, 3, 4", "2, 1, 3, 4", "4, 2, 1, 3"], 0, "Nehru Report (1929), Karachi resolution (1931), first demand for a Constituent Assembly (1934), Government of India Act (1935).", "నెహ్రూ నివేదిక (1929), కరాచీ తీర్మానం (1931), రాజ్యాంగ పరిషత్తు డిమాండ్ (1934), భారత ప్రభుత్వ చట్టం (1935)."], ["The Indian National Congress first made a demand for a Constituent Assembly in", "భారత జాతీయ కాంగ్రెస్ మొదటిసారి రాజ్యాంగ పరిషత్తు కావాలని కోరిన సంవత్సరం", ["1934", "1928", "1946", "1947"], ["1934", "1928", "1946", "1947"], 0, "The INC first demanded a Constituent Assembly in 1934.", "కాంగ్రెస్ 1934లో మొదటిసారి రాజ్యాంగ పరిషత్తును కోరింది."], ["Elections to the Constituent Assembly were held in July 1946 according to the", "జూలై 1946లో రాజ్యాంగ పరిషత్తు ఎన్నికలు దీని ప్రకారం జరిగాయి", ["Cabinet Mission Plan", "Mountbatten Plan", "Cripps Mission", "Government of India Act, 1919"], ["కేబినెట్ మిషన్ ప్రణాళిక", "మౌంట్‌బాటన్ ప్రణాళిక", "క్రిప్స్ మిషన్", "భారత ప్రభుత్వ చట్టం, 1919"], 0, "According to the Cabinet Mission Plan 1946, elections to the Constituent Assembly were held in July 1946.", "1946 కేబినెట్ మిషన్ ప్రణాళిక ప్రకారం జూలై 1946లో రాజ్యాంగ పరిషత్తు ఎన్నికలు జరిగాయి."], ["Identify the person who was NOT a member of the Cabinet Mission (1946)", "కేబినెట్ మిషన్ (1946) సభ్యుడు కానివారు", ["Lord Pethick Lawrence", "Sir Stafford Cripps", "A.V. Alexander", "Lord Mountbatten"], ["లార్డ్ పెథిక్ లారెన్స్", "సర్ స్టాఫర్డ్ క్రిప్స్", "ఎ.వి. అలెగ్జాండర్", "లార్డ్ మౌంట్‌బాటన్"], 3, "The Cabinet Mission members were Lord Pethick Lawrence, Sir Stafford Cripps and A.V. Alexander.", "కేబినెట్ మిషన్ సభ్యులు లార్డ్ పెథిక్ లారెన్స్, సర్ స్టాఫర్డ్ క్రిప్స్, ఎ.వి. అలెగ్జాండర్."], ["The members of the Constituent Assembly were elected", "రాజ్యాంగ పరిషత్తు సభ్యులు ఎన్నికైన విధానం", ["Indirectly by the members of provincial assemblies", "Directly by all adult citizens", "By the British Parliament", "By the Governor-General alone"], ["రాష్ట్ర శాసనసభ సభ్యులచే పరోక్షంగా", "వయోజన పౌరులందరిచే ప్రత్యక్షంగా", "బ్రిటిష్ పార్లమెంట్‌చే", "గవర్నర్ జనరల్ ఒక్కరిచే"], 0, "The members of the Constituent Assembly were elected indirectly by the members of the provincial assemblies.", "రాజ్యాంగ పరిషత్తు సభ్యులు రాష్ట్ర శాసనసభ సభ్యులచే పరోక్షంగా ఎన్నికయ్యారు."], ["The total strength of the Constituent Assembly initially was", "రాజ్యాంగ పరిషత్తు ప్రారంభ మొత్తం సభ్యుల సంఖ్య", ["389", "299", "292", "395"], ["389", "299", "292", "395"], 0, "Provinces elected 292, Princely States nominated 93, and 4 from Delhi, Ajmer-Mewar, Coorg and British Baluchistan — total 389.", "రాష్ట్రాల నుండి 292, సంస్థానాల నుండి 93, ఢిల్లీ, అజ్మీర్–మేవార్, కూర్గ్, బ్రిటిష్ బలూచిస్తాన్ నుండి 4 — మొత్తం 389."], ["After the partition of the country in August 1947, the Indian Constituent Assembly had", "ఆగస్టు 1947 దేశ విభజన తర్వాత భారత రాజ్యాంగ పరిషత్తు సభ్యుల సంఖ్య", ["299 members", "389 members", "395 members", "315 members"], ["299 మంది", "389 మంది", "395 మంది", "315 మంది"], 0, "After partition, the Assembly was bifurcated into the Indian and Pakistan Constituent Assemblies; the Indian Constituent Assembly had 299 members.", "విభజన తర్వాత పరిషత్తు భారత, పాకిస్తాన్ రాజ్యాంగ పరిషత్తులుగా విడిపోయింది; భారత రాజ్యాంగ పరిషత్తులో 299 మంది సభ్యులు."], ["Among the 389 members of the Constituent Assembly, the number of women members was", "రాజ్యాంగ పరిషత్తులోని 389 మంది సభ్యులలో మహిళా సభ్యుల సంఖ్య", ["9", "26", "15", "4"], ["9", "26", "15", "4"], 0, "Among the 389 members, 26 were from Scheduled Castes and 9 were women.", "389 మందిలో 26 మంది షెడ్యూల్డ్ కులాలవారు, 9 మంది మహిళలు."], ["The Chairman (President) of the Indian Constituent Assembly was", "భారత రాజ్యాంగ పరిషత్తు అధ్యక్షుడు", ["Dr. B.R. Ambedkar", "Jawaharlal Nehru", "Mahatma Gandhi", "Dr. Babu Rajendra Prasad"], ["డా. బి.ఆర్. అంబేద్కర్", "జవహర్‌లాల్ నెహ్రూ", "మహాత్మా గాంధీ", "డా. బాబు రాజేంద్రప్రసాద్"], 3, "The Indian Constituent Assembly elected Dr. Babu Rajendra Prasad as its President; the Pakistan Constituent Assembly elected Muhammad Ali Jinnah. (Textbook exercise.)", "భారత రాజ్యాంగ పరిషత్తు డా. బాబు రాజేంద్రప్రసాద్‌ను అధ్యక్షునిగా ఎన్నుకుంది; పాకిస్తాన్ పరిషత్తు మహమ్మద్ అలీ జిన్నాను ఎన్నుకుంది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Dr. Rajendra Prasad, the first President of India, is the only President to have been", "భారత మొదటి రాష్ట్రపతి డా. రాజేంద్రప్రసాద్ ప్రత్యేకత", ["Re-elected for a second term (1950–1962)", "Elected unopposed by the people directly", "Chairman of the Drafting Committee", "First Law Minister of India"], ["రెండవసారి తిరిగి ఎన్నికైన ఏకైక రాష్ట్రపతి (1950–1962)", "ప్రజలచే నేరుగా ఏకగ్రీవంగా ఎన్నిక", "ముసాయిదా కమిటీ అధ్యక్షుడు", "భారత మొదటి న్యాయ మంత్రి"], 0, "Rajendra Prasad was elected the first President on 24 January 1950 in the last session of the Constituent Assembly; he is the only President re-elected for a second term (1950–1962).", "రాజ్యాంగ పరిషత్తు చివరి సమావేశంలో 24 జనవరి 1950న రాజేంద్రప్రసాద్ మొదటి రాష్ట్రపతిగా ఎన్నికయ్యారు; రెండవసారి తిరిగి ఎన్నికైన ఏకైక రాష్ట్రపతి (1950–1962)."], ["The Drafting Committee was set up on 29th August 1947 under the chairmanship of", "29 ఆగస్టు 1947న ఏర్పడిన ముసాయిదా కమిటీ అధ్యక్షుడు", ["Dr. B.R. Ambedkar", "Dr. Rajendra Prasad", "Jawaharlal Nehru", "Sardar Vallabhbhai Patel"], ["డా. బి.ఆర్. అంబేద్కర్", "డా. రాజేంద్రప్రసాద్", "జవహర్‌లాల్ నెహ్రూ", "సర్దార్ వల్లభ్‌భాయ్ పటేల్"], 0, "The Drafting Committee, with seven members, was set up on 29 August 1947 under Dr. B.R. Ambedkar to prepare the Draft Constitution.", "ఏడుగురు సభ్యుల ముసాయిదా కమిటీ 29 ఆగస్టు 1947న డా. బి.ఆర్. అంబేద్కర్ అధ్యక్షతన ఏర్పడింది."], ["The Draft Constitution submitted to the Constituent Assembly in 1948 contained", "1948లో రాజ్యాంగ పరిషత్తుకు సమర్పించిన ముసాయిదా రాజ్యాంగంలో ఉన్నవి", ["315 Articles and 8 Schedules", "395 Articles and 8 Schedules", "395 Articles and 12 Schedules", "299 Articles and 22 Parts"], ["315 ప్రకరణలు, 8 షెడ్యూళ్ళు", "395 ప్రకరణలు, 8 షెడ్యూళ్ళు", "395 ప్రకరణలు, 12 షెడ్యూళ్ళు", "299 ప్రకరణలు, 22 భాగాలు"], 0, "The Draft Constitution (1948) contained 315 Articles and 8 Schedules; it was kept before the public for eight months.", "ముసాయిదా రాజ్యాంగం (1948)లో 315 ప్రకరణలు, 8 షెడ్యూళ్ళు; దీనిని ఎనిమిది నెలలు ప్రజల ముందు ఉంచారు."], ["When finally adopted, the Constitution of India contained", "చివరగా ఆమోదించిన భారత రాజ్యాంగంలో ఉన్నవి", ["395 Articles, 22 Parts and 8 Schedules", "315 Articles, 22 Parts and 8 Schedules", "389 Articles, 12 Parts and 8 Schedules", "395 Articles, 8 Parts and 22 Schedules"], ["395 ప్రకరణలు, 22 భాగాలు, 8 షెడ్యూళ్ళు", "315 ప్రకరణలు, 22 భాగాలు, 8 షెడ్యూళ్ళు", "389 ప్రకరణలు, 12 భాగాలు, 8 షెడ్యూళ్ళు", "395 ప్రకరణలు, 8 భాగాలు, 22 షెడ్యూళ్ళు"], 0, "After modifications, the Constitution with 395 Articles, 22 Parts and 8 Schedules was adopted on 26 November 1949.", "సవరణల తర్వాత 395 ప్రకరణలు, 22 భాగాలు, 8 షెడ్యూళ్ళతో రాజ్యాంగం 26 నవంబర్ 1949న ఆమోదించబడింది."], ["The Constitution of India was adopted on ____ and came into force on ____", "భారత రాజ్యాంగం ____ న ఆమోదించబడి ____ న అమలులోకి వచ్చింది", ["26 November 1949; 26 January 1950", "26 January 1950; 26 November 1949", "15 August 1947; 26 January 1950", "29 August 1947; 26 November 1949"], ["26 నవంబర్ 1949; 26 జనవరి 1950", "26 జనవరి 1950; 26 నవంబర్ 1949", "15 ఆగస్టు 1947; 26 జనవరి 1950", "29 ఆగస్టు 1947; 26 నవంబర్ 1949"], 0, "The Constitution was adopted on 26 November 1949 (Constitution Day) and came into force on 26 January 1950 (Republic Day).", "రాజ్యాంగం 26 నవంబర్ 1949న ఆమోదించబడింది (రాజ్యాంగ దినోత్సవం), 26 జనవరి 1950న అమలులోకి వచ్చింది (గణతంత్ర దినోత్సవం)."], ["Constitution Day (Samvidhan Divas) is celebrated in India every year on", "భారతదేశంలో రాజ్యాంగ దినోత్సవం (సంవిధాన్ దివస్) జరుపుకునే రోజు", ["26th November", "26th January", "15th August", "14th April"], ["నవంబర్ 26", "జనవరి 26", "ఆగస్టు 15", "ఏప్రిల్ 14"], 0, "Constitution Day is celebrated on 26 November to commemorate the adoption of the Constitution on 26 November 1949.", "26 నవంబర్ 1949న రాజ్యాంగం ఆమోదించబడిన సందర్భంగా ప్రతి సంవత్సరం నవంబర్ 26న రాజ్యాంగ దినోత్సవం జరుపుకుంటారు."], ["The Constituent Assembly took ____ to prepare our Constitution", "మన రాజ్యాంగ రూపకల్పనకు రాజ్యాంగ పరిషత్తుకు పట్టిన సమయం", ["2 years, 11 months and 18 days", "3 years, 2 months and 10 days", "1 year, 8 months and 15 days", "2 years, 6 months and 26 days"], ["2 సంవత్సరాలు, 11 నెలలు, 18 రోజులు", "3 సంవత్సరాలు, 2 నెలలు, 10 రోజులు", "1 సంవత్సరం, 8 నెలలు, 15 రోజులు", "2 సంవత్సరాలు, 6 నెలలు, 26 రోజులు"], 0, "The Constituent Assembly took 2 years, 11 months and 18 days to prepare the Constitution.", "రాజ్యాంగ రూపకల్పనకు 2 సంవత్సరాలు, 11 నెలలు, 18 రోజులు పట్టింది."], ["Dr. B.R. Ambedkar, regarded as the 'Father of the Indian Constitution', was born on 14th April 1891 at", "'భారత రాజ్యాంగ పితామహుడు' డా. బి.ఆర్. అంబేద్కర్ 14 ఏప్రిల్ 1891న జన్మించిన ప్రదేశం", ["Mhow Army Cantonment (Madhya Pradesh)", "Pune", "Nagpur", "Mumbai"], ["మౌ సైనిక కంటోన్మెంట్ (మధ్యప్రదేశ్)", "పుణే", "నాగపూర్", "ముంబై"], 0, "Ambedkar was born to Bhimabai and Ramji on 14 April 1891 at Mhow Army Cantonment, Central Provinces (now Madhya Pradesh).", "అంబేద్కర్ 14 ఏప్రిల్ 1891న భీమాబాయి, రాంజీ దంపతులకు మౌ సైనిక కంటోన్మెంట్‌లో (ఇప్పుడు మధ్యప్రదేశ్) జన్మించారు."], ["Consider the following statements about Dr. B.R. Ambedkar:\nI. He was appointed the first Law Minister of India in 1947.\nII. He worked for the welfare of the depressed and the poor.", "డా. బి.ఆర్. అంబేద్కర్ గురించి కింది వాక్యాలను పరిశీలించండి:\nI. 1947లో భారత మొదటి న్యాయ మంత్రిగా నియమితులయ్యారు.\nII. అణగారిన, పేద వర్గాల సంక్షేమం కోసం కృషి చేశారు.", ["Both I and II are correct", "Only I is correct", "Only II is correct", "Neither I nor II is correct"], ["I, II రెండూ సరైనవి", "I మాత్రమే సరైనది", "II మాత్రమే సరైనది", "రెండూ సరైనవి కావు"], 0, "Ambedkar — jurist, social activist and politician — was the first Law Minister (1947) and worked for the welfare of the depressed and poor.", "న్యాయవేత్త, సామాజిక కార్యకర్త, రాజకీయవేత్త అంబేద్కర్ మొదటి న్యాయ మంత్రి (1947); అణగారిన, పేద వర్గాల సంక్షేమానికి కృషి చేశారు."], ["Who proposed the 'Objective Resolution' (13.12.1946), which is the base of the Preamble of the Indian Constitution?", "భారత రాజ్యాంగ ప్రవేశికకు ఆధారమైన 'లక్ష్యాల తీర్మానం' (13.12.1946) ప్రతిపాదించినవారు", ["B.R. Ambedkar", "Sardar Vallabhbhai Patel", "Jawaharlal Nehru", "H.C. Mukherjee"], ["బి.ఆర్. అంబేద్కర్", "సర్దార్ వల్లభ్‌భాయ్ పటేల్", "జవహర్‌లాల్ నెహ్రూ", "హెచ్.సి. ముఖర్జీ"], 2, "Pandit Jawaharlal Nehru proposed the Objective Resolution on 13 December 1946; it is the base of the Preamble. (Textbook exercise.)", "పండిట్ జవహర్‌లాల్ నెహ్రూ 13 డిసెంబర్ 1946న లక్ష్యాల తీర్మానం ప్రతిపాదించారు; ఇదే ప్రవేశికకు ఆధారం. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Preamble of the Indian Constitution begins with the words", "భారత రాజ్యాంగ ప్రవేశిక ప్రారంభ పదాలు", ["We, the People of India", "We, the Parliament of India", "We, the States of India", "We, the Constituent Assembly"], ["భారత ప్రజలమైన మేము", "భారత పార్లమెంటు అయిన మేము", "భారత రాష్ట్రాలమైన మేము", "రాజ్యాంగ పరిషత్తు అయిన మేము"], 0, "The Preamble starts with 'We, the People of India', showing that the people are the source of authority.", "ప్రవేశిక 'భారత ప్రజలమైన మేము' అని ప్రారంభమవుతుంది — అధికారానికి మూలం ప్రజలే అని తెలుపుతుంది."], ["The words 'Socialist' and 'Secular' were added to the Preamble in 1976 through the", "1976లో ప్రవేశికలో 'సామ్యవాద', 'లౌకిక' పదాలను చేర్చిన సవరణ", ["42nd Amendment", "44th Amendment", "86th Amendment", "73rd Amendment"], ["42వ సవరణ", "44వ సవరణ", "86వ సవరణ", "73వ సవరణ"], 0, "The words 'Socialist' and 'Secular' were added to the Preamble in 1976 through the 42nd Amendment.", "1976లో 42వ సవరణ ద్వారా ప్రవేశికలో 'సామ్యవాద', 'లౌకిక' పదాలు చేర్చబడ్డాయి."], ["Match the following:\nA. 42nd Amendment   B. 44th Amendment   C. Part III   D. 86th Amendment   E. Part IVA\n1. Fundamental Duties   2. Right to Education   3. Fundamental Rights   4. Deletion of Right to Property   5. Socialist, Secular added to Preamble", "జతపరచండి:\nA. 42వ సవరణ   B. 44వ సవరణ   C. భాగం III   D. 86వ సవరణ   E. భాగం IVA\n1. ప్రాథమిక విధులు   2. విద్యా హక్కు   3. ప్రాథమిక హక్కులు   4. ఆస్తి హక్కు తొలగింపు   5. ప్రవేశికలో సామ్యవాద, లౌకిక చేర్పు", ["A-5, B-4, C-3, D-2, E-1", "A-4, B-5, C-3, D-2, E-1", "A-5, B-4, C-1, D-2, E-3", "A-5, B-2, C-3, D-4, E-1"], ["A-5, B-4, C-3, D-2, E-1", "A-4, B-5, C-3, D-2, E-1", "A-5, B-4, C-1, D-2, E-3", "A-5, B-2, C-3, D-4, E-1"], 0, "42nd – Socialist, Secular added; 44th – deletion of Right to Property; Part III – Fundamental Rights; 86th – Right to Education; Part IVA – Fundamental Duties. (Textbook exercise.)", "42వ – సామ్యవాద, లౌకిక చేర్పు; 44వ – ఆస్తి హక్కు తొలగింపు; భాగం III – ప్రాథమిక హక్కులు; 86వ – విద్యా హక్కు; భాగం IVA – ప్రాథమిక విధులు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Match the Preamble keywords with their meanings:\nA. Sovereignty   B. Secularism   C. Democracy   D. Republic\n1. The head of the state is decided through election   2. Government run by representatives elected by the people   3. The state has no official religion   4. Complete power to take decisions on external and internal matters", "ప్రవేశిక పదాలను వాటి అర్థాలతో జతపరచండి:\nA. సార్వభౌమత్వం   B. లౌకికత్వం   C. ప్రజాస్వామ్యం   D. గణతంత్రం\n1. దేశాధినేతను ఎన్నిక ద్వారా నిర్ణయించడం   2. ప్రజలు ఎన్నుకున్న ప్రతినిధుల పాలన   3. రాజ్యానికి అధికారిక మతం లేదు   4. అంతర్గత, బాహ్య విషయాల్లో నిర్ణయం తీసుకునే సంపూర్ణ అధికారం", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Sovereignty – complete decision-making power; Secularism – no official religion, all religions equal; Democracy – government by elected representatives; Republic – elected head of state.", "సార్వభౌమత్వం – సంపూర్ణ నిర్ణయాధికారం; లౌకికత్వం – అధికారిక మతం లేదు, అన్ని మతాలు సమానం; ప్రజాస్వామ్యం – ఎన్నికైన ప్రతినిధుల పాలన; గణతంత్రం – ఎన్నికైన దేశాధినేత."], ["India is called a 'Republic' because", "భారతదేశాన్ని 'గణతంత్రం' అనడానికి కారణం", ["The head of the state is an elected person", "India has a written constitution", "India has many religions", "India has an army"], ["దేశాధినేత ఎన్నికైన వ్యక్తి", "భారతదేశానికి లిఖిత రాజ్యాంగం ఉంది", "భారతదేశంలో అనేక మతాలు ఉన్నాయి", "భారతదేశానికి సైన్యం ఉంది"], 0, "In a Republic, the head of the state is decided through election and is not a hereditary ruler.", "గణతంత్రంలో దేశాధినేత వారసత్వంగా కాక ఎన్నిక ద్వారా నిర్ణయించబడతారు."], ["Find the odd one out", "భిన్నమైనదాన్ని గుర్తించండి", ["Liberty", "Inequality", "Justice", "Fraternity"], ["స్వేచ్ఛ", "అసమానత్వం", "న్యాయం", "సౌభ్రాతృత్వం"], 1, "Liberty, Justice and Fraternity are ideals in the Preamble; Inequality is not — the Preamble promises Equality. (Textbook exercise.)", "స్వేచ్ఛ, న్యాయం, సౌభ్రాతృత్వం ప్రవేశిక ఆదర్శాలు; అసమానత్వం కాదు — ప్రవేశిక సమానత్వాన్ని హామీ ఇస్తుంది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["'Fraternity' in the Preamble means", "ప్రవేశికలోని 'సౌభ్రాతృత్వం' అంటే", ["Brotherhood", "Freedom", "Fairness", "Equal status"], ["సోదరభావం", "స్వేచ్ఛ", "న్యాయం", "సమాన హోదా"], 0, "Fraternity means brotherhood; it promotes unity, integrity and loyalty among the people of the nation.", "సౌభ్రాతృత్వం అంటే సోదరభావం; ఇది దేశ ప్రజల్లో ఐక్యత, సమగ్రత, విధేయతను పెంపొందిస్తుంది."], ["In spite of India's federal character, the Constitution provides for 'one' of each of the following EXCEPT", "భారతదేశ సమాఖ్య స్వభావం ఉన్నప్పటికీ రాజ్యాంగం కింది వాటిలో ఒక్కొక్కటే కల్పించింది — ఒకటి తప్ప", ["One judiciary", "One citizenship", "One constitution", "One official religion"], ["ఒకే న్యాయవ్యవస్థ", "ఒకే పౌరసత్వం", "ఒకే రాజ్యాంగం", "ఒకే అధికారిక మతం"], 3, "India has one judiciary, one citizenship, one constitution, one set of fundamental rights and all-India services. It has no official religion — it is secular.", "భారతదేశానికి ఒకే న్యాయవ్యవస్థ, ఒకే పౌరసత్వం, ఒకే రాజ్యాంగం, ఒకే ప్రాథమిక హక్కులు, అఖిల భారత సర్వీసులు ఉన్నాయి. అధికారిక మతం లేదు — లౌకిక దేశం."], ["At present, the Fundamental Rights are mentioned from Article 14 to 32 in", "ప్రస్తుతం ప్రాథమిక హక్కులు ప్రకరణలు 14 నుండి 32 వరకు ఈ భాగంలో ఉన్నాయి", ["Part III", "Part IV", "Part IVA", "Part I"], ["భాగం III", "భాగం IV", "భాగం IVA", "భాగం I"], 0, "Six Fundamental Rights are mentioned from Article 14 to 32 in Part III; they are directly protected by the Supreme Court and High Courts.", "ఆరు ప్రాథమిక హక్కులు భాగం IIIలో ప్రకరణలు 14 నుండి 32 వరకు ఉన్నాయి; వీటిని సుప్రీంకోర్టు, హైకోర్టులు నేరుగా రక్షిస్తాయి."], ["Originally there were seven Fundamental Rights. The right deleted in 1978 through the 44th Amendment was", "మొదట ఏడు ప్రాథమిక హక్కులు ఉండేవి. 1978లో 44వ సవరణ ద్వారా తొలగించబడిన హక్కు", ["Right to Property", "Right to Equality", "Right to Freedom of Religion", "Right to Constitutional Remedies"], ["ఆస్తి హక్కు", "సమానత్వ హక్కు", "మత స్వాతంత్ర్య హక్కు", "రాజ్యాంగ పరిహార హక్కు"], 0, "The Right to Property was deleted from the list of Fundamental Rights in 1978 through the 44th Amendment, leaving six.", "1978లో 44వ సవరణ ద్వారా ఆస్తి హక్కు ప్రాథమిక హక్కుల జాబితా నుండి తొలగించబడింది; ఇప్పుడు ఆరు మిగిలాయి."], ["Match the Fundamental Rights with their Articles:\nA. Right to Equality   B. Right to Freedom   C. Right against Exploitation   D. Right to Freedom of Religion\n1. Articles 25–28   2. Articles 23–24   3. Articles 19–22   4. Articles 14–18", "ప్రాథమిక హక్కులను ప్రకరణలతో జతపరచండి:\nA. సమానత్వ హక్కు   B. స్వేచ్ఛా హక్కు   C. పీడనాన్ని నిరోధించే హక్కు   D. మత స్వాతంత్ర్య హక్కు\n1. ప్రకరణలు 25–28   2. ప్రకరణలు 23–24   3. ప్రకరణలు 19–22   4. ప్రకరణలు 14–18", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Equality – 14–18; Freedom – 19–22; Against Exploitation – 23–24; Freedom of Religion – 25–28; Education & Culture – 29–30; Constitutional Remedies – 32.", "సమానత్వం – 14–18; స్వేచ్ఛ – 19–22; పీడన నిరోధం – 23–24; మత స్వాతంత్ర్యం – 25–28; విద్యా, సాంస్కృతిక – 29–30; రాజ్యాంగ పరిహారం – 32."], ["Abolition of untouchability and abolition of titles come under the", "అంటరానితనం రద్దు, బిరుదుల రద్దు ఈ హక్కు కిందకు వస్తాయి", ["Right to Equality", "Right to Freedom", "Right against Exploitation", "Right to Education and Culture"], ["సమానత్వ హక్కు", "స్వేచ్ఛా హక్కు", "పీడనాన్ని నిరోధించే హక్కు", "విద్యా, సాంస్కృతిక హక్కు"], 0, "The Right to Equality (Art. 14–18) includes equal protection of law, social equality, equal opportunities in employment, abolition of untouchability and abolition of titles.", "సమానత్వ హక్కు (ప్ర. 14–18)లో చట్టం ముందు సమాన రక్షణ, సామాజిక సమానత్వం, ఉద్యోగాల్లో సమాన అవకాశాలు, అంటరానితనం రద్దు, బిరుదుల రద్దు ఉన్నాయి."], ["Which of the following is a violation of Fundamental Rights?", "కిందివాటిలో ప్రాథమిక హక్కుల ఉల్లంఘన ఏది?", ["All are equal before law", "A child below 14 years working in a tea shop", "A person has a right to follow any religion", "Freedom to reside in any part of India"], ["చట్టం ముందు అందరూ సమానులే", "14 ఏళ్ళ లోపు పిల్లవాడు టీ కొట్టులో పనిచేయడం", "ఏ మతాన్నైనా అనుసరించే హక్కు", "దేశంలో ఎక్కడైనా నివసించే స్వేచ్ఛ"], 1, "The Right against Exploitation (Art. 23–24) prohibits forced labour and child labour: no child below 14 shall be employed in factories, mines or hazardous work. (Textbook exercise.)", "పీడనాన్ని నిరోధించే హక్కు (ప్ర. 23–24) వెట్టిచాకిరీ, బాలకార్మిక వ్యవస్థను నిషేధిస్తుంది: 14 ఏళ్ళ లోపు పిల్లలను పనిలో పెట్టరాదు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Our country is known as a Secular State because", "మన దేశాన్ని లౌకిక రాజ్యం అనడానికి కారణం", ["There is no official religion and the government remains neutral in religious matters", "Only one religion is allowed", "All citizens must follow the same religion", "Religion is banned"], ["అధికారిక మతం లేదు, ప్రభుత్వం మత విషయాల్లో తటస్థంగా ఉంటుంది", "ఒకే మతం అనుమతించబడుతుంది", "పౌరులందరూ ఒకే మతం పాటించాలి", "మతం నిషేధించబడింది"], 0, "Under the Right to Freedom of Religion (Art. 25–28), all are free to practise any religion; there is no official religion and the government is neutral — so India is a Secular State.", "మత స్వాతంత్ర్య హక్కు (ప్ర. 25–28) ప్రకారం ఎవరైనా ఏ మతమైనా ఆచరించవచ్చు; అధికారిక మతం లేదు, ప్రభుత్వం తటస్థం — అందుకే లౌకిక రాజ్యం."], ["The Fundamental Right that protects all the other Fundamental Rights through the Supreme Court and High Courts is", "సుప్రీంకోర్టు, హైకోర్టుల ద్వారా మిగతా అన్ని ప్రాథమిక హక్కులను రక్షించే హక్కు", ["Right to Constitutional Remedies (Article 32)", "Right to Equality (Article 14)", "Right to Freedom (Article 19)", "Right to Education and Culture (Article 29)"], ["రాజ్యాంగ పరిహార హక్కు (ప్రకరణ 32)", "సమానత్వ హక్కు (ప్రకరణ 14)", "స్వేచ్ఛా హక్కు (ప్రకరణ 19)", "విద్యా, సాంస్కృతిక హక్కు (ప్రకరణ 29)"], 0, "The Right to Constitutional Remedies (Article 32) protects all Fundamental Rights through the Supreme Court and High Courts.", "రాజ్యాంగ పరిహార హక్కు (ప్రకరణ 32) సుప్రీంకోర్టు, హైకోర్టుల ద్వారా అన్ని ప్రాథమిక హక్కులను రక్షిస్తుంది."], ["The right of minorities, religious or linguistic, to establish and administer educational institutions of their choice comes under", "మత లేదా భాషా అల్పసంఖ్యాకులు తమకు నచ్చిన విద్యాసంస్థలు స్థాపించి నిర్వహించుకునే హక్కు ఈ హక్కు కిందకు వస్తుంది", ["Right to Education and Culture (Articles 29–30)", "Right to Equality", "Right against Exploitation", "Right to Constitutional Remedies"], ["విద్యా, సాంస్కృతిక హక్కు (ప్రకరణలు 29–30)", "సమానత్వ హక్కు", "పీడనాన్ని నిరోధించే హక్కు", "రాజ్యాంగ పరిహార హక్కు"], 0, "Under Articles 29–30, all minorities, religious or linguistic, have the right to establish and administer educational institutions and protect their culture.", "ప్రకరణలు 29–30 ప్రకారం మత, భాషా అల్పసంఖ్యాకులు విద్యాసంస్థలు స్థాపించి నిర్వహించుకోవచ్చు, తమ సంస్కృతిని కాపాడుకోవచ్చు."], ["Which Article in our Constitution tells about the Right to Education?", "మన రాజ్యాంగంలో విద్యా హక్కు గురించి తెలిపే ప్రకరణ", ["19", "20A", "21", "21A"], ["19", "20A", "21", "21A"], 3, "The 86th Amendment (2002) added Article 21A: the State shall provide free and compulsory education to all children aged 6 to 14 years. (Textbook exercise.)", "86వ సవరణ (2002) ప్రకరణ 21Aను చేర్చింది: 6 నుండి 14 ఏళ్ళ పిల్లలందరికీ ఉచిత, నిర్బంధ విద్యను రాజ్యం అందించాలి. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Right of Children to Free and Compulsory Education Act was enacted in ____ and came into force on ____", "బాలల ఉచిత, నిర్బంధ విద్యా హక్కు చట్టం ____ లో రూపొందించబడి ____ న అమలులోకి వచ్చింది", ["2009; 1st April 2010", "2002; 1st April 2005", "2005; 12th October 2005", "2010; 1st April 2012"], ["2009; 1 ఏప్రిల్ 2010", "2002; 1 ఏప్రిల్ 2005", "2005; 12 అక్టోబర్ 2005", "2010; 1 ఏప్రిల్ 2012"], 0, "The RTE Act was enacted by Parliament in 2009 and came into force on 1 April 2010.", "విద్యా హక్కు చట్టం 2009లో పార్లమెంటు రూపొందించగా 1 ఏప్రిల్ 2010న అమలులోకి వచ్చింది."], ["The Right to Information Act, which ensures transparency in administration, was enacted in 2005 and came into force on", "పాలనలో పారదర్శకతను కల్పించే సమాచార హక్కు చట్టం 2005లో రూపొంది అమలులోకి వచ్చిన తేదీ", ["12th October 2005", "1st April 2010", "26th January 2005", "15th August 2005"], ["12 అక్టోబర్ 2005", "1 ఏప్రిల్ 2010", "26 జనవరి 2005", "15 ఆగస్టు 2005"], 0, "The RTI Act empowers every citizen to seek information from the government; it was enacted in 2005 and came into force on 12 October 2005.", "సమాచార హక్కు చట్టం ప్రతి పౌరుడు ప్రభుత్వం నుండి సమాచారం కోరే అధికారం ఇస్తుంది; 2005లో రూపొంది 12 అక్టోబర్ 2005న అమలులోకి వచ్చింది."], ["Identify the one that is NOT among the major child rights listed in the UN resolutions signed by India", "భారతదేశం సంతకం చేసిన ఐరాస తీర్మానాల్లోని ప్రధాన బాలల హక్కులలో లేనిది", ["Right to survival", "Right to protection", "Right to development", "Right to vote"], ["జీవించే హక్కు", "రక్షణ హక్కు", "అభివృద్ధి హక్కు", "ఓటు హక్కు"], 3, "The major child rights are: right to survival, protection, development and participation.", "ప్రధాన బాలల హక్కులు: జీవించే హక్కు, రక్షణ హక్కు, అభివృద్ధి హక్కు, భాగస్వామ్య హక్కు."], ["Which Article in our Constitution tells about the Fundamental Duties?", "మన రాజ్యాంగంలో ప్రాథమిక విధుల గురించి తెలిపే ప్రకరణ", ["51", "51A", "21", "21A"], ["51", "51A", "21", "21A"], 1, "Fundamental Duties were set out in Article 51A, Part IVA, through the 42nd Amendment in 1976. (Textbook exercise.)", "1976లో 42వ సవరణ ద్వారా ప్రాథమిక విధులు భాగం IVAలో ప్రకరణ 51Aలో చేర్చబడ్డాయి. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Fundamental Duties in our Constitution were borrowed from the constitution of", "మన రాజ్యాంగంలోని ప్రాథమిక విధులను ఈ దేశ రాజ్యాంగం నుండి గ్రహించారు", ["Russia (USSR)", "USA", "Britain", "Ireland"], ["రష్యా (సోవియట్ యూనియన్)", "అమెరికా", "బ్రిటన్", "ఐర్లాండ్"], 0, "The Fundamental Duties were taken from the Russian (USSR) constitution. Rights and duties are complementary.", "ప్రాథమిక విధులు రష్యా (సోవియట్) రాజ్యాంగం నుండి గ్రహించబడ్డాయి. హక్కులు, విధులు పరస్పర పూరకాలు."], ["'Real rights are a result of the performance of duty' — this was said by", "'నిజమైన హక్కులు విధి నిర్వహణ ఫలితమే' అన్నది ఎవరు", ["Mahatma Gandhi", "Dr. B.R. Ambedkar", "Jawaharlal Nehru", "Dr. Rajendra Prasad"], ["మహాత్మా గాంధీ", "డా. బి.ఆర్. అంబేద్కర్", "జవహర్‌లాల్ నెహ్రూ", "డా. రాజేంద్రప్రసాద్"], 0, "Mahatma Gandhi said, 'Real rights are a result of the performance of duty'.", "'నిజమైన హక్కులు విధి నిర్వహణ ఫలితమే' అని మహాత్మా గాంధీ అన్నారు."], ["Identify the statement that is a Fundamental DUTY (not a Fundamental Right)", "కిందివాటిలో ప్రాథమిక విధి (ప్రాథమిక హక్కు కానిది) ఏది", ["Develop scientific temper and humanism", "Forced labour is prohibited", "Abolition of untouchability", "Reside and settle in any part of India"], ["శాస్త్రీయ దృక్పథం, మానవతావాదం పెంపొందించుకోవడం", "వెట్టిచాకిరీ నిషేధం", "అంటరానితనం రద్దు", "దేశంలో ఎక్కడైనా నివసించడం"], 0, "Developing scientific temper and humanism is a Fundamental Duty; the others (prohibition of forced labour, abolition of untouchability, freedom to reside) are Fundamental Rights.", "శాస్త్రీయ దృక్పథం, మానవతావాదం పెంపొందించుకోవడం ప్రాథమిక విధి; మిగతావి (వెట్టిచాకిరీ నిషేధం, అంటరానితనం రద్దు, నివాస స్వేచ్ఛ) ప్రాథమిక హక్కులు."], ["A teacher asks students to prepare a role play on practising equality and brotherhood and to tick whether given statements are Fundamental Rights or Duties. This approach mainly aims at", "సమానత్వం, సోదరభావంపై పాత్రాభినయం చేయించి, వాక్యాలు ప్రాథమిక హక్కులా విధులా గుర్తించమని ఉపాధ్యాయుడు అడిగాడు. ఈ విధానం ప్రధాన లక్ష్యం", ["Developing constitutional values and responsible citizenship through activities", "Memorising Article numbers only", "Preparing students for elections", "Testing handwriting"], ["కృత్యాల ద్వారా రాజ్యాంగ విలువలు, బాధ్యతాయుత పౌరసత్వం పెంపొందించడం", "ప్రకరణ సంఖ్యలను బట్టీ పట్టించడం", "విద్యార్థులను ఎన్నికలకు సిద్ధం చేయడం", "చేతిరాత పరీక్షించడం"], 0, "Such 'Let's Do' activities help children internalise values like justice, equality and fraternity and become responsible citizens — the learning outcome of this chapter.", "ఇటువంటి 'చేద్దాం' కృత్యాలు న్యాయం, సమానత్వం, సోదరభావం వంటి విలువలను అలవరచి పిల్లలను బాధ్యతాయుత పౌరులుగా తీర్చిదిద్దుతాయి — ఈ అధ్యాయ అభ్యసన ఫలితం."]]}, {"n": 10, "en": "State Government", "te": "రాష్ట్ర ప్రభుత్వం", "c": "#0891b2", "q": [["In India, power is divided between a government at the Centre (Delhi) and separate governments for each state. This system is called the", "భారతదేశంలో అధికారం కేంద్రంలో (ఢిల్లీ) ఒక ప్రభుత్వం, ప్రతి రాష్ట్రానికి వేర్వేరు ప్రభుత్వాల మధ్య విభజించబడింది. ఈ విధానాన్ని ఇలా అంటారు", ["Federal system", "Unitary system", "Monarchy", "Diarchy"], ["సమాఖ్య విధానం", "ఏకకేంద్ర విధానం", "రాచరికం", "ద్వంద్వ ప్రభుత్వం"], 0, "Government at two levels — Centre and State — with power divided between them is called the federal system. Both work according to the Indian Constitution.", "కేంద్రం, రాష్ట్రం అనే రెండు స్థాయిల్లో అధికార విభజన ఉండటాన్ని సమాఖ్య విధానం అంటారు. రెండూ రాజ్యాంగం ప్రకారం పనిచేస్తాయి."], ["The three main functions of a government are", "ప్రభుత్వపు మూడు ప్రధాన విధులు", ["To make laws, to execute laws and to ensure justice", "To collect taxes, build roads and run schools", "To conduct elections, census and survey", "To print money, defend borders and trade"], ["చట్టాలు చేయడం, అమలుపరచడం, న్యాయం అందించడం", "పన్నులు వసూలు, రోడ్లు, పాఠశాలలు", "ఎన్నికలు, జనగణన, సర్వే", "నోట్ల ముద్రణ, సరిహద్దు రక్షణ, వ్యాపారం"], 0, "A government has three main functions — to make laws, to execute laws and to ensure justice for all.", "ప్రభుత్వ మూడు ప్రధాన విధులు — చట్టాలు చేయడం, వాటిని అమలు చేయడం, అందరికీ న్యాయం అందించడం."], ["Match the organs of the State Government with their functions:\nA. Legislature   B. Executive   C. Judiciary\n1. Interprets the laws   2. Enforces the laws   3. Enacts the laws", "రాష్ట్ర ప్రభుత్వ అంగాలను వాటి విధులతో జతపరచండి:\nA. శాసన శాఖ   B. కార్యనిర్వాహక శాఖ   C. న్యాయ శాఖ\n1. చట్టాలను వ్యాఖ్యానిస్తుంది   2. చట్టాలను అమలు చేస్తుంది   3. చట్టాలను రూపొందిస్తుంది", ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], 0, "The Legislature enacts laws, the Executive enforces them, and the Judiciary interprets them.", "శాసన శాఖ చట్టాలు రూపొందిస్తుంది, కార్యనిర్వాహక శాఖ అమలు చేస్తుంది, న్యాయ శాఖ వ్యాఖ్యానిస్తుంది."], ["The State Legislature consists of", "రాష్ట్ర శాసన వ్యవస్థలో భాగాలు", ["Governor, Legislative Assembly and Legislative Council", "Chief Minister, Council of Ministers and Governor", "High Court, District Courts and Lok Adalats", "Collector, RDO and Tahsildar"], ["గవర్నర్, శాసనసభ, శాసనమండలి", "ముఖ్యమంత్రి, మంత్రిమండలి, గవర్నర్", "హైకోర్టు, జిల్లా కోర్టులు, లోక్ అదాలత్‌లు", "కలెక్టర్, ఆర్డీవో, తహసీల్దార్"], 0, "The Governor, Legislative Assembly and Legislative Council together are called the State Legislature; its primary function is to enact laws.", "గవర్నర్, శాసనసభ, శాసనమండలి కలిపి రాష్ట్ర శాసన వ్యవస్థ; దీని ప్రధాన విధి చట్టాలు చేయడం."], ["The Governor of a state is appointed by", "రాష్ట్ర గవర్నర్‌ను నియమించేది", ["The President of India", "The Chief Minister", "The Prime Minister", "The Chief Justice of the High Court"], ["భారత రాష్ట్రపతి", "ముఖ్యమంత్రి", "ప్రధానమంత్రి", "హైకోర్టు ప్రధాన న్యాయమూర్తి"], 0, "The President of India appoints the Governor on the recommendation of the Prime Minister and the Union Cabinet, for a term of five years.", "ప్రధానమంత్రి, కేంద్ర మంత్రివర్గం సిఫారసుపై భారత రాష్ట్రపతి గవర్నర్‌ను ఐదేళ్ళ కాలానికి నియమిస్తారు."], ["The Article of the Constitution which provides that the same person can be appointed as Governor for two or more States is", "ఒకే వ్యక్తిని రెండు లేదా అంతకంటే ఎక్కువ రాష్ట్రాలకు గవర్నర్‌గా నియమించవచ్చని తెలిపే ప్రకరణ", ["Article 158(3A)", "Article 163(1)", "Article 171(1)", "Article 21A"], ["ప్రకరణ 158(3A)", "ప్రకరణ 163(1)", "ప్రకరణ 171(1)", "ప్రకరణ 21A"], 0, "According to Article 158(3A), the same person can be appointed as Governor for two or more States.", "ప్రకరణ 158(3A) ప్రకారం ఒకే వ్యక్తిని రెండు లేదా అంతకంటే ఎక్కువ రాష్ట్రాలకు గవర్నర్‌గా నియమించవచ్చు."], ["Identify the one that is NOT a function of the Governor", "గవర్నర్ విధి కానిది", ["Inviting the leader of the majority party to form the government", "Summoning and proroguing the sessions of the legislative houses", "Informing the President about the functioning of the State Government", "Allocating portfolios to the ministers"], ["మెజారిటీ పార్టీ నాయకుని ప్రభుత్వ ఏర్పాటుకు ఆహ్వానించడం", "శాసనసభ సమావేశాలను ఏర్పాటు చేయడం, ముగించడం", "రాష్ట్ర ప్రభుత్వ పనితీరును రాష్ట్రపతికి తెలియజేయడం", "మంత్రులకు శాఖలు కేటాయించడం"], 3, "Allocating portfolios to ministers is done by the Chief Minister. The others are functions of the Governor.", "మంత్రులకు శాఖల కేటాయింపు ముఖ్యమంత్రి చేస్తారు. మిగతావి గవర్నర్ విధులు."], ["'Prorogue' means", "'ప్రోరోగ్' (Prorogue) అంటే", ["Termination of a session of the house", "Calling all members of the house", "Dissolving the government", "Introducing a bill"], ["సభా సమావేశాన్ని ముగించడం", "సభ్యులందరినీ సమావేశానికి పిలవడం", "ప్రభుత్వాన్ని రద్దు చేయడం", "బిల్లు ప్రవేశపెట్టడం"], 0, "Prorogue – termination of a session of the house. Summons – the process of calling all members of the house.", "ప్రోరోగ్ – సభా సమావేశ ముగింపు. సమన్స్ – సభ్యులందరినీ సమావేశానికి పిలవడం."], ["The lower house of the State Legislature, where MLAs meet, is the", "ఎమ్మెల్యేలు సమావేశమయ్యే రాష్ట్ర శాసన వ్యవస్థ దిగువ సభ", ["Legislative Assembly", "Legislative Council", "Lok Sabha", "Rajya Sabha"], ["శాసనసభ", "శాసనమండలి", "లోక్‌సభ", "రాజ్యసభ"], 0, "The Legislative Assembly is the lower house where MLAs discuss issues related to the progress and welfare of the state.", "శాసనసభ దిగువ సభ; అక్కడ ఎమ్మెల్యేలు రాష్ట్ర ప్రగతి, సంక్షేమంపై చర్చిస్తారు."], ["Each state is divided into Assembly constituencies on the basis of", "ప్రతి రాష్ట్రాన్ని శాసనసభ నియోజకవర్గాలుగా దీని ఆధారంగా విభజిస్తారు", ["Population", "Area", "Number of districts", "Literacy rate"], ["జనాభా", "విస్తీర్ణం", "జిల్లాల సంఖ్య", "అక్షరాస్యత రేటు"], 0, "Each state is divided into Assembly constituencies based on the population of the State.", "ప్రతి రాష్ట్రం జనాభా ఆధారంగా శాసనసభ నియోజకవర్గాలుగా విభజించబడుతుంది."], ["Elections to the State Legislative Assembly are generally held once in every", "రాష్ట్ర శాసనసభ ఎన్నికలు సాధారణంగా ఎన్నేళ్ళకు ఒకసారి జరుగుతాయి", ["Five years", "Six years", "Four years", "Two years"], ["ఐదేళ్ళు", "ఆరేళ్ళు", "నాలుగేళ్ళు", "రెండేళ్ళు"], 0, "Elections to the State Legislative Assembly are held once in every five years; the Election Commission announces the notification.", "శాసనసభ ఎన్నికలు ఐదేళ్ళకు ఒకసారి జరుగుతాయి; ఎన్నికల సంఘం నోటిఫికేషన్ ఇస్తుంది."], ["A public declaration of policy and aims announced before an election by a political party or candidate is called a", "ఎన్నికలకు ముందు రాజకీయ పార్టీ లేదా అభ్యర్థి ప్రకటించే విధానాలు, లక్ష్యాల బహిరంగ ప్రకటన", ["Manifesto", "Gazette", "Ordinance", "Bill"], ["మేనిఫెస్టో (ఎన్నికల ప్రణాళిక)", "గెజిట్", "ఆర్డినెన్స్", "బిల్లు"], 0, "A manifesto is a public declaration of policy and aims announced before an election by a party or candidate.", "ఎన్నికల ముందు పార్టీ లేదా అభ్యర్థి ప్రకటించే విధానాలు, లక్ష్యాలే మేనిఫెస్టో."], ["To vote in an Assembly election, a voter must be of the age of", "శాసనసభ ఎన్నికల్లో ఓటు వేయడానికి ఓటరు వయసు", ["18 years and above", "21 years and above", "25 years and above", "16 years and above"], ["18 ఏళ్ళు, ఆపైన", "21 ఏళ్ళు, ఆపైన", "25 ఏళ్ళు, ఆపైన", "16 ఏళ్ళు, ఆపైన"], 0, "All voters aged 18 years and above vote in the constituency on election day, showing their voter ID card.", "18 ఏళ్ళు, ఆపైన వయసున్న ఓటర్లు ఓటరు గుర్తింపు కార్డు చూపి ఓటు వేస్తారు."], ["As part of the secret voting system,", "రహస్య ఓటింగ్ విధానంలో భాగంగా", ["Voters should not reveal to whom they cast their vote", "Voters must announce their choice publicly", "Only party members can vote", "Votes are counted before polling"], ["ఎవరికి ఓటు వేశారో ఓటర్లు వెల్లడించరాదు", "ఓటర్లు తమ ఎంపికను బహిరంగంగా ప్రకటించాలి", "పార్టీ సభ్యులు మాత్రమే ఓటు వేయాలి", "పోలింగ్‌కు ముందే లెక్కింపు"], 0, "As part of the secret voting system, voters should not reveal to whom they cast their vote.", "రహస్య ఓటింగ్ విధానంలో ఓటర్లు ఎవరికి ఓటు వేశారో బయటపెట్టరాదు."], ["After counting votes, the candidate declared as MLA of a constituency is the one who", "ఓట్ల లెక్కింపు తర్వాత నియోజకవర్గ ఎమ్మెల్యేగా ప్రకటించబడేది", ["Gets the majority of the votes", "Is the oldest candidate", "Is nominated by the Governor", "Spends the most money"], ["ఎక్కువ ఓట్లు పొందిన అభ్యర్థి", "అత్యంత వయోవృద్ధ అభ్యర్థి", "గవర్నర్ నామినేట్ చేసిన వ్యక్తి", "ఎక్కువ ఖర్చు చేసిన వ్యక్తి"], 0, "After counting, the candidate who gets the majority of votes is declared the MLA of that constituency.", "లెక్కింపు తర్వాత ఎక్కువ ఓట్లు పొందిన అభ్యర్థిని ఎమ్మెల్యేగా ప్రకటిస్తారు."], ["Who becomes the Chief Minister?", "ముఖ్యమంత్రి ఎవరు అవుతారు?", ["Leader of the Opposition Party", "Leader of the Majority Party", "Any Member of Legislative Assembly", "Speaker"], ["ప్రతిపక్ష పార్టీ నాయకుడు", "మెజారిటీ పార్టీ నాయకుడు", "ఏ ఎమ్మెల్యే అయినా", "స్పీకర్"], 1, "The party or coalition with a majority of MLAs elects its leader, who is invited by the Governor to form the government and becomes Chief Minister. (Textbook exercise.)", "మెజారిటీ ఎమ్మెల్యేలున్న పార్టీ లేదా కూటమి తన నాయకుని ఎన్నుకుంటుంది; గవర్నర్ ఆహ్వానంతో ఆయన ముఖ్యమంత్రి అవుతారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Who administers the oath of office to the Chief Minister and the other Ministers?", "ముఖ్యమంత్రి, ఇతర మంత్రులతో ప్రమాణ స్వీకారం చేయించేది ఎవరు?", ["The Governor", "The Speaker", "The Chief Justice of the High Court", "The President of India"], ["గవర్నర్", "స్పీకర్", "హైకోర్టు ప్రధాన న్యాయమూర్తి", "భారత రాష్ట్రపతి"], 0, "The Governor administers the oath to the Chief Minister, and to other Ministers on the recommendation of the Chief Minister.", "గవర్నర్ ముఖ్యమంత్రితో, ముఖ్యమంత్రి సిఫారసుపై ఇతర మంత్రులతో ప్రమాణ స్వీకారం చేయిస్తారు."], ["A government formed by an alliance of two or more parties with common goals, usually when no single party gets an absolute majority, is called a", "ఏ ఒక్క పార్టీకీ సంపూర్ణ మెజారిటీ రానప్పుడు ఉమ్మడి లక్ష్యాలతో రెండు లేదా అంతకంటే ఎక్కువ పార్టీలు ఏర్పరచే ప్రభుత్వం", ["Coalition government", "Federal government", "Military government", "Caretaker government"], ["సంకీర్ణ ప్రభుత్వం", "సమాఖ్య ప్రభుత్వం", "సైనిక ప్రభుత్వం", "ఆపద్ధర్మ ప్రభుత్వం"], 0, "A coalition government is formed by an alliance of two or more parties, usually because no single party has an absolute majority.", "ఏ పార్టీకీ సంపూర్ణ మెజారిటీ లేనప్పుడు రెండు లేదా అంతకంటే ఎక్కువ పార్టీల కూటమి ఏర్పరచేది సంకీర్ణ ప్రభుత్వం."], ["The upper house of the State Legislature is the", "రాష్ట్ర శాసన వ్యవస్థ ఎగువ సభ", ["Legislative Council", "Legislative Assembly", "Rajya Sabha", "Gram Sabha"], ["శాసనమండలి", "శాసనసభ", "రాజ్యసభ", "గ్రామసభ"], 0, "The upper house of the State Legislature is the Legislative Council; its members (MLCs) are elected indirectly.", "రాష్ట్ర శాసన వ్యవస్థ ఎగువ సభ శాసనమండలి; దాని సభ్యులు (ఎమ్మెల్సీలు) పరోక్షంగా ఎన్నికవుతారు."], ["'Bicameral' legislature means", "'ద్విసభా' (Bicameral) శాసన వ్యవస్థ అంటే", ["A legislature with two houses", "A legislature with one house", "A legislature without elections", "A legislature of judges"], ["రెండు సభలు గల శాసన వ్యవస్థ", "ఒకే సభ గల శాసన వ్యవస్థ", "ఎన్నికలు లేని శాసన వ్యవస్థ", "న్యాయమూర్తుల శాసన వ్యవస్థ"], 0, "Bicameral – a legislature divided into two houses (e.g., Legislative Assembly and Legislative Council).", "ద్విసభా విధానం – రెండు సభలుగా విభజించబడిన శాసన వ్యవస్థ (ఉదా: శాసనసభ, శాసనమండలి)."], ["The Legislative Council is called a permanent house because", "శాసనమండలిని శాశ్వత సభ అనడానికి కారణం", ["It cannot be dissolved; one-third of its members retire every 2 years", "Its members are appointed for life", "It never holds elections", "It is headed by the Governor"], ["దీనిని రద్దు చేయలేరు; ప్రతి 2 ఏళ్ళకు మూడో వంతు సభ్యులు పదవీ విరమణ చేస్తారు", "సభ్యులు జీవితకాలం నియమితులు", "ఎన్నికలు ఎప్పుడూ జరగవు", "గవర్నర్ నేతృత్వం వహిస్తారు"], 0, "Every 2 years, one-third of its members who have completed 6 years retire and new members are elected; it cannot be dissolved, so it is a permanent house.", "ప్రతి 2 ఏళ్ళకు 6 ఏళ్ళు పూర్తి చేసిన మూడో వంతు సభ్యులు విరమిస్తారు, కొత్తవారు ఎన్నికవుతారు; రద్దు కాదు కాబట్టి శాశ్వత సభ."], ["Every Member of the Legislative Council (MLC) is elected for a term of", "ప్రతి శాసనమండలి సభ్యుని (ఎమ్మెల్సీ) పదవీకాలం", ["Six years", "Five years", "Four years", "Two years"], ["ఆరేళ్ళు", "ఐదేళ్ళు", "నాలుగేళ్ళు", "రెండేళ్ళు"], 0, "Every MLC is elected for a six-year term; an MLA's term is five years.", "ఎమ్మెల్సీ పదవీకాలం ఆరేళ్ళు; ఎమ్మెల్యే పదవీకాలం ఐదేళ్ళు."], ["Match the composition of the Legislative Council:\nA. Elected by the Legislative Assembly   B. Elected by Local Authorities   C. Elected by the Graduates Constituency   D. Nominated by the Governor\n1. 1/6   2. 1/12   3. 1/3   4. 1/3", "శాసనమండలి కూర్పును జతపరచండి:\nA. శాసనసభచే ఎన్నిక   B. స్థానిక సంస్థలచే ఎన్నిక   C. పట్టభద్రుల నియోజకవర్గం ఎన్నిక   D. గవర్నర్ నామినేషన్\n1. 1/6   2. 1/12   3. 1/3   4. 1/3", ["A-3, B-4, C-2, D-1", "A-2, B-3, C-1, D-4", "A-1, B-2, C-3, D-4", "A-3, B-1, C-4, D-2"], ["A-3, B-4, C-2, D-1", "A-2, B-3, C-1, D-4", "A-1, B-2, C-3, D-4", "A-3, B-1, C-4, D-2"], 0, "1/3 elected by the Legislative Assembly, 1/3 by local authorities, 1/12 by graduates, 1/12 by teachers, and 1/6 nominated by the Governor.", "1/3 శాసనసభచే, 1/3 స్థానిక సంస్థలచే, 1/12 పట్టభద్రులచే, 1/12 ఉపాధ్యాయులచే ఎన్నిక; 1/6 గవర్నర్ నామినేట్ చేస్తారు."], ["The fraction of members of the Legislative Council elected by the Teachers' Constituency is", "ఉపాధ్యాయ నియోజకవర్గం నుండి ఎన్నికయ్యే శాసనమండలి సభ్యుల భాగం", ["1/12", "1/3", "1/6", "1/4"], ["1/12", "1/3", "1/6", "1/4"], 0, "1/12 of the members of the Legislative Council are elected by the Teachers' Constituency.", "శాసనమండలి సభ్యులలో 1/12 వంతు ఉపాధ్యాయ నియోజకవర్గం నుండి ఎన్నికవుతారు."], ["Fill the table — Andhra Pradesh: Legislative Assembly has ____ members and Legislative Council has ____ members", "పట్టిక పూరించండి — ఆంధ్రప్రదేశ్: శాసనసభలో ____ మంది, శాసనమండలిలో ____ మంది సభ్యులు", ["175; 58", "58; 175", "294; 90", "175; 90"], ["175; 58", "58; 175", "294; 90", "175; 90"], 0, "The AP Legislative Assembly has 175 members (term 5 years, presided by the Speaker); the Legislative Council has 58 members (term 6 years, presided by the Chairman). (Textbook exercise.)", "ఏపీ శాసనసభలో 175 మంది (పదవీకాలం 5 ఏళ్ళు, అధ్యక్షుడు స్పీకర్); శాసనమండలిలో 58 మంది (6 ఏళ్ళు, అధ్యక్షుడు చైర్మన్). (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Legislative Assembly is presided over by the ____ and the Legislative Council by the ____", "శాసనసభకు ____, శాసనమండలికి ____ అధ్యక్షత వహిస్తారు", ["Speaker; Chairman", "Chairman; Speaker", "Governor; Chief Minister", "Chief Minister; Governor"], ["స్పీకర్; చైర్మన్", "చైర్మన్; స్పీకర్", "గవర్నర్; ముఖ్యమంత్రి", "ముఖ్యమంత్రి; గవర్నర్"], 0, "The Speaker presides over the Legislative Assembly and the Chairman presides over the Legislative Council.", "శాసనసభకు స్పీకర్, శాసనమండలికి చైర్మన్ అధ్యక్షత వహిస్తారు."], ["The functions and powers of the State and Central governments are divided into three lists. The State Government can make laws on items in the", "రాష్ట్ర, కేంద్ర ప్రభుత్వాల అధికారాలు మూడు జాబితాలుగా విభజించబడ్డాయి. రాష్ట్ర ప్రభుత్వం చట్టాలు చేయగల జాబితాలు", ["State List and Concurrent List", "Union List only", "Union List and State List", "Union List and Concurrent List"], ["రాష్ట్ర జాబితా, ఉమ్మడి జాబితా", "కేంద్ర జాబితా మాత్రమే", "కేంద్ర జాబితా, రాష్ట్ర జాబితా", "కేంద్ర జాబితా, ఉమ్మడి జాబితా"], 0, "The three lists are Union, State and Concurrent. The State Government can make laws on items from the State List and the Concurrent List.", "మూడు జాబితాలు: కేంద్ర, రాష్ట్ర, ఉమ్మడి. రాష్ట్ర ప్రభుత్వం రాష్ట్ర, ఉమ్మడి జాబితాల అంశాలపై చట్టాలు చేయవచ్చు."], ["Financial bills should be introduced only in the", "ఆర్థిక బిల్లులను ప్రవేశపెట్టవలసిన సభ", ["Legislative Assembly, with prior approval of the Governor", "Legislative Council", "High Court", "Either house without any approval"], ["గవర్నర్ ముందస్తు అనుమతితో శాసనసభలో", "శాసనమండలిలో", "హైకోర్టులో", "ఏ అనుమతి లేకుండా ఏ సభలోనైనా"], 0, "Financial bills should be introduced in the Legislative Assembly with prior approval of the Governor. The Assembly has more financial powers than the Council.", "ఆర్థిక బిల్లులను గవర్నర్ ముందస్తు అనుమతితో శాసనసభలోనే ప్రవేశపెట్టాలి. శాసనమండలి కంటే శాసనసభకు ఎక్కువ ఆర్థిక అధికారాలు ఉంటాయి."], ["Arrange the stages of the law-making process in the correct order:\n1. Published in the Gazette\n2. Approved in both houses\n3. Introduced in the first house\n4. Assent by the Governor", "చట్టం రూపొందే దశలను సరైన క్రమంలో అమర్చండి:\n1. గెజిట్‌లో ప్రచురణ\n2. రెండు సభల్లో ఆమోదం\n3. మొదటి సభలో ప్రవేశం\n4. గవర్నర్ ఆమోదం", ["3, 2, 4, 1", "3, 4, 2, 1", "2, 3, 4, 1", "3, 2, 1, 4"], ["3, 2, 4, 1", "3, 4, 2, 1", "2, 3, 4, 1", "3, 2, 1, 4"], 0, "A bill is introduced, discussed and approved in one house, then in the next house; then sent to the Governor for assent; then notified in the Gazette and sent to the Executive for enforcement.", "బిల్లు ఒక సభలో ప్రవేశపెట్టి, చర్చించి ఆమోదించాక రెండో సభలో ఆమోదం; తర్వాత గవర్నర్ ఆమోదం; తర్వాత గెజిట్‌లో ప్రచురించి అమలుకు కార్యనిర్వాహక శాఖకు పంపుతారు."], ["A bill passed by both houses of the State Legislature becomes an Act only when", "రాష్ట్ర శాసన వ్యవస్థ రెండు సభలు ఆమోదించిన బిల్లు చట్టం అయ్యేది", ["The Governor accords his approval", "The Chief Minister signs it", "The High Court approves it", "The Collector notifies it"], ["గవర్నర్ ఆమోదం తెలిపినప్పుడు", "ముఖ్యమంత్రి సంతకం చేసినప్పుడు", "హైకోర్టు ఆమోదించినప్పుడు", "కలెక్టర్ ప్రకటించినప్పుడు"], 0, "Once approved in both houses, the bill is sent to the Governor; it becomes an Act only when the Governor accords approval, after which it is notified in the Gazette.", "రెండు సభల ఆమోదం తర్వాత బిల్లు గవర్నర్‌కు వెళుతుంది; గవర్నర్ ఆమోదించినప్పుడే చట్టం అవుతుంది, తర్వాత గెజిట్‌లో ప్రచురిస్తారు."], ["An official publication for notifying the actions and decisions of the Government is called the", "ప్రభుత్వ చర్యలు, నిర్ణయాలను తెలియజేసే అధికారిక ప్రచురణ", ["Gazette", "Manifesto", "Bulletin", "Constitution"], ["గెజిట్", "మేనిఫెస్టో", "బులెటిన్", "రాజ్యాంగం"], 0, "A Gazette is an official publication notifying the actions and decisions of the Government; an Act is notified in it and sent to the Executive.", "ప్రభుత్వ చర్యలు, నిర్ణయాలను తెలియజేసే అధికారిక ప్రచురణ గెజిట్; చట్టాన్ని అందులో ప్రచురించి కార్యనిర్వాహక శాఖకు పంపుతారు."], ["The State Executive comprises", "రాష్ట్ర కార్యనిర్వాహక శాఖలో ఉండేవారు", ["Governor, Chief Minister, Council of Ministers and Bureaucracy", "Speaker, MLAs and MLCs", "High Court and District Courts", "President and Prime Minister"], ["గవర్నర్, ముఖ్యమంత్రి, మంత్రిమండలి, అధికార యంత్రాంగం", "స్పీకర్, ఎమ్మెల్యేలు, ఎమ్మెల్సీలు", "హైకోర్టు, జిల్లా కోర్టులు", "రాష్ట్రపతి, ప్రధానమంత్రి"], 0, "The State Executive comprises the Governor, the Chief Minister, the Council of Ministers (Cabinet) and the Bureaucracy.", "రాష్ట్ర కార్యనిర్వాహక శాఖలో గవర్నర్, ముఖ్యమంత్రి, మంత్రిమండలి (కేబినెట్), అధికార యంత్రాంగం ఉంటాయి."], ["The real powers in administration in the state government are exercised by the", "రాష్ట్ర ప్రభుత్వ పరిపాలనలో వాస్తవ అధికారాలను వినియోగించేది", ["Speaker", "Governor", "Chief Minister", "All of the above"], ["స్పీకర్", "గవర్నర్", "ముఖ్యమంత్రి", "పైవన్నీ"], 2, "The Governor is the head of the state (nominal), but the Chief Minister, as head of the government, exercises the real powers. (Textbook exercise.)", "గవర్నర్ రాష్ట్రాధినేత (నామమాత్రం); ప్రభుత్వాధినేత అయిన ముఖ్యమంత్రి వాస్తవ అధికారాలు వినియోగిస్తారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Match the following:\nA. Chief Minister   B. Governor   C. MLA   D. MLC   E. Collector\n1. District Magistrate   2. Legislative Council   3. Legislative Assembly   4. Head of the State   5. Head of the Government", "జతపరచండి:\nA. ముఖ్యమంత్రి   B. గవర్నర్   C. ఎమ్మెల్యే   D. ఎమ్మెల్సీ   E. కలెక్టర్\n1. జిల్లా మేజిస్ట్రేట్   2. శాసనమండలి   3. శాసనసభ   4. రాష్ట్రాధినేత   5. ప్రభుత్వాధినేత", ["A-5, B-4, C-3, D-2, E-1", "A-4, B-5, C-3, D-2, E-1", "A-5, B-4, C-2, D-3, E-1", "A-5, B-1, C-3, D-2, E-4"], ["A-5, B-4, C-3, D-2, E-1", "A-4, B-5, C-3, D-2, E-1", "A-5, B-4, C-2, D-3, E-1", "A-5, B-1, C-3, D-2, E-4"], 0, "Chief Minister – Head of the Government; Governor – Head of the State; MLA – Legislative Assembly; MLC – Legislative Council; Collector – District Magistrate. (Textbook exercise.)", "ముఖ్యమంత్రి – ప్రభుత్వాధినేత; గవర్నర్ – రాష్ట్రాధినేత; ఎమ్మెల్యే – శాసనసభ; ఎమ్మెల్సీ – శాసనమండలి; కలెక్టర్ – జిల్లా మేజిస్ట్రేట్. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Identify the one that is NOT a function of the Chief Minister", "ముఖ్యమంత్రి విధి కానిది", ["Preparing the list of ministers and sending it to the Governor", "Allocating portfolios to ministers", "Presiding over cabinet meetings", "Appointing the Chief Justice of the High Court"], ["మంత్రుల జాబితా తయారుచేసి గవర్నర్‌కు పంపడం", "మంత్రులకు శాఖలు కేటాయించడం", "మంత్రివర్గ సమావేశాలకు అధ్యక్షత", "హైకోర్టు ప్రధాన న్యాయమూర్తిని నియమించడం"], 3, "The CM prepares the list of ministers, allocates portfolios, calls and presides over cabinet meetings, and coordinates all departments. The Chief Justice of a High Court is appointed by the President.", "ముఖ్యమంత్రి మంత్రుల జాబితా తయారీ, శాఖల కేటాయింపు, మంత్రివర్గ సమావేశాల అధ్యక్షత, శాఖల సమన్వయం చేస్తారు. హైకోర్టు ప్రధాన న్యాయమూర్తిని రాష్ట్రపతి నియమిస్తారు."], ["According to Article 163(1), the body headed by the Chief Minister to aid and advise the Governor is the", "ప్రకరణ 163(1) ప్రకారం గవర్నర్‌కు సహాయం, సలహా ఇచ్చే ముఖ్యమంత్రి నేతృత్వంలోని సంస్థ", ["Council of Ministers", "Legislative Council", "High Court", "Election Commission"], ["మంత్రిమండలి", "శాసనమండలి", "హైకోర్టు", "ఎన్నికల సంఘం"], 0, "Article 163(1): there shall be a Council of Ministers with the CM as the head to aid and advise the Governor.", "ప్రకరణ 163(1): గవర్నర్‌కు సహాయం, సలహా ఇవ్వడానికి ముఖ్యమంత్రి నేతృత్వంలో మంత్రిమండలి ఉంటుంది."], ["The highest judicial organ at the state level is the", "రాష్ట్ర స్థాయిలో అత్యున్నత న్యాయ సంస్థ", ["High Court", "Supreme Court", "District Court", "Lok Adalat"], ["హైకోర్టు", "సుప్రీంకోర్టు", "జిల్లా కోర్టు", "లోక్ అదాలత్"], 0, "The High Court is the highest judicial organ at the state level; it functions under the Supreme Court, the apex court of the country.", "హైకోర్టు రాష్ట్ర స్థాయిలో అత్యున్నత న్యాయ సంస్థ; ఇది దేశ అత్యున్నత న్యాయస్థానమైన సుప్రీంకోర్టు కింద పనిచేస్తుంది."], ["Consider the following statements about the High Court:\nI. It consists of a Chief Justice and other judges; the number of judges is the same in all states.\nII. It is a 'court of record' — its decisions are kept as records for future reference.", "హైకోర్టు గురించి కింది వాక్యాలను పరిశీలించండి:\nI. ఇందులో ప్రధాన న్యాయమూర్తి, ఇతర న్యాయమూర్తులు ఉంటారు; అన్ని రాష్ట్రాల్లో న్యాయమూర్తుల సంఖ్య ఒకటే.\nII. ఇది 'రికార్డుల న్యాయస్థానం' — దాని తీర్పులను భవిష్యత్ సూచన కోసం రికార్డుగా ఉంచుతారు.", ["Only II is correct", "Only I is correct", "Both I and II are correct", "Neither I nor II is correct"], ["II మాత్రమే సరైనది", "I మాత్రమే సరైనది", "I, II రెండూ సరైనవి", "రెండూ సరైనవి కావు"], 0, "The number of judges in the High Court is NOT the same in all states. The High Court is a court of record — its decisions and decrees are printed and kept as records.", "హైకోర్టు న్యాయమూర్తుల సంఖ్య అన్ని రాష్ట్రాల్లో ఒకేలా ఉండదు. హైకోర్టు రికార్డుల న్యాయస్థానం — దాని తీర్పులు, డిక్రీలను ముద్రించి రికార్డుగా ఉంచుతారు."], ["The Chief Justice of a High Court is appointed by the ____ and can hold office until the age of ____", "హైకోర్టు ప్రధాన న్యాయమూర్తిని ____ నియమిస్తారు; ____ ఏళ్ళ వయసు వరకు పదవిలో ఉండవచ్చు", ["President of India; 62 years", "Governor; 65 years", "Chief Minister; 60 years", "Prime Minister; 70 years"], ["భారత రాష్ట్రపతి; 62", "గవర్నర్; 65", "ముఖ్యమంత్రి; 60", "ప్రధానమంత్రి; 70"], 0, "The President of India appoints the Chief Justice of a High Court, who can hold office until the age of 62 years.", "హైకోర్టు ప్రధాన న్యాయమూర్తిని భారత రాష్ట్రపతి నియమిస్తారు; 62 ఏళ్ళ వయసు వరకు పదవిలో ఉంటారు."], ["Lok Adalats, which settle disputes through conciliation and compromise, have been given statutory status under the", "రాజీ, సయోధ్య ద్వారా వివాదాలు పరిష్కరించే లోక్ అదాలత్‌లకు చట్టబద్ధ హోదా కల్పించిన చట్టం", ["Legal Services Authorities Act, 1987", "Right to Information Act, 2005", "Government of India Act, 1935", "RTE Act, 2009"], ["న్యాయ సేవల ప్రాధికార సంస్థల చట్టం, 1987", "సమాచార హక్కు చట్టం, 2005", "భారత ప్రభుత్వ చట్టం, 1935", "విద్యా హక్కు చట్టం, 2009"], 0, "Lok Adalat (People's Court) is an alternative dispute redressal mechanism with statutory status under the Legal Services Authorities Act 1987; civil, matrimonial and petty offence cases are mainly referred to it.", "లోక్ అదాలత్ (ప్రజా న్యాయస్థానం) ప్రత్యామ్నాయ వివాద పరిష్కార వ్యవస్థ; న్యాయ సేవల ప్రాధికార సంస్థల చట్టం 1987 కింద చట్టబద్ధ హోదా; సివిల్, వైవాహిక, చిన్న నేరాల కేసులు ఇక్కడికి వస్తాయి."], ["The head of the district administration, who is also called the District Magistrate, is the", "జిల్లా మేజిస్ట్రేట్‌గా కూడా పిలువబడే జిల్లా పరిపాలనాధిపతి", ["District Collector", "Superintendent of Police", "Revenue Divisional Officer", "Tahsildar"], ["జిల్లా కలెక్టర్", "పోలీస్ సూపరింటెండెంట్", "రెవెన్యూ డివిజనల్ అధికారి", "తహసీల్దార్"], 0, "The District Collector (District Magistrate) is the head of district administration and represents the state government in the district.", "జిల్లా కలెక్టర్ (జిల్లా మేజిస్ట్రేట్) జిల్లా పరిపాలనాధిపతి; జిల్లాలో రాష్ట్ర ప్రభుత్వ ప్రతినిధి."], ["The District Collector is recruited through the", "జిల్లా కలెక్టర్‌ను నియమించే సంస్థ", ["Union Public Service Commission", "State Election Commission", "High Court", "Legislative Assembly"], ["కేంద్ర పబ్లిక్ సర్వీస్ కమిషన్ (UPSC)", "రాష్ట్ర ఎన్నికల సంఘం", "హైకోర్టు", "శాసనసభ"], 0, "The Collector is recruited through the UPSC and allotted to states by the Central Government.", "కలెక్టర్ UPSC ద్వారా ఎంపికై కేంద్ర ప్రభుత్వంచే రాష్ట్రాలకు కేటాయించబడతారు."], ["Identify the responsibility that does NOT belong to the District Collector", "జిల్లా కలెక్టర్ బాధ్యత కానిది", ["Revenue and land records", "Law and order", "Disaster management and election duties", "Passing laws in the Legislative Assembly"], ["రెవెన్యూ, భూ రికార్డులు", "శాంతిభద్రతలు", "విపత్తు నిర్వహణ, ఎన్నికల విధులు", "శాసనసభలో చట్టాలు చేయడం"], 3, "The Collector looks after revenue, law and order, local self-government, agriculture, disaster management and election duties. Making laws is the work of the Legislature.", "కలెక్టర్ రెవెన్యూ, శాంతిభద్రతలు, స్థానిక స్వపరిపాలన, వ్యవసాయం, విపత్తు నిర్వహణ, ఎన్నికల విధులు చూస్తారు. చట్టాలు చేయడం శాసన శాఖ పని."], ["The chief police officer of a district, who helps the Collector in maintaining law and order, is the", "జిల్లాలో శాంతిభద్రతల పరిరక్షణలో కలెక్టర్‌కు సహాయపడే జిల్లా పోలీస్ ముఖ్య అధికారి", ["Superintendent of Police", "Tahsildar", "Village Revenue Officer", "District Judge"], ["పోలీస్ సూపరింటెండెంట్ (ఎస్పీ)", "తహసీల్దార్", "గ్రామ రెవెన్యూ అధికారి", "జిల్లా న్యాయమూర్తి"], 0, "The Superintendent of Police is the chief police officer of the district headquarters and helps the Collector maintain law and order.", "పోలీస్ సూపరింటెండెంట్ జిల్లా ముఖ్య పోలీస్ అధికారి; శాంతిభద్రతల పరిరక్షణలో కలెక్టర్‌కు సహాయపడతారు."], ["Arrange the revenue officials from the highest to the lowest level", "రెవెన్యూ అధికారులను ఉన్నత స్థాయి నుండి కింది స్థాయికి అమర్చండి", ["District Collector, Revenue Divisional Officer, Tahsildar, Village Revenue Officer", "Tahsildar, RDO, Collector, VRO", "RDO, Collector, VRO, Tahsildar", "Collector, Tahsildar, RDO, VRO"], ["జిల్లా కలెక్టర్, ఆర్డీవో, తహసీల్దార్, వీఆర్వో", "తహసీల్దార్, ఆర్డీవో, కలెక్టర్, వీఆర్వో", "ఆర్డీవో, కలెక్టర్, వీఆర్వో, తహసీల్దార్", "కలెక్టర్, తహసీల్దార్, ఆర్డీవో, వీఆర్వో"], 0, "Collector (district) → RDO (revenue division) → Tahsildar (mandal) → Village Revenue Officer (village).", "కలెక్టర్ (జిల్లా) → ఆర్డీవో (రెవెన్యూ డివిజన్) → తహసీల్దార్ (మండలం) → గ్రామ రెవెన్యూ అధికారి (గ్రామం)."], ["The chief administrative and executive head at the Mandal level, responsible for collection of revenue and maintenance of land records, is the", "మండల స్థాయిలో రెవెన్యూ వసూలు, భూ రికార్డుల నిర్వహణ బాధ్యత గల ముఖ్య పరిపాలనాధికారి", ["Tahsildar", "Revenue Divisional Officer", "Village Revenue Officer", "Superintendent of Police"], ["తహసీల్దార్", "రెవెన్యూ డివిజనల్ అధికారి", "గ్రామ రెవెన్యూ అధికారి", "పోలీస్ సూపరింటెండెంట్"], 0, "The Tahsildar is the chief administrative and executive head at Mandal level, responsible for assessment and collection of revenue and maintenance of land records.", "తహసీల్దార్ మండల స్థాయి ముఖ్య పరిపాలనాధికారి; రెవెన్యూ అంచనా, వసూలు, భూ రికార్డుల నిర్వహణ చూస్తారు."], ["Issuing nativity and residence certificates and inspecting survey stones at the village level is the duty of the", "గ్రామ స్థాయిలో నేటివిటీ, నివాస ధృవపత్రాలు జారీ చేయడం, సర్వే రాళ్ళ తనిఖీ ఎవరి విధి", ["Village Revenue Officer", "District Judge", "Superintendent of Police", "Chief Minister"], ["గ్రామ రెవెన్యూ అధికారి (వీఆర్వో)", "జిల్లా న్యాయమూర్తి", "పోలీస్ సూపరింటెండెంట్", "ముఖ్యమంత్రి"], 0, "The VRO maintains village revenue records, collects land revenue and taxes, inspects survey stones and issues certificates like nativity and residence.", "వీఆర్వో గ్రామ రెవెన్యూ రికార్డులు నిర్వహించి, భూమి శిస్తు, పన్నులు వసూలు చేసి, సర్వే రాళ్ళు తనిఖీ చేసి, నేటివిటీ, నివాస ధృవపత్రాలు జారీ చేస్తారు."], ["Subordinate courts deal with civil and criminal cases and administer", "సబార్డినేట్ కోర్టులు సివిల్, క్రిమినల్ కేసులను విచారిస్తూ అమలుపరిచేవి", ["CPC (Civil Procedure Code) and CrPC (Criminal Procedure Code)", "Only the Fundamental Duties", "The Union List", "The Gazette"], ["సీపీసీ (సివిల్ ప్రొసీజర్ కోడ్), సీఆర్‌పీసీ (క్రిమినల్ ప్రొసీజర్ కోడ్)", "ప్రాథమిక విధులు మాత్రమే", "కేంద్ర జాబితా", "గెజిట్"], 0, "Subordinate courts deal with civil and criminal cases and administer the CPC and CrPC. Judgements of Divisional Courts may be appealed in the District Court.", "సబార్డినేట్ కోర్టులు సివిల్, క్రిమినల్ కేసులను సీపీసీ, సీఆర్‌పీసీ ప్రకారం విచారిస్తాయి. డివిజనల్ కోర్టు తీర్పులపై జిల్లా కోర్టుకు అప్పీలు చేయవచ్చు."], ["Segregate correctly: which group belongs entirely to the JUDICIARY?", "సరిగా వర్గీకరించండి: పూర్తిగా న్యాయ శాఖకు చెందిన సమూహం ఏది?", ["Judge, Lawyer, Chief Justice", "Speaker, Minister, MLA", "Judge, Speaker, MLA", "Minister, Lawyer, Chief Justice"], ["న్యాయమూర్తి, న్యాయవాది, ప్రధాన న్యాయమూర్తి", "స్పీకర్, మంత్రి, ఎమ్మెల్యే", "న్యాయమూర్తి, స్పీకర్, ఎమ్మెల్యే", "మంత్రి, న్యాయవాది, ప్రధాన న్యాయమూర్తి"], 0, "Judge, Lawyer and Chief Justice belong to the Judiciary; Speaker, Minister and MLA belong to the Legislature. (Textbook exercise.)", "న్యాయమూర్తి, న్యాయవాది, ప్రధాన న్యాయమూర్తి న్యాయ శాఖకు; స్పీకర్, మంత్రి, ఎమ్మెల్యే శాసన శాఖకు చెందుతారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["To help students understand the law-making process, a teacher conducts a 'Mock Assembly' in the school where students act as Speaker, ministers and MLAs. This method is best described as", "చట్టాలు రూపొందే ప్రక్రియను అర్థం చేయించడానికి ఉపాధ్యాయుడు పాఠశాలలో విద్యార్థులను స్పీకర్, మంత్రులు, ఎమ్మెల్యేలుగా పెట్టి 'మాదిరి శాసనసభ' నిర్వహించాడు. ఈ పద్ధతి", ["Simulation / role-play method", "Lecture method", "Dictation method", "Drill method"], ["అనుకరణ / పాత్రాభినయ పద్ధతి", "ఉపన్యాస పద్ధతి", "డిక్టేషన్ పద్ధతి", "డ్రిల్ పద్ధతి"], 0, "A mock assembly is a simulation (role-play) — students experience the democratic process directly, as suggested in the textbook's project work.", "మాదిరి శాసనసభ అనుకరణ (పాత్రాభినయ) పద్ధతి — విద్యార్థులు ప్రజాస్వామ్య ప్రక్రియను నేరుగా అనుభవిస్తారు; పాఠ్యపుస్తక ప్రాజెక్టు పనిలో సూచించబడింది."]]}, {"n": 11, "en": "Road Safety", "te": "రోడ్డు భద్రత", "c": "#059669", "q": [["The alternate black and white stripes painted across the road for pedestrians to cross are called", "పాదచారులు రోడ్డు దాటడానికి రోడ్డుపై వేసిన నలుపు–తెలుపు చారలను ఇలా అంటారు", ["Zebra crossing", "Road divider", "Footpath", "Speed breaker"], ["జీబ్రా క్రాసింగ్", "రోడ్ డివైడర్", "ఫుట్‌పాత్", "స్పీడ్ బ్రేకర్"], 0, "Zebra crossings are alternate black and white stripes meant for pedestrians to cross the road from one side to the other.", "జీబ్రా క్రాసింగ్ అనేవి పాదచారులు రోడ్డు ఒకవైపు నుండి మరోవైపు దాటడానికి వేసిన నలుపు–తెలుపు చారలు."], ["Which of the following colour lights indicates 'stop before the line'?", "'గీతకు ముందే ఆగండి' అని సూచించే లైటు రంగు", ["Orange", "Green", "Red", "Yellow"], ["నారింజ", "ఆకుపచ్చ", "ఎరుపు", "పసుపు"], 2, "Red light indicates 'stop', orange indicates 'ready to go', and green indicates 'go'. (Textbook exercise.)", "ఎరుపు లైటు 'ఆగండి', నారింజ 'సిద్ధంగా ఉండండి', ఆకుపచ్చ 'వెళ్ళండి' అని సూచిస్తాయి. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Match the following:\nA. Footpath   B. Red colour light   C. Green colour light   D. Orange colour light   E. Road divider\n1. Road marking sign   2. Get ready to go   3. Move the vehicle   4. Stop before the line   5. Pedestrians", "జతపరచండి:\nA. ఫుట్‌పాత్   B. ఎరుపు లైటు   C. ఆకుపచ్చ లైటు   D. నారింజ లైటు   E. రోడ్ డివైడర్\n1. రోడ్డు మార్కింగ్ గుర్తు   2. వెళ్ళడానికి సిద్ధం   3. వాహనం కదపండి   4. గీతకు ముందు ఆగండి   5. పాదచారులు", ["A-5, B-4, C-3, D-2, E-1", "A-1, B-4, C-3, D-2, E-5", "A-5, B-3, C-4, D-2, E-1", "A-5, B-4, C-2, D-3, E-1"], ["A-5, B-4, C-3, D-2, E-1", "A-1, B-4, C-3, D-2, E-5", "A-5, B-3, C-4, D-2, E-1", "A-5, B-4, C-2, D-3, E-1"], 0, "Footpath – pedestrians; Red – stop before the line; Green – move the vehicle; Orange – get ready to go; Road divider – road marking sign. (Textbook exercise.)", "ఫుట్‌పాత్ – పాదచారులు; ఎరుపు – గీతకు ముందు ఆగండి; ఆకుపచ్చ – వాహనం కదపండి; నారింజ – సిద్ధంగా ఉండండి; డివైడర్ – రోడ్డు మార్కింగ్ గుర్తు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["'Traffic' means", "'ట్రాఫిక్' అంటే", ["Movement of persons and objects from one place to another, including vehicles and pedestrians", "Only the number of buses on a road", "Only traffic police", "Only road signs"], ["వాహనాలు, పాదచారులతో సహా వ్యక్తులు, వస్తువుల ఒక చోటు నుండి మరో చోటుకు కదలిక", "రోడ్డుపై బస్సుల సంఖ్య మాత్రమే", "ట్రాఫిక్ పోలీసులు మాత్రమే", "రోడ్డు గుర్తులు మాత్రమే"], 0, "Traffic is the movement of persons and objects from one place to another; it includes vehicles, pedestrians, animals and others.", "ట్రాఫిక్ అంటే వ్యక్తులు, వస్తువుల కదలిక; ఇందులో వాహనాలు, పాదచారులు, జంతువులు మొదలైనవి ఉంటాయి."], ["According to the textbook, in most cases road crashes occur due to", "పాఠ్యపుస్తకం ప్రకారం చాలా సందర్భాల్లో రోడ్డు ప్రమాదాలకు కారణం", ["Carelessness or lack of road safety awareness of the road user", "Bad weather only", "Animals only", "Wide roads"], ["రోడ్డు వినియోగదారుల నిర్లక్ష్యం లేదా రోడ్డు భద్రతపై అవగాహన లోపం", "చెడు వాతావరణం మాత్రమే", "జంతువులు మాత్రమే", "వెడల్పైన రోడ్లు"], 0, "In most cases crashes occur due to carelessness or lack of road safety awareness; most accidents are due to human mistakes and are avoidable.", "చాలా ప్రమాదాలు నిర్లక్ష్యం లేదా రోడ్డు భద్రతపై అవగాహన లోపం వల్ల జరుగుతాయి; మనుషుల తప్పిదాల వల్లే కాబట్టి నివారించవచ్చు."], ["Road safety education is considered", "రోడ్డు భద్రతా విద్యను ఇలా భావిస్తారు", ["As essential as any other basic skill of survival", "Useful only for drivers", "Necessary only in cities", "Not needed for children"], ["మనుగడకు అవసరమైన ఇతర ప్రాథమిక నైపుణ్యాల వలె అత్యవసరం", "డ్రైవర్లకు మాత్రమే ఉపయోగం", "నగరాల్లో మాత్రమే అవసరం", "పిల్లలకు అవసరం లేదు"], 0, "Road safety education is as essential as any other basic skill of survival; it helps students make informed, safer decisions in traffic.", "రోడ్డు భద్రతా విద్య ఇతర ప్రాథమిక మనుగడ నైపుణ్యాల వలె అత్యవసరం; ట్రాఫిక్‌లో సురక్షిత నిర్ణయాలు తీసుకోవడానికి సహాయపడుతుంది."], ["A road crash is defined as a crash involving at least one vehicle on a road open to public traffic in which", "రోడ్డు ప్రమాదం అంటే ప్రజా రహదారిపై కనీసం ఒక వాహనంతో జరిగే ప్రమాదం, దీనిలో", ["At least one person is injured or killed and property is damaged", "No one is hurt", "Only animals are involved", "Only parked vehicles are damaged"], ["కనీసం ఒక వ్యక్తి గాయపడటం లేదా మరణించడం, ఆస్తి నష్టం", "ఎవరికీ గాయాలు కావు", "జంతువులు మాత్రమే", "నిలిపిన వాహనాలకు మాత్రమే నష్టం"], 0, "A road crash involves at least one vehicle on a public road in which at least one person is injured or dies and physical property is damaged.", "రోడ్డు ప్రమాదంలో ప్రజా రహదారిపై కనీసం ఒక వాహనం ఉండి, కనీసం ఒకరు గాయపడటం లేదా మరణించడం, ఆస్తి నష్టం జరుగుతాయి."], ["Identify the cause of road accidents that is typical of RURAL areas", "గ్రామీణ ప్రాంతాలకు ప్రత్యేకమైన రోడ్డు ప్రమాద కారణం", ["Drying piles of grain on the roads", "Signal jumping", "Using mobile phone while driving", "Non-adherence to lane driving"], ["రోడ్లపై ధాన్యం రాశులు ఆరబెట్టడం", "సిగ్నల్ జంపింగ్", "డ్రైవింగ్‌లో మొబైల్ వాడటం", "లేన్ డ్రైవింగ్ పాటించకపోవడం"], 0, "Rural causes: animals on roads, tractors with cage wheels, potholes by heavy vehicles, garbage/grass piles, village fairs and markets, drying grain on roads.", "గ్రామీణ కారణాలు: రోడ్లపై పశువులు, కేజ్ వీల్స్ ట్రాక్టర్లు, భారీ వాహనాల వల్ల గుంతలు, చెత్త, గడ్డి కుప్పలు, జాతరలు, సంతలు, రోడ్లపై ధాన్యం ఆరబెట్టడం."], ["Identify the one that is NOT a cause of road accidents in rural areas as per the textbook", "పాఠ్యపుస్తకం ప్రకారం గ్రామీణ ప్రాంతాల్లో రోడ్డు ప్రమాదాలకు కారణం కానిది", ["Leaving buffaloes, goats and sheep on roads", "Using tractors with cage wheels", "Traffic caused by village fairs and markets", "Signal jumping in city junctions"], ["పశువులు, మేకలు, గొర్రెలను రోడ్లపై వదలడం", "కేజ్ వీల్స్ ఉన్న ట్రాక్టర్ల వాడకం", "జాతరలు, సంతల వల్ల రద్దీ", "నగర కూడళ్ళలో సిగ్నల్ జంపింగ్"], 3, "Signal jumping is listed as an urban cause. The other three are rural causes.", "సిగ్నల్ జంపింగ్ పట్టణ కారణం. మిగతా మూడు గ్రామీణ కారణాలు."], ["Identify the group of causes of road accidents in URBAN areas", "పట్టణ ప్రాంతాల్లో రోడ్డు ప్రమాద కారణాల సమూహం", ["Over speed, drunk driving, mobile phone use while driving, signal jumping", "Animals on roads, cage wheels, village fairs", "Drying grain, garbage piles, potholes by proclainers", "Thick fog, melting tar, mud"], ["అతివేగం, మద్యం సేవించి డ్రైవింగ్, డ్రైవింగ్‌లో మొబైల్, సిగ్నల్ జంపింగ్", "రోడ్లపై పశువులు, కేజ్ వీల్స్, జాతరలు", "ధాన్యం ఆరబెట్టడం, చెత్త కుప్పలు, ప్రొక్లెయినర్ గుంతలు", "దట్టమైన పొగమంచు, కరిగే తారు, బురద"], 0, "Urban causes: over speed, reckless driving, drunk driving, mobile use, driver distraction, signal jumping, not wearing seat belts/helmets, wrong overtaking.", "పట్టణ కారణాలు: అతివేగం, నిర్లక్ష్య డ్రైవింగ్, మద్యం సేవించి డ్రైవింగ్, మొబైల్ వాడకం, దృష్టి మళ్ళడం, సిగ్నల్ జంపింగ్, సీట్ బెల్ట్/హెల్మెట్ ధరించకపోవడం, తప్పుగా ఓవర్‌టేక్."], ["Match the seasons with the weather-related reasons for road accidents:\nA. Winter   B. Rainy season   C. Summer\n1. Melting tar causing sudden tyre bursts   2. Potholes and mud causing skidding   3. Thick fog", "రుతువులను వాతావరణ సంబంధిత ప్రమాద కారణాలతో జతపరచండి:\nA. శీతాకాలం   B. వర్షాకాలం   C. వేసవి\n1. తారు కరిగి టైర్లు పేలడం   2. గుంతలు, బురదతో జారడం   3. దట్టమైన పొగమంచు", ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], 0, "Winter – thick fog; rainy season – potholes and mud cause skidding; summer – high temperatures melt tar, causing sudden tyre bursts.", "శీతాకాలం – దట్టమైన పొగమంచు; వర్షాకాలం – గుంతలు, బురదతో జారడం; వేసవి – అధిక ఉష్ణోగ్రతకు తారు కరిగి టైర్లు పేలడం."], ["Identify the one that is NOT a consequence of road accidents", "రోడ్డు ప్రమాదాల పర్యవసానం కానిది", ["Temporary or permanent injury", "Death", "Suffering of the victim's family", "Improvement in the family's income"], ["తాత్కాలిక లేదా శాశ్వత గాయం", "మరణం", "బాధితుని కుటుంబం బాధపడటం", "కుటుంబ ఆదాయం పెరగడం"], 3, "Consequences: temporary or permanent injury, death, suffering of family members, damage or loss of property, orphanage or desertion of family members.", "పర్యవసానాలు: తాత్కాలిక/శాశ్వత గాయం, మరణం, కుటుంబ సభ్యుల బాధ, ఆస్తి నష్టం, కుటుంబ సభ్యులు అనాథలు కావడం."], ["According to the road accident report (2019) given in the textbook, the age group most affected by accidents is", "పాఠ్యపుస్తకంలోని రోడ్డు ప్రమాదాల నివేదిక (2019) ప్రకారం ప్రమాదాలకు ఎక్కువగా గురయ్యే వయో వర్గం", ["25–35 years (26%)", "18–25 years (22%)", "35–45 years (22%)", "Below 18 years"], ["25–35 ఏళ్ళు (26%)", "18–25 ఏళ్ళు (22%)", "35–45 ఏళ్ళు (22%)", "18 ఏళ్ళ లోపు"], 0, "18–25: 22%; 25–35: 26%; 35–45: 22%; others: 30%. The 25–35 age group is the most affected single group — loss of youth affects the country's economy.", "18–25: 22%; 25–35: 26%; 35–45: 22%; ఇతరులు: 30%. 25–35 వర్గం ఎక్కువగా ప్రభావితం — యువత మరణాలు దేశ ఆర్థిక వ్యవస్థను దెబ్బతీస్తాయి."], ["The initial medical support given to accident victims before reaching the hospital is called", "ఆసుపత్రికి చేరకముందే ప్రమాద బాధితులకు ఇచ్చే ప్రాథమిక వైద్య సహాయం", ["First Aid", "Trauma care", "Surgery", "Physiotherapy"], ["ప్రథమ చికిత్స", "ట్రామా కేర్", "శస్త్రచికిత్స", "ఫిజియోథెరపీ"], 0, "First Aid is the initial support before reaching the hospital; Trauma care is the immediate medical care at a medical establishment to crash victims.", "ఆసుపత్రికి ముందు ఇచ్చే సహాయం ప్రథమ చికిత్స; ఆసుపత్రిలో ప్రమాద బాధితులకు ఇచ్చే తక్షణ వైద్యం ట్రామా కేర్."], ["The immediate medical care given at a medical establishment to road crash victims with major and minor injuries is called", "ఆసుపత్రిలో పెద్ద, చిన్న గాయాలైన రోడ్డు ప్రమాద బాధితులకు ఇచ్చే తక్షణ వైద్యం", ["Trauma care", "First Aid", "Kerb drill", "Road safety week"], ["ట్రామా కేర్", "ప్రథమ చికిత్స", "కెర్బ్ డ్రిల్", "రోడ్డు భద్రతా వారోత్సవం"], 0, "Trauma care is the immediate medical care at a medical establishment to road crash victims.", "వైద్య సంస్థలో రోడ్డు ప్రమాద బాధితులకు అందించే తక్షణ వైద్యమే ట్రామా కేర్."], ["A person who regulates traffic and guides people for safe travel on road is", "ట్రాఫిక్‌ను నియంత్రించి ప్రజలను సురక్షిత ప్రయాణానికి మార్గనిర్దేశం చేసేవారు", ["Traffic police", "Village Revenue Officer", "Tahsildar", "Pedestrian"], ["ట్రాఫిక్ పోలీసు", "గ్రామ రెవెన్యూ అధికారి", "తహసీల్దార్", "పాదచారి"], 0, "Traffic police regulate traffic and guide people for safe travel on the road.", "ట్రాఫిక్ పోలీసులు ట్రాఫిక్‌ను నియంత్రించి సురక్షిత ప్రయాణానికి మార్గనిర్దేశం చేస్తారు."], ["Identify the one that is NOT a duty of the traffic police", "ట్రాఫిక్ పోలీసు విధి కానిది", ["Regulating the flow of traffic", "Arranging emergency medical help for accident victims", "Penalising road users who violate rules", "Issuing nativity certificates"], ["ట్రాఫిక్ ప్రవాహాన్ని నియంత్రించడం", "ప్రమాద బాధితులకు అత్యవసర వైద్య సహాయం ఏర్పాటు", "నియమాలు ఉల్లంఘించినవారికి జరిమానా", "నేటివిటీ ధృవపత్రాలు జారీ చేయడం"], 3, "Traffic police create awareness, regulate traffic flow, alert people, arrange emergency medical help and penalise violators. Nativity certificates are issued by revenue officials.", "ట్రాఫిక్ పోలీసులు అవగాహన కల్పించడం, ట్రాఫిక్ నియంత్రణ, హెచ్చరికలు, అత్యవసర వైద్య సహాయం, ఉల్లంఘనదారులకు జరిమానా విధిస్తారు. నేటివిటీ ధృవపత్రాలు రెవెన్యూ అధికారులు ఇస్తారు."], ["The device used to identify drivers who have consumed alcohol is the", "మద్యం సేవించిన డ్రైవర్లను గుర్తించడానికి వాడే పరికరం", ["Breath analyser", "Speed gun camera", "Thermometer", "Barometer"], ["బ్రీత్ ఎనలైజర్", "స్పీడ్ గన్ కెమెరా", "థర్మామీటర్", "బారోమీటర్"], 0, "A breath analyser identifies alcoholic drivers; a speed gun camera measures vehicle speed during violations.", "బ్రీత్ ఎనలైజర్ మద్యం సేవించిన డ్రైవర్లను గుర్తిస్తుంది; స్పీడ్ గన్ కెమెరా ఉల్లంఘన సమయంలో వాహన వేగాన్ని కొలుస్తుంది."], ["A device that measures the speed of a vehicle during violation of road safety rules is the", "రోడ్డు భద్రతా నియమ ఉల్లంఘన సమయంలో వాహన వేగాన్ని కొలిచే పరికరం", ["Speed gun camera", "Breath analyser", "Odometer only", "Traffic signal"], ["స్పీడ్ గన్ కెమెరా", "బ్రీత్ ఎనలైజర్", "ఓడోమీటర్ మాత్రమే", "ట్రాఫిక్ సిగ్నల్"], 0, "A speed gun camera measures the speed of a vehicle during violation of road safety rules.", "స్పీడ్ గన్ కెమెరా నియమ ఉల్లంఘన సమయంలో వాహన వేగాన్ని కొలుస్తుంది."], ["Traffic signs are divided into three types. They are", "ట్రాఫిక్ గుర్తులు మూడు రకాలు. అవి", ["Mandatory, Information and Cautionary signs", "Red, Orange and Green signs", "Footpath, Divider and Zebra signs", "Rural, Urban and Highway signs"], ["తప్పనిసరి, సమాచార, హెచ్చరిక గుర్తులు", "ఎరుపు, నారింజ, ఆకుపచ్చ గుర్తులు", "ఫుట్‌పాత్, డివైడర్, జీబ్రా గుర్తులు", "గ్రామీణ, పట్టణ, హైవే గుర్తులు"], 0, "Traffic signs are of three types: Mandatory signs, Information signs and Cautionary signs.", "ట్రాఫిక్ గుర్తులు మూడు రకాలు: తప్పనిసరి (ఆదేశ) గుర్తులు, సమాచార గుర్తులు, హెచ్చరిక గుర్తులు."], ["'Horn Prohibited', 'Pedestrians Prohibited' and 'Overtaking Prohibited' are examples of", "'హారన్ నిషేధం', 'పాదచారులు నిషేధం', 'ఓవర్‌టేకింగ్ నిషేధం' వీటికి ఉదాహరణలు", ["Mandatory signs", "Information signs", "Cautionary signs", "Road marking signs"], ["తప్పనిసరి (ఆదేశ) గుర్తులు", "సమాచార గుర్తులు", "హెచ్చరిక గుర్తులు", "రోడ్డు మార్కింగ్ గుర్తులు"], 0, "Prohibition signs like Horn Prohibited, Pedestrians Prohibited and Overtaking Prohibited are mandatory signs — they must be obeyed.", "హారన్ నిషేధం, పాదచారులు నిషేధం, ఓవర్‌టేకింగ్ నిషేధం వంటివి తప్పనిసరి గుర్తులు — తప్పక పాటించాలి."], ["'First Aid Post', 'Hospital', 'Bus Stop' and 'Public Telephone' signs are examples of", "'ప్రథమ చికిత్స కేంద్రం', 'ఆసుపత్రి', 'బస్ స్టాప్', 'పబ్లిక్ టెలిఫోన్' గుర్తులు వీటికి ఉదాహరణలు", ["Information signs", "Mandatory signs", "Cautionary signs", "Road marking signs"], ["సమాచార గుర్తులు", "తప్పనిసరి గుర్తులు", "హెచ్చరిక గుర్తులు", "రోడ్డు మార్కింగ్ గుర్తులు"], 0, "Pedestrian subway, first aid post, hospital, bus stop and public telephone are information signs.", "పాదచారుల సబ్‌వే, ప్రథమ చికిత్స కేంద్రం, ఆసుపత్రి, బస్ స్టాప్, పబ్లిక్ టెలిఫోన్ — సమాచార గుర్తులు."], ["'School Zone', 'Railway Crossing', 'Narrow Bridge' and 'Signal Ahead' signs are examples of", "'పాఠశాల ప్రాంతం', 'రైల్వే క్రాసింగ్', 'ఇరుకు వంతెన', 'ముందు సిగ్నల్' గుర్తులు వీటికి ఉదాహరణలు", ["Cautionary signs", "Information signs", "Mandatory signs", "Road marking signs"], ["హెచ్చరిక గుర్తులు", "సమాచార గుర్తులు", "తప్పనిసరి గుర్తులు", "రోడ్డు మార్కింగ్ గుర్తులు"], 0, "Pedestrian crossing, school zone, railway crossing, signal ahead and narrow bridge are cautionary signs — they warn road users.", "పాదచారుల క్రాసింగ్, పాఠశాల ప్రాంతం, రైల్వే క్రాసింగ్, ముందు సిగ్నల్, ఇరుకు వంతెన — హెచ్చరిక గుర్తులు."], ["Identify the sign that is NOT an Information sign", "సమాచార గుర్తు కానిది", ["Hospital", "Bus stop", "Pedestrian subway", "Overtaking prohibited"], ["ఆసుపత్రి", "బస్ స్టాప్", "పాదచారుల సబ్‌వే", "ఓవర్‌టేకింగ్ నిషేధం"], 3, "'Overtaking prohibited' is a mandatory sign; the others are information signs.", "'ఓవర్‌టేకింగ్ నిషేధం' తప్పనిసరి గుర్తు; మిగతావి సమాచార గుర్తులు."], ["Match the traffic signs with their types:\nA. Horn prohibited   B. First aid post   C. Railway crossing\n1. Cautionary sign   2. Information sign   3. Mandatory sign", "ట్రాఫిక్ గుర్తులను వాటి రకాలతో జతపరచండి:\nA. హారన్ నిషేధం   B. ప్రథమ చికిత్స కేంద్రం   C. రైల్వే క్రాసింగ్\n1. హెచ్చరిక గుర్తు   2. సమాచార గుర్తు   3. తప్పనిసరి గుర్తు", ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], 0, "Horn prohibited – mandatory; First aid post – information; Railway crossing – cautionary.", "హారన్ నిషేధం – తప్పనిసరి; ప్రథమ చికిత్స కేంద్రం – సమాచార; రైల్వే క్రాసింగ్ – హెచ్చరిక."], ["Road Safety Week is organised every year in the month of ____ by the ____", "రోడ్డు భద్రతా వారోత్సవాన్ని ప్రతి సంవత్సరం ____ నెలలో ____ నిర్వహిస్తుంది", ["January; Ministry of Road Transport and Highways", "August; Election Commission", "November; Ministry of Education", "June; Ministry of Health"], ["జనవరి; కేంద్ర రోడ్డు రవాణా, రహదారుల మంత్రిత్వ శాఖ", "ఆగస్టు; ఎన్నికల సంఘం", "నవంబర్; విద్యా మంత్రిత్వ శాఖ", "జూన్; ఆరోగ్య మంత్రిత్వ శాఖ"], 0, "Road Safety Week is organised every January by the Ministry of Road Transport and Highways to educate people on road safety and reduce casualties.", "రోడ్డు భద్రతా వారోత్సవాన్ని ప్రతి జనవరిలో కేంద్ర రోడ్డు రవాణా, రహదారుల మంత్రిత్వ శాఖ నిర్వహిస్తుంది."], ["Footpath, road divider and zebra crossing are considered as", "ఫుట్‌పాత్, రోడ్ డివైడర్, జీబ్రా క్రాసింగ్‌లను ఇలా పరిగణిస్తారు", ["Road marking signs", "Mandatory signs", "Information signs", "Cautionary signs"], ["రోడ్డు మార్కింగ్ గుర్తులు", "తప్పనిసరి గుర్తులు", "సమాచార గుర్తులు", "హెచ్చరిక గుర్తులు"], 0, "Footpath, road divider and zebra crossing are road marking signs — lines and designs painted or built with cement blocks on the road for smooth movement of traffic.", "ఫుట్‌పాత్, డివైడర్, జీబ్రా క్రాసింగ్ రోడ్డు మార్కింగ్ గుర్తులు — సాఫీ ట్రాఫిక్ కోసం రోడ్డుపై వేసిన గీతలు, సిమెంట్ బ్లాకులు."], ["Find out the odd one", "భిన్నమైనదాన్ని గుర్తించండి", ["Footpath", "Bridge", "Divider", "Zebra crossing"], ["ఫుట్‌పాత్", "వంతెన", "డివైడర్", "జీబ్రా క్రాసింగ్"], 1, "Footpath, divider and zebra crossing are road marking signs; a bridge is not. (Textbook exercise.)", "ఫుట్‌పాత్, డివైడర్, జీబ్రా క్రాసింగ్ రోడ్డు మార్కింగ్ గుర్తులు; వంతెన కాదు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The main purpose of a road divider is to", "రోడ్ డివైడర్ ప్రధాన ఉద్దేశం", ["Prevent traffic chaos and road crashes", "Help pedestrians walk", "Park vehicles", "Decorate the road"], ["ట్రాఫిక్ గందరగోళం, ప్రమాదాలను నివారించడం", "పాదచారులు నడవడానికి", "వాహనాలు నిలపడానికి", "రోడ్డును అలంకరించడానికి"], 0, "A road divider, built with cement blocks or painted, separates the road into two or more parts to prevent traffic chaos and crashes.", "సిమెంట్ బ్లాకులతో లేదా రంగుతో వేసిన డివైడర్ రోడ్డును రెండు లేదా ఎక్కువ భాగాలుగా విభజించి గందరగోళం, ప్రమాదాలను నివారిస్తుంది."], ["A part of the road laid on both sides, separated by painted lines or cement blocks and meant for pedestrians to walk, is the", "రోడ్డుకు రెండువైపులా, గీతలు లేదా సిమెంట్ బ్లాకులతో వేరుచేసి పాదచారులు నడవడానికి ఉద్దేశించిన భాగం", ["Footpath", "Road divider", "Zebra crossing", "Cycle track"], ["ఫుట్‌పాత్", "రోడ్ డివైడర్", "జీబ్రా క్రాసింగ్", "సైకిల్ ట్రాక్"], 0, "A footpath is meant for pedestrians; it is laid on both sides of the road.", "ఫుట్‌పాత్ పాదచారుల కోసం; రోడ్డుకు రెండువైపులా ఉంటుంది."], ["A person who travels on foot is called a", "కాలినడకన ప్రయాణించే వ్యక్తిని ఇలా అంటారు", ["Pedestrian", "Passenger", "Driver", "Cyclist"], ["పాదచారి", "ప్రయాణికుడు", "డ్రైవర్", "సైకిలిస్ట్"], 0, "A pedestrian is a person who travels on foot, i.e., uses the road/footpath on foot.", "కాలినడకన రోడ్డు/ఫుట్‌పాత్ వాడే వ్యక్తి పాదచారి."], ["If there is no footpath, a pedestrian should", "ఫుట్‌పాత్ లేకపోతే పాదచారి", ["Walk in single file on the extreme edge of the road facing oncoming vehicles", "Walk in the middle of the road", "Walk in groups side by side", "Walk with the traffic, back to oncoming vehicles"], ["ఎదురుగా వచ్చే వాహనాలను చూస్తూ రోడ్డు చివరన ఒక్కొక్కరుగా వరుసలో నడవాలి", "రోడ్
