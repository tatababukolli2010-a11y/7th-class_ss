అంచనా వేయడానికి సహాయపడతాయి", ["Climate and local time", "Population", "Language", "Crops only"], ["శీతోష్ణస్థితి, స్థానిక సమయం", "జనాభా", "భాష", "పంటలు మాత్రమే"], 0, "Latitudes and longitudes provide basic information to identify a location and are also useful to guess the climate and local time of a place.", "అక్షాంశ, రేఖాంశాలు స్థానాన్ని గుర్తించడానికి, శీతోష్ణస్థితి, స్థానిక సమయం అంచనా వేయడానికి ఉపయోగపడతాయి."], ["The network of latitudes and longitudes that helps to know the exact location of a place is called a", "ఒక ప్రదేశపు ఖచ్చితమైన స్థానం తెలుసుకోవడానికి సహాయపడే అక్షాంశ, రేఖాంశాల జాలాన్ని ఇలా అంటారు", ["Grid", "Legend", "Contour", "Projection"], ["జాలకం (గ్రిడ్)", "సూచిక", "సమోన్నత రేఖ", "ప్రక్షేపణ"], 0, "A grid is the network of latitudes and longitudes; to read it, latitude is observed first and then longitude.", "అక్షాంశ, రేఖాంశాల జాలమే గ్రిడ్; దీనిని చదివేటప్పుడు మొదట అక్షాంశం, తర్వాత రేఖాంశం చూడాలి."], ["While reading information in a grid, we observe", "గ్రిడ్‌లో సమాచారం చదివేటప్పుడు మనం చూసేది", ["Latitude first and then longitude", "Longitude first and then latitude", "Only the title", "Only the colours"], ["మొదట అక్షాంశం, తర్వాత రేఖాంశం", "మొదట రేఖాంశం, తర్వాత అక్షాంశం", "శీర్షిక మాత్రమే", "రంగులు మాత్రమే"], 0, "To read the information in a grid, latitude is observed first and then longitude.", "గ్రిడ్‌ను చదివేటప్పుడు మొదట అక్షాంశం, తర్వాత రేఖాంశం చూడాలి."], ["Maps are classified on the basis of", "పటాలను వర్గీకరించే ఆధారాలు", ["Scale, theme and content", "Colour only", "Size of paper", "Language"], ["స్కేలు, విషయం, అంశాలు", "రంగు మాత్రమే", "కాగితం పరిమాణం", "భాష"], 0, "Maps are classified on the basis of scale, theme and content: Political, Physical, Thematic and Historical maps.", "పటాలను స్కేలు, విషయం, అంశాల ఆధారంగా వర్గీకరిస్తారు: రాజకీయ, భౌతిక, విషయ నిర్దేశిత, చారిత్రక పటాలు."], ["A map showing administrative units, neighbouring countries, boundaries and capitals is a", "పరిపాలనా విభాగాలు, పొరుగు దేశాలు, సరిహద్దులు, రాజధానులను చూపే పటం", ["Political map", "Physical map", "Thematic map", "Historical map"], ["రాజకీయ పటం", "భౌతిక పటం", "విషయ నిర్దేశిత పటం", "చారిత్రక పటం"], 0, "A political map shows administrative units, neighbouring countries, boundaries, capitals etc.", "రాజకీయ పటం పరిపాలనా విభాగాలు, పొరుగు దేశాలు, సరిహద్దులు, రాజధానులను చూపుతుంది."], ["Which statement about colours in a political map is correct?", "రాజకీయ పటంలో రంగుల గురించి సరైన వాక్యం", ["There is no significance for colours used in a political map", "Green always shows plains", "Blue always shows states", "Brown shows capitals"], ["రాజకీయ పటంలో వాడిన రంగులకు ప్రత్యేక అర్థం లేదు", "ఆకుపచ్చ ఎప్పుడూ మైదానాలను చూపుతుంది", "నీలం ఎప్పుడూ రాష్ట్రాలను చూపుతుంది", "గోధుమ రాజధానులను చూపుతుంది"], 0, "In a political map, the thickness, colour and pattern of boundary lines show the type of region; there is no significance for the colours used.", "రాజకీయ పటంలో సరిహద్దు రేఖల మందం, రంగు, నమూనా ప్రాంత రకాన్ని తెలుపుతాయి; రంగులకు ప్రత్యేక అర్థం లేదు."], ["In terms of area, India is the ____ largest country in the world with an area of 3.28 million sq. km", "3.28 మిలియన్ చ.కి.మీ. విస్తీర్ణంతో భారతదేశం ప్రపంచంలో ____ పెద్ద దేశం", ["Second", "Fifth", "Seventh", "Tenth"], ["రెండవ", "ఐదవ", "ఏడవ", "పదవ"], 2, "India is the seventh largest country in the world with an area of 3.28 million sq. km; it has 28 states and 8 Union Territories.", "భారత్ 3.28 మిలియన్ చ.కి.మీ. విస్తీర్ణంతో ప్రపంచంలో ఏడవ పెద్ద దేశం; 28 రాష్ట్రాలు, 8 కేంద్రపాలిత ప్రాంతాలు ఉన్నాయి."], ["India has", "భారతదేశంలో ఉన్నవి", ["28 States and 8 Union Territories", "29 States and 7 Union Territories", "28 States and 9 Union Territories", "25 States and 7 Union Territories"], ["28 రాష్ట్రాలు, 8 కేంద్రపాలిత ప్రాంతాలు", "29 రాష్ట్రాలు, 7 కేంద్రపాలిత ప్రాంతాలు", "28 రాష్ట్రాలు, 9 కేంద్రపాలిత ప్రాంతాలు", "25 రాష్ట్రాలు, 7 కేంద్రపాలిత ప్రాంతాలు"], 0, "India has 28 States and 8 Union Territories. A Union Territory is governed by the Central government.", "భారతదేశంలో 28 రాష్ట్రాలు, 8 కేంద్రపాలిత ప్రాంతాలు ఉన్నాయి. కేంద్రపాలిత ప్రాంతాన్ని కేంద్ర ప్రభుత్వం పాలిస్తుంది."], ["India is located between the northern latitudes of ____ and the eastern longitudes of ____", "భారతదేశం ఉన్న ఉత్తర అక్షాంశాలు ____, తూర్పు రేఖాంశాలు ____", ["8°4′ – 37°6′ N; 68°7′ – 97°25′ E", "0° – 23½° N; 68° – 97° E", "23½° – 66½° N; 60° – 90° E", "8° – 20° N; 70° – 80° E"], ["8°4′ – 37°6′ ఉ; 68°7′ – 97°25′ తూ", "0° – 23½° ఉ; 68° – 97° తూ", "23½° – 66½° ఉ; 60° – 90° తూ", "8° – 20° ఉ; 70° – 80° తూ"], 0, "India lies between 8°4′ and 37°6′ N latitudes and 68°7′ and 97°25′ E longitudes, in the southern part of Asia.", "భారత్ 8°4′–37°6′ ఉత్తర అక్షాంశాలు, 68°7′–97°25′ తూర్పు రేఖాంశాల మధ్య, ఆసియా దక్షిణ భాగంలో ఉంది."], ["The important latitude that runs halfway through India is the", "భారతదేశం మధ్య గుండా వెళ్ళే ముఖ్య అక్షాంశం", ["Equator", "Tropic of Cancer", "Tropic of Capricorn", "Arctic Circle"], ["భూమధ్యరేఖ", "కర్కట రేఖ", "మకర రేఖ", "ఆర్కిటిక్ వలయం"], 1, "The Tropic of Cancer (23½° N) runs halfway through India.", "కర్కట రేఖ (23½° ఉ) భారతదేశం మధ్య గుండా వెళ్తుంది."], ["The state of India closest to the Equator is", "భూమధ్యరేఖకు అతి దగ్గరగా ఉన్న భారత రాష్ట్రం", ["Kerala", "Tamil Nadu", "Andhra Pradesh", "Goa"], ["కేరళ", "తమిళనాడు", "ఆంధ్రప్రదేశ్", "గోవా"], 1, "Tamil Nadu (Kanyakumari, about 8°4′ N) is the state closest to the Equator. (The southernmost point of India, Indira Point, is in the Andaman & Nicobar UT.)", "తమిళనాడు (కన్యాకుమారి, సుమారు 8°4′ ఉ) భూమధ్యరేఖకు అతి దగ్గరి రాష్ట్రం. (భారత దక్షిణ కొన ఇందిరా పాయింట్ అండమాన్ కేంద్రపాలిత ప్రాంతంలో ఉంది.)"], ["A map showing mountain ranges, hills, plateaus, plains, rivers, deserts and lakes is a", "పర్వత శ్రేణులు, కొండలు, పీఠభూములు, మైదానాలు, నదులు, ఎడారులు, సరస్సులను చూపే పటం", ["Physical map", "Political map", "Historical map", "Population map"], ["భౌతిక పటం", "రాజకీయ పటం", "చారిత్రక పటం", "జనాభా పటం"], 0, "A physical map shows physical features like mountain ranges, hills, plateaus, plains, rivers, deserts, lakes and highlands.", "భౌతిక పటం పర్వత శ్రేణులు, కొండలు, పీఠభూములు, మైదానాలు, నదులు, ఎడారులు, సరస్సుల వంటి భౌతిక స్వరూపాలను చూపుతుంది."], ["Match the colours in the physical map of India with what they show:\nA. Green   B. Orange to brown   C. White   D. Blue\n1. Water bodies   2. Snow-capped Himalayas   3. Hills, highlands, plateaus   4. Plains", "భారత భౌతిక పటంలోని రంగులను అవి చూపే వాటితో జతపరచండి:\nA. ఆకుపచ్చ   B. నారింజ నుండి గోధుమ   C. తెలుపు   D. నీలం\n1. జలాశయాలు   2. మంచుతో కప్పిన హిమాలయాలు   3. కొండలు, ఎత్తైన ప్రాంతాలు, పీఠభూములు   4. మైదానాలు", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Green – plains; orange to brown – hilly regions, highlands, plateaus; violet – higher elevations; white – snow-capped Himalayas; blue – water bodies.", "ఆకుపచ్చ – మైదానాలు; నారింజ–గోధుమ – కొండలు, ఎత్తైన ప్రాంతాలు, పీఠభూములు; ఊదా – ఇంకా ఎత్తైనవి; తెలుపు – మంచుతో కప్పిన హిమాలయాలు; నీలం – జలాశయాలు."], ["Imaginary lines that connect places of equal height are called", "సమాన ఎత్తు గల ప్రదేశాలను కలిపే ఊహా రేఖలను ఇలా అంటారు", ["Contour lines", "Latitudes", "Longitudes", "Isobars"], ["సమోన్నత రేఖలు (కాంటూర్ లైన్స్)", "అక్షాంశాలు", "రేఖాంశాలు", "సమభార రేఖలు"], 0, "Contour lines connect places of equal height and illustrate the topography of a place; the distance between two lines shows the difference in elevation.", "సమాన ఎత్తు గల ప్రదేశాలను కలిపే రేఖలు సమోన్నత రేఖలు; ఇవి ప్రదేశపు స్థలాకృతిని చూపుతాయి."], ["The potato activity in the textbook (cutting a potato into slices and drawing lines) helps students understand", "బంగాళదుంపను ముక్కలుగా కోసి గీతలు గీసే పాఠ్యపుస్తక కృత్యం విద్యార్థులకు అర్థం చేయించేది", ["How contour lines change a 3-D landform into a 2-D map", "How to cook potatoes", "Types of soils", "Latitudes"], ["సమోన్నత రేఖలు త్రిమితీయ భూస్వరూపాన్ని ద్విమితీయ పటంగా ఎలా మారుస్తాయో", "బంగాళదుంపలు వండటం", "నేలల రకాలు", "అక్షాంశాలు"], 0, "The potato activity shows the transformation of a three-dimensional concept (length, breadth, height) into a two-dimensional one using contour lines.", "బంగాళదుంప కృత్యం సమోన్నత రేఖల ద్వారా త్రిమితీయ (పొడవు, వెడల్పు, ఎత్తు) భావనను ద్విమితీయంగా మార్చడాన్ని చూపుతుంది."], ["Maps prepared for a special purpose or theme, like natural vegetation, soils, population and climate maps, are", "సహజ వృక్షసంపద, నేలలు, జనాభా, శీతోష్ణస్థితి వంటి ప్రత్యేక ఉద్దేశం లేదా అంశం కోసం తయారు చేసే పటాలు", ["Thematic maps", "Political maps", "Physical maps", "Historical maps"], ["విషయ నిర్దేశిత (థిమాటిక్) పటాలు", "రాజకీయ పటాలు", "భౌతిక పటాలు", "చారిత్రక పటాలు"], 0, "Thematic maps are prepared for a special purpose or theme, e.g., natural vegetation, soils, population and climatic maps; they show population data, minerals, migration etc.", "ప్రత్యేక అంశం కోసం తయారు చేసే పటాలు థిమాటిక్ పటాలు; ఉదా: వృక్షసంపద, నేలలు, జనాభా, శీతోష్ణస్థితి పటాలు."], ["'Andhra Pradesh – Soils' (Map 3.7) and 'Temperature map of India' (Map 3.8) are examples of", "'ఆంధ్రప్రదేశ్ – నేలలు' (పటం 3.7), 'భారత ఉష్ణోగ్రత పటం' (పటం 3.8) దీనికి ఉదాహరణలు", ["Thematic maps", "Political maps", "Historical maps", "Toposheets only"], ["థిమాటిక్ పటాలు", "రాజకీయ పటాలు", "చారిత్రక పటాలు", "టోపోషీట్లు మాత్రమే"], 0, "Soil and temperature maps show a single theme, so they are thematic maps.", "నేలలు, ఉష్ణోగ్రత పటాలు ఒకే అంశాన్ని చూపుతాయి కాబట్టి థిమాటిక్ పటాలు."], ["Maps showing detailed information of a place like relief, agricultural lands, soils, rivers and settlements using conventional symbols are", "సాంప్రదాయ చిహ్నాలతో ఒక ప్రదేశపు నిమ్నోన్నతాలు, వ్యవసాయ భూములు, నేలలు, నదులు, నివాసాల వివరాలను చూపే పటాలు", ["Topographical maps (toposheets)", "World political maps", "Historical maps", "Climatic maps"], ["స్థలాకృతి పటాలు (టోపోషీట్లు)", "ప్రపంచ రాజకీయ పటాలు", "చారిత్రక పటాలు", "శీతోష్ణ పటాలు"], 0, "Topographical maps show detailed information of a place — relief, topography, agricultural lands, soils, rivers, settlements — using conventional symbols.", "స్థలాకృతి పటాలు సాంప్రదాయ చిహ్నాలతో ఒక ప్రదేశపు నిమ్నోన్నతాలు, వ్యవసాయ భూములు, నేలలు, నదులు, నివాసాల వివరాలను చూపుతాయి."], ["Maps that show historical details of a particular past period, like the extent of a dynasty and trade routes, are", "ఒక గత కాలపు రాజవంశ విస్తీర్ణం, వ్యాపార మార్గాల వంటి చారిత్రక వివరాలను చూపే పటాలు", ["Historical maps", "Physical maps", "Thematic soil maps", "Contour maps"], ["చారిత్రక పటాలు", "భౌతిక పటాలు", "నేలల పటాలు", "సమోన్నత పటాలు"], 0, "Historical maps show the details of a particular past period — extent of a region, important places, trade routes and socio-cultural relations.", "చారిత్రక పటాలు ఒక గత కాలపు ప్రాంత విస్తీర్ణం, ముఖ్య ప్రదేశాలు, వ్యాపార మార్గాలు, సామాజిక–సాంస్కృతిక సంబంధాలను చూపుతాయి."], ["The 'Edicts of Ashoka' map (Map 3.9) is an example of a", "'అశోకుని శాసనాలు' పటం (పటం 3.9) దీనికి ఉదాహరణ", ["Historical map", "Physical map", "Population map", "Political map of today"], ["చారిత్రక పటం", "భౌతిక పటం", "జనాభా పటం", "నేటి రాజకీయ పటం"], 0, "The map of Ashoka's edicts (and 'Map of Ashoka's Empire') shows a past period, so it is a historical map.", "అశోకుని శాసనాల పటం గత కాలాన్ని చూపుతుంది కాబట్టి అది చారిత్రక పటం."], ["Find the correct sentence", "సరైన వాక్యాన్ని గుర్తించండి", ["River Ganga originates in the Himalayas", "River Cauvery flows in West Bengal", "River Krishna drains into the Arabian Sea", "River Penna flows in Maharashtra"], ["గంగా నది హిమాలయాల్లో పుడుతుంది", "కావేరి నది పశ్చిమ బెంగాల్‌లో ప్రవహిస్తుంది", "కృష్ణా నది అరేబియా సముద్రంలో కలుస్తుంది", "పెన్నా నది మహారాష్ట్రలో ప్రవహిస్తుంది"], 0, "The Ganga originates in the Himalayas. Cauvery flows in Karnataka and Tamil Nadu; Krishna joins the Bay of Bengal; Penna flows in Karnataka and AP. (Textbook exercise.)", "గంగా హిమాలయాల్లో పుడుతుంది. కావేరి కర్ణాటక, తమిళనాడులో; కృష్ణా బంగాళాఖాతంలో కలుస్తుంది; పెన్నా కర్ణాటక, ఏపీలో ప్రవహిస్తుంది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Identify the odd one regarding the location (origin) of rivers", "నదుల స్థానం (జన్మస్థలం) దృష్ట్యా వేరుగా ఉన్నదాన్ని గుర్తించండి", ["Krishna", "Penna", "Brahmaputra", "Cauvery"], ["కృష్ణా", "పెన్నా", "బ్రహ్మపుత్ర", "కావేరి"], 2, "Krishna, Penna and Cauvery are peninsular rivers; the Brahmaputra is a Himalayan river. (Textbook exercise.)", "కృష్ణా, పెన్నా, కావేరి ద్వీపకల్ప నదులు; బ్రహ్మపుత్ర హిమాలయ నది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Read the statements:\na) Kerala is on the west coast.\nb) Arunachal Pradesh has a border with Pakistan.", "వాక్యాలు చదవండి:\na) కేరళ పశ్చిమ తీరంలో ఉంది.\nb) అరుణాచల్ ప్రదేశ్‌కు పాకిస్తాన్‌తో సరిహద్దు ఉంది.", ["'a' is true; 'b' is false", "'a' is false; 'b' is true", "Both 'a' and 'b' are false", "Both are true"], ["'a' నిజం; 'b' తప్పు", "'a' తప్పు; 'b' నిజం", "'a', 'b' రెండూ తప్పు", "రెండూ నిజం"], 0, "Kerala is on the west coast (true). Arunachal Pradesh borders China, Bhutan and Myanmar, not Pakistan (false). (Textbook exercise.)", "కేరళ పశ్చిమ తీరంలో ఉంది (నిజం). అరుణాచల్ ప్రదేశ్‌కు చైనా, భూటాన్, మయన్మార్‌లతో సరిహద్దు ఉంది, పాకిస్తాన్‌తో కాదు (తప్పు). (పాఠ్యపుస్తక అభ్యాసం.)"], ["Identify the mismatched pair (State capital – State)", "సరిగా జతపరచని జతను గుర్తించండి (రాజధాని – రాష్ట్రం)", ["Chennai – Tamil Nadu", "Bhopal – Gujarat", "Jaipur – Rajasthan", "Thiruvananthapuram – Kerala"], ["చెన్నై – తమిళనాడు", "భోపాల్ – గుజరాత్", "జైపూర్ – రాజస్థాన్", "తిరువనంతపురం – కేరళ"], 1, "Bhopal is the capital of Madhya Pradesh; the capital of Gujarat is Gandhinagar. (Textbook exercise.)", "భోపాల్ మధ్యప్రదేశ్ రాజధాని; గుజరాత్ రాజధాని గాంధీనగర్. (పాఠ్యపుస్తక అభ్యాసం.)"], ["India lies in the Eastern Hemisphere because its longitudes are", "భారతదేశం తూర్పు అర్ధగోళంలో ఉండటానికి కారణం దాని రేఖాంశాలు", ["East of the Prime Meridian (68°7′ E – 97°25′ E)", "West of the Prime Meridian", "Between 0° and 10° W", "On the International Date Line"], ["ప్రధాన రేఖాంశానికి తూర్పున (68°7′ తూ – 97°25′ తూ)", "ప్రధాన రేఖాంశానికి పడమర", "0°–10° ప మధ్య", "అంతర్జాతీయ దినరేఖపై"], 0, "India lies between 68°7′ E and 97°25′ E longitudes — east of the Prime Meridian — so it is in the Eastern Hemisphere.", "భారత్ 68°7′ తూ – 97°25′ తూ రేఖాంశాల మధ్య, ప్రధాన రేఖాంశానికి తూర్పున ఉంది; కాబట్టి తూర్పు అర్ధగోళంలో ఉంది."], ["A teacher asks students to prepare a self-made atlas by tracing maps of continents, India and Andhra Pradesh. This mainly develops", "ఖండాలు, భారత్, ఆంధ్రప్రదేశ్ పటాలను ట్రేస్ చేసి స్వంత అట్లాస్ తయారు చేయమని ఉపాధ్యాయుడు అడిగాడు. ఇది ప్రధానంగా పెంపొందించేది", ["Map-drawing skill", "Rote memory", "Reading speed only", "Physical fitness"], ["పట నిర్మాణ నైపుణ్యం", "బట్టీ జ్ఞాపకం", "పఠన వేగం మాత్రమే", "శారీరక దారుఢ్యం"], 0, "Tracing and drawing maps (a project in the chapter) develops the map-drawing skill — the 'Skill' objective in Social Studies.", "పటాలు ట్రేస్ చేయడం, గీయడం (పాఠంలోని ప్రాజెక్టు) పట నిర్మాణ నైపుణ్యాన్ని పెంచుతుంది — సాంఘిక శాస్త్రంలో 'నైపుణ్యం' లక్ష్యం."]]}, {"n": 4, "en": "Delhi Sultanate", "te": "ఢిల్లీ సుల్తానుల రాజ్యం", "c": "#0ea5a4", "q": [["The Delhi Sultans made Delhi the capital of their empire and ruled from", "ఢిల్లీ సుల్తానులు ఢిల్లీని రాజధానిగా చేసుకుని పాలించిన కాలం", ["13th to 16th century CE", "8th to 10th century CE", "16th to 18th century CE", "3rd to 6th century CE"], ["క్రీ.శ. 13వ – 16వ శతాబ్దం", "క్రీ.శ. 8వ – 10వ శతాబ్దం", "క్రీ.శ. 16వ – 18వ శతాబ్దం", "క్రీ.శ. 3వ – 6వ శతాబ్దం"], 0, "The Delhi Sultans ruled from the 13th century CE to the 16th century CE (1206–1526 CE).", "ఢిల్లీ సుల్తానులు క్రీ.శ. 13వ శతాబ్దం నుండి 16వ శతాబ్దం వరకు (1206–1526) పాలించారు."], ["History is considered as", "చరిత్రను ఇలా పరిగణిస్తారు", ["The record of past factual events", "Imaginary stories", "A study of rocks", "A study of planets"], ["గత వాస్తవ సంఘటనల నమోదు", "ఊహా కథలు", "శిలల అధ్యయనం", "గ్రహాల అధ్యయనం"], 0, "History is the record of past factual events; it reveals how people lived, in chronological order, gives moral understanding and a sense of identity, and is essential for good citizenship.", "చరిత్ర గత వాస్తవ సంఘటనల నమోదు; ప్రజలు ఎలా జీవించారో కాలక్రమంలో తెలుపుతుంది; నైతిక అవగాహన, గుర్తింపు భావన ఇస్తుంది; మంచి పౌరసత్వానికి అవసరం."], ["The sources of history are broadly classified into", "చరిత్ర ఆధారాలను స్థూలంగా ఇలా వర్గీకరిస్తారు", ["Archaeological and Literary sources", "Political and Physical sources", "Primary and Tertiary maps", "Oral and Digital sources only"], ["పురావస్తు, సాహిత్య ఆధారాలు", "రాజకీయ, భౌతిక ఆధారాలు", "ప్రాథమిక, తృతీయ పటాలు", "మౌఖిక, డిజిటల్ ఆధారాలు మాత్రమే"], 0, "Sources are classified into Archaeological sources (material remains) and Literary sources (all texts).", "చరిత్ర ఆధారాలు రెండు రకాలు: పురావస్తు ఆధారాలు (భౌతిక అవశేషాలు), సాహిత్య ఆధారాలు (అన్ని గ్రంథాలు)."], ["Identify the one that is a LITERARY source of history", "కింది వాటిలో చరిత్రకు సాహిత్య ఆధారం", ["Pottery", "Rock edicts", "Accounts by foreign travellers", "Metal pillars"], ["కుండలు", "శిలా శాసనాలు", "విదేశీ యాత్రికుల రచనలు", "లోహ స్తంభాలు"], 2, "Literary sources: epics and poems, accounts by foreign travellers, works by Indian authors, folk art. Pottery, rock edicts, temple walls and metal pillars are archaeological sources.", "సాహిత్య ఆధారాలు: ఇతిహాసాలు, కావ్యాలు, విదేశీ యాత్రికుల రచనలు, భారతీయ రచయితల గ్రంథాలు, జానపద కళలు. కుండలు, శిలా శాసనాలు, లోహ స్తంభాలు పురావస్తు ఆధారాలు."], ["According to the textbook, Medieval History in India covers the period", "పాఠ్యపుస్తకం ప్రకారం భారతదేశంలో మధ్యయుగ చరిత్ర కాలం", ["Up to 8th century CE", "8th to 18th century CE", "18th century CE onwards", "1st to 5th century CE"], ["క్రీ.శ. 8వ శతాబ్దం వరకు", "క్రీ.శ. 8వ – 18వ శతాబ్దం", "క్రీ.శ. 18వ శతాబ్దం నుండి", "క్రీ.శ. 1వ – 5వ శతాబ్దం"], 1, "Ancient History: up to 8th century CE; Medieval History: 8th to 18th century CE; Modern History: from 18th century CE.", "ప్రాచీన చరిత్ర: క్రీ.శ. 8వ శతాబ్దం వరకు; మధ్యయుగ చరిత్ర: 8వ – 18వ శతాబ్దం; ఆధునిక చరిత్ర: 18వ శతాబ్దం నుండి."], ["The Tomara Rajputs built Dhillika or Dhillikapura, which is modern-day", "తోమర రాజపుత్రులు నిర్మించిన ఢిల్లిక లేదా ఢిల్లికాపురం నేటి", ["Agra", "Delhi", "Ajmer", "Lahore"], ["ఆగ్రా", "ఢిల్లీ", "అజ్మీర్", "లాహోర్"], 1, "The Tomara Rajputs built Dhillika (modern Delhi) and made it their capital; they were displaced by the Chauhans of Ajmer in the 12th century.", "తోమర రాజపుత్రులు ఢిల్లిక (నేటి ఢిల్లీ)ను నిర్మించి రాజధానిగా చేసుకున్నారు; 12వ శతాబ్దంలో అజ్మీర్ చౌహాన్‌లు వారిని తొలగించారు."], ["Muhammad Ghori defeated Prithviraj Chauhan at Tarain and occupied Delhi in", "మహమ్మద్ ఘోరీ తరైన్ వద్ద పృథ్వీరాజ్ చౌహాన్‌ను ఓడించి ఢిల్లీని ఆక్రమించిన సంవత్సరం", ["1192 AD", "1206 AD", "1290 AD", "1526 AD"], ["క్రీ.శ. 1192", "క్రీ.శ. 1206", "క్రీ.శ. 1290", "క్రీ.శ. 1526"], 0, "Muhammad Ghori defeated Prithviraj Chauhan at Tarain in 1192 AD and occupied Delhi; Delhi and the Ganga–Jamuna doab came under Turkish rule.", "మహమ్మద్ ఘోరీ 1192లో తరైన్ వద్ద పృథ్వీరాజ్ చౌహాన్‌ను ఓడించి ఢిల్లీని ఆక్రమించాడు; ఢిల్లీ, గంగా–యమునా అంతర్వేది తురుష్కుల పాలనలోకి వచ్చాయి."], ["After the assassination of Muhammad Ghori, his representative who became Sultan of Delhi and started the Mamluk (Slave) dynasty in 1206 AD was", "మహమ్మద్ ఘోరీ హత్య తర్వాత ఢిల్లీ సుల్తాన్ అయి 1206లో మామ్లుక్ (బానిస) వంశాన్ని స్థాపించిన అతని ప్రతినిధి", ["Iltutmish", "Qutbuddin Aibak", "Balban", "Jalaluddin Khilji"], ["ఇల్‌టుట్‌మిష్", "కుతుబుద్దీన్ ఐబక్", "బాల్బన్", "జలాలుద్దీన్ ఖిల్జీ"], 1, "Qutbuddin Aibak, Ghori's representative, became Sultan and started the Mamluk or Slave dynasty in 1206 AD, with Lahore as his capital.", "ఘోరీ ప్రతినిధి కుతుబుద్దీన్ ఐబక్ 1206లో సుల్తాన్ అయి మామ్లుక్ (బానిస) వంశాన్ని స్థాపించాడు; అతని రాజధాని లాహోర్."], ["Arrange the dynasties of the Delhi Sultanate in chronological order", "ఢిల్లీ సుల్తానుల వంశాలను కాలక్రమంలో అమర్చండి", ["Slave, Khilji, Tughlaq, Sayyid, Lodi", "Khilji, Slave, Tughlaq, Lodi, Sayyid", "Slave, Tughlaq, Khilji, Sayyid, Lodi", "Lodi, Sayyid, Tughlaq, Khilji, Slave"], ["బానిస, ఖిల్జీ, తుగ్లక్, సయ్యద్, లోడీ", "ఖిల్జీ, బానిస, తుగ్లక్, లోడీ, సయ్యద్", "బానిస, తుగ్లక్, ఖిల్జీ, సయ్యద్, లోడీ", "లోడీ, సయ్యద్, తుగ్లక్, ఖిల్జీ, బానిస"], 0, "Slave/Mamluk (1206–1290), Khilji (1290–1320), Tughlaq (1321–1414), Sayyid (1414–1451) and Lodi (1451–1526).", "బానిస/మామ్లుక్ (1206–1290), ఖిల్జీ (1290–1320), తుగ్లక్ (1321–1414), సయ్యద్ (1414–1451), లోడీ (1451–1526)."], ["Match the dynasties with their founders:\nA. Slave dynasty   B. Khilji dynasty   C. Tughlaq dynasty   D. Sayyid dynasty   E. Lodi dynasty\n1. Bahlul Lodi   2. Khizr Khan   3. Ghiyasuddin Tughlaq   4. Jalaluddin Khilji   5. Qutbuddin Aibak", "వంశాలను వాటి స్థాపకులతో జతపరచండి:\nA. బానిస   B. ఖిల్జీ   C. తుగ్లక్   D. సయ్యద్   E. లోడీ\n1. బహలుల్ లోడీ   2. ఖిజర్ ఖాన్   3. ఘియాసుద్దీన్ తుగ్లక్   4. జలాలుద్దీన్ ఖిల్జీ   5. కుతుబుద్దీన్ ఐబక్", ["A-5, B-4, C-3, D-2, E-1", "A-4, B-5, C-3, D-2, E-1", "A-5, B-3, C-4, D-1, E-2", "A-5, B-4, C-2, D-3, E-1"], ["A-5, B-4, C-3, D-2, E-1", "A-4, B-5, C-3, D-2, E-1", "A-5, B-3, C-4, D-1, E-2", "A-5, B-4, C-2, D-3, E-1"], 0, "Slave – Qutbuddin Aibak; Khilji – Jalaluddin Khilji; Tughlaq – Ghiyasuddin Tughlaq; Sayyid – Khizr Khan; Lodi – Bahlul Lodi. (Textbook match the following.)", "బానిస – కుతుబుద్దీన్ ఐబక్; ఖిల్జీ – జలాలుద్దీన్; తుగ్లక్ – ఘియాసుద్దీన్; సయ్యద్ – ఖిజర్ ఖాన్; లోడీ – బహలుల్ లోడీ. (పాఠ్యపుస్తక జతపరచడం.)"], ["'Mamluk' means", "'మామ్లుక్' అంటే", ["Owned slave", "King of kings", "Holy warrior", "Governor"], ["యాజమాన్యంలోని బానిస", "రాజాధిరాజు", "పవిత్ర యోధుడు", "గవర్నర్"], 0, "Mamluk means 'owned slave' — hence the Slave dynasty.", "మామ్లుక్ అంటే 'యాజమాన్యంలోని బానిస' — అందుకే బానిస వంశం అనే పేరు."], ["The first sovereign ruler from Delhi and the real founder of the Delhi Sultanate, who changed the capital to Delhi, was", "ఢిల్లీ నుండి పాలించిన మొదటి సార్వభౌమ పాలకుడు, ఢిల్లీ సుల్తానుల రాజ్య నిజమైన స్థాపకుడు, రాజధానిని ఢిల్లీకి మార్చినవాడు", ["Qutbuddin Aibak", "Iltutmish", "Balban", "Alauddin Khilji"], ["కుతుబుద్దీన్ ఐబక్", "ఇల్‌టుట్‌మిష్", "బాల్బన్", "అల్లావుద్దీన్ ఖిల్జీ"], 1, "During the rule of Iltutmish the capital was changed from Lahore to Delhi; he was the first sovereign ruler from Delhi and the real founder of the Delhi Sultanate.", "ఇల్‌టుట్‌మిష్ కాలంలో రాజధాని లాహోర్ నుండి ఢిల్లీకి మారింది; ఢిల్లీ నుండి పాలించిన మొదటి సార్వభౌముడు, ఢిల్లీ సుల్తానుల రాజ్య నిజమైన స్థాపకుడు."], ["The only woman ruler of the Delhi Sultanate was", "ఢిల్లీ సుల్తానుల రాజ్యపు ఏకైక మహిళా పాలకురాలు", ["Razia Sultana", "Rudramadevi", "Noor Jahan", "Chand Bibi"], ["రజియా సుల్తానా", "రుద్రమదేవి", "నూర్జహాన్", "చాంద్ బీబీ"], 0, "Razia Sultana, daughter of Iltutmish, was the only woman ruler of the Delhi Sultanate; she faced opposition from the Wazirs and the Chahalgani nobles.", "ఇల్‌టుట్‌మిష్ కుమార్తె రజియా సుల్తానా ఢిల్లీ సుల్తానుల ఏకైక మహిళా పాలకురాలు; వజీర్లు, చహల్‌గనీ ప్రభువుల వ్యతిరేకతను ఎదుర్కొంది."], ["Razia Sultana was the daughter and successor of", "రజియా సుల్తానా ఈ సుల్తాన్ కుమార్తె, వారసురాలు", ["Qutbuddin Aibak", "Iltutmish", "Balban", "Alauddin Khilji"], ["కుతుబుద్దీన్ ఐబక్", "ఇల్‌టుట్‌మిష్", "బాల్బన్", "అల్లావుద్దీన్ ఖిల్జీ"], 1, "Iltutmish was succeeded by his daughter Razia Sultana (1236–1240 CE).", "ఇల్‌టుట్‌మిష్ తర్వాత అతని కుమార్తె రజియా సుల్తానా (1236–1240) పాలించింది."], ["The 'Chahalgani' (Turkan-i-Chahalgani or Chalisa) was", "'చహల్‌గనీ' (తుర్కాన్-ఇ-చహల్‌గనీ లేదా చాలీసా) అంటే", ["A group of forty Turkish nobles", "A tax on land", "A type of coin", "A Sufi saint"], ["నలభై మంది తురుష్క ప్రభువుల బృందం", "భూమి పన్ను", "ఒక రకమైన నాణెం", "ఒక సూఫీ సాధువు"], 0, "Chahalgani was a group of forty Turkish nobles — an administrative support system initiated by Iltutmish that helped suppress opponent nobles.", "చహల్‌గనీ నలభై మంది తురుష్క ప్రభువుల బృందం — ఇల్‌టుట్‌మిష్ ప్రారంభించిన పరిపాలనా సహాయ వ్యవస్థ; ప్రత్యర్థి ప్రభువులను అణచడానికి ఉపయోగపడింది."], ["The Slave dynasty ruler who restored the Crown's prestige and power in the Sultanate was", "సుల్తానుల రాజ్యంలో రాజ్యాధికార గౌరవాన్ని, శక్తిని పునరుద్ధరించిన బానిస వంశ పాలకుడు", ["Ghiyasuddin Balban", "Qaiqubad", "Khizr Khan", "Firoz Shah Tughlaq"], ["ఘియాసుద్దీన్ బాల్బన్", "కైకుబాద్", "ఖిజర్ ఖాన్", "ఫిరోజ్ షా తుగ్లక్"], 0, "Ghiyasuddin Balban restored the Crown's prestige and power. The Slave dynasty ended during the reign of Qaiqubad and his infant son Kayumars.", "ఘియాసుద్దీన్ బాల్బన్ రాజ్యాధికార గౌరవాన్ని పునరుద్ధరించాడు. కైకుబాద్, అతని పసి కుమారుడు కయూమర్స్ కాలంలో బానిస వంశం అంతమైంది."], ["Jalaluddin Khilji, the founder of the Khilji dynasty, was assassinated by his son-in-law", "ఖిల్జీ వంశ స్థాపకుడు జలాలుద్దీన్ ఖిల్జీని హత్య చేసిన అతని అల్లుడు", ["Alauddin Khilji", "Malik Kafur", "Iltutmish", "Balban"], ["అల్లావుద్దీన్ ఖిల్జీ", "మాలిక్ కాఫర్", "ఇల్‌టుట్‌మిష్", "బాల్బన్"], 0, "Jalaluddin Khilji was assassinated by his son-in-law Alauddin Khilji, who succeeded him (1296–1316 CE).", "జలాలుద్దీన్ ఖిల్జీని అతని అల్లుడు అల్లావుద్దీన్ ఖిల్జీ హత్య చేసి సింహాసనం అధిష్ఠించాడు (1296–1316)."], ["Alauddin Khilji sent his army to conquer South India under the command of", "దక్షిణ భారతాన్ని జయించడానికి అల్లావుద్దీన్ ఖిల్జీ తన సైన్యాన్ని ఎవరి నాయకత్వంలో పంపాడు", ["Malik Kafur", "Timur", "Qutbuddin Aibak", "Khizr Khan"], ["మాలిక్ కాఫర్", "తైమూర్", "కుతుబుద్దీన్ ఐబక్", "ఖిజర్ ఖాన్"], 0, "After conquering Gujarat, Ranthambore, Chittor and Malwa in the north, Alauddin sent his army under Malik Kafur to conquer South India.", "ఉత్తరాన గుజరాత్, రణథంబోర్, చిత్తోర్, మాల్వాలను జయించిన తర్వాత అల్లావుద్దీన్ మాలిక్ కాఫర్ నాయకత్వంలో దక్షిణ భారతంపై సైన్యాన్ని పంపాడు."], ["Alauddin Khilji is connected with", "అల్లావుద్దీన్ ఖిల్జీకి సంబంధించినది", ["Branding of horses", "Changing the capital to Daulatabad", "Founding the Khilji dynasty", "All the above"], ["గుర్రాలకు ముద్ర (దాగ్) వేయడం", "రాజధానిని దౌలతాబాద్‌కు మార్చడం", "ఖిల్జీ వంశ స్థాపన", "పైవన్నీ"], 0, "Alauddin introduced branding of horses, a standing army paid in cash, market (price) reforms and a strong spy system. Changing the capital was by Muhammad bin Tughlaq; the founder was Jalaluddin. (Textbook exercise.)", "అల్లావుద్దీన్ గుర్రాలకు ముద్ర, నగదు జీతంతో స్థిర సైన్యం, మార్కెట్ (ధరల) సంస్కరణలు, గూఢచార వ్యవస్థ తెచ్చాడు. రాజధాని మార్పు మహమ్మద్ బిన్ తుగ్లక్‌ది; స్థాపకుడు జలాలుద్దీన్. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Identify the measure that was NOT introduced by Alauddin Khilji", "అల్లావుద్దీన్ ఖిల్జీ ప్రవేశపెట్టని చర్య", ["Standing army paid salaries in cash", "Market reforms controlling prices", "Strong spy system", "Token currency in copper coins"], ["నగదు జీతాలతో స్థిర సైన్యం", "ధరలను నియంత్రించే మార్కెట్ సంస్కరణలు", "బలమైన గూఢచార వ్యవస్థ", "రాగి నాణేలతో టోకెన్ కరెన్సీ"], 3, "Token currency in copper coins was introduced by Muhammad bin Tughlaq. Alauddin introduced the standing army, cash salaries, market reforms, spy system and branding of horses.", "రాగి టోకెన్ కరెన్సీని మహమ్మద్ బిన్ తుగ్లక్ ప్రవేశపెట్టాడు. అల్లావుద్దీన్ స్థిర సైన్యం, నగదు జీతాలు, మార్కెట్ సంస్కరణలు, గూఢచార వ్యవస్థ, గుర్రాలకు ముద్ర తెచ్చాడు."], ["Alauddin Khilji introduced the branding of horses in order to", "అల్లావుద్దీన్ ఖిల్జీ గుర్రాలకు ముద్ర వేసే విధానం ప్రవేశపెట్టిన ఉద్దేశం", ["Prevent the substitution of a bad horse for a good one", "Decorate horses", "Increase horse prices", "Count horses for tax"], ["మంచి గుర్రం బదులు చెడ్డ గుర్రం మార్చకుండా నివారించడం", "గుర్రాలను అలంకరించడం", "గుర్రాల ధరలు పెంచడం", "పన్ను కోసం గుర్రాలు లెక్కించడం"], 0, "Branding of horses was introduced to prevent the substitution of a bad horse for a good one.", "మంచి గుర్రం స్థానంలో చెడ్డ గుర్రాన్ని మార్చకుండా నివారించడానికి గుర్రాలకు ముద్ర వేసే విధానం తెచ్చాడు."], ["The leader who united the Mongols and established the Mongol Empire in 1206 CE was", "మంగోలులను ఏకం చేసి 1206లో మంగోల్ సామ్రాజ్యాన్ని స్థాపించినవాడు", ["Timur", "Chengiz Khan", "Babur", "Muhammad Ghori"], ["తైమూర్", "చెంఘిజ్ ఖాన్", "బాబర్", "మహమ్మద్ ఘోరీ"], 1, "Chengiz Khan united the Mongols and established the Mongol Empire in 1206 CE; Mongols conducted several invasions into India during the Delhi Sultanate.", "చెంఘిజ్ ఖాన్ మంగోలులను ఏకం చేసి 1206లో మంగోల్ సామ్రాజ్యాన్ని స్థాపించాడు; సుల్తానుల కాలంలో మంగోలులు భారత్‌పై అనేక దండయాత్రలు చేశారు."], ["Ghiyasuddin Tughlaq founded the Tughlaq dynasty by ending the reign of", "ఘియాసుద్దీన్ తుగ్లక్ ఎవరి పాలనను అంతం చేసి తుగ్లక్ వంశాన్ని స్థాపించాడు", ["Khusrau Khan", "Ibrahim Lodi", "Razia", "Alam Shah"], ["ఖుస్రో ఖాన్", "ఇబ్రహీం లోడీ", "రజియా", "ఆలం షా"], 0, "Ghiyasuddin Tughlaq founded the Tughlaq dynasty by bringing to an end the reign of Khusrau Khan.", "ఖుస్రో ఖాన్ పాలనను అంతం చేసి ఘియాసుద్దీన్ తుగ్లక్ తుగ్లక్ వంశాన్ని స్థాపించాడు."], ["Timur invaded India and captured Delhi during the rule of this dynasty", "ఈ రాజవంశం కాలంలో తైమూర్ భారతదేశంపై దండయాత్ర చేసి ఢిల్లీని స్వాధీనపరచుకున్నాడు", ["Slave", "Khilji", "Tughlaq", "Lodi"], ["బానిస", "ఖిల్జీ", "తుగ్లక్", "లోడీ"], 2, "Timur, the ruler of Central Asia, invaded India in 1398 AD during the Tughlaq rule and captured Delhi. (This question appeared in the AP TET/DSC paper.)", "మధ్య ఆసియా పాలకుడు తైమూర్ 1398లో తుగ్లక్‌ల కాలంలో భారత్‌పై దండెత్తి ఢిల్లీని ఆక్రమించాడు. (ఇది AP TET/DSC పేపర్‌లో వచ్చిన ప్రశ్న.)"], ["Timur's invasion of India took place in", "తైమూర్ భారతదేశంపై దండయాత్ర చేసిన సంవత్సరం", ["1192 AD", "1206 AD", "1398 AD", "1526 AD"], ["క్రీ.శ. 1192", "క్రీ.శ. 1206", "క్రీ.శ. 1398", "క్రీ.శ. 1526"], 2, "In 1398 AD Timur invaded India and captured Delhi; it took Delhi nearly 100 years to rebuild. This paved the way for Babur's invasion.", "1398లో తైమూర్ దండెత్తి ఢిల్లీని ఆక్రమించాడు; ఢిల్లీ తిరిగి నిర్మాణానికి దాదాపు 100 సంవత్సరాలు పట్టింది. ఇది బాబర్ దండయాత్రకు దారితీసింది."], ["The most learned yet eccentric Delhi Sultan, proficient in philosophy, mathematics and astronomy, but lacking practical judgment, was", "తత్వశాస్త్రం, గణితం, ఖగోళ శాస్త్రంలో ప్రావీణ్యం గల, అత్యంత విద్వాంసుడైనా విపరీత స్వభావం, ఆచరణాత్మక విచక్షణ లోపించిన సుల్తాన్", ["Muhammad bin Tughlaq", "Firoz Shah Tughlaq", "Alauddin Khilji", "Iltutmish"], ["మహమ్మద్ బిన్ తుగ్లక్", "ఫిరోజ్ షా తుగ్లక్", "అల్లావుద్దీన్ ఖిల్జీ", "ఇల్‌టుట్‌మిష్"], 0, "Muhammad bin Tughlaq (1324–1351) was the most learned yet eccentric ruler; he lacked practical judgment, so his reforms failed.", "మహమ్మద్ బిన్ తుగ్లక్ (1324–1351) గొప్ప విద్వాంసుడైనా విపరీత స్వభావుడు; ఆచరణాత్మక విచక్షణ లోపించడంతో అతని సంస్కరణలు విఫలమయ్యాయి."], ["Muhammad bin Tughlaq shifted his capital from Delhi to", "మహమ్మద్ బిన్ తుగ్లక్ రాజధానిని ఢిల్లీ నుండి ఇక్కడికి మార్చాడు", ["Agra", "Lahore", "Devagiri (Daulatabad)", "Multan"], ["ఆగ్రా", "లాహోర్", "దేవగిరి (దౌలతాబాద్)", "ముల్తాన్"], 2, "He shifted the capital to Devagiri (Daulatabad) — a strategic, central location close to the South — and ordered the entire population to move; many died on the way.", "అతను రాజధానిని వ్యూహాత్మక, కేంద్ర స్థానమైన, దక్షిణానికి దగ్గరగా ఉన్న దేవగిరి (దౌలతాబాద్)కి మార్చి ప్రజలందరినీ తరలించమన్నాడు; దారిలో చాలామంది చనిపోయారు."], ["Daulatabad, the capital chosen by Muhammad bin Tughlaq, is located in the present-day state of", "మహమ్మద్ బిన్ తుగ్లక్ ఎంచుకున్న రాజధాని దౌలతాబాద్ నేటి ఈ రాష్ట్రంలో ఉంది", ["Maharashtra", "Gujarat", "Karnataka", "Madhya Pradesh"], ["మహారాష్ట్ర", "గుజరాత్", "కర్ణాటక", "మధ్యప్రదేశ్"], 0, "Daulatabad (Devagiri) is located in Maharashtra (also a puzzle answer in the textbook).", "దౌలతాబాద్ (దేవగిరి) మహారాష్ట్రలో ఉంది (పాఠ్యపుస్తక పజిల్ సమాధానం కూడా)."], ["People started minting coins in their homes during the period of", "ప్రజలు ఇళ్ళలోనే నాణేలు ముద్రించడం మొదలుపెట్టిన కాలం", ["Alauddin Khilji", "Balban", "Muhammad bin Tughlaq", "Ibrahim Lodi"], ["అల్లావుద్దీన్ ఖిల్జీ", "బాల్బన్", "మహమ్మద్ బిన్ తుగ్లక్", "ఇబ్రహీం లోడీ"], 2, "Due to shortage of silver, Muhammad bin Tughlaq issued copper token coins but took no precautions against forgery; people minted coins at home. Exchanging them for silver and gold emptied the treasury. (Textbook exercise.)", "వెండి కొరత వల్ల మహమ్మద్ బిన్ తుగ్లక్ రాగి టోకెన్ నాణేలు ప్రవేశపెట్టాడు కానీ నకిలీలను అడ్డుకోలేదు; ప్రజలు ఇళ్ళలో నాణేలు ముద్రించారు. వాటిని వెండి, బంగారంతో మార్చడంతో ఖజానా ఖాళీ అయింది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Match the coins of the Delhi Sultanate:\nA. Tanka   B. Jital\n1. Copper coin   2. Silver coin", "ఢిల్లీ సుల్తానుల నాణేలను జతపరచండి:\nA. టంకా   B. జిటల్\n1. రాగి నాణెం   2. వెండి నాణెం", ["A-2, B-1", "A-1, B-2", "Both silver", "Both copper"], ["A-2, B-1", "A-1, B-2", "రెండూ వెండి", "రెండూ రాగి"], 0, "Tanka (silver coins) and Jital (copper coins) were the basic coins in usage.", "టంకా (వెండి నాణేలు), జిటల్ (రాగి నాణేలు) ప్రాథమిక నాణేలు."], ["The fourth dynasty of the Delhi Sultanate, formed by Khizr Khan, was the", "ఖిజర్ ఖాన్ స్థాపించిన ఢిల్లీ సుల్తానుల నాల్గవ వంశం", ["Lodi dynasty", "Sayyid dynasty", "Tughlaq dynasty", "Khilji dynasty"], ["లోడీ వంశం", "సయ్యద్ వంశం", "తుగ్లక్ వంశం", "ఖిల్జీ వంశం"], 1, "The Sayyid dynasty (1414–1451) was the fourth dynasty, formed by Khizr Khan; its last ruler Alam Shah was defeated by Bahlul Lodi.", "సయ్యద్ వంశం (1414–1451) నాల్గవ వంశం; ఖిజర్ ఖాన్ స్థాపకుడు; చివరి పాలకుడు ఆలం షాను బహలుల్ లోడీ ఓడించాడు."], ["The last ruler of the Delhi Sultanate was", "ఢిల్లీ సుల్తానుల చివరి పాలకుడు", ["Bahlul Lodi", "Sikandar Lodi", "Ibrahim Lodi", "Alam Shah"], ["బహలుల్ లోడీ", "సికందర్ లోడీ", "ఇబ్రహీం లోడీ", "ఆలం షా"], 2, "Ibrahim Lodi was the last ruler; during his rule the Sultanate came to an end.", "ఇబ్రహీం లోడీ చివరి పాలకుడు; అతని కాలంలో సుల్తానుల పాలన అంతమైంది."], ["The Delhi Sultanate came to an end when Babur defeated Ibrahim Lodi in", "బాబర్ ఇబ్రహీం లోడీని ఓడించడంతో ఢిల్లీ సుల్తానుల రాజ్యం అంతమైన యుద్ధం", ["The Battle of Tarain, 1192", "The first Battle of Panipat, 1526", "The Battle of Plassey, 1757", "The Battle of Talikota, 1565"], ["తరైన్ యుద్ధం, 1192", "మొదటి పానిపట్ యుద్ధం, 1526", "ప్లాసీ యుద్ధం, 1757", "తళ్ళికోట యుద్ధం, 1565"], 1, "Mughal ruler Babur defeated Ibrahim Lodi in the first Battle of Panipat in 1526 AD; the Delhi Sultanate ended and the Mughal era began.", "మొఘల్ పాలకుడు బాబర్ 1526లో మొదటి పానిపట్ యుద్ధంలో ఇబ్రహీం లోడీని ఓడించాడు; ఢిల్లీ సుల్తానుల రాజ్యం అంతమై మొఘల్ యుగం మొదలైంది."], ["The first ruler of the Mughal dynasty was", "మొఘల్ వంశ మొదటి పాలకుడు", ["Akbar", "Babur", "Humayun", "Timur"], ["అక్బర్", "బాబర్", "హుమాయూన్", "తైమూర్"], 1, "Babur, after defeating Ibrahim Lodi in 1526, became the first ruler of the Mughal dynasty.", "1526లో ఇబ్రహీం లోడీని ఓడించిన బాబర్ మొఘల్ వంశ మొదటి పాలకుడయ్యాడు."], ["The rule of the Delhi Sultans was in accordance with", "ఢిల్లీ సుల్తానుల పాలన దీని ప్రకారం జరిగింది", ["Shariat (Islamic law)", "Manusmriti", "Arthashastra", "The Constitution"], ["షరియత్ (ఇస్లామిక్ చట్టం)", "మనుస్మృతి", "అర్థశాస్త్రం", "రాజ్యాంగం"], 0, "The Sultan was the head; the rule was in accordance with Shariat, the Islamic law. All political, legal, military and religious powers were vested with him.", "సుల్తాన్ రాజ్యాధిపతి; పాలన షరియత్ (ఇస్లామిక్ చట్టం) ప్రకారం సాగింది; రాజకీయ, న్యాయ, సైనిక, మత అధికారాలన్నీ అతనివే."], ["The Delhi Sultans divided the empire into", "ఢిల్లీ సుల్తానులు సామ్రాజ్యాన్ని ఇలా విభజించారు", ["Mandalas", "Iqtas", "Nadus", "Valanadus"], ["మండలాలు", "ఇక్తాలు", "నాడులు", "వలనాడులు"], 1, "The Sultanate was divided into Iqtas (provinces), Shiqs, Parganas and villages. (Textbook exercise.)", "సుల్తానుల రాజ్యం ఇక్తాలు (రాష్ట్రాలు), షిక్‌లు, పరగణాలు, గ్రామాలుగా విభజించబడింది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Arrange the administrative units of the Delhi Sultanate from largest to smallest", "ఢిల్లీ సుల్తానుల పరిపాలనా విభాగాలను పెద్దదాని నుండి చిన్నదానికి అమర్చండి", ["Iqtas, Shiqs, Parganas, Villages", "Villages, Parganas, Shiqs, Iqtas", "Shiqs, Iqtas, Villages, Parganas", "Parganas, Iqtas, Shiqs, Villages"], ["ఇక్తాలు, షిక్‌లు, పరగణాలు, గ్రామాలు", "గ్రామాలు, పరగణాలు, షిక్‌లు, ఇక్తాలు", "షిక్‌లు, ఇక్తాలు, గ్రామాలు, పరగణాలు", "పరగణాలు, ఇక్తాలు, షిక్‌లు, గ్రామాలు"], 0, "The Sultanate was divided into smaller units — Iqtas, Shiqs, Parganas and Villages.", "సుల్తానుల రాజ్యం ఇక్తాలు, షిక్‌లు, పరగణాలు, గ్రామాలుగా విభజించబడింది."], ["The Iqtas (provinces) were administered by", "ఇక్తాలను (రాష్ట్రాలను) నిర్వహించినవారు", ["Muqtis", "Wazirs", "Qazis", "Bandagan"], ["ముక్తీలు", "వజీర్లు", "ఖాజీలు", "బందగాన్"], 0, "Governors of Iqtas were called Muqtis (military officers); they maintained law and order and provided military and revenue services. Their rank was not hereditary; they were often transferred. (Textbook exercise.)", "ఇక్తాల గవర్నర్లను ముక్తీలు అంటారు (సైనిక అధికారులు); శాంతిభద్రతలు, సైనిక, రెవెన్యూ సేవలు అందించేవారు. వారి పదవి వంశపారంపర్యం కాదు; తరచూ బదిలీ అయ్యేవారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Slaves purchased by Iltutmish for military service, who were loyal and completely dependent on the king, were called", "సైనిక సేవ కోసం ఇల్‌టుట్‌మిష్ కొనుగోలు చేసిన, రాజుపై పూర్తిగా ఆధారపడిన విశ్వాసపాత్రులైన బానిసలు", ["Bandagan", "Muqtis", "Chahalgani", "Wazirs"], ["బందగాన్", "ముక్తీలు", "చహల్‌గనీ", "వజీర్లు"], 0, "Iltutmish purchased slaves for military service called Bandagan (in Persian); this continued under the Khiljis and Tughlaqs.", "ఇల్‌టుట్‌మిష్ సైనిక సేవ కోసం కొనుగోలు చేసిన బానిసలను పర్షియన్‌లో బందగాన్ అంటారు; ఖిల్జీ, తుగ్లక్‌ల కాలంలోనూ ఇది కొనసాగింది."], ["In the Delhi Sultanate, the tillers had to pay this share of their produce as land revenue", "ఢిల్లీ సుల్తానుల కాలంలో రైతులు భూమి శిస్తుగా చెల్లించాల్సిన వాటా", ["1/6", "1/3", "1/2", "1/10"], ["1/6", "1/3", "1/2", "1/10"], 1, "Agriculture was the main occupation; tillers had to pay 1/3 of their produce as land revenue. Textile was the main industry.", "వ్యవసాయం ప్రధాన వృత్తి; రైతులు పంటలో 1/3 వంతు భూమి శిస్తుగా చెల్లించాలి. వస్త్ర పరిశ్రమ ప్రధాన పరిశ్రమ."], ["Workshops started by the Sultans for different products were called", "సుల్తానులు వివిధ ఉత్పత్తుల కోసం ప్రారంభించిన కర్మాగారాలను ఇలా పిలిచారు", ["Karkhanas", "Iqtas", "Parganas", "Madrasas"], ["కార్ఖానాలు", "ఇక్తాలు", "పరగణాలు", "మదరసాలు"], 0, "The Sultans started many Karkhanas (workshops) for different products.", "సుల్తానులు వివిధ ఉత్పత్తుల కోసం అనేక కార్ఖానాలు (కర్మాగారాలు) ప్రారంభించారు."], ["The combination of Arabic and Indian styles of architecture that developed during the Sultanate period is known as the", "సుల్తానుల కాలంలో అభివృద్ధి చెందిన అరబిక్, భారతీయ శైలుల మిశ్రమ వాస్తుశైలి", ["Indo-Islamic style", "Dravida style", "Vesara style", "Gandhara style"], ["ఇండో-ఇస్లామిక్ శైలి", "ద్రావిడ శైలి", "వేసర శైలి", "గాంధార శైలి"], 0, "A combination of Arabic and Indian art and architecture, using Indian craftspersons, gave birth to the Indo-Islamic style; geometric shapes and calligraphy replaced Hindu decorative style.", "అరబిక్, భారతీయ కళల కలయికతో, భారతీయ శిల్పుల సహాయంతో ఇండో-ఇస్లామిక్ శైలి ఏర్పడింది; జ్యామితీయ ఆకారాలు, కాలిగ్రఫీ వచ్చాయి."], ["Match the architectural styles with their features:\nA. Trabeate style   B. Arcuate style\n1. Arches carrying the weight of the superstructure above doors and windows   2. A horizontal beam placed across two vertical columns", "వాస్తు శైలులను వాటి లక్షణాలతో జతపరచండి:\nA. ట్రబీట్ శైలి   B. ఆర్క్యుయేట్ శైలి\n1. తలుపులు, కిటికీల పైభాగం బరువును మోసే ఆర్చీలు (వంపులు)   2. రెండు నిలువు స్తంభాలపై అడ్డ దూలం", ["A-2, B-1", "A-1, B-2", "Both use arches", "Both use beams only"], ["A-2, B-1", "A-1, B-2", "రెండూ ఆర్చీలు వాడతాయి", "రెండూ దూలాలే వాడతాయి"], 0, "Trabeate (indigenous) – horizontal beam across two vertical columns; Arcuate (introduced later) – arches carry the weight of the superstructure.", "ట్రబీట్ (స్వదేశీ) – రెండు నిలువు స్తంభాలపై అడ్డ దూలం; ఆర్క్యుయేట్ (తర్వాత వచ్చినది) – ఆర్చీలు పైభాగపు బరువును మోస్తాయి."], ["The Qutub Minar, built by Qutbuddin Aibak and Iltutmish, is dedicated to the Sufi saint", "కుతుబుద్దీన్ ఐబక్, ఇల్‌టుట్‌మిష్ నిర్మించిన కుతుబ్ మినార్ ఈ సూఫీ సాధువుకు అంకితం", ["Qutubuddin Bakhtiyar Kaki", "Nizamuddin Auliya", "Shaikh Salim Chishti", "Amir Khusrau"], ["కుతుబుద్దీన్ భక్తియార్ కాకీ", "నిజాముద్దీన్ ఔలియా", "షేక్ సలీం చిష్తీ", "అమీర్ ఖుస్రో"], 0, "The Qutub Minar, in the premises of Quwwat-ul-Islam masjid, was built by Qutbuddin Aibak and Iltutmish and dedicated to Sufi saint Qutubuddin Bakhtiyar Kaki. It is 74.1 m tall and four-storied.", "కువ్వత్-ఉల్-ఇస్లాం మసీదు ఆవరణలో కుతుబుద్దీన్ ఐబక్, ఇల్‌టుట్‌మిష్ నిర్మించిన కుతుబ్ మినార్ సూఫీ సాధువు కుతుబుద్దీన్ భక్తియార్ కాకీకి అంకితం. ఎత్తు 74.1 మీ., నాలుగు అంతస్తులు."], ["The height of the four-storied Qutub Minar, according to the textbook, is", "పాఠ్యపుస్తకం ప్రకారం నాలుగు అంతస్తుల కుతుబ్ మినార్ ఎత్తు", ["54.1 metres", "74.1 metres", "94.1 metres", "100 metres"], ["54.1 మీటర్లు", "74.1 మీటర్లు", "94.1 మీటర్లు", "100 మీటర్లు"], 1, "The 74.1 metre four-storied marble and sandstone Qutub Minar is unique for its skilful construction.", "పాలరాయి, ఇసుకరాయితో నిర్మించిన 74.1 మీటర్ల నాలుగు అంతస్తుల కుతుబ్ మినార్ నైపుణ్యవంతమైన నిర్మాణానికి ప్రసిద్ధి."], ["The Alai Darwaza, the southern entrance to the Quwwat-ul-Islam masjid, where domes and arches were used for the first time, was constructed by", "తొలిసారిగా గుమ్మటాలు, ఆర్చీలు వాడిన, కువ్వత్-ఉల్-ఇస్లాం మసీదు దక్షిణ ద్వారం అలాయ్ దర్వాజాను నిర్మించినవాడు", ["Muhammad bin Tughlaq", "Alauddin Khilji", "Ghiyasuddin Balban", "Sikandar Lodi"], ["మహమ్మద్ బిన్ తుగ్లక్", "అల్లావుద్దీన్ ఖిల్జీ", "ఘియాసుద్దీన్ బాల్బన్", "సికందర్ లోడీ"], 1, "The Alai Darwaza was built by Alauddin Khilji; domes and arches were used for the first time. (Textbook exercise.)", "అలాయ్ దర్వాజాను అల్లావుద్దీన్ ఖిల్జీ నిర్మించాడు; తొలిసారిగా గుమ్మటాలు, ఆర్చీలు వాడారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Alberuni, who learnt Sanskrit and was impressed by the Upanishads and the Bhagavad-Gita, wrote", "సంస్కృతం నేర్చుకుని ఉపనిషత్తులు, భగవద్గీతకు ముగ్ధుడైన అల్‌బెరూనీ రచించిన గ్రంథం", ["Tarikh Al-Hind (History of India)", "Arthashastra", "Indica", "Tuti-e-Hind"], ["తారీఖ్ అల్-హింద్ (భారతదేశ చరిత్ర)", "అర్థశాస్త్రం", "ఇండికా", "తూతీ-ఎ-హింద్"], 0, "Alberuni, an Arabic and Persian scholar, learnt Sanskrit, translated some works into Arabic and wrote Tarikh Al-Hind (History of India).", "అరబిక్, పర్షియన్ పండితుడు అల్‌బెరూనీ సంస్కృతం నేర్చుకుని కొన్ని గ్రంథాలను అరబిక్‌లోకి అనువదించి 'తారీఖ్ అల్-హింద్' (భారతదేశ చరిత్ర) రచించాడు."], ["The Persian poet and great singer known as 'Tuti-e-Hind' (The Parrot of India) was", "'తూతీ-ఎ-హింద్' (భారతదేశ చిలుక)గా పేరొందిన పర్షియన్ కవి, గొప్ప గాయకుడు", ["Alberuni", "Amir Khusrau", "Zia-ud-din Barani", "Kalidasa"], ["అల్‌బెరూనీ", "అమీర్ ఖుస్రో", "జియా-ఉద్-దిన్ బరానీ", "కాళిదాసు"], 1, "Amir Khusrau was a Persian poet and great singer who wrote many couplets; he was known as 'Tuti-e-Hind' (The Parrot of India).", "అమీర్ ఖుస్రో పర్షియన్ కవి, గొప్ప గాయకుడు; అనేక ద్విపదలు రచించాడు; 'తూతీ-ఎ-హింద్' (భారతదేశ చిలుక)గా పేరొందాడు."], ["Identify the one that was NOT a cause of the decline of the Delhi Sultanate", "ఢిల్లీ సుల్తానుల రాజ్య పతనానికి కారణం కానిది", ["Timur's invasion in 1398", "Weak administration and regional states breaking away", "Incompetent rule of the Sayyids and Lodis", "Strong market reforms of Alauddin"], ["1398లో తైమూర్ దండయాత్ర", "బలహీన పాలన, ప్రాంతీయ రాజ్యాలు విడిపోవడం", "సయ్యద్, లోడీల అసమర్థ పాలన", "అల్లావుద్దీన్ బలమైన మార్కెట్ సంస్కరణలు"], 3, "Decline began in the Tughlaq period; Timur's invasion drained wealth; regional states (Vijayanagara, Bahmani) broke away; incompetent Sayyids and Lodis led to collapse. Alauddin's reforms strengthened the Sultanate.", "తుగ్లక్‌ల కాలంలో పతనం మొదలైంది; తైమూర్ దండయాత్ర సంపదను హరించింది; విజయనగర, బహమనీ రాజ్యాలు విడిపోయాయి; సయ్యద్, లోడీల అసమర్థ పాలన పతనానికి దారితీసింది. అల్లావుద్దీన్ సంస్కరణలు రాజ్యాన్ని బలపరిచాయి."], ["The two southern kingdoms that broke away from the Delhi Sultanate were", "ఢిల్లీ సుల్తానుల రాజ్యం నుండి విడిపోయిన రెండు దక్షిణ రాజ్యాలు", ["Vijayanagara and Bahmani", "Chola and Pandya", "Kakatiya and Pallava", "Satavahana and Ikshvaku"], ["విజయనగర, బహమనీ", "చోళ, పాండ్య", "కాకతీయ, పల్లవ", "శాతవాహన, ఇక్ష్వాకు"], 0, "The Vijayanagara and Bahmani kingdoms in the South broke away from the Sultanate.", "దక్షిణాన విజయనగర, బహమనీ రాజ్యాలు సుల్తానుల రాజ్యం నుండి విడిపోయాయి."]]}, {"n": 5, "en": "Kakatiya Kingdom", "te": "కాకతీయ రాజ్యం", "c": "#16a34a", "q": [["Identify the kingdom that was NOT among the five important regional kingdoms of South India in the medieval period", "మధ్యయుగంలో దక్షిణ భారతదేశంలో ఏర్పడిన ఐదు ముఖ్య ప్రాంతీయ రాజ్యాలలో లేనిది", ["Chalukyas of Kalyani", "Yadavas", "Hoysalas", "Mauryas"], ["కళ్యాణి చాళుక్యులు", "యాదవులు", "హొయసలులు", "మౌర్యులు"], 3, "The five kingdoms were the Chalukyas of Kalyani, the Yadavas, the Kakatiyas, the Hoysalas and the Pandyas. The Mauryas were an ancient north Indian dynasty.", "ఐదు రాజ్యాలు: కళ్యాణి చాళుక్యులు, యాదవులు, కాకతీయులు, హొయసలులు, పాండ్యులు. మౌర్యులు ప్రాచీన ఉత్తర భారత వంశం."], ["Among the five medieval regional kingdoms of South India, the one that belonged to the Telugu land was the", "మధ్యయుగ దక్షిణ భారత ఐదు ప్రాంతీయ రాజ్యాలలో తెలుగు నేలకు చెందినది", ["Kakatiyas", "Pandyas", "Hoysalas", "Yadavas"], ["కాకతీయులు", "పాండ్యులు", "హొయసలులు", "యాదవులు"], 0, "Out of the five kingdoms, the Kakatiyas belonged to the Telugu land.", "ఐదు రాజ్యాలలో కాకతీయులు తెలుగు నేలకు చెందినవారు."], ["The founder of the Chalukyas of Kalyani (Western Chalukyas) was", "కళ్యాణి చాళుక్యుల (పశ్చిమ చాళుక్యుల) స్థాపకుడు", ["Thailapa II", "Bhillama", "Gundyana", "Kula Sekhar"], ["రెండవ తైలపుడు", "భిల్లముడు", "గుండ్యన", "కులశేఖరుడు"], 0, "Thailapa II founded the Chalukyas of Kalyani; their capital was Basava Kalyani in Bidar district and the kingdom lasted 200 years.", "రెండవ తైలపుడు కళ్యాణి చాళుక్యులను స్థాపించాడు; రాజధాని బీదర్ జిల్లాలోని బసవ కళ్యాణి; రాజ్యం 200 సంవత్సరాలు కొనసాగింది."], ["The educational institutions called 'Ghatikas' were established by the", "'ఘటికలు' అనే విద్యా సంస్థలను స్థాపించినవారు", ["Chalukyas of Kalyani", "Yadavas", "Pandyas", "Kakatiyas"], ["కళ్యాణి చాళుక్యులు", "యాదవులు", "పాండ్యులు", "కాకతీయులు"], 0, "The Chalukyas of Kalyani established educational institutions called Ghatikas; they patronised Sanskrit and Kannada (Bilhana, Ranna).", "కళ్యాణి చాళుక్యులు ఘటికలు అనే విద్యా సంస్థలను స్థాపించారు; సంస్కృతం, కన్నడను ప్రోత్సహించారు (బిల్హణుడు, రన్నుడు)."], ["'Vikramanka Deva Charitra' was written by", "'విక్రమాంకదేవ చరిత్ర' రచయిత", ["Bilhana", "Ranna", "Tikkana", "Vidyanatha"], ["బిల్హణుడు", "రన్నుడు", "తిక్కన", "విద్యానాథుడు"], 0, "Bilhana wrote Vikramanka Deva Charitra; Ranna, the famous Kannada poet, belonged to the court of the Chalukyas of Kalyani.", "బిల్హణుడు విక్రమాంకదేవ చరిత్ర రచించాడు; కన్నడ కవి రన్నుడు కళ్యాణి చాళుక్యుల ఆస్థాన కవి."], ["The capital of the Yadavas was", "యాదవుల రాజధాని", ["Devagiri", "Dwarasamudra", "Madurai", "Orugallu"], ["దేవగిరి", "ద్వారసముద్రం", "మధురై", "ఓరుగల్లు"], 0, "The Yadavas (founder Bhillama, famous king Singhana) ruled the Ahmednagar–Nasik areas with Devagiri as capital; their kingdom extended from the Narmada to Shimoga.", "యాదవుల (స్థాపకుడు భిల్లముడు, ప్రసిద్ధ రాజు సింఘణుడు) రాజధాని దేవగిరి; రాజ్యం నర్మద నుండి షిమోగా వరకు విస్తరించింది."], ["Match the regional kingdoms with their capitals:\nA. Chalukyas of Kalyani   B. Yadavas   C. Hoysalas   D. Pandyas\n1. Madurai   2. Dwarasamudra   3. Devagiri   4. Basava Kalyani", "ప్రాంతీయ రాజ్యాలను వాటి రాజధానులతో జతపరచండి:\nA. కళ్యాణి చాళుక్యులు   B. యాదవులు   C. హొయసలులు   D. పాండ్యులు\n1. మధురై   2. ద్వారసముద్రం   3. దేవగిరి   4. బసవ కళ్యాణి", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Chalukyas of Kalyani – Basava Kalyani; Yadavas – Devagiri; Hoysalas – Dwarasamudra; Pandyas – Madurai.", "కళ్యాణి చాళుక్యులు – బసవ కళ్యాణి; యాదవులు – దేవగిరి; హొయసలులు – ద్వారసముద్రం; పాండ్యులు – మధురై."], ["The Hoysalas rose to prominence during the time of", "హొయసలులు ఎవరి కాలంలో ప్రాముఖ్యం పొందారు", ["Bittiga Vishnuvardhana", "Ballala IV", "Thailapa II", "Singhana"], ["బిట్టిగ విష్ణువర్ధనుడు", "నాల్గవ బల్లాలుడు", "రెండవ తైలపుడు", "సింఘణుడు"], 0, "The Hoysalas of Dwarasamudra rose to prominence during Bittiga Vishnuvardhana's time; Ballala IV was the last ruler. They followed Jainism, Madhwacharya's Dwaita and Ramanuja's Visishtadwaita.", "ద్వారసముద్ర హొయసలులు బిట్టిగ విష్ణువర్ధనుని కాలంలో ప్రాముఖ్యం పొందారు; చివరి రాజు నాల్గవ బల్లాలుడు. జైనం, మధ్వాచార్యుని ద్వైతం, రామానుజుని విశిష్టాద్వైతాన్ని అనుసరించారు."], ["The Pandya king who made a successful expedition up to Ceylon, and whose kingdom was visited and praised by Marco Polo, was", "సిలోన్ వరకు విజయవంతమైన దండయాత్ర చేసిన, మార్కోపోలో సందర్శించి ప్రశంసించిన పాండ్య రాజు", ["Kula Sekhar", "Singhana", "Bhillama", "Prola II"], ["కులశేఖరుడు", "సింఘణుడు", "భిల్లముడు", "రెండవ ప్రోలరాజు"], 0, "Kula Sekhar of the Pandya dynasty (capital Madurai) made a successful expedition up to Ceylon; Marco Polo, a Venetian traveller, praised his administration.", "పాండ్య వంశపు (రాజధాని మధురై) కులశేఖరుడు సిలోన్ వరకు దండయాత్ర చేశాడు; వెనిస్ యాత్రికుడు మార్కోపోలో అతని పాలనను ప్రశంసించాడు."], ["The Kakatiyas are remembered in Indian history mainly because they", "కాకతీయులు భారత చరిత్రలో ప్రధానంగా గుర్తుండేది", ["United the entire Andhra area politically and created a spirit of oneness among the Telugu people", "Ruled all of North India", "Founded Buddhism", "Built the Qutub Minar"], ["ఆంధ్ర ప్రాంతం మొత్తాన్ని రాజకీయంగా ఏకం చేసి తెలుగు ప్రజల్లో ఐక్యత భావన కలిగించడం", "ఉత్తర భారతదేశం మొత్తాన్ని పాలించడం", "బౌద్ధమతం స్థాపించడం", "కుతుబ్ మినార్ నిర్మించడం"], 0, "The Kakatiyas united the entire Andhra area politically, created a spirit of oneness, patriotism and independence among the Telugu people and made the word 'Andhra' respectable.", "కాకతీయులు ఆంధ్ర ప్రాంతాన్ని రాజకీయంగా ఏకం చేసి తెలుగు ప్రజల్లో ఐక్యత, దేశభక్తి, స్వాతంత్ర్య భావన కలిగించి 'ఆంధ్ర' పదానికి గౌరవం తెచ్చారు."], ["Early Kakatiyas served as feudatories to", "తొలి కాకతీయులు ఎవరికి సామంతులుగా ఉన్నారు", ["The Rashtrakutas and the Western Chalukyas", "The Mughals", "The Delhi Sultans", "The Pandyas"], ["రాష్ట్రకూటులు, పశ్చిమ చాళుక్యులు", "మొఘలులు", "ఢిల్లీ సుల్తానులు", "పాండ్యులు"], 0, "Early Kakatiyas served as feudatories to the Rashtrakutas and the Western Chalukyas; the kingdom emerged after the fall of the Western Chalukyas.", "తొలి కాకతీయులు రాష్ట్రకూటులు, పశ్చిమ చాళుక్యులకు సామంతులు; పశ్చిమ చాళుక్యుల పతనం తర్వాత కాకతీయ రాజ్యం ఏర్పడింది."], ["The Kakatiyas worshipped this mother goddess, a form of Durga Devi", "కాకతీయులు పూజించిన, దుర్గాదేవి రూపమైన మాతృదేవత", ["Ammathalli", "Kakati", "Tripurasundari", "Maisamma"], ["అమ్మతల్లి", "కాకతి", "త్రిపురసుందరి", "మైసమ్మ"], 1, "Some historians say the name 'Kakatiya' comes from the deity 'Kakati', a form of Durga Devi, whom they worshipped. (Textbook exercise.)", "కాకతీయులు దుర్గాదేవి రూపమైన 'కాకతి' దేవతను పూజించడం వల్ల ఆ పేరు వచ్చిందని కొందరు చరిత్రకారుల అభిప్రాయం. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The founder of the Kakatiya dynasty was", "కాకతీయ వంశ స్థాపకుడు", ["Gundyana (Gundaya)", "Recharla Rudra", "Ganapathi Deva", "Jayapa"], ["గుండ్యన (గుండయ)", "రేచర్ల రుద్రుడు", "గణపతిదేవుడు", "జాయప"], 0, "The Kakatiya dynasty was founded by Gundyana. (Textbook exercise.)", "కాకతీయ వంశాన్ని గుండ్యన స్థాపించాడు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Telugu region under the Kakatiyas was called", "కాకతీయుల కాలంలో తెలుగు ప్రాంతాన్ని ఇలా పిలిచారు", ["Thrilingadesam", "Dwarasamudra", "Vengi", "Kalinga"], ["త్రిలింగదేశం", "ద్వారసముద్రం", "వేంగి", "కళింగ"], 0, "As per its location, the Telugu region was called Thrilingadesam — the land of three lingas: Kaleswaram, Srisailam and Draksharamam.", "తెలుగు ప్రాంతాన్ని త్రిలింగదేశం అన్నారు — కాళేశ్వరం, శ్రీశైలం, ద్రాక్షారామం అనే మూడు లింగాల నేల."], ["Identify the place that is NOT one of the Thrilinga places", "త్రిలింగ క్షేత్రాలలో లేనిది", ["Kaleswaram", "Srisailam", "Draksharamam", "Tirupati"], ["కాళేశ్వరం", "శ్రీశైలం", "ద్రాక్షారామం", "తిరుపతి"], 3, "The Thrilinga places are Kaleswaram (Telangana), Srisailam (Rayalaseema) and Draksharamam (Coastal Andhra).", "త్రిలింగ క్షేత్రాలు: కాళేశ్వరం (తెలంగాణ), శ్రీశైలం (రాయలసీమ), ద్రాక్షారామం (కోస్తా ఆంధ్ర)."], ["The Kakatiyas started their rule with this place as their (early) capital", "కాకతీయులు తమ పాలనను ప్రారంభించిన తొలి రాజధాని", ["Hanumakonda", "Orugallu", "Devagiri", "Rekapalle"], ["హనుమకొండ", "ఓరుగల్లు", "దేవగిరి", "రేకపల్లి"], 0, "The Kakatiyas started their rule from Hanumakonda; later Rudra Deva built Orugallu and the capital was shifted there.", "కాకతీయులు హనుమకొండ నుండి పాలన మొదలుపెట్టారు; తర్వాత రుద్రదేవుడు ఓరుగల్లు నిర్మించగా రాజధాని అక్కడికి మారింది."], ["The present name of Orugallu, the new capital built by Rudra Deva, is", "రుద్రదేవుడు నిర్మించిన కొత్త రాజధాని ఓరుగల్లు నేటి పేరు", ["Hanumakonda", "Warangal", "Karimnagar", "Khammam"], ["హనుమకొండ", "వరంగల్", "కరీంనగర్", "ఖమ్మం"], 1, "The present name of Orugallu is Warangal; its ancient name was Ekasila Nagaram.", "ఓరుగల్లు నేటి పేరు వరంగల్; దాని ప్రాచీన పేరు ఏకశిలా నగరం."], ["The poet of the Kakatiya period who contributed the first poetic work 'Srimadandhra Mahabharatham' in Telugu was", "కాకతీయుల కాలంలో 'శ్రీమదాంధ్ర మహాభారతం' రచించిన కవి", ["Tikkana", "Nannechoda", "Palkuriki Somanatha", "Vidyanatha"], ["తిక్కన", "నన్నెచోడుడు", "పాల్కురికి సోమనాథుడు", "విద్యానాథుడు"], 0, "Tikkana, who contributed Srimadandhra Mahabharatham in Telugu, belonged to the Kakatiya period.", "తెలుగులో శ్రీమదాంధ్ర మహాభారతం రచించిన తిక్కన కాకతీయుల కాలానికి చెందినవాడు."], ["Arrange the Kakatiya rulers in chronological order:\nP. Ganapathi Deva   Q. Prola II   R. Rudrama Devi   S. Rudra Deva   T. Pratapa Rudra", "కాకతీయ రాజులను కాలక్రమంలో అమర్చండి:\nP. గణపతిదేవుడు   Q. రెండవ ప్రోలరాజు   R. రుద్రమదేవి   S. రుద్రదేవుడు   T. ప్రతాపరుద్రుడు", ["Q, S, P, R, T", "S, Q, P, R, T", "Q, P, S, R, T", "Q, S, R, P, T"], ["Q, S, P, R, T", "S, Q, P, R, T", "Q, P, S, R, T", "Q, S, R, P, T"], 0, "Prola II (1115–1157) → Rudra Deva (1158–1195) → (Maha Deva) → Ganapathi Deva (1199–1262) → Rudrama Devi (1262–1289) → Pratapa Rudra (1289–1323).", "రెండవ ప్రోలరాజు (1115–1157) → రుద్రదేవుడు (1158–1195) → (మహాదేవుడు) → గణపతిదేవుడు (1199–1262) → రుద్రమదేవి (1262–1289) → ప్రతాపరుద్రుడు (1289–1323)."], ["The first independent ruler of the Kakatiyas, who threw off the lordship of the Chalukyas, was", "చాళుక్యుల ఆధిపత్యాన్ని వదిలించుకున్న కాకతీయుల మొదటి స్వతంత్ర పాలకుడు", ["Prola II", "Rudra Deva", "Gundyana", "Ganapathi Deva"], ["రెండవ ప్రోలరాజు", "రుద్రదేవుడు", "గుండ్యన", "గణపతిదేవుడు"], 0, "Prola II (1115–1157), son of Betha Raju II, threw off the lordship of the Chalukyas and started independent rule from Hanumakonda.", "బేతరాజు II కుమారుడు రెండవ ప్రోలరాజు (1115–1157) చాళుక్యుల ఆధిపత్యాన్ని వదిలించుకుని హనుమకొండ నుండి స్వతంత్ర పాలన మొదలుపెట్టాడు."], ["Rudra Deva's achievements are described in the", "రుద్రదేవుని విజయాలు ఈ శాసనంలో వర్ణించబడ్డాయి", ["Hanumakonda inscription", "Motupalli inscription", "Vilasa grant", "Aihole inscription"], ["హనుమకొండ శాసనం", "మోటుపల్లి శాసనం", "విలస తామ్ర శాసనం", "ఐహోలు శాసనం"], 0, "Rudra Deva's achievements are described in the Hanumakonda inscription.", "రుద్రదేవుని విజయాలు హనుమకొండ శాసనంలో వర్ణించబడ్డాయి."], ["The book 'Neetisara' in Sanskrit was written by the Kakatiya king", "సంస్కృతంలో 'నీతిసారం' రచించిన కాకతీయ రాజు", ["Rudra Deva", "Ganapathi Deva", "Prataparudra", "Prola II"], ["రుద్రదేవుడు", "గణపతిదేవుడు", "ప్రతాపరుద్రుడు", "రెండవ ప్రోలరాజు"], 0, "Rudra Deva wrote Neetisara in Sanskrit, built the Thousand Pillar temple at Hanumakonda and built the new capital Orugallu.", "రుద్రదేవుడు సంస్కృతంలో నీతిసారం రచించాడు; హనుమకొండలో వేయి స్తంభాల గుడి, కొత్త రాజధాని ఓరుగల్లు నిర్మించాడు."], ["The Kakatiya king who died while besieging the Yadava capital Devagiri was", "యాదవ రాజధాని దేవగిరిని ముట్టడిస్తూ మరణించిన కాకతీయ రాజు", ["Maha Deva", "Ganapathi Deva", "Prola II", "Pratapa Rudra"], ["మహాదేవుడు", "గణపతిదేవుడు", "రెండవ ప్రోలరాజు", "ప్రతాపరుద్రుడు"], 0, "Rudra Deva was succeeded by his brother Maha Deva (1195–1199), who invaded the Yadava kingdom and died in the attack on Devagiri.", "రుద్రదేవుని తర్వాత అతని తమ్ముడు మహాదేవుడు (1195–1199) యాదవ రాజ్యంపై దండెత్తి దేవగిరి ముట్టడిలో మరణించాడు."], ["The period of this Kakatiya ruler, who ruled for 63 years, is called the 'Golden era'", "63 సంవత్సరాలు పాలించిన ఈ కాకతీయ రాజు కాలాన్ని 'స్వర్ణయుగం' అంటారు", ["Rudra Deva", "Ganapathi Deva", "Rudrama Devi", "Pratapa Rudra"], ["రుద్రదేవుడు", "గణపతిదేవుడు", "రుద్రమదేవి", "ప్రతాపరుద్రుడు"], 1, "Ganapathi Deva (1199–1262) ruled for 63 years; his period is called the Golden era. He had the title Mahamandaleswara.", "గణపతిదేవుడు (1199–1262) 63 సంవత్సరాలు పాలించాడు; అతని కాలాన్ని స్వర్ణయుగం అంటారు. 'మహామండలేశ్వర' బిరుదు ఉంది."], ["The Motupalli inscription, which enunciated principles of taxation and foreign trade, was issued by", "పన్నులు, విదేశీ వ్యాపార సూత్రాలను తెలిపిన మోటుపల్లి శాసనాన్ని జారీ చేసినవారు", ["Rudrama Devi", "Rudra Deva", "Prataparudra", "Ganapathi Deva"], ["రుద్రమదేవి", "రుద్రదేవుడు", "ప్రతాపరుద్రుడు", "గణపతిదేవుడు"], 3, "Ganapathi Deva issued the Motupalli inscription, enunciating principles of taxation, foreign trade and taxes on goods. (Textbook exercise.)", "గణపతిదేవుడు మోటుపల్లి శాసనం జారీ చేసి పన్నులు, విదేశీ వ్యాపార సూత్రాలను తెలిపాడు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Ganapathi Deva invaded the coastal region and captured Vijayawada and the island of", "గణపతిదేవుడు తీర ప్రాంతంపై దండెత్తి విజయవాడ, ఈ దీవిని స్వాధీనం చేసుకున్నాడు", ["Diviseema", "Sriharikota", "Ceylon", "Rameswaram"], ["దివిసీమ", "శ్రీహరికోట", "సిలోన్", "రామేశ్వరం"], 0, "Ganapathi Deva captured Vijayawada and the island of Diviseema; his empire stretched from the Godavari region to Chengalpattu.", "గణపతిదేవుడు విజయవాడ, దివిసీమ దీవిని స్వాధీనం చేసుకున్నాడు; అతని సామ్రాజ్యం గోదావరి ప్రాంతం నుండి చెంగల్పట్టు వరకు విస్తరించింది."], ["The mythical bird (swan) whose image is kept on both sides at the top of the Kakatiya Kalathoranam is called", "కాకతీయ కళాతోరణం పైభాగంలో రెండు వైపులా ఉండే పౌరాణిక పక్షి (హంస)ని ఇలా అంటారు", ["Annapakshi", "Garuda", "Mayura", "Kokila"], ["అన్నపక్షి", "గరుడ", "మయూరం", "కోకిల"], 0, "The Sanskrit word Annapakshi refers to a mythical bird, the swan; its image is on both sides at the top of the Kakatiya Kalathoranam.", "అన్నపక్షి అనే సంస్కృత పదం పౌరాణిక హంసను సూచిస్తుంది; దాని బొమ్మ కాకతీయ కళాతోరణం పైభాగంలో రెండు వైపులా ఉంటుంది."], ["The one and only woman ruler of the Kakatiya dynasty was", "కాకతీయ వంశంలో ఏకైక మహిళా పాలకురాలు", ["Muppamamba", "Rudrama Devi", "Mailamba", "Razia Sultana"], ["ముప్పమాంబ", "రుద్రమదేవి", "మైలాంబ", "రజియా సుల్తానా"], 1, "Rudrama Devi (1262–1289) was the one and only woman ruler of the Kakatiya dynasty; her other names were Rudramamba and Rudradeva Maharaja.", "రుద్రమదేవి (1262–1289) కాకతీయ వంశ ఏకైక మహిళా పాలకురాలు; ఆమెకు రుద్రమాంబ, రుద్రదేవ మహారాజు అనే పేర్లు కూడా ఉన్నాయి."], ["The Italian (Venetian) traveller who visited Rudrama Devi's court and praised her administration was", "రుద్రమదేవి ఆస్థానాన్ని సందర్శించి ఆమె పాలనను ప్రశంసించిన ఇటలీ (వెనిస్) యాత్రికుడు", ["Marco Polo", "Ibn Battuta", "Alberuni", "Megasthenes"], ["మార్కోపోలో", "ఇబన్ బటూటా", "అల్‌బెరూనీ", "మెగస్తనీస్"], 0, "Marco Polo visited Rudrama Devi's court and paid tributes to her administration; he wrote that Andhra Desha was famous for valuable stones, ornaments and diamonds.", "మార్కోపోలో రుద్రమదేవి ఆస్థానాన్ని సందర్శించి ఆమె పాలనను ప్రశంసించాడు; ఆంధ్రదేశం విలువైన రాళ్ళు, ఆభరణాలు, వజ్రాలకు ప్రసిద్ధి అని రాశాడు."], ["Rudrama Devi defeated the rebellious Kakatiya feudatory who opposed her rule in Nellore and recovered Tripurantakam. He was", "నెల్లూరులో రుద్రమదేవి పాలనను వ్యతిరేకించిన సామంతుడిని ఓడించి త్రిపురాంతకాన్ని తిరిగి సాధించింది. ఆ సామంతుడు", ["Ambadeva", "Mahadeva", "Ulugh Khan", "Recharla Rudra"], ["అంబదేవుడు", "మహాదేవుడు", "ఉలుగ్ ఖాన్", "రేచర్ల రుద్రుడు"], 0, "Kakatiya feudatory Ambadeva opposed Rudrama Devi's rule in Nellore; she herself invaded with a large army, defeated him and recovered Tripurantakam.", "కాకతీయ సామంతుడు అంబదేవుడు నెల్లూరులో రుద్రమదేవిని వ్యతిరేకించాడు; ఆమె స్వయంగా పెద్ద సైన్యంతో దండెత్తి అతన్ని ఓడించి త్రిపురాంతకాన్ని సాధించింది."], ["Rudrama Devi married Chalukya Veerabhadra, the ruler of", "రుద్రమదేవి వివాహమాడిన చాళుక్య వీరభద్రుడు ఈ ప్రాంత పాలకుడు", ["Nidadavole", "Rajahmundry", "Nellore", "Vijayawada"], ["నిడదవోలు", "రాజమహేంద్రవరం", "నెల్లూరు", "విజయవాడ"], 0, "Rudrama Devi married Chalukya Veerabhadra, ruler of Nidadavole (now in West Godavari district). She declared her grandson Pratapa Rudra as heir-apparent.", "రుద్రమదేవి నిడదవోలు (పశ్చిమ గోదావరి) పాలకుడు చాళుక్య వీరభద్రుని వివాహమాడింది. మనవడు ప్రతాపరుద్రుని వారసునిగా ప్రకటించింది."], ["Rudrama Devi completed the construction of the fort of Orugallu, which was started by", "రుద్రమదేవి పూర్తి చేసిన ఓరుగల్లు కోట నిర్మాణాన్ని ప్రారంభించినవారు", ["Her father Ganapathi Deva", "Prola II", "Pratapa Rudra", "Maha Deva"], ["ఆమె తండ్రి గణపతిదేవుడు", "రెండవ ప్రోలరాజు", "ప్రతాపరుద్రుడు", "మహాదేవుడు"], 0, "Rudrama Devi completed the construction of the Orugallu fort started by her father Ganapathi Deva; she also built tanks and temples.", "తండ్రి గణపతిదేవుడు ప్రారంభించిన ఓరుగల్లు కోట నిర్మాణాన్ని రుద్రమదేవి పూర్తి చేసింది; చెరువులు, ఆలయాలు కూడా నిర్మించింది."], ["The Kakatiyas divided their territories among military chiefs who maintained a stipulated number of troops for the king. They were called", "కాకతీయులు తమ భూభాగాలను విభజించి ఇచ్చిన, రాజు కోసం నిర్ణీత సైన్యాన్ని పోషించిన సైనిక నాయకులు", ["Nayankaras", "Muqtis", "Ayagars", "Sunkadhikaris"], ["నాయంకరులు", "ముక్తీలు", "ఆయగార్లు", "సుంకాధికారులు"], 0, "The administration was organised on a military basis; territories were divided among military chiefs called Nayankaras, who maintained troops and could be transferred. There were about 72 Nayankaras under Pratapa Rudra.", "కాకతీయ పాలన సైనిక ఆధారంగా సాగింది; భూభాగాలను నాయంకరులు అనే సైనిక నాయకులకు ఇచ్చారు; వారు సైన్యాన్ని పోషించేవారు, బదిలీ అయ్యేవారు. ప్రతాపరుద్రుని కాలంలో సుమారు 72 మంది నాయంకరులు ఉండేవారు."], ["In Kakatiya village administration, a group of about ten to sixty villages was called a ____ and a combination of several of these formed a ____", "కాకతీయ గ్రామ పరిపాలనలో 10 నుండి 60 గ్రామాల సమూహాన్ని ____ అని, అలాంటి అనేకం కలిస్తే ____ అని అన్నారు", ["Sthala; Nadu", "Nadu; Sthala", "Iqta; Pargana", "Mandal; Zilla"], ["స్థలం; నాడు", "నాడు; స్థలం", "ఇక్తా; పరగణా", "మండలం; జిల్లా"], 0, "The village divisions were Sthala (a group of ten to sixty villages) and Nadu (a combination of several Sthalas).", "గ్రామ విభాగాలు: స్థలం (10–60 గ్రామాల సమూహం), నాడు (అనేక స్థలాల కలయిక)."], ["The village officials who looked after the villages in the Kakatiya period were called", "కాకతీయుల కాలంలో గ్రామాలను చూసుకున్న గ్రామ అధికారులు", ["Ayagars", "Muqtis", "Nayankaras", "Bandagan"], ["ఆయగార్లు", "ముక్తీలు", "నాయంకరులు", "బందగాన్"], 0, "The villages were looked after by village officials called Ayagars; the village was the basic unit of administration.", "గ్రామాలను ఆయగార్లు అనే గ్రామ అధికారులు చూసుకునేవారు; గ్రామం పరిపాలనకు మూల యూనిట్."], ["Match the Kakatiya village officials with their duties:\nA. Karanam   B. Reddi   C. Talari\n1. Village policeman   2. Village headman   3. Kept village records", "కాకతీయ గ్రామ అధికారులను వారి విధులతో జతపరచండి:\nA. కరణం   B. రెడ్డి   C. తలారి\n1. గ్రామ రక్షకభటుడు   2. గ్రామ పెద్ద   3. గ్రామ రికార్డులు ఉంచేవాడు", ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], 0, "Karanam – kept village records; Reddi – village headman; Talari – village policeman.", "కరణం – గ్రామ రికార్డులు; రెడ్డి – గ్రామ పెద్ద; తలారి – గ్రామ రక్షకభటుడు."], ["In every village some land was kept under the king's possession. It was called", "ప్రతి గ్రామంలో రాజు ఆధీనంలో ఉంచిన భూమిని ఇలా అన్నారు", ["Velipolam", "Rachapolam", "Thotapolam", "All the above"], ["వెలిపొలం", "రాచపొలం", "తోటపొలం", "పైవన్నీ"], 1, "Rachapolam was the king's land in every village, given to farmers on rent; those who cultivated it were called Artha seeri. (Textbook exercise.)", "రాచపొలం ప్రతి గ్రామంలో రాజు భూమి; దానిని రైతులకు కౌలుకు ఇచ్చేవారు; సాగు చేసినవారిని అర్థసీరి అన్నారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Match the Kakatiya land divisions:\nA. Rachapolam   B. Thotapolam (Thota bhumi)\n1. Land related to plants (gardens)   2. Government (king's) land", "కాకతీయ భూ విభాగాలను జతపరచండి:\nA. రాచపొలం   B. తోటపొలం (తోటభూమి)\n1. తోటల భూమి   2. ప్రభుత్వ (రాజు) భూమి", ["A-2, B-1", "A-1, B-2", "Both are government land", "Both are garden land"], ["A-2, B-1", "A-1, B-2", "రెండూ ప్రభుత్వ భూములు", "రెండూ తోట భూములు"], 0, "Rachapolam – government (king's) land; Thotapolam (Thota bhumi) – land related to plants (gardens). Velipolam (Velichenu) was another land division.", "రాచపొలం – ప్రభుత్వ (రాజు) భూమి; తోటపొలం (తోటభూమి) – తోటల భూమి. వెలిపొలం (వెలిచేను) మరో భూ విభాగం."], ["Match the Kakatiya taxes:\nA. Illari   B. Pullari   C. Addapattu sunkam\n1. Tax on flocks (sheep/cattle)   2. Tax on forest products   3. House tax", "కాకతీయ పన్నులను జతపరచండి:\nA. ఇల్లరి   B. పుల్లరి   C. అడ్డపట్టు సుంకం\n1. మందలపై పన్ను   2. అటవీ ఉత్పత్తులపై పన్ను   3. ఇంటి పన్ను", ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], ["A-3, B-2, C-1", "A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2"], 0, "Illari – house tax; Pullari – tax on forest products; Addapattu sunkam – tax on flocks. Darisanam, Appanam and Upakruthi were paid directly to the king.", "ఇల్లరి – ఇంటి పన్ను; పుల్లరి – అటవీ ఉత్పత్తుల పన్ను; అడ్డపట్టు సుంకం – మందల పన్ను. దరిశనం, అప్పనం, ఉపకృతి రాజుకు నేరుగా చెల్లించేవారు."], ["Officials appointed by the Kakatiyas for tax collection were called", "పన్నుల వసూలుకు కాకతీయులు నియమించిన అధికారులు", ["Sunkadhikaris", "Ayagars", "Karanams", "Nayankaras"], ["సుంకాధికారులు", "ఆయగార్లు", "కరణాలు", "నాయంకరులు"], 0, "The Kakatiyas appointed Sunkadhikaris for tax collection.", "పన్నుల వసూలుకు కాకతీయులు సుంకాధికారులను నియమించారు."], ["To develop foreign trade, the Kakatiyas developed the port of", "విదేశీ వ్యాపారం కోసం కాకతీయులు అభివృద్ధి చేసిన రేవు", ["Motupalli", "Lothal", "Calicut", "Machilipatnam only"], ["మోటుపల్లి", "లోథాల్", "కాలికట్", "మచిలీపట్నం మాత్రమే"], 0, "Kakatiya kings gave importance to foreign trade and developed Motupalli port.", "కాకతీయ రాజులు విదేశీ వ్యాపారానికి ప్రాముఖ్యమిచ్చి మోటుపల్లి రేవును అభివృద్ధి చేశారు."], ["'Sivatatva Saaram' was written by", "'శివతత్వసారం' రచయిత", ["Mallikarjuna Panditharadhya", "Jayapa", "Palkuriki Somanatha", "Nannechoda"], ["మల్లికార్జున పండితారాధ్యుడు", "జాయప", "పాల్కురికి సోమనాథుడు", "నన్నెచోడుడు"], 0, "Mallikarjuna Panditharadhya, a follower of the Veera Saiva tradition in the Kakatiya period, wrote Sivatatva Saaram. Saivism and Veerasaivism were very popular. (Textbook exercise.)", "కాకతీయుల కాలంలో వీరశైవ సంప్రదాయానికి చెందిన మల్లికార్జున పండితారాధ్యుడు శివతత్వసారం రచించాడు. శైవం, వీరశైవం బాగా ప్రాచుర్యం పొందాయి. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Match the literary works with their authors:\nA. Basava Puranam   B. Kumarasambhavam   C. Nrutya Ratnavali   D. Prataparudreeyamu\n1. Vidyanatha   2. Jayapa Senani   3. Nannechoda   4. Palkuriki Somanatha", "గ్రంథాలను వాటి రచయితలతో జతపరచండి:\nA. బసవపురాణం   B. కుమారసంభవం   C. నృత్తరత్నావళి   D. ప్రతాపరుద్రీయం\n1. విద్యానాథుడు   2. జాయప సేనాని   3. నన్నెచోడుడు   4. పాల్కురికి సోమనాథుడు", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Basava Puranam – Palkuriki Somanatha; Kumarasambhavam – Nannechoda; Nrutya Ratnavali (and Geetha Ratnavali) – Jayapa Senani; Prataparudreeyamu – Vidyanatha. (Textbook match the following.)", "బసవపురాణం – పాల్కురికి సోమనాథుడు; కుమారసంభవం – నన్నెచోడుడు; నృత్తరత్నావళి (గీతరత్నావళి) – జాయప సేనాని; ప్రతాపరుద్రీయం – విద్యానాథుడు. (పాఠ్యపుస్తక జతపరచడం.)"], ["The famous dance of the Kakatiya period, performed at the time of warfare to inspire soldiers, is", "యుద్ధ సమయంలో సైనికులకు ఉత్సాహం కలిగించడానికి ప్రదర్శించిన కాకతీయుల కాలపు ప్రసిద్ధ నృత్యం", ["Perini Natyam", "Kuchipudi", "Bharatanatyam", "Kathak"], ["పేరిణి నాట్యం", "కూచిపూడి", "భరతనాట్యం", "కథక్"], 0, "Perini Natyam was performed during warfare to motivate soldiers; Nataraja Ramakrishna, a Padma Shri awardee, was famous in it.", "పేరిణి నాట్యం యుద్ధ సమయంలో సైనికులను ఉత్తేజపరచడానికి ప్రదర్శించేవారు; పద్మశ్రీ నటరాజ రామకృష్ణ దీనికి ప్రసిద్ధులు."], ["The Thousand Pillar temple (Rudreswara temple, 'Veyi Sthambhala Gudi') at Hanumakonda was built by", "హనుమకొండలోని వేయి స్తంభాల గుడి (రుద్రేశ్వరాలయం) నిర్మాత", ["Rudra Deva", "Ganapathi Deva", "Recharla Rudra", "Rudrama Devi"], ["రుద్రదేవుడు", "గణపతిదేవుడు", "రేచర్ల రుద్రుడు", "రుద్రమదేవి"], 0, "The Thousand Pillar temple, also called Rudreswara temple, at Hanumakonda was built by Rudra Deva; its rock-cut elephants and monolithic dolerite Nandi are main attractions.", "హనుమకొండలోని వేయి స్తంభాల గుడి (రుద్రేశ్వరాలయం)ను రుద్రదేవుడు నిర్మించాడు; రాతి ఏనుగులు, ఏకశిలా డోలరైట్ నంది ప్రధాన ఆకర్షణలు."], ["The Ramappa temple near Palampet, whose deity is Ramalingeswara Swamy, was built by", "రామలింగేశ్వర స్వామి కొలువైన, పాలంపేట సమీపంలోని రామప్ప ఆలయ నిర్మాత", ["Recharla Rudra, a commander of Ganapathi Deva", "Rudra Deva", "Prataparudra", "Musunuri Kapaya Nayaka"], ["గణపతిదేవుని సేనాని రేచర్ల రుద్రుడు", "రుద్రదేవుడు", "ప్రతాపరుద్రుడు", "ముసునూరి కాపయ నాయకుడు"], 0, "The Ramappa temple was built by Recharla Rudra, a commander of Ganapathi Deva. It is on a star-shaped platform, with black granite statues; some pillars produce saptaswaras.", "రామప్ప ఆలయాన్ని గణపతిదేవుని సేనాని రేచర్ల రుద్రుడు నిర్మించాడు. నక్షత్రాకార వేదికపై, నల్ల గ్రానైట్ విగ్రహాలతో ఉంది; కొన్ని స్తంభాలు సప్తస్వరాలు పలుకుతాయి."], ["The Kakatiya temple style that followed the Mandapa, Antharalaya and Garbhagriha model is also called", "మండపం, అంతరాలయం, గర్భగృహం నమూనాను అనుసరించిన కాకతీయ ఆలయ శైలిని ఇలా కూడా అంటారు", ["Thrikuta method", "Vesara style", "Arcuate style", "Mamalla style"], ["త్రికూట పద్ధతి", "వేసర శైలి", "ఆర్క్యుయేట్ శైలి", "మామల్ల శైలి"], 0, "Kakatiya temple architecture followed the Mandapa, Antharalaya and Garbhagriha model with pillar sculptures — also called the Thrikuta method.", "కాకతీయ ఆలయ వాస్తు మండపం, అంతరాలయం, గర్భగృహం నమూనాతో స్తంభ శిల్పాలను అనుసరించింది — దీనిని త్రికూట పద్ధతి అంటారు."], ["The Kakatiya kingdom was finally occupied by the Delhi Sultans when this commander invaded it in 1323 CE", "1323లో ఈ సేనాని దండయాత్రతో కాకతీయ రాజ్యాన్ని ఢిల్లీ సుల్తానులు ఆక్రమించారు", ["Ulugh Khan", "Malik Kafur", "Timur", "Alauddin Khilji"], ["ఉలుగ్ ఖాన్", "మాలిక్ కాఫర్", "తైమూర్", "అల్లావుద్దీన్ ఖిల్జీ"], 0, "During Pratapa Rudra's time the Delhi Sultans invaded many times; the kingdom was finally occupied when Ulugh Khan invaded in 1323 CE and Pratapa Rudra was taken prisoner.", "ప్రతాపరుద్రుని కాలంలో ఢిల్లీ సుల్తానులు అనేకసార్లు దండెత్తారు; 1323లో ఉలుగ్ ఖాన్ దండయాత్రతో రాజ్యం ఆక్రమించబడింది, ప్రతాపరుద్రుడు బందీ అయ్యాడు."], ["After the fall of the Kakatiyas, Prolaya Nayaka came to power and made this place his capital, in the Sabari river valley near Papikondalu", "కాకతీయుల పతనం తర్వాత ప్రోలయ నాయకుడు అధికారంలోకి వచ్చి పాపికొండల సమీపంలోని శబరి నదీ లోయలోని ఈ ప్రదేశాన్ని రాజధానిగా చేసుకున్నాడు", ["Rekapalle", "Warangal", "Kondaveedu", "Addanki"], ["రేకపల్లి", "వరంగల్", "కొండవీడు", "అద్దంకి"], 0, "According to the Vilasa grant, Prolaya Nayaka came to power at Rekapalle — a strategically protected narrow Sabari river valley near Papikondalu; the Konda Reddis may have helped him.", "విలస తామ్ర శాసనం ప్రకారం ప్రోలయ నాయకుడు రేకపల్లిలో అధికారంలోకి వచ్చాడు — ఇది పాపికొండల సమీపంలోని శబరి నదీ లోయలో రక్షిత ప్రాంతం; కొండరెడ్లు సహాయపడి ఉండవచ్చు."], ["Musunuri Kapaya Nayaka, who led a larger rebellion to drive the Tughlaqs out of Warangal in 1336 CE, was the brother of", "1336లో తుగ్లక్‌లను వరంగల్ నుండి తరిమేయడానికి పెద్ద తిరుగుబాటు చేసిన ముసునూరి కాపయ నాయకుడు ఎవరి సోదరుడు", ["Prolaya Nayaka", "Pratapa Rudra", "Prolaya Vema Reddi", "Ambadeva"], ["ప్రోలయ నాయకుడు", "ప్రతాపరుద్రుడు", "ప్రోలయ వేమారెడ్డి", "అంబదేవుడు"], 0, "Musunuri Kapaya Nayaka (1335–1368 CE) came to the throne after his brother Prolaya Nayaka and rebelled against the Tughlaqs in 1336 CE.", "ముసునూరి కాపయ నాయకుడు (1335–1368) తన సోదరుడు ప్రోలయ నాయకుని తర్వాత అధికారంలోకి వచ్చి 1336లో తుగ్లక్‌లపై తిరుగుబాటు చేశాడు."]]}, {"n": 6, "en": "Vijayanagara Empire", "te": "విజయనగర సామ్రాజ్యం", "c": "#dc2626", "q": [["When Muhammad bin Tughlaq was losing his power in the Deccan, two new kingdoms emerged in South India. They were", "దక్కన్‌లో మహమ్మద్ బిన్ తుగ్లక్ అధికారం బలహీనపడుతున్నప్పుడు దక్షిణ భారతదేశంలో ఏర్పడిన రెండు కొత్త రాజ్యాలు", ["Vijayanagara and Bahmani", "Kakatiya and Chola", "Pallava and Chalukya", "Satavahana and Ikshvaku"], ["విజయనగర, బహమనీ", "కాకతీయ, చోళ", "పల్లవ, చాళుక్య", "శాతవాహన, ఇక్ష్వాకు"], 0, "As Muhammad bin Tughlaq lost power in the Deccan, the Vijayanagara and Bahmani kingdoms emerged. (Textbook exercise: Vijayanagara was established during Muhammad bin Tughlaq's reign.)", "దక్కన్‌లో మహమ్మద్ బిన్ తుగ్లక్ అధికారం తగ్గుతున్నప్పుడు విజయనగర, బహమనీ రాజ్యాలు ఏర్పడ్డాయి. (పాఠ్యపుస్తక అభ్యాసం: విజయనగరం మహమ్మద్ బిన్ తుగ్లక్ కాలంలో ఏర్పడింది.)"], ["The Vijayanagara Empire occupied a glorious place in Indian history for more than 300 years, from", "విజయనగర సామ్రాజ్యం 300 సంవత్సరాలకు పైగా భారత చరిత్రలో విశిష్ట స్థానం పొందిన కాలం", ["1336 CE to 1646 CE", "1206 CE to 1526 CE", "1115 CE to 1323 CE", "1347 CE to 1482 CE"], ["క్రీ.శ. 1336 – 1646", "క్రీ.శ. 1206 – 1526", "క్రీ.శ. 1115 – 1323", "క్రీ.శ. 1347 – 1482"], 0, "The Vijayanagara Empire lasted from 1336 CE to 1646 CE — more than three hundred years.", "విజయనగర సామ్రాజ్యం క్రీ.శ. 1336 నుండి 1646 వరకు — మూడు వందల సంవత్సరాలకు పైగా — కొనసాగింది."], ["The capital of the Vijayanagara Empire, said to be bigger and richer than London and Paris of that time, was", "ఆ కాలపు లండన్, పారిస్ కంటే పెద్దదిగా, సంపన్నంగా ఉన్న విజయనగర సామ్రాజ్య రాజధాని", ["Hampi", "Gulbarga", "Warangal", "Kondaveedu"], ["హంపి", "గుల్బర్గా", "వరంగల్", "కొండవీడు"], 0, "Hampi (in present Karnataka) was the capital — the second largest city in the world then, bigger and richer than London and Paris; traders traded gems in its streets.", "హంపి (నేటి కర్ణాటక) రాజధాని — అప్పట్లో ప్రపంచంలో రెండవ పెద్ద నగరం; లండన్, పారిస్ కంటే పెద్దది, సంపన్నమైనది; వీధుల్లో రత్నాల వ్యాపారం జరిగేది."], ["The Vijayanagara Empire was founded in 1336 CE by Harihara Raya I and Bukka Raya I with the encouragement of", "1336లో హరిహరరాయలు, బుక్కరాయలు ఎవరి ప్రోత్సాహంతో విజయనగర సామ్రాజ్యాన్ని స్థాపించారు", ["Swami Vidyaranya", "Thimmarusu", "Tenali Ramakrishna", "Siddhendra Yogi"], ["స్వామి విద్యారణ్యులు", "తిమ్మరుసు", "తెనాలి రామకృష్ణుడు", "సిద్ధేంద్ర యోగి"], 0, "The empire was founded in 1336 CE by brothers Harihara Raya I and Bukka Raya I of the Sangama dynasty with the encouragement of Swami Vidyaranya.", "సంగమ వంశపు సోదరులు హరిహరరాయలు, బుక్కరాయలు స్వామి విద్యారణ్యుల ప్రోత్సాహంతో 1336లో విజయనగర సామ్రాజ్యాన్ని స్థాపించారు."], ["Harihara and Bukka first served in the court of the Kakatiya king", "హరిహర, బుక్కరాయలు మొదట ఈ కాకతీయ రాజు ఆస్థానంలో పనిచేశారు", ["Prataparudra II of Warangal", "Ganapathi Deva", "Rudra Deva", "Prola II"], ["వరంగల్ ప్రతాపరుద్రుడు II", "గణపతిదేవుడు", "రుద్రదేవుడు", "రెండవ ప్రోలరాజు"], 0, "Harihara and Bukka first served in the court of Kakatiya king Prataparudra II of Warangal (1323 CE), later moved to Kampili.", "హరిహర, బుక్కరాయలు మొదట వరంగల్ కాకతీయ రాజు ప్రతాపరుద్రుని ఆస్థానంలో పనిచేసి, తర్వాత కంపిలి రాజ్యానికి వెళ్ళారు."], ["The new city of Vijayanagaram was established in 1336 CE on the south bank of the river", "1336లో విజయనగరం అనే కొత్త నగరాన్ని ఈ నది దక్షిణ తీరంలో స్థాపించారు", ["Tungabhadra", "Krishna", "Godavari", "Kaveri"], ["తుంగభద్ర", "కృష్ణా", "గోదావరి", "కావేరి"], 0, "In 1336 CE they established the new city Vijayanagaram on the south bank of the Tungabhadra.", "1336లో తుంగభద్ర నది దక్షిణ తీరాన విజయనగరం అనే కొత్త నగరాన్ని స్థాపించారు."], ["The ruins at Hampi were brought to light in 1805 by the first Surveyor General of India", "1805లో హంపి శిథిలాలను వెలుగులోకి తెచ్చిన భారతదేశ మొదటి సర్వేయర్ జనరల్", ["Colonel Colin Mackenzie", "James Prinsep", "Alexander Cunningham", "Mortimer Wheeler"], ["కల్నల్ కాలిన్ మెకంజీ", "జేమ్స్ ప్రిన్సెప్", "అలెగ్జాండర్ కన్నింగ్‌హామ్", "మార్టిమర్ వీలర్"], 0, "Colonel Colin Mackenzie, an engineer and antiquarian of the English East India Company and the first Surveyor General of India, brought the Hampi ruins to light in 1805.", "ఈస్ట్ ఇండియా కంపెనీ ఇంజనీర్, పురాతత్వవేత్త, భారత మొదటి సర్వేయర్ జనరల్ కల్నల్ కాలిన్ మెకంజీ 1805లో హంపి శిథిలాలను వెలుగులోకి తెచ్చారు."], ["Kumara Kampana, who destroyed the Madurai Sultans and extended Vijayanagara up to Rameswaram, was the son of", "మధురై సుల్తానులను నాశనం చేసి విజయనగరాన్ని రామేశ్వరం వరకు విస్తరించిన కుమార కంపనుడు ఎవరి కుమారుడు", ["Bukka Raya I", "Harihara Raya I", "Deva Raya II", "Krishna Deva Raya"], ["మొదటి బుక్కరాయలు", "మొదటి హరిహరరాయలు", "రెండవ దేవరాయలు", "శ్రీకృష్ణదేవరాయలు"], 0, "Kumara Kampana, son of Bukka Raya I, destroyed the Madurai Sultans after a four-decade struggle; the empire then comprised the whole of South India up to Rameswaram.", "మొదటి బుక్కరాయల కుమారుడు కుమార కంపనుడు నాలుగు దశాబ్దాల పోరాటం తర్వాత మధురై సుల్తానులను నాశనం చేశాడు; సామ్రాజ్యం రామేశ్వరం వరకు విస్తరించింది."], ["The long conflict between Vijayanagara and the Bahmani kingdom was mainly over the", "విజయనగర, బహమనీ రాజ్యాల మధ్య దీర్ఘకాల ఘర్షణకు ప్రధాన కారణం", ["Raichur Doab and the fertile Krishna–Godavari delta", "Ganga–Yamuna doab", "Kashmir valley", "Thar desert"], ["రాయచూరు అంతర్వేది, సారవంతమైన కృష్ణా–గోదావరి డెల్టా", "గంగా–యమునా అంతర్వేది", "కాశ్మీర్ లోయ", "థార్ ఎడారి"], 0, "The dispute over the Raichur Doab (the region between the Krishna and Tungabhadra) and the fertile Krishna–Godavari delta led to the long conflict.", "రాయచూరు అంతర్వేది (కృష్ణా, తుంగభద్రల మధ్య ప్రాంతం), సారవంతమైన కృష్ణా–గోదావరి డెల్టాపై వివాదం దీర్ఘకాల ఘర్షణకు దారితీసింది."], ["Arrange the four dynasties of the Vijayanagara Empire in chronological order", "విజయనగర సామ్రాజ్యపు నాలుగు వంశాలను కాలక్రమంలో అమర్చండి", ["Sangama, Saluva, Tuluva, Aravidu", "Saluva, Sangama, Aravidu, Tuluva", "Tuluva, Sangama, Saluva, Aravidu", "Sangama, Tuluva, Saluva, Aravidu"], ["సంగమ, సాళువ, తుళువ, అరవీడు", "సాళువ, సంగమ, అరవీడు, తుళువ", "తుళువ, సంగమ, సాళువ, అరవీడు", "సంగమ, తుళువ, సాళువ, అరవీడు"], 0, "Sangama (1336–1485), Saluva (1485–1505), Tuluva (1505–1570) and Aravidu (1570–1646).", "సంగమ (1336–1485), సాళువ (1485–1505), తుళువ (1505–1570), అరవీడు (1570–1646)."], ["The greatest ruler of the Sangama dynasty, also known as Praudha Devaraya, was", "సంగమ వంశంలో గొప్ప రాజు, ప్రౌఢ దేవరాయలుగా పేరొందినవాడు", ["Deva Raya II", "Harihara I", "Bukka I", "Virupaksha Raya"], ["రెండవ దేవరాయలు", "మొదటి హరిహరరాయలు", "మొదటి బుక్కరాయలు", "విరూపాక్షరాయలు"], 0, "Deva Raya II (Praudha Devaraya) was the greatest Sangama ruler — an able administrator, warrior and scholar; he annexed Kondaveedu and extended authority up to Rajahmundry.", "రెండవ దేవరాయలు (ప్రౌఢ దేవరాయలు) సంగమ వంశంలో గొప్పవాడు — సమర్థ పాలకుడు, యోధుడు, పండితుడు; కొండవీడును కలుపుకుని రాజమహేంద్రవరం వరకు అధికారం విస్తరించాడు."], ["The Saluva dynasty, the second dynasty of Vijayanagara, was founded by", "విజయనగరపు రెండవ వంశమైన సాళువ వంశ స్థాపకుడు", ["Saluva Narasimha Raya", "Veera Narasimha", "Aliya Rama Raya", "Tirumala"], ["సాళువ నరసింహరాయలు", "వీర నరసింహుడు", "అళియ రామరాయలు", "తిరుమలరాయలు"], 0, "The Saluva dynasty was founded by Saluva Narasimha Raya; he was succeeded by his son Immadi Narasimha Raya.", "సాళువ వంశాన్ని సాళువ నరసింహరాయలు స్థాపించాడు; అతని తర్వాత కుమారుడు ఇమ్మడి నరసింహరాయలు పాలించాడు."], ["Sri Krishna Deva Raya belonged to this Vijayanagara dynasty", "శ్రీకృష్ణదేవరాయలు చెందిన విజయనగర వంశం", ["Saluva", "Tuluva", "Aravidu", "Sangama"], ["సాళువ", "తుళువ", "అరవీడు", "సంగమ"], 1, "Krishna Deva Raya (1509–1529 CE), the greatest Vijayanagara ruler, belonged to the Tuluva dynasty founded by Veera Narasimha. (Textbook exercise.)", "విజయనగర రాజులలో గొప్పవాడైన శ్రీకృష్ణదేవరాయలు (1509–1529) వీర నరసింహుడు స్థాపించిన తుళువ వంశానికి చెందినవాడు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Krishna Deva Raya defeated the Sultan of Bijapur and captured the city of Raichur in", "శ్రీకృష్ణదేవరాయలు బీజాపూర్ సుల్తాన్‌ను ఓడించి రాయచూరును స్వాధీనం చేసుకున్న సంవత్సరం", ["1509 CE", "1520 CE", "1565 CE", "1336 CE"], ["క్రీ.శ. 1509", "క్రీ.శ. 1520", "క్రీ.శ. 1565", "క్రీ.శ. 1336"], 1, "After defeating Muslim armies in the battle of Diwani, Krishna Deva Raya invaded the Raichur Doab, defeated the Sultan of Bijapur and captured Raichur in 1520 CE.", "దివాని యుద్ధంలో ముస్లిం సైన్యాలను ఓడించిన తర్వాత శ్రీకృష్ణదేవరాయలు రాయచూరు అంతర్వేదిపై దండెత్తి బీజాపూర్ సుల్తాన్‌ను ఓడించి 1520లో రాయచూరును స్వాధీనం చేసుకున్నాడు."], ["The great and wise minister who assisted and guided Krishna Deva Raya was", "శ్రీకృష్ణదేవరాయలకు సహాయపడి మార
