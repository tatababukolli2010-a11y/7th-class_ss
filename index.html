్గనిర్దేశం చేసిన గొప్ప మంత్రి", ["Thimmarusu", "Mahmud Gawan", "Vidyaranya", "Allasani Peddana"], ["తిమ్మరుసు", "మహమూద్ గవాన్", "విద్యారణ్యులు", "అల్లసాని పెద్దన"], 0, "His great and wise minister Thimmarusu assisted and guided Krishna Deva Raya.", "మహామంత్రి తిమ్మరుసు శ్రీకృష్ణదేవరాయలకు సహాయపడి మార్గనిర్దేశం చేశాడు."], ["Sri Krishna Deva Raya, a great patron of literature, was known by the title", "సాహిత్య పోషకుడైన శ్రీకృష్ణదేవరాయలకు గల బిరుదు", ["Andhra Bhoja", "Andhra Kavita Pitamaha", "Trisamudradheeswara", "Prabandha Parameswara"], ["ఆంధ్ర భోజుడు", "ఆంధ్ర కవితా పితామహుడు", "త్రిసముద్రాధీశ్వరుడు", "ప్రబంధ పరమేశ్వరుడు"], 0, "Krishna Deva Raya was known as Andhra Bhoja; he said 'Desa Bhashalandu Telugu Lessa'.", "శ్రీకృష్ణదేవరాయలను ఆంధ్ర భోజుడు అంటారు; 'దేశ భాషలందు తెలుగు లెస్స' అన్నాడు."], ["The famous saying 'Desa Bhashalandu Telugu Lessa' (Telugu is the best among the languages of the land) is attributed to", "'దేశ భాషలందు తెలుగు లెస్స' అన్న ప్రసిద్ధ వాక్యం ఎవరిది", ["Sri Krishna Deva Raya", "Tenali Ramakrishna", "Tikkana", "Vidyaranya"], ["శ్రీకృష్ణదేవరాయలు", "తెనాలి రామకృష్ణుడు", "తిక్కన", "విద్యారణ్యులు"], 0, "Krishna Deva Raya said 'Desa Bhashalandu Telugu Lessa'.", "'దేశ భాషలందు తెలుగు లెస్స' అన్నది శ్రీకృష్ణదేవరాయలు."], ["The eight eminent scholars in the royal court of Krishna Deva Raya were known as", "శ్రీకృష్ణదేవరాయల ఆస్థానంలోని ఎనిమిది మంది మహా కవులను ఇలా పిలిచారు", ["Ashtadiggajas", "Navaratnas", "Saptarishis", "Chahalgani"], ["అష్టదిగ్గజాలు", "నవరత్నాలు", "సప్తర్షులు", "చహల్‌గనీ"], 0, "Eight eminent scholars called Ashtadiggajas were in Krishna Deva Raya's court.", "శ్రీకృష్ణదేవరాయల ఆస్థానంలో అష్టదిగ్గజాలు అనే ఎనిమిది మంది మహా కవులు ఉండేవారు."], ["The greatest of the Ashtadiggajas, called 'Andhra Kavita Pitamaha', was", "అష్టదిగ్గజాలలో గొప్పవాడు, 'ఆంధ్ర కవితా పితామహుడు'గా పేరొందినవాడు", ["Allasani Peddana", "Tenali Ramakrishna", "Dhurjati", "Pingali Surana"], ["అల్లసాని పెద్దన", "తెనాలి రామకృష్ణుడు", "ధూర్జటి", "పింగళి సూరన"], 0, "Allasani Peddana was the greatest and was called Andhra Kavita Pitamaha; his works include Manucharitam and Harikathasaram.", "అల్లసాని పెద్దన అష్టదిగ్గజాలలో గొప్పవాడు, ఆంధ్ర కవితా పితామహుడు; మనుచరిత్ర, హరికథాసారం రచించాడు."], ["Match the Ashtadiggajas with their works:\nA. Allasani Peddana   B. Nandi Timmana   C. Dhurjati   D. Tenali Ramakrishna\n1. Pandurangamahatyam   2. Sri Kalahastiswara Mahatyam   3. Parijathapaharanam   4. Manucharitam", "అష్టదిగ్గజాలను వారి రచనలతో జతపరచండి:\nA. అల్లసాని పెద్దన   B. నంది తిమ్మన   C. ధూర్జటి   D. తెనాలి రామకృష్ణుడు\n1. పాండురంగ మాహాత్మ్యం   2. శ్రీకాళహస్తీశ్వర మాహాత్మ్యం   3. పారిజాతాపహరణం   4. మనుచరిత్ర", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Allasani Peddana – Manucharitam; Nandi Timmana – Parijathapaharanam; Dhurjati – Sri Kalahastiswara Mahatyam; Tenali Ramakrishna – Pandurangamahatyam.", "అల్లసాని పెద్దన – మనుచరిత్ర; నంది తిమ్మన – పారిజాతాపహరణం; ధూర్జటి – శ్రీకాళహస్తీశ్వర మాహాత్మ్యం; తెనాలి రామకృష్ణుడు – పాండురంగ మాహాత్మ్యం."], ["Match the Ashtadiggajas with their works:\nA. Pingali Surana   B. Ramaraja Bhushana   C. Madayagari Mallana   D. Ayyalaraju Ramabhadrudu\n1. Sakala Neethi Saara Sangraham   2. Rajasekhara Charitham   3. Vasucharitra   4. Raghava Pandaveeyam", "అష్టదిగ్గజాలను వారి రచనలతో జతపరచండి:\nA. పింగళి సూరన   B. రామరాజ భూషణుడు   C. మాదయగారి మల్లన   D. అయ్యలరాజు రామభద్రుడు\n1. సకల నీతి సార సంగ్రహం   2. రాజశేఖర చరిత్ర   3. వసుచరిత్ర   4. రాఘవ పాండవీయం", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Pingali Surana – Raghava Pandaveeyam; Ramaraja Bhushana – Vasucharitra; Madayagari Mallana – Rajasekhara Charitham; Ayyalaraju Ramabhadrudu – Sakala Neethi Saara Sangraham.", "పింగళి సూరన – రాఘవ పాండవీయం; రామరాజ భూషణుడు – వసుచరిత్ర; మాదయగారి మల్లన – రాజశేఖర చరిత్ర; అయ్యలరాజు రామభద్రుడు – సకల నీతి సార సంగ్రహం."], ["The Telugu work authored by Krishna Deva Raya himself is", "శ్రీకృష్ణదేవరాయలు స్వయంగా రచించిన తెలుగు గ్రంథం", ["Amuktamalyada", "Manucharitam", "Vasucharitra", "Maduravijayam"], ["ఆముక్తమాల్యద", "మనుచరిత్ర", "వసుచరిత్ర", "మధురావిజయం"], 0, "Krishna Deva Raya authored the Telugu work Amuktamalyada and Sanskrit works Jambavathi Kalyanam and Ushaparinayam.", "శ్రీకృష్ణదేవరాయలు తెలుగులో ఆముక్తమాల్యద, సంస్కృతంలో జాంబవతీ కళ్యాణం, ఉషాపరిణయం రచించాడు."], ["Krishna Deva Raya built a new city called Nagalapuram in memory of his", "శ్రీకృష్ణదేవరాయలు నాగలాపురం అనే కొత్త నగరాన్ని ఎవరి జ్ఞాపకార్థం నిర్మించాడు", ["Mother Nagalamba", "Wife", "Minister Thimmarusu", "Guru Vidyaranya"], ["తల్లి నాగలాంబ", "భార్య", "మంత్రి తిమ్మరుసు", "గురువు విద్యారణ్యులు"], 0, "He built Nagalapuram in memory of his mother Nagalamba; he also built the Vittalaswamy and Hazara Ramaswamy temples at Vijayanagar.", "తల్లి నాగలాంబ జ్ఞాపకార్థం నాగలాపురం నిర్మించాడు; విజయనగరంలో విఠలస్వామి, హజార రామస్వామి ఆలయాలను కూడా కట్టించాడు."], ["The Rakshasa Tangadi or the Battle of Tallikota, which marked the end of the glory of Vijayanagara, broke out in", "విజయనగర వైభవానికి ముగింపు పలికిన రాక్షస తంగడి / తళ్ళికోట యుద్ధం జరిగిన సంవత్సరం", ["1520", "1565", "1526", "1646"], ["1520", "1565", "1526", "1646"], 1, "In 1565, Bijapur, Ahmadnagar, Golkonda and Bidar formed an alliance and defeated Aliya Rama Raya at the Battle of Tallikota (Rakshasa Tangadi). (Textbook exercise.)", "1565లో బీజాపూర్, అహ్మద్‌నగర్, గోల్కొండ, బీదర్ కూటమిగా ఏర్పడి తళ్ళికోట (రాక్షస తంగడి) యుద్ధంలో అళియ రామరాయలను ఓడించాయి. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Vijayanagara ruler defeated at the Battle of Tallikota was", "తళ్ళికోట యుద్ధంలో ఓడిపోయిన విజయనగర పాలకుడు", ["Aliya Rama Raya", "Krishna Deva Raya", "Achyuta Deva Raya", "Sri Ranga III"], ["అళియ రామరాయలు", "శ్రీకృష్ణదేవరాయలు", "అచ్యుతదేవరాయలు", "మూడవ శ్రీరంగరాయలు"], 0, "Aliya Rama Raya was defeated at Tallikota; two of his Muslim commanders betrayed him; the city of Vijayanagar was destroyed.", "తళ్ళికోటలో అళియ రామరాయలు ఓడిపోయాడు; అతని ఇద్దరు సేనానులు ద్రోహం చేశారు; విజయనగర నగరం ధ్వంసమైంది."], ["Identify the kingdom that was NOT part of the alliance against Vijayanagara at Tallikota", "తళ్ళికోటలో విజయనగరానికి వ్యతిరేకంగా ఏర్పడిన కూటమిలో లేని రాజ్యం", ["Bijapur", "Ahmadnagar", "Golkonda", "Berar"], ["బీజాపూర్", "అహ్మద్‌నగర్", "గోల్కొండ", "బేరార్"], 3, "The alliance was formed by Bijapur, Ahmadnagar, Golkonda and Bidar (as per the textbook).", "పాఠ్యపుస్తకం ప్రకారం కూటమిలో బీజాపూర్, అహ్మద్‌నగర్, గోల్కొండ, బీదర్ ఉన్నాయి."], ["The last ruler of the Vijayanagara kingdom (Aravidu dynasty) was", "విజయనగర రాజ్య (అరవీడు వంశ) చివరి పాలకుడు", ["Sri Ranga III", "Venkatapati Raya II", "Tirumala", "Achyuta Deva Raya"], ["మూడవ శ్రీరంగరాయలు", "రెండవ వెంకటపతిరాయలు", "తిరుమలరాయలు", "అచ్యుతదేవరాయలు"], 0, "After Tallikota, the kingdom continued under the Aravidu dynasty for about a century; Tirumala, Sri Ranga and Venkatapati II were important; the last ruler was Sri Ranga III.", "తళ్ళికోట తర్వాత అరవీడు వంశం కింద రాజ్యం సుమారు ఒక శతాబ్దం కొనసాగింది; తిరుమల, శ్రీరంగ, రెండవ వెంకటపతి ముఖ్యులు; చివరి పాలకుడు మూడవ శ్రీరంగరాయలు."], ["Arrange the administrative units of the Vijayanagara Empire from largest to smallest", "విజయనగర సామ్రాజ్య పరిపాలనా విభాగాలను పెద్దదాని నుండి చిన్నదానికి అమర్చండి", ["Mandalas, Nadus, Sthalas, Gramas", "Gramas, Sthalas, Nadus, Mandalas", "Nadus, Mandalas, Gramas, Sthalas", "Iqtas, Shiqs, Parganas, Villages"], ["మండలాలు, నాడులు, స్థలాలు, గ్రామాలు", "గ్రామాలు, స్థలాలు, నాడులు, మండలాలు", "నాడులు, మండలాలు, గ్రామాలు, స్థలాలు", "ఇక్తాలు, షిక్‌లు, పరగణాలు, గ్రామాలు"], 0, "The Empire was divided into Mandalas, Nadus, Sthalas and finally Gramas. The governor of a Mandala was called Mandaleswara or Nayak.", "సామ్రాజ్యం మండలాలు, నాడులు, స్థలాలు, గ్రామాలుగా విభజించబడింది. మండల పాలకుని మండలేశ్వరుడు లేదా నాయకుడు అన్నారు."], ["The governor of a Mandala in the Vijayanagara Empire was called", "విజయనగర సామ్రాజ్యంలో మండల పాలకుని ఇలా పిలిచారు", ["Mandaleswara or Nayak", "Muqti", "Ayagar", "Wazir"], ["మండలేశ్వరుడు లేదా నాయకుడు", "ముక్తీ", "ఆయగారు", "వజీర్"], 0, "The governor of a Mandala was called Mandaleswara or Nayak.", "మండల పాలకుని మండలేశ్వరుడు లేదా నాయకుడు అన్నారు."], ["In the Vijayanagara Empire, land revenue was generally fixed at", "విజయనగర సామ్రాజ్యంలో భూమి శిస్తు సాధారణంగా ఎంత", ["One-sixth of the produce", "One-third of the produce", "One-half of the produce", "One-tenth of the produce"], ["పంటలో ఆరవ వంతు", "పంటలో మూడో వంతు", "పంటలో సగం", "పంటలో పదో వంతు"], 0, "Land revenue was fixed generally as one-sixth of the produce; customs duties at ports and professional taxes were other sources.", "భూమి శిస్తు సాధారణంగా పంటలో ఆరవ వంతు; రేవుల్లో సుంకాలు, వృత్తి పన్నులు ఇతర ఆదాయ వనరులు."], ["The lands granted to Nayaks or Palegars (top-grade army officers) in lieu of their services were called", "సేవలకు బదులుగా నాయకులు/పాలెగాళ్ళకు (ఉన్నత సైనికాధికారులకు) ఇచ్చిన భూములు", ["Amaram", "Rachapolam", "Iqta", "Inam"], ["అమరం", "రాచపొలం", "ఇక్తా", "ఈనాం"], 0, "Top-grade army officers were called Nayaks or Palegars; they were granted land called Amaram. The Amara Nayaka system was a major political innovation of Vijayanagara.", "ఉన్నత సైనికాధికారులను నాయకులు లేదా పాలెగాళ్ళు అన్నారు; వారికి ఇచ్చిన భూమి అమరం. అమర నాయంకర వ్యవస్థ విజయనగర రాజకీయ నూతన ఆవిష్కరణ."], ["The major political innovation of the Vijayanagara Empire, in which military commanders were given territories to govern, was the", "సైనిక నాయకులకు పాలనకై భూభాగాలు ఇచ్చిన విజయనగర సామ్రాజ్య ప్రధాన రాజకీయ ఆవిష్కరణ", ["Amara Nayaka system", "Iqta system", "Bandagan system", "Chahalgani"], ["అమర నాయంకర వ్యవస్థ", "ఇక్తా వ్యవస్థ", "బందగాన్ వ్యవస్థ", "చహల్‌గనీ"], 0, "The Amara Nayaka system was a major political innovation; Amara Nayakas were military commanders given territories to govern by the Raya.", "అమర నాయంకర వ్యవస్థ విజయనగర ప్రధాన రాజకీయ ఆవిష్కరణ; అమర నాయకులు రాయలు ఇచ్చిన భూభాగాలను పాలించే సైనిక నాయకులు."], ["'Maduravijayam' was written by", "'మధురావిజయం' రచయిత్రి", ["Ganga Devi", "Tirumalamma", "Hanumayamma", "Nagalamba"], ["గంగాదేవి", "తిరుమలమ్మ", "హనుమాయమ్మ", "నాగలాంబ"], 0, "Gangadevi, wife of Kumara Kampana, authored the famous work Maduravijayam. Women held a high position in Vijayanagara society. (Textbook exercise.)", "కుమార కంపనుని భార్య గంగాదేవి మధురావిజయం రచించింది. విజయనగర సమాజంలో స్త్రీలకు ఉన్నత స్థానం ఉండేది. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The famous Telugu women poets of the Vijayanagara period were", "విజయనగర కాలపు ప్రసిద్ధ తెలుగు కవయిత్రులు", ["Tallapaka Timmakka and Atukuri Molla", "Rudrama Devi and Mailamba", "Razia and Gangadevi", "Savitribai and Sarojini"], ["తాళ్ళపాక తిమ్మక్క, ఆతుకూరి మొల్ల", "రుద్రమదేవి, మైలాంబ", "రజియా, గంగాదేవి", "సావిత్రీబాయి, సరోజిని"], 0, "Tallapaka Timmakka and Atukuri Molla were famous Telugu poets of this period.", "తాళ్ళపాక తిమ్మక్క, ఆతుకూరి మొల్ల ఈ కాలపు ప్రసిద్ధ తెలుగు కవయిత్రులు."], ["The chief gold coin of the Vijayanagara Empire was the", "విజయనగర సామ్రాజ్య ప్రధాన బంగారు నాణెం", ["Varaha", "Tanka", "Jital", "Rupee"], ["వరహా", "టంకా", "జిటల్", "రూపాయి"], 0, "The chief gold coin was the Varaha. (Tanka and Jital were Delhi Sultanate coins.)", "ప్రధాన బంగారు నాణెం వరహా. (టంకా, జిటల్ ఢిల్లీ సుల్తానుల నాణేలు.)"], ["In the Vijayanagara period, diamond mines were located in", "విజయనగర కాలంలో వజ్రాల గనులు ఉన్న జిల్లాలు", ["Kurnool and Anantapur districts", "Krishna and Guntur districts", "Srikakulam and Vizianagaram", "Nellore and Prakasam"], ["కర్నూలు, అనంతపురం జిల్లాలు", "కృష్ణా, గుంటూరు జిల్లాలు", "శ్రీకాకుళం, విజయనగరం", "నెల్లూరు, ప్రకాశం"], 0, "Diamond mines were located in Kurnool and Anantapur districts.", "వజ్రాల గనులు కర్నూలు, అనంతపురం జిల్లాల్లో ఉండేవి."], ["The chief seaport of Vijayanagara on the Malabar coast was", "మలబార్ తీరంలో విజయనగర ప్రధాన రేవు", ["Cannanore", "Motupalli", "Lothal", "Masulipatnam"], ["కన్ననూర్", "మోటుపల్లి", "లోథాల్", "మచిలీపట్నం"], 0, "There were a number of seaports on the Malabar coast, the chief being Cannanore.", "మలబార్ తీరంలో అనేక రేవులు ఉండేవి; ప్రధానమైనది కన్ననూర్."], ["Identify the item that was IMPORTED (not exported) by the Vijayanagara kings", "విజయనగర రాజులు దిగుమతి చేసుకున్న (ఎగుమతి చేయని) వస్తువు", ["Horses", "Spices", "Cotton", "Rice"], ["గుర్రాలు", "సుగంధ ద్రవ్యాలు", "పత్తి", "బియ్యం"], 0, "Exports: cotton, silk, spices, rice, iron, saltpetre, sugar. Imports: horses, pearls, copper, coral, mercury, China silk and velvet.", "ఎగుమతులు: పత్తి, పట్టు, సుగంధ ద్రవ్యాలు, బియ్యం, ఇనుము, సూరేకారం, చక్కెర. దిగుమతులు: గుర్రాలు, ముత్యాలు, రాగి, పగడాలు, పాదరసం, చైనా పట్టు, వెల్వెట్."], ["Match the foreign travellers with the rulers in whose period they visited Vijayanagara:\nA. Ibn Battuta   B. Abdul Razzaq   C. Domingo Paes   D. Fernando Nuniz\n1. Achyuta Deva Raya   2. Sri Krishna Deva Raya   3. Deva Raya II   4. Harihara I", "విదేశీ యాత్రికులను వారు సందర్శించిన కాలపు రాజులతో జతపరచండి:\nA. ఇబన్ బటూటా   B. అబ్దుల్ రజాక్   C. డొమింగో పేస్   D. ఫెర్నావో నూనిజ్\n1. అచ్యుతదేవరాయలు   2. శ్రీకృష్ణదేవరాయలు   3. రెండవ దేవరాయలు   4. మొదటి హరిహరరాయలు", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Ibn Battuta (Moroccan) – Harihara I; Abdul Razzaq (Persian) and Nicolo Conti (Italian) – Deva Raya II; Domingo Paes and Duarte Barbosa (Portuguese) – Krishna Deva Raya; Fernando Nuniz (Portuguese) – Achyuta Deva Raya.", "ఇబన్ బటూటా (మొరాకో) – హరిహర I; అబ్దుల్ రజాక్ (పర్షియా), నికోలో కాంటి (ఇటలీ) – దేవరాయ II; డొమింగో పేస్, డువార్టే బార్బోసా (పోర్చుగల్) – శ్రీకృష్ణదేవరాయలు; నూనిజ్ (పోర్చుగల్) – అచ్యుతదేవరాయలు."], ["Abdul Razzaq, who visited Vijayanagara during Deva Raya II's reign, was a traveller from", "రెండవ దేవరాయల కాలంలో విజయనగరాన్ని సందర్శించిన అబ్దుల్ రజాక్ ఈ దేశ యాత్రికుడు", ["Persia", "Portugal", "Italy", "Morocco"], ["పర్షియా", "పోర్చుగల్", "ఇటలీ", "మొరాకో"], 0, "Abdul Razzaq was a Persian traveller. (Textbook match: Abdul Razzaq – Persian.)", "అబ్దుల్ రజాక్ పర్షియన్ యాత్రికుడు. (పాఠ్యపుస్తక జతపరచడం: అబ్దుల్ రజాక్ – పర్షియన్.)"], ["The chief characteristics of Vijayanagara temple architecture were", "విజయనగర ఆలయ వాస్తుశిల్పపు ప్రధాన లక్షణాలు", ["Tall Gopurams (gateways) and Kalyana mandapams with carved pillars", "Stupas and chaityas", "Minarets and domes only", "Rock-cut caves only"], ["ఎత్తైన గోపురాలు, చెక్కిన స్తంభాలతో కళ్యాణ మండపాలు", "స్తూపాలు, చైత్యాలు", "మినార్లు, గుమ్మటాలు మాత్రమే", "రాతి గుహలు మాత్రమే"], 0, "Vijayanagara architecture is characterised by tall Gopurams and Kalyana mandapams with carved pillars; the horse was the most common animal on pillars; some mandapams had 100 to 1000 pillars.", "విజయనగర వాస్తు లక్షణాలు: ఎత్తైన గోపురాలు, చెక్కిన స్తంభాలతో కళ్యాణ మండపాలు; స్తంభాలపై ఎక్కువగా గుర్రం బొమ్మ; కొన్ని మండపాలకు 100–1000 స్తంభాలు."], ["Identify the temple that is NOT an example of Vijayanagara style", "విజయనగర శైలికి ఉదాహరణ కాని ఆలయం", ["Vittalaswamy temple, Hampi", "Hazara Ramalayam, Hampi", "Varadaraja temple, Kanchipuram", "Ramappa temple, Palampet"], ["విఠలస్వామి ఆలయం, హంపి", "హజార రామాలయం, హంపి", "వరదరాజ ఆలయం, కాంచీపురం", "రామప్ప ఆలయం, పాలంపేట"], 3, "Vittalaswamy, Hazara Ramalayam, and the Varadaraja and Ekambaranatha temples at Kanchipuram are Vijayanagara style. Ramappa temple is a Kakatiya temple.", "విఠలస్వామి, హజార రామాలయం, కాంచీపురం వరదరాజ, ఏకాంబరనాథ ఆలయాలు విజయనగర శైలి. రామప్ప ఆలయం కాకతీయుల ఆలయం."], ["The Carnatic music tradition developed during this age. 'Sangeetha Sarvaswam' was written by", "ఈ కాలంలో కర్ణాటక సంగీతం అభివృద్ధి చెందింది. 'సంగీత సర్వస్వం' రచయిత", ["Swami Vidyaranya", "Praudha Devaraya", "Tyagaraja", "Thimmarusu"], ["స్వామి విద్యారణ్యులు", "ప్రౌఢ దేవరాయలు", "త్యాగరాజు", "తిమ్మరుసు"], 0, "Swami Vidyaranya wrote Sangeetha Sarvaswam; Praudha Devaraya's Mahanataka Sudhanidhi also deals with music.", "స్వామి విద్యారణ్యులు సంగీత సర్వస్వం రచించారు; ప్రౌఢ దేవరాయల మహానాటక సుధానిధి కూడా సంగీతానికి సంబంధించినది."], ["The dance form Kuchipudi was introduced by", "కూచిపూడి నృత్యాన్ని ప్రవేశపెట్టినవారు", ["Siddhendra Yogi", "Bharata Muni", "Nataraja Ramakrishna", "Jayapa"], ["సిద్ధేంద్ర యోగి", "భరతముని", "నటరాజ రామకృష్ణ", "జాయప"], 0, "Kuchipudi was introduced by Siddhendra Yogi; Yakshaganam (themes from Bhagavatam) and Perini Natyam were also popular.", "కూచిపూడిని సిద్ధేంద్ర యోగి ప్రవేశపెట్టారు; భాగవత కథలతో యక్షగానం, పేరిణి నాట్యం కూడా ప్రాచుర్యం పొందాయి."], ["The Reddy kingdom, which ruled coastal and central Andhra from 1325 to 1448 AD, was established by", "1325–1448 మధ్య కోస్తా, మధ్య ఆంధ్రను పాలించిన రెడ్డి రాజ్య స్థాపకుడు", ["Prolaya Vema Reddy", "Anapota Reddy", "Komaragiri Reddy", "Pedakomati Vema Reddy"], ["ప్రోలయ వేమారెడ్డి", "అనపోతారెడ్డి", "కొమరగిరి రెడ్డి", "పెదకోమటి వేమారెడ్డి"], 0, "The Reddy kingdom was established by Prolaya Vema Reddy; it stretched from Cuttack to Kanchi and Srisailam.", "రెడ్డి రాజ్యాన్ని ప్రోలయ వేమారెడ్డి స్థాపించాడు; అది కటక్ నుండి కంచి, శ్రీశైలం వరకు విస్తరించింది."], ["The initial capital of the Reddy kingdom was ____ and it was later moved to ____", "రెడ్డి రాజ్య తొలి రాజధాని ____, తర్వాత మార్చిన రాజధాని ____", ["Addanki; Kondaveedu", "Kondaveedu; Addanki", "Rajahmundry; Warangal", "Gulbarga; Bidar"], ["అద్దంకి; కొండవీడు", "కొండవీడు; అద్దంకి", "రాజమహేంద్రవరం; వరంగల్", "గుల్బర్గా; బీదర్"], 0, "The initial capital was Addanki (Prakasam district); later it moved to Kondaveedu, with a subsidiary branch at Rajahmundry. They built hill forts at Kondapalli and Kondaveedu.", "తొలి రాజధాని అద్దంకి (ప్రకాశం జిల్లా); తర్వాత కొండవీడుకు మారింది; రాజమహేంద్రవరంలో ఉపశాఖ ఉండేది. కొండపల్లి, కొండవీడులలో కొండ కోటలు నిర్మించారు."], ["Errapragada, one of the trio who wrote the Andhra Mahabharata and honoured with the title 'Prabandha Parameswara', was a poet in the court of", "ఆంధ్ర మహాభారత కవిత్రయంలో ఒకరైన, 'ప్రబంధ పరమేశ్వర' బిరుదు పొందిన ఎర్రాప్రగడ ఈ రాజు ఆస్థాన కవి", ["Prolaya Vema Reddy", "Krishna Deva Raya", "Ganapathi Deva", "Deva Raya II"], ["ప్రోలయ వేమారెడ్డి", "శ్రీకృష్ణదేవరాయలు", "గణపతిదేవుడు", "రెండవ దేవరాయలు"], 0, "Errapragada was a poet in the court of Prolaya Vema Reddy and was honoured with the title 'Prabandha Parameswara'.", "ఎర్రాప్రగడ ప్రోలయ వేమారెడ్డి ఆస్థాన కవి; 'ప్రబంధ పరమేశ్వర' బిరుదు పొందాడు."], ["The Bahmani kingdom was founded in 1347 AD by Alauddin Bahman Shah (Hasan Gangu) with its capital at", "1347లో అల్లావుద్దీన్ బహమన్ షా (హసన్ గంగు) స్థాపించిన బహమనీ రాజ్య రాజధాని", ["Gulbarga", "Bidar", "Golkonda", "Bijapur"], ["గుల్బర్గా", "బీదర్", "గోల్కొండ", "బీజాపూర్"], 0, "The Bahmani kingdom was founded in 1347 by Alauddin Bahman Shah (Hasan Gangu) with capital Gulbarga; later Ahmad Shah shifted it to Bidar. (Textbook exercise.)", "బహమనీ రాజ్యాన్ని 1347లో అల్లావుద్దీన్ బహమన్ షా (హసన్ గంగు) గుల్బర్గా రాజధానిగా స్థాపించాడు; తర్వాత అహ్మద్ షా రాజధానిని బీదర్‌కు మార్చాడు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Bahmani kingdom reached its peak under Muhammad Shah III mainly due to the services of his Persian chief minister", "మూడవ మహమ్మద్ షా కాలంలో బహమనీ రాజ్యం ఉచ్ఛస్థితికి చేరడానికి కారణమైన పర్షియన్ ప్రధానమంత్రి", ["Mahmud Gawan", "Thimmarusu", "Malik Kafur", "Ulugh Khan"], ["మహమూద్ గవాన్", "తిమ్మరుసు", "మాలిక్ కాఫర్", "ఉలుగ్ ఖాన్"], 0, "Mahmud Gawan, a Persian merchant who came to India at 42, became chief minister; a learned man and military genius, he expanded the empire. (Textbook match: Mahmud Gawan – Chief minister.)", "42 ఏళ్ళ వయసులో భారత్ వచ్చిన పర్షియన్ వ్యాపారి మహమూద్ గవాన్ ప్రధానమంత్రి అయ్యాడు; పండితుడు, సైనిక మేధావి; రాజ్యాన్ని విస్తరించాడు. (పాఠ్యపుస్తక జతపరచడం.)"], ["After the death of Muhammad Shah III, the Bahmani kingdom disintegrated into five kingdoms. Identify the one that was NOT among them", "మూడవ మహమ్మద్ షా మరణం తర్వాత బహమనీ రాజ్యం ఐదు రాజ్యాలుగా విడిపోయింది. వాటిలో లేనిది", ["Ahmednagar", "Bijapur", "Golkonda", "Vijayanagara"], ["అహ్మద్‌నగర్", "బీజాపూర్", "గోల్కొండ", "విజయనగరం"], 3, "The Bahmani kingdom disintegrated into Ahmednagar, Berar, Bidar, Bijapur and Golkonda. Vijayanagara was a separate rival empire.", "బహమనీ రాజ్యం అహ్మద్‌నగర్, బేరార్, బీదర్, బీజాపూర్, గోల్కొండలుగా విడిపోయింది. విజయనగరం వేరే ప్రత్యర్థి సామ్రాజ్యం."]]}, {"n": 7, "en": "Mughal Empire", "te": "మొఘల్ సామ్రాజ్యం", "c": "#7c3aed", "q": [["The Red Fort in Delhi, from where the Prime Minister addresses the nation on Independence Day, was built by", "స్వాతంత్ర్య దినోత్సవం రోజున ప్రధానమంత్రి జాతినుద్దేశించి ప్రసంగించే ఢిల్లీలోని ఎర్రకోటను నిర్మించినది", ["Shah Jahan", "Akbar", "Babur", "Aurangzeb"], ["షాజహాన్", "అక్బర్", "బాబర్", "ఔరంగజేబు"], 0, "The Red Fort was built by Shah Jahan as the fortified palace of his capital Shahjahanabad.", "ఎర్రకోటను షాజహాన్ తన రాజధాని షాజహానాబాద్‌లో కోట రాజభవనంగా నిర్మించాడు."], ["Babur established the Mughal Empire after defeating Ibrahim Lodi, the last ruler of the Delhi Sultanate, at", "ఢిల్లీ సుల్తానుల చివరి పాలకుడు ఇబ్రహీం లోడీని బాబర్ ఓడించి మొఘల్ సామ్రాజ్యాన్ని స్థాపించిన ప్రదేశం", ["First battle of Panipat, 1526 CE", "Second battle of Panipat, 1556 CE", "Battle of Chausa, 1539 CE", "Battle of Kanauj, 1540 CE"], ["మొదటి పానిపట్ యుద్ధం, 1526", "రెండవ పానిపట్ యుద్ధం, 1556", "చౌసా యుద్ధం, 1539", "కనోజ్ యుద్ధం, 1540"], 0, "Babur defeated Ibrahim Lodi at the first battle of Panipat in 1526 CE; this marked the beginning of the Mughal Empire.", "1526లో మొదటి పానిపట్ యుద్ధంలో బాబర్ ఇబ్రహీం లోడీని ఓడించాడు; దీనితో మొఘల్ సామ్రాజ్యం ప్రారంభమైంది."], ["The Mughal Empire in India spans from", "భారతదేశంలో మొఘల్ సామ్రాజ్య కాలం", ["1526 CE to 1857 CE", "1206 CE to 1526 CE", "1336 CE to 1646 CE", "1556 CE to 1707 CE"], ["క్రీ.శ. 1526 – 1857", "క్రీ.శ. 1206 – 1526", "క్రీ.శ. 1336 – 1646", "క్రీ.శ. 1556 – 1707"], 0, "The Mughal Empire history spans from 1526 CE (Babur) to 1857 CE, when it collapsed during the reign of Bahadur Shah II.", "మొఘల్ సామ్రాజ్యం 1526 (బాబర్) నుండి 1857 వరకు — రెండవ బహదూర్ షా కాలంలో అంతమైంది."], ["Babur was related to ____ from his father's side and to ____ from his mother's side", "బాబర్ తండ్రి వైపు నుండి ____ కు, తల్లి వైపు నుండి ____ వంశానికి సంబంధించినవాడు", ["Timur; Genghis Khan", "Genghis Khan; Timur", "Ibrahim Lodi; Timur", "Sher Shah; Genghis Khan"], ["తైమూర్; చెంఘిజ్ ఖాన్", "చెంఘిజ్ ఖాన్; తైమూర్", "ఇబ్రహీం లోడీ; తైమూర్", "షేర్ షా; చెంఘిజ్ ఖాన్"], 0, "Babur was related to Timur from his father's side and to Genghis Khan's dynasty from his mother's side.", "బాబర్ తండ్రి వైపు తైమూర్‌కు, తల్లి వైపు చెంఘిజ్ ఖాన్ వంశానికి సంబంధించినవాడు."], ["The word 'Mughal' is derived from", "'మొఘల్' అనే పదం దీని నుండి వచ్చింది", ["Mongol", "Turk", "Persian", "Afghan"], ["మంగోల్", "తుర్క్", "పర్షియన్", "ఆఫ్ఘన్"], 0, "The word 'Mughal' comes from 'Mongol'. The Mughals preferred to call themselves Chaghatayids, after Genghis Khan's second son Chaghatay.", "'మొఘల్' పదం 'మంగోల్' నుండి వచ్చింది. మొఘలులు తమను చెంఘిజ్ ఖాన్ రెండవ కుమారుడు చఘతాయ్ పేరుతో చఘతాయిదులుగా పిలుచుకున్నారు."], ["Babur, the founder of the Mughal empire, was one of the greatest poets in this language", "మొఘల్ సామ్రాజ్య స్థాపకుడు బాబర్ ఈ భాషా సాహిత్యంలో గొప్ప కవులలో ఒకడు", ["Turkish", "Persian", "Arabic", "Urdu"], ["తుర్కీ", "పర్షియన్", "అరబిక్", "ఉర్దూ"], 0, "Babur was a genius at war tactics, one of the greatest poets in Turkish literature and a nature lover. He wrote Baburnama.", "బాబర్ యుద్ధ వ్యూహాలలో మేధావి, తుర్కీ సాహిత్యంలో గొప్ప కవి, ప్రకృతి ప్రేమికుడు. బాబర్‌నామా రచించాడు."], ["Sher Shah defeated Humayun at ____ in 1539 CE and at ____ in 1540 CE", "షేర్ షా హుమాయూన్‌ను 1539లో ____ వద్ద, 1540లో ____ వద్ద ఓడించాడు", ["Chausa; Kanauj", "Panipat; Kanauj", "Kanauj; Chausa", "Chausa; Panipat"], ["చౌసా; కనోజ్", "పానిపట్; కనోజ్", "కనోజ్; చౌసా", "చౌసా; పానిపట్"], 0, "Sher Shah defeated Humayun at Chausa (1539 CE) and Kanauj (1540 CE) and forced him to flee to Iran.", "షేర్ షా హుమాయూన్‌ను చౌసా (1539), కనోజ్ (1540) వద్ద ఓడించి ఇరాన్‌కు పారిపోయేలా చేశాడు."], ["Humayun recaptured Delhi in 1555 CE with the help of", "హుమాయూన్ 1555లో ఎవరి సహాయంతో ఢిల్లీని తిరిగి స్వాధీనం చేసుకున్నాడు", ["The Safavid Shah of Iran", "The Sultan of Bijapur", "The Rajputs of Mewar", "The Portuguese"], ["ఇరాన్ సఫావిద్ షా", "బీజాపూర్ సుల్తాన్", "మేవార్ రాజపుత్రులు", "పోర్చుగీసువారు"], 0, "In Iran, Humayun received help from the Safavid Shah and recaptured Delhi in 1555 CE; he died in 1556 CE.", "ఇరాన్‌లో సఫావిద్ షా సహాయం పొంది హుమాయూన్ 1555లో ఢిల్లీని తిరిగి గెలిచాడు; 1556లో మరణించాడు."], ["Sher Shah Sur, the Afghan leader who defeated Humayun, established this dynasty in Delhi", "హుమాయూన్‌ను ఓడించిన ఆఫ్ఘన్ నాయకుడు షేర్ షా సూర్ ఢిల్లీలో స్థాపించిన వంశం", ["Sur dynasty", "Lodi dynasty", "Tughlaq dynasty", "Sayyid dynasty"], ["సూర్ వంశం", "లోడీ వంశం", "తుగ్లక్ వంశం", "సయ్యద్ వంశం"], 0, "Sher Shah Sur defeated Humayun twice and established the Sur dynasty in Delhi; he extended his empire from Kabul to Bengal and Malwa.", "షేర్ షా సూర్ హుమాయూన్‌ను రెండుసార్లు ఓడించి ఢిల్లీలో సూర్ వంశాన్ని స్థాపించాడు; కాబూల్ నుండి బెంగాల్, మాల్వా వరకు విస్తరించాడు."], ["Consider the following statements about Sher Shah:\nI. He introduced a land revenue system, new currency and a postal service.\nII. He ruled for about five years and died in 1545 CE due to an artillery explosion.", "షేర్ షా గురించి కింది వాక్యాలను పరిశీలించండి:\nI. భూమి శిస్తు విధానం, కొత్త నాణేలు, తపాలా సేవలను ప్రవేశపెట్టాడు.\nII. సుమారు ఐదేళ్ళు పాలించి 1545లో ఫిరంగి పేలుడు వల్ల మరణించాడు.", ["Both I and II are correct", "Only I is correct", "Only II is correct", "Neither I nor II is correct"], ["I, II రెండూ సరైనవి", "I మాత్రమే సరైనది", "II మాత్రమే సరైనది", "రెండూ సరైనవి కావు"], 0, "During his five-year reign (1540–1545 CE) Sher Shah created a land revenue system, introduced new currency and a postal service. He died in 1545 CE due to an artillery explosion.", "తన ఐదేళ్ళ పాలనలో (1540–1545) షేర్ షా భూమి శిస్తు విధానం, కొత్త నాణేలు, తపాలా సేవలు ప్రవేశపెట్టాడు. 1545లో ఫిరంగి పేలుడులో మరణించాడు."], ["Find out the odd one", "భిన్నమైనదాన్ని గుర్తించండి", ["Akbar", "Humayun", "Sher Shah", "Jahangir"], ["అక్బర్", "హుమాయూన్", "షేర్ షా", "జహంగీర్"], 2, "Akbar, Humayun and Jahangir were Mughal emperors; Sher Shah was an Afghan of the Sur dynasty. (Textbook exercise.)", "అక్బర్, హుమాయూన్, జహంగీర్ మొఘల్ చక్రవర్తులు; షేర్ షా సూర్ వంశానికి చెందిన ఆఫ్ఘన్. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Akbar was just 13 years old when Humayun died. His guardian who looked after the administration was", "హుమాయూన్ మరణించినప్పుడు అక్బర్ వయసు 13 ఏళ్ళు. అతని తరఫున పాలన చూసుకున్న సంరక్షకుడు", ["Bairam Khan", "Raja Todar Mal", "Abul Fazal", "Raja Man Singh"], ["బైరాం ఖాన్", "రాజా తోడర్‌మల్", "అబుల్ ఫజల్", "రాజా మాన్‌సింగ్"], 0, "Since Akbar was very young, his guardian Bairam Khan took care of the administration on his behalf.", "అక్బర్ చిన్నవాడు కావడంతో అతని సంరక్షకుడు బైరాం ఖాన్ అతని తరఫున పాలన చూసుకున్నాడు."], ["Hemu, who wanted to capture Delhi, was defeated and killed by Akbar's forces at", "ఢిల్లీని ఆక్రమించాలనుకున్న హేముని అక్బర్ సేనలు ఓడించి చంపిన యుద్ధం", ["Second battle of Panipat, 1556 CE", "First battle of Panipat, 1526 CE", "Battle of Haldighati, 1576 CE", "Battle of Tallikota, 1565 CE"], ["రెండవ పానిపట్ యుద్ధం, 1556", "మొదటి పానిపట్ యుద్ధం, 1526", "హల్దీఘాటి యుద్ధం, 1576", "తళ్ళికోట యుద్ధం, 1565"], 0, "Hemu was defeated and killed at the second battle of Panipat in 1556 CE.", "1556లో రెండవ పానిపట్ యుద్ధంలో హేము ఓడిపోయి హతమయ్యాడు."], ["Arrange the Mughal rulers in chronological order", "మొఘల్ పాలకులను కాలక్రమంలో అమర్చండి", ["Babur, Humayun, Akbar, Jahangir, Shah Jahan, Aurangzeb", "Babur, Akbar, Humayun, Shah Jahan, Jahangir, Aurangzeb", "Humayun, Babur, Akbar, Jahangir, Aurangzeb, Shah Jahan", "Babur, Humayun, Jahangir, Akbar, Shah Jahan, Aurangzeb"], ["బాబర్, హుమాయూన్, అక్బర్, జహంగీర్, షాజహాన్, ఔరంగజేబు", "బాబర్, అక్బర్, హుమాయూన్, షాజహాన్, జహంగీర్, ఔరంగజేబు", "హుమాయూన్, బాబర్, అక్బర్, జహంగీర్, ఔరంగజేబు, షాజహాన్", "బాబర్, హుమాయూన్, జహంగీర్, అక్బర్, షాజహాన్, ఔరంగజేబు"], 0, "Babur (1526–30), Humayun (1530–40, 1555–56), Akbar (1556–1605), Jahangir (1605–27), Shah Jahan (1628–58), Aurangzeb (1658–1707).", "బాబర్ (1526–30), హుమాయూన్ (1530–40, 1555–56), అక్బర్ (1556–1605), జహంగీర్ (1605–27), షాజహాన్ (1628–58), ఔరంగజేబు (1658–1707)."], ["Identify the one who was NOT a Rajput noble appointed to a high position by Akbar", "అక్బర్ ఉన్నత పదవుల్లో నియమించిన రాజపుత్ర ప్రముఖులలో లేనివారు", ["Raja Man Singh", "Raja Todar Mal", "Raja Bhagavan Das", "Maharana Pratap"], ["రాజా మాన్‌సింగ్", "రాజా తోడర్‌మల్", "రాజా భగవాన్‌దాస్", "మహారాణా ప్రతాప్"], 3, "Akbar appointed Rajputs like Raja Man Singh, Raja Todar Mal and Raja Bhagavan Das to high positions. Maharana Pratap of Mewar fought Akbar throughout his life.", "అక్బర్ రాజా మాన్‌సింగ్, రాజా తోడర్‌మల్, రాజా భగవాన్‌దాస్ వంటి రాజపుత్రులను ఉన్నత పదవుల్లో నియమించాడు. మేవార్ మహారాణా ప్రతాప్ జీవితాంతం అక్బర్‌తో పోరాడాడు."], ["The ruler of Mewar who fought against Akbar throughout his life was", "జీవితాంతం అక్బర్‌తో పోరాడిన మేవార్ పాలకుడు", ["Maharana Pratap", "Raja Man Singh", "Hemu", "Raja Jai Singh"], ["మహారాణా ప్రతాప్", "రాజా మాన్‌సింగ్", "హేము", "రాజా జయసింహ"], 0, "Mewar ruler Maharana Pratap fought with Akbar throughout his life; the Sisodiyas did not accept Mughal authority.", "మేవార్ పాలకుడు మహారాణా ప్రతాప్ జీవితాంతం అక్బర్‌తో పోరాడాడు; సిసోడియాలు మొఘల్ అధికారాన్ని అంగీకరించలేదు."], ["The brave woman of Ahmednagar who fought against and opposed Akbar was", "అక్బర్‌ను ఎదిరించి ధైర్యంగా పోరాడిన అహ్మద్‌నగర్ వీరవనిత", ["Rani Chand Bibi", "Rani Durgavati", "Nurjahan", "Jijabai"], ["రాణి చాంద్ బీబీ", "రాణి దుర్గావతి", "నూర్జహాన్", "జిజాబాయి"], 0, "Rani Chand Bibi of Ahmednagar was the woman who fought bravely and opposed Akbar.", "అహ్మద్‌నగర్ రాణి చాంద్ బీబీ ధైర్యంగా పోరాడి అక్బర్‌ను ఎదిరించింది."], ["Salim, the successor of Akbar, came to the throne with the title Jahangir, which means", "అక్బర్ తర్వాత సింహాసనమెక్కిన సలీం 'జహంగీర్' బిరుదు ధరించాడు. దాని అర్థం", ["World conqueror", "King of kings", "Light of the world", "Lord of the seas"], ["ప్రపంచ విజేత", "రాజాధిరాజు", "ప్రపంచానికి వెలుగు", "సముద్రాధిపతి"], 0, "Salim took the title Jahangir (world conqueror). He loved birds, was a great painter, and his wife Nurjahan took over administration when he was ill.", "సలీం జహంగీర్ (ప్రపంచ విజేత) బిరుదు ధరించాడు. పక్షులంటే ప్రేమ, గొప్ప చిత్రకారుడు; అతను అనారోగ్యంతో ఉన్నప్పుడు భార్య నూర్జహాన్ పాలన చూసింది."], ["Under the reign of this emperor, also called Khurram, the Mughal Empire reached the peak of its cultural glory", "ఖుర్రం అని కూడా పిలువబడిన ఈ చక్రవర్తి కాలంలో మొఘల్ సామ్రాజ్యం సాంస్కృతిక వైభవ శిఖరానికి చేరింది", ["Shah Jahan", "Jahangir", "Aurangzeb", "Akbar"], ["షాజహాన్", "జహంగీర్", "ఔరంగజేబు", "అక్బర్"], 0, "Shah Jahan (Khurram), son of Jahangir — under him the empire reached its cultural peak: Taj Mahal, Moti Masjid (Agra), Jama Masjid and Red Fort (Delhi).", "జహంగీర్ కుమారుడు షాజహాన్ (ఖుర్రం) — అతని కాలంలో సాంస్కృతిక వైభవ శిఖరం: తాజ్ మహల్, మోతీ మసీదు (ఆగ్రా), జామా మసీదు, ఎర్రకోట (ఢిల్లీ)."], ["It is said that this emperor met his personal expenses with money earned by sewing caps", "టోపీలు కుట్టి సంపాదించిన డబ్బుతో తన వ్యక్తిగత ఖర్చులు భరించాడని చెప్పబడే చక్రవర్తి", ["Aurangzeb", "Akbar", "Babur", "Shah Jahan"], ["ఔరంగజేబు", "అక్బర్", "బాబర్", "షాజహాన్"], 0, "Aurangzeb, a devout Muslim, is said to have covered his own expenses (food, clothing) with money earned by sewing caps.", "భక్తిపరుడైన ముస్లిం ఔరంగజేబు టోపీలు కుట్టి సంపాదించిన డబ్బుతో తన ఆహారం, దుస్తుల ఖర్చులు భరించాడని చెబుతారు."], ["Aurangzeb conquered Bijapur in ____ and Golkonda in ____", "ఔరంగజేబు బీజాపూర్‌ను ____ లో, గోల్కొండను ____ లో జయించాడు", ["1685 CE; 1687 CE", "1687 CE; 1685 CE", "1658 CE; 1707 CE", "1674 CE; 1680 CE"], ["1685; 1687", "1687; 1685", "1658; 1707", "1674; 1680"], 0, "After Shivaji's death, Aurangzeb invaded the Deccan and conquered Bijapur in 1685 CE and Golkonda in 1687 CE.", "శివాజీ మరణం తర్వాత ఔరంగజేబు దక్కన్‌పై దండెత్తి 1685లో బీజాపూర్, 1687లో గోల్కొండను జయించాడు."], ["The contemporary Mughal ruler of Shivaji was", "శివాజీ సమకాలీన మొఘల్ పాలకుడు", ["Akbar", "Babur", "Jahangir", "Aurangzeb"], ["అక్బర్", "బాబర్", "జహంగీర్", "ఔరంగజేబు"], 3, "Shivaji revolted against Aurangzeb and established an independent Maratha kingdom. (Textbook exercise.)", "శివాజీ ఔరంగజేబుకు వ్యతిరేకంగా తిరుగుబాటు చేసి స్వతంత్ర మరాఠా రాజ్యం స్థాపించాడు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Arrange the administrative divisions of the Mughal Empire from largest to smallest", "మొఘల్ సామ్రాజ్య పరిపాలనా విభాగాలను పెద్దదాని నుండి చిన్నదానికి అమర్చండి", ["Subas, Sarkars, Paraganas", "Sarkars, Subas, Paraganas", "Paraganas, Sarkars, Subas", "Mandalas, Nadus, Gramas"], ["సుబాలు, సర్కార్లు, పరగణాలు", "సర్కార్లు, సుబాలు, పరగణాలు", "పరగణాలు, సర్కార్లు, సుబాలు", "మండలాలు, నాడులు, గ్రామాలు"], 0, "Akbar divided his empire into Subas (provinces, each under a Subedar); Subas into Sarkars; Sarkars into Paraganas.", "అక్బర్ సామ్రాజ్యాన్ని సుబాలుగా (ప్రతి సుబాకు సుబేదార్), సుబాలను సర్కార్లుగా, సర్కార్లను పరగణాలుగా విభజించాడు."], ["In the Mughal Empire, a 'Suba' (province) was governed by a", "మొఘల్ సామ్రాజ్యంలో 'సుబా' (రాష్ట్రం) పాలకుడు", ["Subedar", "Mansabdar", "Peshwa", "Nayak"], ["సుబేదార్", "మన్సబ్‌దార్", "పీష్వా", "నాయకుడు"], 0, "Akbar appointed a Subedar for each Suba. According to the textbook, Akbar divided his kingdom into 15 Subas.", "అక్బర్ ప్రతి సుబాకు ఒక సుబేదార్‌ను నియమించాడు. పాఠ్యపుస్తకం ప్రకారం అక్బర్ రాజ్యాన్ని 15 సుబాలుగా విభజించాడు."], ["The term 'Mansabdar' refers to an individual who holds a mansab, meaning", "'మన్సబ్‌దార్' అంటే మన్సబ్ కలిగినవాడు. మన్సబ్ అంటే", ["A position or rank", "A piece of land", "A tax", "A coin"], ["పదవి లేదా హోదా (ర్యాంక్)", "భూమి ముక్క", "పన్ను", "నాణెం"], 0, "Akbar introduced the Mansabdari system — a grading system to fix rank, salary and military responsibilities. Each mansabdar had 10 to 10,000 soldiers. (Textbook match: Mansabdar – Rank.)", "అక్బర్ మన్సబ్‌దారీ విధానం ప్రవేశపెట్టాడు — హోదా, జీతం, సైనిక బాధ్యతలు నిర్ణయించే శ్రేణీ విధానం. ఒక్కో మన్సబ్‌దార్ కింద 10 నుండి 10,000 సైనికులు. (పాఠ్యపుస్తక జతపరచడం: మన్సబ్‌దార్ – హోదా.)"], ["Akbar's religious tolerance is shown by the fact that he abolished", "అక్బర్ మత సహనానికి నిదర్శనంగా అతను రద్దు చేసిన పన్నులు", ["Jizya tax and Pilgrim tax on Hindus", "Land revenue and customs duty", "Zabt and Dam", "Trade and commercial taxes"], ["హిందువులపై జిజియా, యాత్రా పన్నులు", "భూమి శిస్తు, సుంకాలు", "జబ్త్, దామ్", "వర్తక, వాణిజ్య పన్నులు"], 0, "Akbar showed religious tolerance — he abolished the Jizya tax and the Pilgrim tax levied on Hindus and allowed religious ceremonies to be celebrated openly.", "అక్బర్ మత సహనం చూపాడు — హిందువులపై ఉన్న జిజియా, యాత్రా పన్నులను రద్దు చేసి, మతపరమైన వేడుకలు బహిరంగంగా జరుపుకోనిచ్చాడు."], ["Ibadat Khana, the house of worship built by Akbar in 1575 CE, is situated in", "1575లో అక్బర్ నిర్మించిన ప్రార్థనా మందిరం 'ఇబాదత్ ఖానా' ఉన్న ప్రదేశం", ["Fatehpur Sikri", "Delhi", "Jahangirabad", "Aurangabad"], ["ఫతేపూర్ సిక్రీ", "ఢిల్లీ", "జహంగీరాబాద్", "ఔరంగాబాద్"], 0, "Akbar built the Ibadat Khana at Fatehpur Sikri in 1575 CE. (Textbook exercise.)", "అక్బర్ 1575లో ఫతేపూర్ సిక్రీలో ఇబాదత్ ఖానా నిర్మించాడు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["In 1582 CE Akbar proclaimed Din-i-Ilahi, which literally means", "1582లో అక్బర్ ప్రకటించిన దీన్-ఇ-ఇలాహీ అక్షరార్థం", ["Peace with all (universal peace)", "Holy war", "Victory city", "World conqueror"], ["అందరితో శాంతి (సార్వత్రిక శాంతి)", "పవిత్ర యుద్ధం", "విజయ నగరం", "ప్రపంచ విజేత"], 0, "Din-i-Ilahi (1582 CE) literally means 'Peace with all' — a harmonious relationship among religions. Only 18 people joined it; it remained a court religion.", "దీన్-ఇ-ఇలాహీ (1582) అర్థం 'అందరితో శాంతి' — మతాల మధ్య సామరస్యం. 18 మంది మాత్రమే చేరారు; ఇది ఆస్థాన మతంగానే మిగిలిపోయింది."], ["The Mughals adopted and standardised the Rupee (silver) and Dam (copper) currencies introduced by", "వెండి రూపాయి, రాగి దామ్ నాణేలను మొదట ప్రవేశపెట్టి, తర్వాత మొఘలులు ప్రామాణీకరించినవి ఎవరివి", ["Sher Shah Sur", "Babur", "Muhammad bin Tughlaq", "Krishna Deva Raya"], ["షేర్ షా సూర్", "బాబర్", "మహమ్మద్ బిన్ తుగ్లక్", "శ్రీకృష్ణదేవరాయలు"], 0, "The Mughals adopted and standardised the Rupee (silver) and Dam (copper) introduced by Sher Shah Sur; the Dam was the most common coin in Akbar's time.", "షేర్ షా సూర్ ప్రవేశపెట్టిన రూపాయి (వెండి), దామ్ (రాగి) నాణేలను మొఘలులు ప్రామాణీకరించారు; అక్బర్ కాలంలో దామ్ ఎక్కువగా వాడబడింది."], ["Match the following:\nA. Copper coin   B. Mansabdar   C. Taj Mahal   D. Todar Mal   E. Tuzuk-i-Jahangiri\n1. Shah Jahan   2. Autobiography   3. Minister   4. Dam   5. Rank", "జతపరచండి:\nA. రాగి నాణెం   B. మన్సబ్‌దార్   C. తాజ్ మహల్   D. తోడర్‌మల్   E. తుజుక్-ఇ-జహంగీరీ\n1. షాజహాన్   2. ఆత్మకథ   3. మంత్రి   4. దామ్   5. హోదా", ["A-4, B-5, C-1, D-3, E-2", "A-5, B-4, C-1, D-2, E-3", "A-4, B-5, C-3, D-1, E-2", "A-1, B-5, C-4, D-3, E-2"], ["A-4, B-5, C-1, D-3, E-2", "A-5, B-4, C-1, D-2, E-3", "A-4, B-5, C-3, D-1, E-2", "A-1, B-5, C-4, D-3, E-2"], 0, "Copper coin – Dam; Mansabdar – Rank; Taj Mahal – Shah Jahan; Todar Mal – Minister; Tuzuk-i-Jahangiri – Autobiography. (Textbook exercise.)", "రాగి నాణెం – దామ్; మన్సబ్‌దార్ – హోదా; తాజ్ మహల్ – షాజహాన్; తోడర్‌మల్ – మంత్రి; తుజుక్-ఇ-జహంగీరీ – ఆత్మకథ. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Akbar's revenue system 'Zabt' was developed largely under the supervision of his revenue minister", "అక్బర్ 'జబ్త్' రెవెన్యూ విధానం ఎక్కువగా ఈ రెవెన్యూ మంత్రి పర్యవేక్షణలో రూపొందింది", ["Raja Todar Mal", "Birbal", "Bairam Khan", "Abul Fazal"], ["రాజా తోడర్‌మల్", "బీర్బల్", "బైరాం ఖాన్", "అబుల్ ఫజల్"], 0, "The Zabt system was developed under Raja Todar Mal. In 1580 CE previous 10 years' revenue statistics were averaged; tax ranged from one-third to one-half of production value, payable in dams.", "జబ్త్ విధానం రాజా తోడర్‌మల్ పర్యవేక్షణలో రూపొందింది. 1580లో గత 10 ఏళ్ళ గణాంకాల సగటు తీసుకున్నారు; పన్ను ఉత్పత్తి విలువలో 1/3 నుండి 1/2 వరకు, దామ్‌లలో చెల్లించాలి."], ["Identify the commercial crops that Indian cultivators began to grow extensively during the Mughal period", "మొఘల్ కాలంలో భారతీయ రైతులు విస్తృతంగా పండించడం ప్రారంభించిన వాణిజ్య పంటలు", ["Maize and Tobacco", "Wheat and Barley", "Rice and Millets", "Tea and Coffee"], ["మొక్కజొన్న, పొగాకు", "గోధుమ, బార్లీ", "వరి, చిరుధాన్యాలు", "తేయాకు, కాఫీ"], 0, "Food crops: wheat, rice, barley; cash crops: cotton, opium, indigo. Cultivators began to grow the commercial crops maize and tobacco extensively.", "ఆహార పంటలు: గోధుమ, వరి, బార్లీ; వాణిజ్య పంటలు: పత్తి, నల్లమందు, నీలిమందు. మొక్కజొన్న, పొగాకు విస్తృతంగా పండించడం ప్రారంభమైంది."], ["Akbar shifted his capital from Agra to Sikri ridge to honour the Sufi saint", "అక్బర్ ఈ సూఫీ సాధువు గౌరవార్థం రాజధానిని ఆగ్రా నుండి సిక్రీ కొండకు మార్చాడు", ["Sheikh Salim Chishti", "Nizamuddin Auliya", "Moinuddin Chishti", "Samartha Ramadas"], ["షేక్ సలీం చిష్తీ", "నిజాముద్దీన్ ఔలియా", "మొయినుద్దీన్ చిష్తీ", "సమర్థ రామదాసు"], 0, "After victories over Chittor and Ranthambore, Akbar shifted his capital to Sikri ridge to honour Sheikh Salim Chishti; the city was named Fatehabad, later Fatehpur Sikri.", "చిత్తోర్, రణథంబోర్ విజయాల తర్వాత షేక్ సలీం చిష్తీ గౌరవార్థం అక్బర్ రాజధానిని సిక్రీకి మార్చాడు; నగరం ఫతేహాబాద్, తర్వాత ఫతేపూర్ సిక్రీ అయింది."], ["Akbar built the Buland Darwaza at Fatehpur Sikri as a victory arch to commemorate his successful campaign in", "అక్బర్ ఫతేపూర్ సిక్రీలో బులంద్ దర్వాజాను ఈ విజయానికి గుర్తుగా విజయతోరణంగా నిర్మించాడు", ["Gujarat", "Bengal", "Deccan", "Kabul"], ["గుజరాత్", "బెంగాల్", "దక్కన్", "కాబూల్"], 0, "Buland Darwaza ('the lofty') was built by Akbar as a victory arch to commemorate his successful Gujarat campaign. Panch Mahal is a five-storeyed building there.", "బులంద్ దర్వాజా (ఎత్తైన ద్వారం)ను అక్బర్ గుజరాత్ దండయాత్ర విజయానికి గుర్తుగా నిర్మించాడు. అక్కడి పంచ్ మహల్ ఐదు అంతస్తుల భవనం."], ["Identify the structure that is NOT inside the Red Fort complex", "ఎర్రకోట సముదాయంలో లేని నిర్మాణం", ["Diwan-e-Aam", "Diwan-e-Khas", "Rang Mahal", "Buland Darwaza"], ["దివాన్-ఇ-ఆమ్", "దివాన్-ఇ-ఖాస్", "రంగ్ మహల్", "బులంద్ దర్వాజా"], 3, "The Red Fort includes Diwan-e-Aam, Diwan-e-Khas, Moti Masjid, Hayat Bakhsh Bagh and Rang Mahal. Buland Darwaza is at Fatehpur Sikri.", "ఎర్రకోటలో దివాన్-ఇ-ఆమ్, దివాన్-ఇ-ఖాస్, మోతీ మసీదు, హయాత్ బక్ష్ బాగ్, రంగ్ మహల్ ఉన్నాయి. బులంద్ దర్వాజా ఫతేపూర్ సిక్రీలో ఉంది."], ["The Taj Mahal, the 'jewel of Mughal art in India', was built by Shah Jahan in memory of his wife", "'భారతదేశంలో మొఘల్ కళా రత్నం' తాజ్ మహల్‌ను షాజహాన్ ఈ భార్య జ్ఞాపకార్థం నిర్మించాడు", ["Mumtaz", "Nurjahan", "Jodhabai", "Jijabai"], ["ముంతాజ్", "నూర్జహాన్", "జోధాబాయి", "జిజాబాయి"], 0, "The Taj Mahal, a white marble mausoleum in Agra, was built by Shah Jahan in memory of his wife Mumtaz.", "ఆగ్రాలోని తెల్లని పాలరాతి సమాధి తాజ్ మహల్‌ను షాజహాన్ తన భార్య ముంతాజ్ జ్ఞాపకార్థం నిర్మించాడు."], ["Identify the mismatched pair", "సరిగా జతపరచని జతను గుర్తించండి", ["Qutub Minar – Humayun", "Tansen – Rag Dipak", "Abul Fazal – Akbar Nama", "Shivaji – Raigarh"], ["కుతుబ్ మినార్ – హుమాయూన్", "తాన్‌సేన్ – రాగ్ దీపక్", "అబుల్ ఫజల్ – అక్బర్ నామా", "శివాజీ – రాయగఢ్"], 0, "Qutub Minar is linked with the Delhi Sultanate (begun by Qutb-ud-din Aibak), not Humayun. The other pairs are correct. (Textbook exercise.)", "కుతుబ్ మినార్ ఢిల్లీ సుల్తానుల (కుతుబుద్దీన్ ఐబక్ ప్రారంభం) కాలానిది, హుమాయూన్‌ది కాదు. మిగిలినవి సరైన జతలు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Ain-i-Akbari and Akbar Nama were written by", "ఐన్-ఇ-అక్బరీ, అక్బర్ నామా రచయిత", ["Abul Fazal", "Birbal", "Tulsidas", "Dara Shikoh"], ["అబుల్ ఫజల్", "బీర్బల్", "తులసీదాస్", "దారా షికో"], 0, "Abul Fazal, a great scholar in Akbar's time, wrote Ain-i-Akbari and Akbar Nama. Persian was the official language of the empire.", "అక్బర్ కాలపు గొప్ప పండితుడు అబుల్ ఫజల్ ఐన్-ఇ-అక్బరీ, అక్బర్ నామా రచించాడు. సామ్రాజ్య అధికార భాష పర్షియన్."], ["Shah Jahan's son who translated the Bhagavad Gita and the Mahabharata into Persian was", "భగవద్గీత, మహాభారతాన్ని పర్షియన్ భాషలోకి అనువదించిన షాజహాన్ కుమారుడు", ["Dara Shikoh", "Aurangzeb", "Murad", "Shuja"], ["దారా షికో", "ఔరంగజేబు", "మురాద్", "షుజా"], 0, "Shah Jahan's son Dara Shikoh translated the Bhagavad Gita and the Mahabharata into Persian.", "షాజహాన్ కుమారుడు దారా షికో భగవద్గీత, మహాభారతాన్ని పర్షియన్‌లోకి అనువదించాడు."], ["The most influential Hindi poet who wrote the Ramcharitmanas, the Hindi version of the Ramayana, during this period was", "ఈ కాలంలో రామాయణాన్ని హిందీలో 'రామచరితమానస్'గా రచించిన ప్రభావశాలి హిందీ కవి", ["Tulsidas", "Kabir", "Surdas", "Tansen"], ["తులసీదాస్", "కబీర్", "సూరదాస్", "తాన్‌సేన్"], 0, "Tulsidas wrote the Ramcharitmanas, the Hindi version of the Ramayana.", "తులసీదాస్ రామాయణాన్ని హిందీలో రామచరితమానస్‌గా రచించాడు."], ["Mughal miniature painting reached its peak under the patronage of", "మొఘల్ సూక్ష్మ చిత్రకళ ఎవరి పోషణలో శిఖరానికి చేరింది", ["Jahangir", "Aurangzeb", "Babur", "Humayun"], ["జహంగీర్", "ఔరంగజేబు", "బాబర్", "హుమాయూన్"], 0, "A new school of miniature painting emerged; it reached its peak under Jahangir. Peacock blue and Indian red were newly introduced colours.", "మొఘల్ కాలంలో సూక్ష్మ చిత్రకళ ఆవిర్భవించింది; జహంగీర్ పోషణలో శిఖరానికి చేరింది. నెమలి నీలం, భారతీయ ఎరుపు రంగులు కొత్తగా ప్రవేశపెట్టారు."], ["The musician in Akbar's court, one of his Navaratnas, said to create rain by singing Megh Malhar, was", "మేఘ మల్హార్ పాడి వర్షం కురిపించేవాడని చెప్పబడే అక్బర్ ఆస్థాన సంగీతకారుడు, నవరత్నాలలో ఒకరు", ["Tansen", "Abul Fazal", "Raja Birbal", "Raja Todar Mal"], ["తాన్‌సేన్", "అబుల్ ఫజల్", "రాజా బీర్బల్", "రాజా తోడర్‌మల్"], 0, "Tansen was one of Akbar's Navaratnas. Abul Fazal mentions 36 singers in Akbar's court, the most famous being Tansen and Baz Bahadur. (Textbook exercise.)", "తాన్‌సేన్ అక్బర్ నవరత్నాలలో ఒకడు. అబుల్ ఫజల్ ప్రకారం అక్బర్ ఆస్థానంలో 36 మంది గాయకులు; వారిలో ప్రసిద్ధులు తాన్‌సేన్, బాజ్ బహదూర్. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Mughal Empire, founded by Babur in 1526 CE, collapsed in 1857 CE during the reign of", "1526లో బాబర్ స్థాపించిన మొఘల్ సామ్రాజ్యం 1857లో ఈ పాలకుని కాలంలో కూలిపోయింది", ["Bahadur Shah II", "Aurangzeb", "Shah Alam II", "Farrukhsiyar"], ["రెండవ బహదూర్ షా", "ఔరంగజేబు", "రెండవ షా ఆలం", "ఫరూక్‌సియార్"], 0, "The Mughal Empire collapsed in 1857 CE during the reign of Bahadur Shah II.", "మొఘల్ సామ్రాజ్యం 1857లో రెండవ బహదూర్ షా కాలంలో అంతమైంది."], ["Identify the one that was NOT a reason for the decline of the Mughal Empire", "మొఘల్ సామ్రాజ్య పతనానికి కారణం కానిది", ["Akbar's policy of religious tolerance", "Incapable heirs of Aurangzeb", "Wars of succession among the sons", "Invasions of Nadir Shah and Ahmad Shah"], ["అక్బర్ మత సహన విధానం", "ఔరంగజేబు అసమర్థ వారసులు", "కుమారుల మధ్య వారసత్వ యుద్ధాలు", "నాదిర్ షా, అహ్మద్ షా దండయాత్రలు"], 0, "Reasons for decline: Aurangzeb's policies and revolts, incapable heirs, corrupt nobles, wars of succession, the Deccan policy, invasions of Nadir Shah and Ahmad Shah, revolts of Mansabdars. Akbar's tolerance strengthened the empire.", "పతన కారణాలు: ఔరంగజేబు విధానాలు, తిరుగుబాట్లు, అసమర్థ వారసులు, అవినీతి సామంతులు, వారసత్వ యుద్ధాలు, దక్కన్ విధానం, నాదిర్ షా, అహ్మద్ షా దండయాత్రలు, మన్సబ్‌దార్ల తిరుగుబాట్లు. అక్బర్ మత సహనం సామ్రాజ్యాన్ని బలపరిచింది."], ["Shivaji, the founder of the Maratha kingdom, was born in", "మరాఠా రాజ్య స్థాపకుడు శివాజీ జన్మస్థలం", ["Shivneri fort near Pune", "Raigarh fort", "Torana fort", "Agra fort"], ["పుణే సమీపంలోని శివనేరి కోట", "రాయగఢ్ కోట", "తోరణ కోట", "ఆగ్రా కోట"], 0, "Shivaji was born in Shivneri fort near Pune; his father Shahji Bhonsle served the Sultan of Bijapur; he was brought up by his mother Jijabai.", "శివాజీ పుణే సమీపంలోని శివనేరి కోటలో జన్మించాడు; తండ్రి షాహాజీ భోంస్లే బీజాపూర్ సుల్తాన్ వద్ద ఉన్నత పదవిలో ఉన్నాడు; తల్లి జిజాబాయి పెంచింది."], ["Shivaji was inspired by the teachings of the Maratha saint", "శివాజీని ప్రేరేపించిన మరాఠా సాధువు", ["Samartha Ramadas", "Sheikh Salim Chishti", "Tulsidas", "Vidyaranya"], ["సమర్థ రామదాసు", "షేక్ సలీం చిష్తీ", "తులసీదాస్", "విద్యారణ్యులు"], 0, "Shivaji was inspired by Samartha Ramadas; his tutors Dadaji Kondadev and Tanaji Malusare taught him warfare. He built a strong brigade with the Mavalis, tribal people of the Western Ghats.", "శివాజీ సమర్థ రామదాసు బోధనలతో ప్రేరణ పొందాడు; దాదాజీ కొండదేవ్, తానాజీ మాలుసరే యుద్ధ విద్య నేర్పారు. పశ్చిమ కనుమల గిరిజనులైన మావళీలతో బలమైన సైన్యం నిర్మించాడు."], ["The general of Bijapur whom Shivaji killed with the 'Vyaghra Nakha' (tiger's claw) was", "'వ్యాఘ్ర నఖం' (పులి గోళ్ళు)తో శివాజీ చంపిన బీజాపూర్ సేనాని", ["Afzal Khan", "Shaista Khan", "Raja Jai Singh", "Mahmud Gawan"], ["అఫ్జల్ ఖాన్", "షయిస్తా ఖాన్", "రాజా జయసింహ", "మహమూద్ గవాన్"], 0, "The Sultan of Bijapur sent Afzal Khan, who invited Shivaji under the pretext of reconciliation; Shivaji killed him with the Vyaghra Nakha. Later Aurangzeb sent Shaista Khan, whom Shivaji defeated.", "బీజాపూర్ సుల్తాన్ పంపిన అఫ్జల్ ఖాన్ సంధి పేరుతో శివాజీని పిలిచాడు; శివాజీ వ్యాఘ్ర నఖంతో అతన్ని చంపాడు. తర్వాత ఔరంగజేబు పంపిన షయిస్తా ఖాన్‌ను కూడా ఓడించాడు."], ["In the Ashta Pradhan council of Shivaji, the Prime Minister was called", "శివాజీ అష్టప్రధాన్ మండలిలో ప్రధానమంత్రిని ఇలా పిలిచారు", ["Peshwa", "Amatya", "Senapati", "Sumant"], ["పీష్వా", "అమాత్య", "సేనాపతి", "సుమంత్"], 0, "Shivaji had eight ministers called Ashta Pradhans; the Prime Minister was the Peshwa. Amatya – Finance, Senapati – Commander-in-chief, Sumant – Foreign Minister.", "శివాజీకి అష్టప్రధానులు అనే ఎనిమిది మంది మంత్రులు; ప్రధానమంత్రి పీష్వా. అమాత్య – ఆర్థిక, సేనాపతి – సర్వసైన్యాధిపతి, సుమంత్ – విదేశాంగ మంత్రి."], ["Match the Ashta Pradhans with their roles:\nA. Amatya   B. Sumant   C. Nyayadhish   D. Panditrao\n1. High priest   2. Chief Justice   3. Foreign Minister   4. Finance Minister", "అష్టప్రధానులను వారి బాధ్యతలతో జతపరచండి:\nA. అమాత్య   B. సుమంత్   C. న్యాయాధీశ్   D. పండితరావు\n1. ప్రధాన పురోహితుడు   2. ప్రధాన న్యాయమూర్తి   3. విదేశాంగ మంత్రి   4. ఆర్థిక మంత్రి", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-3, C-1, D-2", "A-2, B-3, C-4, D-1"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-3, C-1, D-2", "A-2, B-3, C-4, D-1"], 0, "Amatya – Finance Minister; Sumant – Foreign Minister; Nyayadhish – Chief Justice; Panditrao – High priest.", "అమాత్య – ఆర్థిక మంత్రి; సుమంత్ – విదేశాంగ మంత్రి; న్యాయాధీశ్ – ప్రధాన న్యాయమూర్తి; పండితరావు – ప్రధాన పురోహితుడు."], ["While teaching the Mughal Empire, a teacher asks students to role-play an Akbar–Birbal story and to mark Delhi, Agra and Fatehpur Sikri on an outline map. This mainly promotes", "మొఘల్ సామ్రాజ్యం బోధిస్తూ ఉపాధ్యాయుడు అక్బర్–బీర్బల్ కథను పాత్రాభినయం చేయించి, ఢిల్లీ, ఆగ్రా, ఫతేపూర్ సిక్రీలను పటంలో గుర్తించమన్నాడు. ఇది ప్రధానంగా ప్రోత్సహించేది", ["Activity-based, experiential learning", "Rote memorisation of dates", "Teacher-centred lecturing", "Punishment-based discipline"], ["కృత్యాధార, అనుభవపూర్వక అభ్యసనం", "తేదీల బట్టీ", "ఉపాధ్యాయ కేంద్రిత ఉపన్యాసం", "శిక్షల ఆధారిత క్రమశిక్షణ"], 0, "Role-play and map work are activity-based methods that make history experiential and engaging, as suggested in the textbook's 'Let's Do' activities.", "పాత్రాభినయం, పటం పని కృత్యాధార పద్ధతులు; పాఠ్యపుస్తకంలోని 'చేద్దాం' కృత్యాల వలె చరిత్రను అనుభవపూర్వకంగా, ఆసక్తికరంగా చేస్తాయి."]]}, {"n": 8, "en": "Bhakti – Sufi", "te": "భక్తి – సూఫీ ఉద్యమాలు", "c": "#db2777", "q": [["'Bhakti' means", "'భక్తి' అంటే", ["Devotion and surrender to God", "Knowledge of the Vedas", "Performing rituals", "Renouncing the world"], ["దేవునిపై భక్తి, శరణాగతి", "వేద జ్ఞానం", "కర్మకాండలు చేయడం", "ప్రపంచాన్ని త్యజించడం"], 0, "Bhakti means devotion to God — attachment, a state of mind where the devotee surrenders unquestioningly; it builds a strong relation between devotee and God.", "భక్తి అంటే దేవునిపై భక్తి — భక్తుడు ప్రశ్నించకుండా సంపూర్ణంగా శరణాగతి పొందే మానసిక స్థితి; భక్తునికి, దేవునికి మధ్య బలమైన బంధం."], ["According to the textbook, the Bhakti movement started in the ____ century and continued up to the ____ century", "పాఠ్యపుస్తకం ప్రకారం భక్తి ఉద్యమం ____ శతాబ్దంలో ప్రారంభమై ____ శతాబ్దం వరకు కొనసాగింది", ["8th; 17th", "6th; 12th", "10th; 19th", "12th; 15th"], ["8వ; 17వ", "6వ; 12వ", "10వ; 19వ", "12వ; 15వ"], 0, "The Bhakti movement started in the 8th century and continued up to the 17th century, spreading all over India. (Textbook exercise: it began in the 8th century CE.)", "భక్తి ఉద్యమం 8వ శతాబ్దంలో ప్రారంభమై 17వ శతాబ్దం వరకు దేశమంతా వ్యాపించింది. (పాఠ్యపుస్తక అభ్యాసం: 8వ శతాబ్దంలో ప్రారంభమైంది.)"], ["In Hinduism, the different paths of attaining moksha are", "హిందూమతంలో మోక్ష సాధనకు ఉన్న వివిధ మార్గాలు", ["Karma, Gnana and Bhakti", "Zabt, Dahsala and Batai", "Saf, Suf and Sama", "Satra, Namghar and Math"], ["కర్మ, జ్ఞాన, భక్తి", "జబ్త్, దహసాల, బటాయి", "సఫ్, సూఫ్, సమా", "సత్ర, నామఘర్, మఠం"], 0, "In Hinduism there are different paths to moksha — Karma, Gnana and Bhakti. In the medieval period the path of Bhakti became more popular.", "హిందూమతంలో మోక్షానికి కర్మ, జ్ఞాన, భక్తి మార్గాలు ఉన్నాయి. మధ్యయుగంలో భక్తి మార్గం ఎక్కువ ప్రాచుర్యం పొందింది."], ["Worshipping God with form is called", "రూపంతో కూడిన దేవుని ఆరాధనను ఇలా అంటారు", ["Saguna Bhakti", "Nirguna Bhakti", "Advaita", "Sufism"], ["సగుణ భక్తి", "నిర్గుణ భక్తి", "అద్వైతం", "సూఫీయిజం"], 0, "Saguna Bhakti means worshipping God with form; Nirguna Bhakti means worshipping God without form.", "సగుణ భక్తి అంటే రూపంతో దేవుని ఆరాధన; నిర్గుణ భక్తి అంటే రూపం లేని దేవుని ఆరాధన."], ["Match the following:\nA. Alwars   B. Hindu scripture   C. Saguna Bhakti   D. Nirguna Bhakti   E. Shaiva\n1. Worship of the divine as formless   2. Nayanars   3. Worshipping god with form   4. Ramayana, Bhagavadgita   5. Worshipping of Vishnu", "జతపరచండి:\nA. ఆళ్వారులు   B. హిందూ గ్రంథం   C. సగుణ భక్తి   D. నిర్గుణ భక్తి   E. శైవం\n1. రూపం లేని దైవారాధన   2. నాయనార్లు   3. రూపంతో దైవారాధన   4. రామాయణం, భగవద్గీత   5. విష్ణువు ఆరాధన", ["A-5, B-4, C-3, D-1, E-2", "A-2, B-4, C-3, D-1, E-5", "A-5, B-3, C-4, D-1, E-2", "A-5, B-4, C-1, D-3, E-2"], ["A-5, B-4, C-3, D-1, E-2", "A-2, B-4, C-3, D-1, E-5", "A-5, B-3, C-4, D-1, E-2", "A-5, B-4, C-1, D-3, E-2"], 0, "Alwars – worship of Vishnu; Hindu scripture – Ramayana, Bhagavadgita; Saguna – God with form; Nirguna – formless; Shaiva – Nayanars. (Textbook exercise.)", "ఆళ్వారులు – విష్ణు ఆరాధన; హిందూ గ్రంథం – రామాయణం, భగవద్గీత; సగుణ – రూపంతో; నిర్గుణ – రూపం లేని; శైవం – నాయనార్లు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["The Vaishnava saints and the Saiva saints who spread the Bhakti movement in South India, mainly in Tamil Nadu, were respectively", "దక్షిణ భారతదేశంలో, ముఖ్యంగా తమిళనాడులో భక్తి ఉద్యమాన్ని వ్యాప్తి చేసిన వైష్ణవ, శైవ భక్తులు వరుసగా", ["Alwars and Nayanars", "Nayanars and Alwars", "Sufis and Alwars", "Sikhs and Nayanars"], ["ఆళ్వారులు, నాయనార్లు", "నాయనార్లు, ఆళ్వారులు", "సూఫీలు, ఆళ్వారులు", "సిక్కులు, నాయనార్లు"], 0, "Alwars were Vaishnava saints and Nayanars were Saiva saints; they came from all castes and spread Bhakti in South India, mainly Tamil Nadu.", "ఆళ్వారులు వైష్ణవ భక్తులు, నాయనార్లు శైవ భక్తులు; అన్ని కులాల నుండి వచ్చి దక్షిణ భారతంలో, ముఖ్యంగా తమిళనాడులో భక్తిని వ్యాపింపజేశారు."], ["Match the philosophers with their philosophies:\nA. Adi Shankaracharya   B. Ramanujacharya   C. Madhwacharya   D. Vallabhacharya\n1. Suddhadvaita   2. Dwaita   3. Visishtadvaita   4. Advaita", "తత్వవేత్తలను వారి సిద్ధాంతాలతో జతపరచండి:\nA. ఆది శంకరాచార్యులు   B. రామానుజాచార్యులు   C. మధ్వాచార్యులు   D. వల్లభాచార్యులు\n1. శుద్ధాద్వైతం   2. ద్వైతం   3. విశిష్టాద్వైతం   4. అద్వైతం", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Shankaracharya – Advaita; Ramanujacharya – Visishtadvaita; Madhwacharya – Dwaita; Vallabhacharya – Suddhadvaita (pure non-dualism).", "శంకరాచార్యులు – అద్వైతం; రామానుజాచార్యులు – విశిష్టాద్వైతం; మధ్వాచార్యులు – ద్వైతం; వల్లభాచార్యులు – శుద్ధాద్వైతం."], ["Who preached the Visishtadvaita philosophy?", "విశిష్టాద్వైత సిద్ధాంతాన్ని బోధించినవారు", ["Ramanuja", "Shankaracharya", "Ramananda", "Kabir"], ["రామానుజులు", "శంకరాచార్యులు", "రామానందుడు", "కబీర్"], 0, "Ramanujacharya preached Visishtadvaita. (Textbook exercise.)", "రామానుజాచార్యులు విశిష్టాద్వైతాన్ని బోధించారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Adi Shankaracharya was born at", "ఆది శంకరాచార్యుల జన్మస్థలం", ["Kaladi in Kerala", "Sriperumbudur in Tamil Nadu", "Prayag", "Talwandi"], ["కేరళలోని కాలడి", "తమిళనాడులోని శ్రీపెరంబుదూర్", "ప్రయాగ", "తల్వండి"], 0, "Shankaracharya was born in Kaladi, Kerala; he became a saint at the age of five and preached Advaita.", "శంకరాచార్యులు కేరళలోని కాలడిలో జన్మించారు; ఐదేళ్ళ వయసులోనే సన్యాసం స్వీకరించి అద్వైతం బోధించారు."], ["Adi Shankaracharya established four peethas in the four corners of India. Identify the correct set", "ఆది శంకరాచార్యులు భారతదేశ నాలుగు దిక్కులలో నాలుగు పీఠాలు స్థాపించారు. సరైన సమూహం", ["Badri (N), Sringeri (S), Puri (E), Dwaraka (W)", "Kashi (N), Kanchi (S), Puri (E), Somnath (W)", "Badri (N), Rameswaram (S), Gaya (E), Dwaraka (W)", "Haridwar (N), Sringeri (S), Puri (E), Ujjain (W)"], ["బద్రి (ఉ), శృంగేరి (ద), పూరి (తూ), ద్వారక (ప)", "కాశీ (ఉ), కంచి (ద), పూరి (తూ), సోమనాథ్ (ప)", "బద్రి (ఉ), రామేశ్వరం (ద), గయ (తూ), ద్వారక (ప)", "హరిద్వార్ (ఉ), శృంగేరి (ద), పూరి (తూ), ఉజ్జయిని (ప)"], 0, "He established peethas (mathas) at Badri in the North, Sringeri in the South, Puri in the East and Dwaraka in the West.", "ఉత్తరాన బద్రి, దక్షిణాన శృంగేరి, తూర్పున పూరి, పశ్చిమాన ద్వారకలలో పీఠాలు (మఠాలు) స్థాపించారు."], ["Identify the work that was NOT written by Adi Shankaracharya", "ఆది శంకరాచార్యులు రచించనిది", ["Vivekachudamani", "Soundaryalahari", "Sivanandalahari", "Sri Bhashya"], ["వివేకచూడామణి", "సౌందర్యలహరి", "శివానందలహరి", "శ్రీభాష్యం"], 3, "Shankaracharya wrote Vivekachudamani, Soundaryalahari, Sivanandalahari, Atmabodha, etc. Sri Bhashya, a commentary on the Brahma Sutras, was written by Ramanujacharya.", "శంకరాచార్యులు వివేకచూడామణి, సౌందర్యలహరి, శివానందలహరి, ఆత్మబోధ మొదలైనవి రచించారు. బ్రహ్మసూత్రాలపై వ్యాఖ్యానం శ్రీభాష్యం రామానుజాచార్యులది."], ["Adi Shankaracharya, considered the greatest reformer of Sanatana Dharma, attained nirvana at the age of", "సనాతన ధర్మ గొప్ప సంస్కర్తగా భావించే ఆది శంకరాచార్యులు నిర్వాణం పొందిన వయసు", ["32", "5", "50", "70"], ["32", "5", "50", "70"], 0, "Shankaracharya became a saint at five and attained nirvana at the age of 32.", "శంకరాచార్యులు ఐదేళ్ళకు సన్యాసి అయి, 32 ఏళ్ళ వయసులో నిర్వాణం పొందారు."], ["Ramanujacharya was born at ____ in the year ____", "రామానుజాచార్యులు ____ లో ____ సంవత్సరంలో జన్మించారు", ["Sriperumbudur; 1017 CE", "Kaladi; 788 CE", "Talwandi; 1469 CE", "Prayag; 1299 CE"], ["శ్రీపెరంబుదూర్; 1017", "కాలడి; 788", "తల్వండి; 1469", "ప్రయాగ; 1299"], 0, "Ramanujacharya, philosopher and social reformer, was born at Sriperumbudur in 1017 CE; he gave a philosophical basis to Vaishnavism.", "తత్వవేత్త, సంఘ సంస్కర్త రామానుజాచార్యులు 1017లో శ్రీపెరంబుదూర్‌లో జన్మించారు; వైష్ణవానికి తాత్విక పునాది ఇచ్చారు."], ["Ramanujacharya's commentary on the Brahma Sutras is popularly known as", "బ్రహ్మసూత్రాలపై రామానుజాచార్యుల వ్యాఖ్యానం", ["Sri Bhashya", "Jnaneswari", "Vivekachudamani", "Guru Granth Sahib"], ["శ్రీభాష్యం", "జ్ఞానేశ్వరి", "వివేకచూడామణి", "గురు గ్రంథ్ సాహిబ్"], 0, "Ramanuja wrote a commentary on the Brahma Sutras popularly known as 'Sri Bhashya'. He stated that everyone could attain salvation by completely surrendering to the Almighty.", "రామానుజులు బ్రహ్మసూత్రాలపై 'శ్రీభాష్యం' వ్యాఖ్యానం రాశారు. సర్వశక్తిమంతునికి సంపూర్ణ శరణాగతి ద్వారా ప్రతి ఒక్కరూ మోక్షం పొందవచ్చన్నారు."], ["The Brahma Sutras, also known as the Vedanta Sutra, is a Sanskrit text attributed to", "వేదాంత సూత్రాలుగా పిలువబడే బ్రహ్మసూత్రాల రచయితగా భావించేది", ["Sage Badarayana (Vyasa)", "Valmiki", "Kalidasa", "Patanjali"], ["బాదరాయణ మహర్షి (వ్యాసుడు)", "వాల్మీకి", "కాళిదాసు", "పతంజలి"], 0, "The Brahma Sutras is a Sanskrit text attributed to sage Badarayana or Vyasa; it is also known as Vedanta Sutra.", "బ్రహ్మసూత్రాలు బాదరాయణ లేదా వ్యాస మహర్షికి ఆపాదించబడిన సంస్కృత గ్రంథం; వీటిని వేదాంత సూత్రాలు అని కూడా అంటారు."], ["Madhwacharya, born on the west coast of Karnataka in the 13th century, preached Dwaita. Dwaita considers", "13వ శతాబ్దంలో కర్ణాటక పశ్చిమ తీరంలో జన్మించిన మధ్వాచార్యులు ద్వైతం బోధించారు. ద్వైతం ప్రకారం", ["Brahman and Atman as two different entities", "Brahman and Atman as one", "The world as an illusion", "God as formless only"], ["బ్రహ్మం, ఆత్మ రెండు వేర్వేరు అస్తిత్వాలు", "బ్రహ్మం, ఆత్మ ఒకటే", "ప్రపంచం మాయ", "దేవుడు నిరాకారుడు మాత్రమే"], 0, "Dwaita means duality; it considers Brahman and Atman as different entities, Bhakti as the route to salvation, and the world as a reality, not an illusion.", "ద్వైతం అంటే ద్వంద్వం; బ్రహ్మం, ఆత్మ వేర్వేరు; భక్తి మోక్షమార్గం; ప్రపంచం మాయ కాదు, వాస్తవం."], ["Consider the following statements about Vallabhacharya:\nI. He hailed from a Telugu family.\nII. His teachings are known as Pushtimarga or the Path of Grace.", "వల్లభాచార్యుల గురించి కింది వాక్యాలను పరిశీలించండి:\nI. ఆయన తెలుగు కుటుంబానికి చెందినవారు.\nII. ఆయన బోధనలను పుష్టిమార్గం లేదా అనుగ్రహ మార్గం అంటారు.", ["Both I and II are correct", "Only I is correct", "Only II is correct", "Neither I nor II is correct"], ["I, II రెండూ సరైనవి", "I మాత్రమే సరైనది", "II మాత్రమే సరైనది", "రెండూ సరైనవి కావు"], 0, "Vallabhacharya, a Vaishnava saint from a Telugu family, preached Suddhadvaita; his teachings are called Pushtimarga (Path of Grace); he had intense love for Lord Krishna.", "తెలుగు కుటుంబానికి చెందిన వైష్ణవ భక్తుడు వల్లభాచార్యులు శుద్ధాద్వైతం బోధించారు; ఆయన బోధనలు పుష్టిమార్గం (అనుగ్రహ మార్గం); శ్రీకృష్ణునిపై అపార ప్రేమ."], ["Basaveswara of Karnataka popularised Veerasaivism. His literary works are known as", "కర్ణాటకకు చెందిన బసవేశ్వరుడు వీరశైవాన్ని ప్రచారం చేశాడు. ఆయన సాహిత్య రచనలను ఇలా అంటారు", ["Vachanas", "Abhangas", "Dohas", "Keerthanas"], ["వచనాలు", "అభంగాలు", "దోహాలు", "కీర్తనలు"], 0, "Basaveswara — statesman, philosopher, poet and social reformer — popularised Veerasaivism; his works are called Vachanas.", "రాజనీతిజ్ఞుడు, తత్వవేత్త, కవి, సంఘ సంస్కర్త బసవేశ్వరుడు వీరశైవాన్ని ప్రచారం చేశాడు; ఆయన రచనలు వచనాలు."], ["'All men are equal. There is no caste or sub-caste' is the famous quote of", "'మనుషులందరూ సమానులే. కులం, ఉపకులం లేవు' అన్న ప్రసిద్ధ సూక్తి ఎవరిది", ["Basaveswara", "Ramanujacharya", "Madhwacharya", "Chaitanya"], ["బసవేశ్వరుడు", "రామానుజాచార్యులు", "మధ్వాచార్యులు", "చైతన్యుడు"], 0, "Basaveswara's famous quote is 'All men are equal. There is no caste or sub-caste'.", "'మనుషులందరూ సమానులే. కులం, ఉపకులం లేవు' అన్నది బసవేశ్వరుని ప్రసిద్ధ సూక్తి."], ["The credit for spreading the Vaishnava religion in northern India goes to", "ఉత్తర భారతదేశంలో వైష్ణవ మత వ్యాప్తి ఘనత ఎవరిది", ["Ramananda", "Madhwacharya", "Basaveswara", "Shankara Deva"], ["రామానందుడు", "మధ్వాచార్యులు", "బసవేశ్వరుడు", "శంకరదేవుడు"], 0, "Ramananda, born at Prayag and schooled in Banaras, spread Vaishnavism in northern India; he followed Ramanuja's Visishtadvaita and carried it further.", "ప్రయాగలో జన్మించి కాశీలో చదువుకున్న రామానందుడు ఉత్తర భారతంలో వైష్ణవాన్ని వ్యాపింపజేశాడు; రామానుజుల విశిష్టాద్వైతాన్ని అనుసరించాడు."], ["Kabir was brought up by a Muslim weaver named", "కబీర్‌ను పెంచిన ముస్లిం నేత కార్మికుని పేరు", ["Niru", "Baba Farid", "Shahji", "Mardana"], ["నీరు", "బాబా ఫరీద్", "షాహాజీ", "మర్దానా"], 0, "Kabir was brought up by a Muslim weaver named Niru; he later became a disciple of Ramananda at Banaras.", "కబీర్‌ను నీరు అనే ముస్లిం నేత కార్మికుడు పెంచాడు; తర్వాత కాశీలో రామానందుని శిష్యుడయ్యాడు."], ["The first saint who tried to reconcile Hinduism and Islam, advocating 'All are equal before God', was", "'దేవుని ముందు అందరూ సమానులే' అని చాటి హిందూ, ఇస్లాం మతాలను సమన్వయపరచడానికి ప్రయత్నించిన మొదటి సాధువు", ["Kabir", "Tulsidas", "Jnaneswar", "Madhwacharya"], ["కబీర్", "తులసీదాస్", "జ్ఞానేశ్వర్", "మధ్వాచార్యులు"], 0, "Kabir preached a religion of love, promoting unity among castes and creeds; he was the first saint who tried to reconcile Hinduism and Islam.", "కబీర్ కులమతాల మధ్య ఐక్యత కోసం ప్రేమ మతాన్ని బోధించాడు; హిందూ, ఇస్లాం మతాలను సమన్వయపరచడానికి ప్రయత్నించిన మొదటి సాధువు."], ["'Hari is in all and all in Hari' was the cardinal quote of", "'హరి అందరిలో ఉన్నాడు, అందరూ హరిలో ఉన్నారు' అన్నది ఎవరి ముఖ్య సూక్తి", ["Sant Ravidas", "Kabir", "Namdev", "Chaitanya"], ["సంత్ రవిదాస్", "కబీర్", "నామదేవ్", "చైతన్యుడు"], 0, "Sant Ravidas lived at Banaras a life of simplicity and contentment; his cardinal quote was 'Hari is in all and all in Hari'.", "సంత్ రవిదాస్ కాశీలో సరళ, సంతృప్త జీవితం గడిపాడు; 'హరి అందరిలో, అందరూ హరిలో' అన్నది ఆయన ముఖ్య సూక్తి."], ["Mira Bai, who was born in a royal family and became popular as a divine singer, was a devotee of", "రాజకుటుంబంలో జన్మించి దివ్య గాయనిగా పేరొందిన మీరాబాయి ఆరాధ్యదైవం", ["Lord Krishna", "Lord Shiva", "Lord Rama", "Vithoba"], ["శ్రీకృష్ణుడు", "శివుడు", "శ్రీరాముడు", "విఠోబా"], 0, "Mira Bai was a devotee of Krishna from childhood; she propagated Krishna Bhakti among all sections; hermits visited Chittod (Rajasthan) to hear her.", "మీరాబాయి చిన్నతనం నుండి కృష్ణ భక్తురాలు; అన్ని వర్గాలలో కృష్ణ భక్తిని ప్రచారం చేసింది; ఆమె పాటలు వినడానికి సాధువులు చిత్తోడ్ (రాజస్థాన్) వచ్చేవారు."], ["According to the textbook, Mira Bai was the disciple of", "పాఠ్యపుస్తకం ప్రకారం మీరాబాయి ఎవరి శిష్యురాలు", ["Sant Ravidas", "Kabir", "Ramananda", "Vallabhacharya"], ["సంత్ రవిదాస్", "కబీర్", "రామానందుడు", "వల్లభాచార్యులు"], 0, "The textbook says Mira Bai was the disciple of Sant Ravidas; her songs have remained popular for centuries.", "మీరాబాయి సంత్ రవిదాస్ శిష్యురాలని పాఠ్యపుస్తకం చెబుతుంది; ఆమె పాటలు శతాబ్దాలుగా ప్రసిద్ధి."], ["Chaitanya Mahaprabhu, the Vaishnava saint from Bengal also known as Sri Gauranga, finally settled down at", "శ్రీ గౌరాంగుడుగా పిలువబడే బెంగాల్ వైష్ణవ భక్తుడు చైతన్య మహాప్రభు చివరకు స్థిరపడిన ప్రదేశం", ["Puri", "Pandharpur", "Brindavan", "Banaras"], ["పూరి", "పండరీపురం", "బృందావనం", "కాశీ"], 0, "Chaitanya visited Pandharpur, Somnath, Dwarka, Brindavan and Mathura, but finally settled at Puri till his last breath. He preached that God can be realised through love, devotion, song and dance.", "చైతన్యుడు పండరీపురం, సోమనాథ్, ద్వారక, బృందావనం, మథుర సందర్శించి చివరకు పూరిలో స్థిరపడ్డాడు. ప్రేమ, భక్తి, గానం, నృత్యంతో దేవుని పొందవచ్చన్నాడు."], ["The saint of Assam who founded Satras (monasteries) and Nam-Ghars where people of all castes met was", "అన్ని కులాలవారు కలిసే సత్రాలు (మఠాలు), నామఘర్‌లను స్థాపించిన అస్సాం భక్తుడు", ["Shankara Deva", "Chaitanya", "Guru Nanak", "Namdev"], ["శంకరదేవుడు", "చైతన్యుడు", "గురునానక్", "నామదేవ్"], 0, "Shankara Deva of Assam — poet, playwright and social reformer — founded Satras and Nam-Ghars and preached Vaishnavism among all people including tribals.", "అస్సాం భక్తుడు శంకరదేవుడు — కవి, నాటకకర్త, సంఘ సంస్కర్త — సత్రాలు, నామఘర్‌లు స్థాపించి గిరిజనులతో సహా అందరికీ వైష్ణవాన్ని బోధించాడు."], ["Match the Bhakti saints with their regions:\nA. Chaitanya Mahaprabhu   B. Shankara Deva   C. Guru Nanak   D. Basaveswara\n1. Karnataka   2. Punjab   3. Assam   4. Bengal", "భక్తి సాధువులను వారి ప్రాంతాలతో జతపరచండి:\nA. చైతన్య మహాప్రభు   B. శంకరదేవుడు   C. గురునానక్   D. బసవేశ్వరుడు\n1. కర్ణాటక   2. పంజాబ్   3. అస్సాం   4. బెంగాల్", ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], ["A-4, B-3, C-2, D-1", "A-3, B-4, C-2, D-1", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4"], 0, "Chaitanya – Bengal; Shankara Deva – Assam; Guru Nanak – Punjab; Basaveswara – Karnataka.", "చైతన్యుడు – బెంగాల్; శంకరదేవుడు – అస్సాం; గురునానక్ – పంజాబ్; బసవేశ్వరుడు – కర్ణాటక."], ["Identify the saint who was NOT associated with Maharashtra", "మహారాష్ట్రకు సంబంధం లేని భక్తుడు", ["Tukaram", "Namdev", "Samartha Ramadas", "Kabir"], ["తుకారాం", "నామదేవ్", "సమర్థ రామదాసు", "కబీర్"], 3, "Tukaram, Namdev and Samartha Ramadas (and Jnaneswar) carried the movement in Maharashtra; Kabir was in North India (Banaras).", "తుకారాం, నామదేవ్, సమర్థ రామదాసు (జ్ఞానేశ్వర్) మహారాష్ట్రలో ఉద్యమాన్ని కొనసాగించారు; కబీర్ ఉత్తర భారతం (కాశీ)."], ["The founder of the Sikh religion is", "సిక్కు మత స్థాపకుడు", ["Guru Nanak", "Sankaracharya", "Ramananda", "Akbar"], ["గురునానక్", "శంకరాచార్యులు", "రామానందుడు", "అక్బర్"], 0, "Guru Nanak was the founder of the Sikh religion; his followers were known as Sikhs. (Textbook exercise.)", "గురునానక్ సిక్కు మత స్థాపకుడు; ఆయన అనుచరులను సిక్కులు అంటారు. (పాఠ్యపుస్తక అభ్యాసం.)"], ["Guru Nanak was born in 1469 at", "గురునానక్ 1469లో జన్మించిన గ్రామం", ["Talwandi near Lahore", "Kaladi in Kerala", "Shivneri near Pune", "Prayag"], ["లాహోర్ సమీపంలోని తల్వండి", "కేరళలోని కాలడి", "పుణే సమీపంలోని శివనేరి", "ప్రయాగ"], 0, "Guru Nanak was born at village Talwandi near Lahore in 1469; he greatly appreciated the teachings of Kabir.", "గురునానక్ 1469లో లాహోర్ సమీపంలోని తల్వండి గ్రామంలో జన్మించాడు; కబీర్ బోధనలను ఎంతో మెచ్చుకున్నాడు."], ["Consider the following statements about Guru Nanak:\nI. He believed in the oneness of God and the brotherhood of men.\nII. He supported the caste system and preached only in Sanskrit.", "గురునానక్ గురించి కింది వాక్యాలను పరిశీలించండి:\nI. ఏకేశ్వరోపాసన, మానవ సోదరభావాన్ని నమ్మాడు.\nII. కుల వ్యవస్థను సమర్థించి, సంస్కృతంలో మాత్రమే బోధించాడు.", ["Only I is correct", "Only II is correct", "Both I and II are correct", "Neither I nor II is correct"], ["I మాత్రమే సరైనది", "II మాత్రమే సరైనది", "I, II రెండూ సరైనవి", "రెండూ సరైనవి కావు"], 0, "Guru Nanak believed in one God and brotherhood of men, preached in the language of the people, and denounced the caste system, teaching that everyone is equal regardless of caste and gender.", "గురునానక్ ఏకేశ్వరుని, మానవ సోదరభావాన్ని నమ్మి ప్రజల భాషలో బోధించాడు; కుల వ్యవస్థను ఖండించి కులం, లింగ భేదం లేకుండా అందరూ సమానులన్నాడు."], ["Namdev, who conducted Bhajan sessions with people of all sections, was a devotee of", "అన్ని వర్గాల ప్రజలతో భజనలు నిర్వహించిన నామదేవ్ ఆరాధ్యదైవం", ["Vithoba of Pandharpur", "Lord Venkateswara", "Lord Jagannath of Puri", "Lord Shiva of Srisailam"], ["పండరీపుర విఠోబా", "శ్రీ వేంకటేశ్వరుడు", "పూరి జగన్నాథుడు", "శ్రీశైల శివుడు"], 0, "Namdev was a devotee of Vithoba of Pandharpur; he said there is no need for rituals — concentrate the mind on God to attain moksha.", "నామదేవ్ పండరీపుర విఠోబా భక్తుడు; కర్మకాండలు అవసరం లేదు, మనస్సును దేవునిపై లగ్నం చేస్తే మోక్షం అన్నాడు."], ["Jnaneswar's commentary on the Bhagavad Gita, written in Marathi, is called Bhavartha Deepika, commonly known as", "మరాఠీలో జ్ఞానేశ్వర్ రాసిన భగవద్గీత వ్యాఖ్యానం 'భావార్థ దీపిక'ను సాధారణంగా ఇలా అంటారు", ["Jnaneswari", "Sri Bhashya", "Ramcharitmanas", "Amuktamalyada"], ["జ్ఞానేశ్వరి", "శ్రీభాష్యం", "రామచరితమానస్", "ఆముక్తమాల్యద"], 0, "Jnaneswar wrote a Marathi commentary on the Bhagavad Gita, commonly known as Jnaneswari; he advocated allowing all castes to read the Gita.", "జ్ఞానేశ్వర్ మరాఠీలో భగవద్గీతపై వ్యాఖ్యానం రాశాడు — దీనిని జ్ఞానేశ్వరి అంటారు; అన్ని కులాలవారు గీత చదవాలని సమర్థించాడు."], ["The Telugu poet Molla (Mollamamba), said to be a contemporary of Krishna Deva Raya, is famous for writing", "శ్రీకృష్ణదేవరాయల సమకాలికురాలిగా చెప్పబడే తెలుగు కవయిత్రి మొల్ల (మొల్లమాంబ) ప్రసిద్ధ రచన", ["Ramayana in Telugu", "Mahabharata in Telugu", "Bhagavatam in Telugu", "Manucharitra"], ["తెలుగులో రామాయణం", "తెలుగులో మహాభారతం", "తెలుగులో భాగవతం", "మనుచరిత్ర"], 0, "Molla wrote the Ramayana in Telugu in a simple and attractive style.", "మొల్ల సరళమైన, ఆకర్షణీయ శైలిలో తెలుగులో రామాయణం రచించింది."], ["Tallapaka Annamacharya, known as 'Padakavitha Pithamaha', wrote 32,000 keerthanas in praise of", "'పదకవితా పితామహుడు' తాళ్ళపాక అన్నమాచార్యులు 32,000 కీర్తనలు ఎవరిపై రచించారు", ["Lord Venkateswara", "Lord Rama", "Lord Shiva", "Lord Krishna of Puri"], ["శ్రీ వేంకటేశ్వరుడు", "శ్రీరాముడు", "శివుడు", "పూరి కృష్ణుడు"], 0, "Annamayya of Tallapaka village (Kadapa region) wrote 32,000 keerthanas on Lord Venkateswara; in his poems he resented social inequalities.", "తాళ్ళపాక గ్రామానికి (కడప ప్రాంతం) చెందిన అన్నమయ్య శ్రీ వేంకటేశ్వరునిపై 32,000 కీర్తనలు రాశారు; సామాజిక అసమానతలను నిరసించారు."], ["The most important social impact of the Bhakti movement was", "భక్తి ఉద్యమపు అత్యంత ముఖ్యమైన సామాజిక ప్రభావం", ["Rejection of caste discrimination", "Increase in rituals", "Spread of the Sanskrit language only", "Growth of foreign trade"], ["కుల వివక్షను తిరస్కరించడం", "కర్మకాండల పెరుగుదల", "సంస్కృత భాష మాత్రమే వ్యాప్తి", "విదేశీ వాణిజ్య పెరుగుదల"], 0, "The most important social impact was that followers rejected caste discrimination; it also encouraged religious tolerance, monotheism, harmony and a humanitarian attitude.", "అత్యంత ముఖ్య ప్రభావం — అనుచరులు కుల వివక్షను తిరస్కరించారు; మత సహనం, ఏకేశ్వరోపాసన, సామరస్యం, మానవతా దృక్పథం పెరిగాయి."], ["Identify the one that was NOT a main feature of the Bhakti movement", "భక్తి ఉద్యమ ప్రధాన లక్షణం కానిది", ["Oneness of God", "Equality of all humans", "Preaching in local languages", "Strict caste discrimination"], ["ఏకేశ్వరోపాసన", "మానవులందరి సమానత్వం", "స్థానిక భాషల్లో బోధన", "కఠిన కుల వివక్ష"], 3, "Features: oneness of God, Bhakti as a path to moksha, surrender to God, equality of all, no discrimination of caste or creed, preaching in local languages.", "లక్షణాలు: ఏకేశ్వరోపాసన, మోక్షానికి భక్తి మార్గం, దేవునికి శరణాగతి, అందరి సమానత్వం, కుల మత భేదం లేకపోవడం, స్థానిక భాషల్లో బోధన."], ["The Sufi movement was a socio-religious movement in", "సూఫీ ఉద్యమం ఈ మతంలోని సామాజిక–మత ఉద్యమం", ["Islam", "Hinduism", "Buddhism", "Jainism"], ["ఇస్లాం", "హిందూమతం", "బౌద్ధమతం", "జైనమతం"], 0, "The Sufi movement was a socio-religious movement in Islam emphasising an egalitarian society based on universal love; Sufis led simple lives in meditation.", "సూఫీ ఉద్యమం ఇస్లాంలోని సామాజిక–మత ఉద్యమం; విశ్వప్రేమ ఆధారిత సమసమాజాన్ని కోరింది; సూఫీలు ధ్యానంలో సరళ జీవితం గడిపారు."], ["Identify the one that is NOT a salient feature of Sufism", "సూఫీయిజం ముఖ్య లక్షణం కానిది", ["There is only one God; all are children of God", "To love a fellow human being is to love God", "Devotional music is a way to reach God", "Elaborate rituals are the only way to God"], ["దేవుడు ఒక్కడే; అందరూ దేవుని బిడ్డలే", "తోటి మనిషిని ప్రేమించడమే దేవుని ప్రేమించడం", "భక్తి సంగీతం దేవుని చేరే మార్గం", "విస్తృత కర్మకాండలే దేవుని చేరే ఏకైక మార్గం"], 3, "Sufism: one God, all are His children; loving fellow humans is loving God; devotional music is a way to God. Sufis led simple lives and protested superstitions.", "సూఫీయిజం: దేవుడు ఒక్కడే, అందరూ ఆయన బిడ్డలు; తోటి మనిషిపై ప్రేమే దైవప్రేమ; భక్తి సంగీతం దైవమార్గం. సూఫీలు సరళ జీవితం గడిపి మూఢనమ్మకాలను వ్యతిరేకించారు."], ["The Chishti order of Sufism was established in India by", "భారతదేశంలో చిష్తీ సూఫీ శాఖను స్థాపించినవారు", ["Khwaja Moinuddin Chishti", "Nizamuddin Auliya", "Baba Farid", "Sheikh Salim Chishti"], ["ఖ్వాజా మొయినుద్దీన్ చిష్తీ", "నిజాముద్దీన్ ఔలియా", "బాబా ఫరీద్", "షేక్ సలీం చిష్తీ"], 0, "Khwaja Moinuddin Chishti, born in 1143 AD in Seistan (Persia), established the Chishti order in India and preached love and universal brotherhood.", "1143లో పర్షియాలోని సీస్తాన్‌లో జన్మించిన ఖ్వాజా మొయినుద్దీన్ చిష్తీ భారతదేశంలో చిష్తీ శాఖను స్థాపించి ప్రేమ, విశ్వ సోదరభావాన్ని బోధించారు."], ["The Dargah of Khwaja Moinuddin Chishti is located at", "ఖ్వాజా మొయినుద్దీన్ చిష్తీ దర్గా ఉన్న ప్రదేశం", ["Ajmer, Rajasthan", "Delhi", "Fatehpur Sikri", "Hyderabad"], ["అజ్మీర్, రాజస్థాన్", "ఢిల్లీ", "ఫతేపూర్ సిక్రీ", "హైదరాబాద్"], 0, "The Moinuddin Chishti Dargah, with the grave of the saint, is at Ajmer, Rajasthan.", "మొయినుద్దీన్ చిష్తీ సమాధి ఉన్న దర్గా రాజస్థాన్‌లోని అజ్మీర్‌లో ఉంది."], ["Nizamuddin Auliya, the most famous of the Chishti saints, was the disciple of", "చిష్తీ సాధువులలో అత్యంత ప్రసిద్ధుడైన నిజాముద్దీన్ ఔలియా ఎవరి శిష్యుడు", ["Baba Farid", "Moinuddin Chishti", "Kabir", "Sheikh Salim Chishti"], ["బాబా ఫరీద్", "మొయినుద్దీన్ చిష్తీ", "కబీర్", "షేక్ సలీం చిష్తీ"], 0, "Nizamuddin Auliya was the disciple of Baba Farid (Farid-ud-din Ganj-i-Shakar); he said love of God means love of humanity.", "నిజాముద్దీన్ ఔలియా బాబా ఫరీద్ (ఫరీదుద్దీన్ గంజ్-ఇ-షకర్) శిష్యుడు; దైవప్రేమ అంటే మానవప్రేమ అన్నాడు."], ["'Love of God means love of humanity' was emphasised by the Sufi saint", "'దైవప్రేమ అంటే మానవాళిపై ప్రేమ' అని ప్రబోధించిన సూఫీ సాధువు", ["Nizamuddin Auliya", "Guru Nanak", "Namdev", "Chaitanya"], ["నిజాముద్దీన్ ఔలియా", "గురునానక్", "నామదేవ్", "చైతన్యుడు"], 0, "Nizamuddin Auliya laid emphasis on love leading to realisation of God and said love of God means love of humanity.", "నిజాముద్దీన్ ఔలియా ప్రేమ ద్వారా దైవసాక్షాత్కారం అని, దైవప్రేమ అంటే మానవప్రేమ అని బోధించాడు."], ["Identify the correct statement about the impact of the Sufi movement", "సూఫీ ఉద్యమ ప్రభావం గురించి సరైన వాక్యం", ["Sufis travelled to reach the poor and rural communities and preached in local languages", "Sufis preached only to kings in Persian", "Sufis encouraged superstitions", "Sufis lived luxurious lives in palaces"], ["సూఫీలు పేదలు, గ్రామీణులను చేరడానికి పర్యటించి స్థానిక భాషల్లో బోధించారు", "సూఫీలు పర్షియన్‌లో రాజులకు మాత్రమే బోధించారు", "సూఫీలు మూఢనమ్మకాలను ప్రోత్సహించారు", "సూఫీలు రాజభవనాల్లో విలాస జీవితం గడిపారు"], 0, "Sufis travelled all over the country to reach the poor and rural communities, preached in local languages and lived modest, simple lives.", "సూఫీలు పేద, గ్రామీణ ప్రజలను చేరడానికి దేశమంతా పర్యటించి స్థానిక భాషల్లో బోధించారు; సాధారణ జీవితం గడిపారు."], ["Sufi saints gave great prominence to music in praising God. An example of Sufi devotional music is", "సూఫీ సాధువులు దైవస్తుతిలో సంగీతానికి ప్రాధాన్యం ఇచ్చారు. సూఫీ భక్తి సంగీతానికి ఉదాహరణ", ["Qawwali", "Kuchipudi", "Yakshaganam", "Abhanga"], ["ఖవ్వాలి", "కూచిపూడి", "యక్షగానం", "అభంగ్"], 0, "Sufi saints propagated their principles through poems and songs; Qawwali is an example.", "సూఫీ సాధువులు కవితలు, పాటల ద్వారా తమ సిద్ధాంతాలను ప్రచారం చేశారు; ఉదాహరణ ఖవ్వాలి."], ["The textbook says the inspiration of the Bhakti movement led to the formation of new kingdoms. Match correctly:\nVijayanagara kingdom – inspired by ____ ; Maratha kingdom – inspired by ____", "భక్తి ఉద్యమ ప్రేరణతో కొత్త రాజ్యాలు ఏర్పడ్డాయని పాఠ్యపుస్తకం చెబుతుంది. సరిగా పూరించండి:\nవిజయనగర రాజ్యం – ____ ప్రేరణ; మరాఠా రాజ్యం – ____ ప్రేరణ", ["Swami Vidyaranya; Samartha Ramadas", "Samartha Ramadas; Swami Vidyaranya", "Ramanuja; Tukaram", "Basaveswara; Namdev"], ["స్వామి విద్యారణ్యులు; సమర్థ రామదాసు", "సమర్థ రామదాసు; స్వామి విద్యారణ్యులు", "రామానుజులు; తుకారాం", "బసవేశ్వరుడు; నామదేవ్"], 0, "Vijayanagara was established with the inspiration of Swami Vidyaranya, and the Maratha kingdom by Shivaji with the inspiration of Samartha Ramadas.", "విజయనగరం స్వామి విద్యారణ్యుల ప్రేరణతో, మరాఠా రాజ్యం సమర్థ రామదాసు ప్రేరణతో శివాజీ స్థాపించాడు."], ["The Bhakti movement enhanced literature in regional languages. Identify the correct examples given in the textbook", "భక్తి ఉద్యమం ప్రాంతీయ భాషా సాహిత్యాన్ని పెంపొందించింది. పాఠ్యపుస్తకంలోని సరైన ఉదాహరణలు", ["Writings of Akkamahadevi, Meera bhajans, Tiruppavai of Godadevi", "Ain-i-Akbari, Akbar Nama, Baburnama", "Arthashastra, Indica, Rajatarangini", "Manucharitra, Vasucharitra, Amuktamalyada"], ["అక్కమహాదేవి రచనలు, మీరా భజనలు, గోదాదేవి తిరుప్పావై", "ఐన్-ఇ-అక్బరీ, అక్బర్ నామా, బాబర్‌నామా", "అర్థశాస్త్రం, ఇండికా, రాజతరంగిణి", "మనుచరిత్ర, వసుచరిత్ర, ఆముక్తమాల్యద"], 0, "Bhakti saints composed songs and poems to reach common people, enriching regional literature — e.g., Akkamahadevi's writings, Meera bhajans, Tiruppavai of Godadevi.", "భక్తి సాధువులు సామాన్యుల కోసం పాటలు, పద్యాలు రచించి ప్రాంతీయ సాహిత్యాన్ని సుసంపన్నం చేశారు — ఉదా: అక్కమహాదేవి రచనలు, మీరా భజనలు, గోదాదేవి తిరుప్పావై."], ["'Egalitarian', a word used to describe the Sufi idea of society, means", "సూఫీ సమాజ భావనను వివరించే 'ఈగాలిటేరియన్' (Egalitarian) పదానికి అర్థం", ["The concept of equalness", "Deliverance of the soul", "A trance-like state", "Knowledge attained by few"], ["సమానత్వ భావన", "ఆత్మకు విముక్తి", "సమాధి (తన్మయ) స్థితి", "కొద్దిమందికే లభించే జ్ఞానం"], 0, "Egalitarian – the concept of equalness. Salvation – deliverance of the soul; Ecstasy – a trance-like state; Esoteric – knowledge attained by few saints.", "ఈగాలిటేరియన్ – సమానత్వ భావన. సాల్వేషన్ – ఆత్మ విముక్తి; ఎక్స్టసీ – తన్మయ స్థితి; ఎసోటెరిక్ – కొద్దిమంది సాధువులకే లభించే జ్ఞానం."], ["After teaching the Bhakti and Sufi movements, a teacher asks students to list the similarities in the teachings of Hindu and Islamic reformers. This activity mainly develops", "భక్తి, సూఫీ ఉద్యమాలు బోధించాక ఉపాధ్యాయుడు హిందూ, ఇస్లాం సంస్కర్తల బోధనల్లో సారూప్యతలను జాబితా చేయమన్నాడు. ఈ కృత్యం ప్రధానంగా పెంపొందించేది", ["Comparative thinking and values of harmony", "Rote memorisation of names", "Competition between religions", "Map-drawing skills"], ["తులనాత్మక ఆలోచన, సామరస్య విలువలు", "పేర్ల బట్టీ", "మతాల మధ్య పోటీ", "పటం గీయడం నైపుణ్యాలు"], 0, "Comparing teachings (oneness of God, equality, love) develops higher-order comparative thinking and values like religious tolerance and harmony — a 'Let's Do' activity in the textbook.", "బోధనలను పోల్చడం (ఏకేశ్వరోపాసన, సమానత్వం, ప్రేమ) ఉన్నతస్థాయి తులనాత్మక ఆలోచనను, మత సహనం, సామరస్యం వంటి విలువలను పెంపొందిస్తుంది — పాఠ్యపుస్తకంలోని 'చేద్దాం' కృత్యం."]]}, {"n": 9, "en": "Indian Constitution – an Introduction", "te": "భారత రాజ్యాంగం – పరిచయం", "c": "#d97706", "q": [["The basic law of a country, with a set of rules showing the nature of the country, form of government, and rights and duties of citizens, is called the", "దేశ స్వభావం, ప్రభుత్వ రూపం, పౌరుల హక్కులు–విధులను తెలిపే నియమాల సమాహారమైన దేశపు ప్రాథమిక చట్టాన్ని ఇలా అంటారు", ["Constitution", "Preamble", "Ordinance", "Manifesto"], ["రాజ్యాంగం", "ప్రవేశిక", "ఆర్డినెన్స్", "మేనిఫెస్టో"], 0, "The Constitution is the basic law of a country. It may be written or non-written; India's is written while the British constitution is non-written.", "రాజ్యాంగం దేశపు ప్రాథమిక చట్టం. ఇది లిఖిత లేదా అలిఖిత రూపంలో ఉండవచ్చు; భారత రాజ్యాంగం లిఖితం, బ్రిటిష్ రాజ్యాంగం అలిఖితం."], ["During British rule, an important act which provided for an all-India federation of Provinces and Princely States and divided powers between Centre and States into three lists was", "బ్రిటిష్ పాలనలో రాష్ట్రాలు, సంస్థానాలతో అఖిల భారత సమాఖ్యను ప్రతిపాదించి, కేంద్ర–రాష్ట్రాల అధికారాలను మూడు జాబితాలుగా విభజించిన ముఖ్య చట్టం", ["Government of India Act, 1935", "Regulating Act, 1773", "Indian Councils Act, 1909", "Indian Independence Act, 1947"], ["భారత ప్రభుత్వ చట్టం, 1935", "రెగ్యులేటింగ్ చట్టం, 1773", "భారత కౌన్సిళ్ళ చట్టం, 1909", "భారత స్వాతంత్ర్య చట్టం, 1947"], 0, "The Government of India Act 1935 provided for an all-India federation, divided powers into three lists, provided for diarchy at the Centre and autonomy for the provinces.", "భారత ప్రభుత్వ చట్టం 1935 అఖిల భారత సమాఖ్యను, అధికారాల మూడు జాబితాలను, కేంద్రంలో ద్వంద్వ ప్రభుత్వాన్ని, రాష్ట్రాలకు స్వ
